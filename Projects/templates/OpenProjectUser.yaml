apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: {{ .Release.Name }}

spec:
  name: OpenProject
  groups:
    - LDAPService

  psql:
    enabled: true
    createUserDatabase: false
    databases:
      - 'Gmdfb5HXbk'

  s3:
    enabled: true
    createBuckets: true
    createCredentials: true
    buckets:
      - 'ba8f4fed-33ed-6b22-9d0a-3a7b064db6dc-6g7ka2'
    writeCredentialsSecretRef:
      name: 'business-projects-openproject-s3-{{ .Values.secretSuffix }}'
      namespace: {{ .Release.Namespace | quote }}

  writeConnectionSecretToRef:
    name: {{ .Release.Name }}
