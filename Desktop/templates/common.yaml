---
{{- include "bjw-s.common.loader.init" . }}

{{- define "app-template.hardcodedValues" -}}
{{- if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{- end }}

controllers:
  {{- range $desktop := .Values.desktops }}
  {{- if $desktop.enabled }}
  {{- $resourceName := default $desktop.name $desktop.resourceName }}
  desktop-{{ $resourceName }}:
    strategy: Recreate
    revisionHistoryLimit: 3
    pod:
      {{- with $desktop.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $desktop.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
    containers:
      {{ $resourceName }}:
        image:
          repository: {{ $desktop.image | quote }}
          tag: {{ required (printf "desktops[%s].tag is required" $desktop.name) $desktop.tag | quote }}
          pullPolicy: IfNotPresent
        {{- with $desktop.env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $desktop.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
          - name: http
            containerPort: {{ default 3000 $desktop.port }}
            protocol: TCP
  {{- end }}
  {{- end }}

service:
  {{- range $desktop := .Values.desktops }}
  {{- if $desktop.enabled }}
  {{- $resourceName := default $desktop.name $desktop.resourceName }}
  desktop-{{ $resourceName }}:
    enabled: true
    controller: desktop-{{ $resourceName }}
    nameOverride: desktop-{{ $resourceName }}
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 80
        targetPort: http
        protocol: HTTP
  {{- end }}
  {{- end }}

route:
  {{- range $desktop := .Values.desktops }}
  {{- if $desktop.enabled }}
  {{- $resourceName := default $desktop.name $desktop.resourceName }}
  desktop-{{ $resourceName }}:
    enabled: true
    kind: HTTPRoute
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: {{ $.Values.gateway.name | quote }}
        namespace: {{ $.Values.gateway.namespace | quote }}
        sectionName: {{ $.Values.gateway.sectionName | quote }}
    hostnames:
      - {{ required (printf "desktops[%s].hostname is required" $desktop.name) $desktop.hostname | quote }}
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - kind: Service
            identifier: desktop-{{ $resourceName }}
            port: 80
            weight: 1
  {{- end }}
  {{- end }}

persistence:
  {{- range $desktop := .Values.desktops }}
  {{- if $desktop.enabled }}
  {{- $resourceName := default $desktop.name $desktop.resourceName }}
  {{- if and $desktop.volume $desktop.volume.enabled }}
  desktop-{{ $resourceName }}:
    enabled: true
    type: persistentVolumeClaim
    size: {{ default "5Gi" $desktop.volume.size | quote }}
    accessMode: ReadWriteOnce
    advancedMounts:
      desktop-{{ $resourceName }}:
        {{ $resourceName }}:
          - path: {{ default "/config" $desktop.volume.mount | quote }}
  {{- end }}
  {{- if and $desktop.shm $desktop.shm.enabled }}
  desktop-{{ $resourceName }}-shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: {{ default "1Gi" $desktop.shm.sizeLimit | quote }}
    advancedMounts:
      desktop-{{ $resourceName }}:
        {{ $resourceName }}:
          - path: /dev/shm
  {{- end }}
  {{- end }}
  {{- end }}
{{- end -}}

{{- $_ := mergeOverwrite .Values (include "app-template.hardcodedValues" . | fromYaml) -}}
{{ include "bjw-s.common.loader.generate" . }}
