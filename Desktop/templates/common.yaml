---
{{- include "bjw-s.common.loader.init" . }}

{{- define "app-template.hardcodedValues" -}}
{{- if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{- end }}

controllers:
  {{- range $desktop := .Values.desktops }}
  {{- if $desktop.enabled }}
  desktop-{{ $desktop.name }}:
    strategy: Recreate
    revisionHistoryLimit: 3
    pod:
      {{- with $desktop.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $desktop.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
    containers:
      {{ $desktop.name }}:
        image:
          repository: {{ $desktop.image | quote }}
          tag: {{ required (printf "desktops[%s].tag is required" $desktop.name) $desktop.tag | quote }}
          pullPolicy: IfNotPresent
        {{- with $desktop.env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $desktop.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
          - name: http
            containerPort: {{ default 3000 $desktop.port }}
            protocol: TCP
  {{- end }}
  {{- end }}

service:
  {{- range $desktop := .Values.desktops }}
  {{- if $desktop.enabled }}
  desktop-{{ $desktop.name }}:
    enabled: true
    controller: desktop-{{ $desktop.name }}
    nameOverride: desktop-{{ $desktop.name }}
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 80
        targetPort: http
        protocol: HTTP
  {{- end }}
  {{- end }}

persistence:
  {{- range $desktop := .Values.desktops }}
  {{- if $desktop.enabled }}
  {{- if and $desktop.volume $desktop.volume.enabled }}
  desktop-{{ $desktop.name }}:
    enabled: true
    type: persistentVolumeClaim
    size: {{ default "5Gi" $desktop.volume.size | quote }}
    accessMode: ReadWriteOnce
    advancedMounts:
      desktop-{{ $desktop.name }}:
        {{ $desktop.name }}:
          - path: {{ default "/config" $desktop.volume.mount | quote }}
  {{- end }}
  {{- if and $desktop.shm $desktop.shm.enabled }}
  desktop-{{ $desktop.name }}-shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: {{ default "1Gi" $desktop.shm.sizeLimit | quote }}
    advancedMounts:
      desktop-{{ $desktop.name }}:
        {{ $desktop.name }}:
          - path: /dev/shm
  {{- end }}
  {{- end }}
  {{- end }}
{{- end -}}

{{- $_ := mergeOverwrite .Values (include "app-template.hardcodedValues" . | fromYaml) -}}
{{ include "bjw-s.common.loader.generate" . }}
