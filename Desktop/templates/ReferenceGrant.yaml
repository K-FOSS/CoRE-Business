{{- if .Values.auth.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ .Release.Name }}-authentik-outpost
  namespace: {{ .Values.auth.outpost.namespace }}
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: {{ .Release.Namespace }}
  to:
    - group: ''
      kind: Service
      name: {{ .Values.auth.outpost.name }}
{{- end }}
