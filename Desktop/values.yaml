env: 'prod'

hub: true

cluster:
  name: 'k8s'
  domain: 'cluster.local'

datacenter: 'dc1'
region: 'yxl'

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

auth:
  enabled: true
  providerConfigRef: 'authentik'
  applicationSlug: 'desktop'
  applicationName: 'CoRE Desktops'
  accessGroup: 'Desktop Users'
  outpost:
    name: 'aaa-myloginspace-proxy'
    namespace: 'core-prod'
    port: 80

desktops:
  - name: 'dolphin'
    enabled: true
    image: 'lscr.io/linuxserver/dolphin'
    tag: 'latest'
    port: 3000
    hostname: 'dolphin.mylogin.space'
    env:
      - name: 'PIXELFLUX_WAYLAND'
        value: 'true'
      - name: 'SELKIES_DESKTOP'
        value: 'false'
    volume:
      enabled: true
      size: '30Gi'
      mount: '/config'
    shm:
      enabled: true
      sizeLimit: '1Gi'
    resources:
      limits:
        gpu.intel.com/i915: '1'

  - name: 'orcha-slicer'
    resourceName: 'orca'
    enabled: true
    image: 'lscr.io/linuxserver/orcaslicer'
    tag: 'latest'
    port: 3000
    hostname: 'orcaslicer.mylogin.space'
    env:
      - name: 'PIXELFLUX_WAYLAND'
        value: 'true'
      - name: 'SELKIES_DESKTOP'
        value: 'false'
      - name: 'SELKIES_FRAMERATE'
        value: '120'
      - name: 'DRINODE'
        value: '/dev/dri/renderD128'
      - name: 'DRI_NODE'
        value: '/dev/dri/renderD128'
    volume:
      enabled: true
      size: '30Gi'
      mount: '/config'
    shm:
      enabled: true
      sizeLimit: '1Gi'
    resources:
      limits:
        gpu.intel.com/i915: '1'

  - name: 'steam'
    enabled: true
    image: 'lscr.io/linuxserver/steam'
    tag: '8beba5cd-ls35'
    port: 3000
    hostname: 'steam.mylogin.space'
    env:
      - name: 'PIXELFLUX_WAYLAND'
        value: 'true'
      - name: 'SELKIES_DESKTOP'
        value: 'false'
      - name: WLR_BACKENDS
        value: wayland

      - name: 'SELKIES_ENCODER'
        value: 'x264enc'
      - name: 'SELKIES_H264_STREAMING_MODE'
        value: 'true|locked'
      - name: 'SELKIES_USE_PAINT_OVER_QUALITY'
        value: 'false'
      - name: SELKIES_USE_BROWSER_CURSORS
        value: false|locked

      - name: SELKIES_GAMEPAD_ENABLED
        value: true|locked
      - name: NVIDIA_DRIVER_CAPABILITIES
        value: compute,video,graphics,utility,display
      - name: DRINODE
        value: /dev/dri/renderD128
      - name: DRI_NODE
        value: /dev/dri/renderD129
      - name: MESA_VK_DEVICE_SELECT
        value: 10de:1e87!
      - name: VK_LOADER_DRIVERS_SELECT
        value: '*nvidia*'

      - name: WLR_WL_OUTPUTS
        value: '1'

      - name: __GLX_VENDOR_LIBRARY_NAME
        value: nvidia
      - name: SELKIES_FRAMERATE
        value: '60'
      - name: SELKIES_USE_CPU
        value: false|locked
      - name: SELKIES_ENABLE_RATE_CONTROL
        value: true|locked
      - name: SELKIES_RATE_CONTROL_MODE
        value: cbr

      - name: SELKIES_VIDEO_BITRATE
        value: '100'


      - name: SELKIES_USE_PAINT_OVER_QUALITY
        value: 'false'

      - name: SELKIES_ENCODER
        value: x264enc

      - name: __NV_PRIME_RENDER_OFFLOAD
        value: '1'

      - name: __VK_LAYER_NV_optimus
        value: NVIDIA_only

      - name: VK_LOADER_DRIVERS_SELECT
        value: '*nvidia*'
      - name: SELKIES_H264_STREAMING_MODE
        value: true|locked
      - name: SELKIES_USE_CSS_SCALING
        value: false|locked



      - name: SELKIES_MANUAL_WIDTH
        value: '2560'
      - name: SELKIES_MANUAL_HEIGHT
        value: '1440'

      - name: SELKIES_H264_FULLCOLOR
        value: true|locked
      - name: SELKIES_SCALING_DPI
        value: '96'
    volume:
      enabled: true
      size: '450Gi'
      mount: '/config'
    shm:
      enabled: true
      sizeLimit: '2Gi'
    nodeSelector:
      kubernetes.io/arch: 'amd64'
      nvidia.com/cuda.runtime.major: '13'
    runtimeClassName: 'nvidia'
    tolerations:
      - operator: Exists
    resources:
      limits:
        nvidia.com/gpu: '1'
    securityContext:
      seccompProfile:
        type: Unconfined
    autostartCommand: '/usr/bin/wrapped-steam -bigpicture'

  - name: 'steam-intel'
    resourceName: 'steam-i'
    enabled: true
    image: 'lscr.io/linuxserver/steam'
    tag: '8beba5cd-ls35'
    port: 3000
    hostname: 'steam-intel.mylogin.space'
    env:
      - name: 'PIXELFLUX_WAYLAND'
        value: 'true'
      - name: 'SELKIES_DESKTOP'
        value: 'false'
      - name: 'SELKIES_FRAMERATE'
        value: '120'
      - name: 'SELKIES_H264_STREAMING_MODE'
        value: 'true'
      - name: 'SELKIES_USE_PAINT_OVER_QUALITY'
        value: 'false'
      - name: 'SELKIES_GAMEPAD_ENABLED'
        value: 'true'
      - name: 'DRINODE'
        value: '/dev/dri/renderD128'
      - name: 'DRI_NODE'
        value: '/dev/dri/renderD128'
    volume:
      enabled: true
      size: '300Gi'
      mount: '/config'
      storageClass: 'desktop-rwx'
      accessMode: ReadWriteMany
    shm:
      enabled: true
      sizeLimit: '2Gi'
    nodeSelector:
      kubernetes.io/arch: 'amd64'
    resources:
      limits:
        gpu.intel.com/i915: '1'
    securityContext:
      seccompProfile:
        type: Unconfined

kasm:
  enabled: false
