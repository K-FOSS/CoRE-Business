env: 'prod'

global:
  createDefaultServiceAccount: true

cluster:
  name: ''

datacenter: ''
region: ''

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'
  domainName: 'passwords.mylogin.space'

strategy:
  type: 'RollingUpdate'

vaultwarden:
  domain: 'https://passwords.mylogin.space'

  image:
    repository: 'ghcr.io/dani-garcia/vaultwarden'
    pullPolicy: 'IfNotPresent'
    tag: '1.36.0-alpine'

  resources:
    requests:
      cpu: '15m'
      memory: '100Mi'
    limits:
      cpu: '800m'
      memory: '512Mi'

  config:
    allowSignups: true
    verifySignup: false
    allowInvitation: true
    showPasswordHint: true
    enableWebsockets: true
    enableWebVault: true
    orgCreationUsers: 'all'

  smtp:
    secretName: 'business-vaultwarden-mail-prod'

  psql:
    # The owning ApplicationSet must inject the target's site-local PGPool DNS
    # name and matching site providers.
    host: ''
    database: 'bitwarden'
    crossplaneProvider: ''
    terraformProvider: ''

  credentialsSync:
    enabled: true
    refreshInterval: '1h'
    remoteKey: 'Vaultwarden/prod/Database'
    secretStoreRef:
      kind: ClusterSecretStore
      name: 'mainvault-core'

  user:
    # The owning ApplicationSet enables this only for the PostgreSQL hub.
    enabled: false
    hubCluster: 'core-dc1-talos-prod'
    name: 'vaultwarden-core-prod'
    username: 'vaultwarden-prod'
    connectionSecretName: 'vaultwarden-core-prod'
