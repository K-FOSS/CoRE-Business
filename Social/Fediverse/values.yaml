# Required site inputs are injected by the owning Backplane ApplicationSet.
cluster:
  name: ''
datacenter: ''
region: ''

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

mastodon:
  domain: ''
  image:
    repository: 'ghcr.io/mastodon/mastodon'
    tag: 'v4.7.0@sha256:207fbb6199e7bc6edb59dad30e55f398f9a4b165c7d757e3f781a15cd85093c4'
    pullPolicy: 'IfNotPresent'
  streamingImage:
    repository: 'ghcr.io/mastodon/mastodon-streaming'
    tag: 'v4.7.0@sha256:5f5c6fee47c3cd39fe15b6bf968b36dfcc778c58e78788e1bce04df5d4b29284'
    pullPolicy: 'IfNotPresent'
  user:
    name: 'mastodon'
    username: 'mastodon'
    connectionSecretName: 'mastodon-user'
    s3CredentialsSecretName: 'mastodon-s3-user'
    s3GeneratedCredentialsSecretName: 'mastodon-s3-user-generated'
  psql:
    database: 'mastodon_production'
    host: ''
    port: 5432
    crossplaneProvider: ''
    terraformProvider: ''
  s3:
    bucket: 'mastodon-media'
    region: 'us-east-1'
    crossplaneProvider: ''
    terraformProvider: ''
  oidc:
    enabled: true
    providerConfigRef: 'authentik'
    issuerBaseUrl: 'https://idp.mylogin.space'
    applicationSlug: 'mastodon'
    accessGroup: 'Mastodon Users'
    displayName: 'mylogin.space'
    only: true
    assumeEmailIsVerified: true
  smtp:
    server: 'mail.mylogin.space'
    port: 465

  resources:
    web:
      requests:
        cpu: '500m'
        memory: '1Gi'
      limits:
        memory: '2Gi'
    streaming:
      requests:
        cpu: '100m'
        memory: '256Mi'
      limits:
        memory: '512Mi'
    sidekiq:
      requests:
        cpu: '500m'
        memory: '1Gi'
      limits:
        memory: '2Gi'
    migrate:
      requests:
        cpu: '500m'
        memory: '1Gi'
      limits:
        memory: '2Gi'

redis:
  # Empty host derives from dragonfly.<cluster>.<datacenter>.<region>.mylogin.space.
  host: ''
  port: 6379
  passwordSecretKey: 'REDIS_PASSWORD'
  secretName: 'mastodon-redis'
  secretStoreRef:
    kind: 'ClusterSecretStore'
    name: 'corevault-rootsecrets'
  remoteRef:
    # Empty key derives the site-local path published by the Backplane Dragonfly chart.
    key: ''
    property: 'Password'

secretManagement:
  secretStoreRef:
    kind: 'ClusterSecretStore'
    name: 'mainvault-core'
  remoteKey: ''
  random:
    generatorName: 'mastodon-random'
    secretName: 'mastodon-random'
    bootstrapSecretName: 'mastodon-random-bootstrap'
  vapid:
    secretName: 'mastodon-vapid'
    bootstrapSecretName: 'mastodon-key-bootstrap'
    serviceAccountName: 'mastodon-vapid-generator'
  encryption:
    secretName: 'mastodon-encryption'

controllers:
  migrate:
    enabled: true

monitoring:
  enabled: true
  host: '0.0.0.0'
  port: 9394
  webDetailedMetrics: false
  sidekiqDetailedMetrics: false

serviceMonitor:
  web:
    enabled: true
    service:
      identifier: 'web'
    endpoints:
      - port: 'metrics'
        path: '/metrics'
  streaming:
    enabled: true
    service:
      identifier: 'streaming'
    endpoints:
      - port: 'http'
        path: '/metrics'

podMonitor:
  sidekiq:
    enabled: true
    controller:
      identifier: 'sidekiq'
    podMetricsEndpoints:
      - port: 'metrics'
        path: '/metrics'

service:
  web:
    controller: 'web'
    ports:
      http:
        port: 3000
        protocol: 'HTTP'
      metrics:
        port: 9394
        protocol: 'HTTP'
  streaming:
    controller: 'streaming'
    ports:
      http:
        port: 4000
        protocol: 'HTTP'
        appProtocol: 'kubernetes.io/ws'

persistence:
  tmp:
    type: 'emptyDir'
    globalMounts:
      - path: '/tmp'

route:
  mastodon:
    kind: 'HTTPRoute'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames:
      - '{{ .Values.mastodon.domain }}'
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/api/v1/streaming'
        timeouts:
          request: '0s'
          backendRequest: '0s'
        backendRefs:
          - identifier: 'streaming'
            port: 4000
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        timeouts:
          request: '0s'
          backendRequest: '0s'
        backendRefs:
          - identifier: 'web'
            port: 3000
