# Site inputs are injected by the owning Backplane ApplicationSet.
cluster:
  name: ''
datacenter: ''
region: ''

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

mastodon:
  domain: ''
  image:
    repository: 'ghcr.io/glitch-soc/mastodon'
    tag: 'v4.7.2@sha256:e41c60edd9cc4e6eee8ff80fe478cc06d17309afd26834aa1648ae3364cd9820'
    pullPolicy: 'IfNotPresent'
  streamingImage:
    repository: 'ghcr.io/mastodon/mastodon-streaming'
    tag: 'v4.7.0@sha256:5f5c6fee47c3cd39fe15b6bf968b36dfcc778c58e78788e1bce04df5d4b29284'
    pullPolicy: 'IfNotPresent'
  user:
    name: 'mastodon'
    username: 'mastodon'
    connectionSecretName: 'mastodon-user'
    s3CredentialsSecretName: 'mastodon-s3-user'
    s3GeneratedCredentialsSecretName: 'mastodon-s3-user-generated'
  psql:
    database: 'mastodon_production'
    host: ''
    port: 5432
    crossplaneProvider: ''
    terraformProvider: ''
  s3:
    bucket: 'mastodon-media'
    region: 'us-east-1'
    crossplaneProvider: ''
    terraformProvider: ''
  oidc:
    enabled: true
    providerConfigRef: 'authentik'
    issuerBaseUrl: 'https://idp.mylogin.space'
    applicationSlug: 'mastodon'
    accessGroup: 'Mastodon Users'
    displayName: 'mylogin.space'
    only: true
    assumeEmailIsVerified: true
  smtp:
    server: 'mail.mylogin.space'
    port: 465
  replicas:
    web: 3
    streaming: 3
    sidekiq: 3
  scheduling:
    topologyKey: 'kubernetes.io/hostname'
    whenUnsatisfiable: 'DoNotSchedule'
  resources:
    web:
      requests:
        cpu: '500m'
        memory: '1Gi'
      limits:
        memory: '2Gi'
    streaming:
      requests:
        cpu: '100m'
        memory: '256Mi'
      limits:
        memory: '512Mi'
    sidekiq:
      requests:
        cpu: '500m'
        memory: '1Gi'
      limits:
        memory: '2Gi'
    migrate:
      requests:
        cpu: '500m'
        memory: '1Gi'
      limits:
        memory: '2Gi'
  redis:
    host: ''
    port: 6379
    passwordSecretKey: 'REDIS_PASSWORD'
    secretName: 'mastodon-redis'
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'corevault-rootsecrets'
    remoteRef:
      key: ''
      property: 'Password'
  secretManagement:
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'mainvault-core'
    remoteKey: ''
    random:
      generatorName: 'mastodon-random'
      secretName: 'mastodon-random'
      bootstrapSecretName: 'mastodon-random-bootstrap'
    vapid:
      secretName: 'mastodon-vapid'
      bootstrapSecretName: 'mastodon-key-bootstrap'
      serviceAccountName: 'mastodon-vapid-generator'
    encryption:
      secretName: 'mastodon-encryption'
  monitoring:
    enabled: true
    host: '0.0.0.0'
    port: 9394
    webDetailedMetrics: false
    sidekiqDetailedMetrics: false

bluesky:
  enabled: true
  hostname: 'pds.mylogin.space'
  existingSecret: ''
  emailFromAddress: ''
  user:
    name: 'microblog-pds'
    username: 'microblog-pds'
    connectionSecretName: 'microblog-pds-user'
    s3CredentialsSecretName: 'microblog-pds-s3'
  s3:
    bucket: 'microblog-blobs'
    region: 'us-east-1'
    crossplaneProvider: ''
    terraformProvider: ''
  image:
    repository: 'ghcr.io/bluesky-social/pds'
    tag: '0.4.5027@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12'
    pullPolicy: 'IfNotPresent'
  replicas: 1
  strategy: 'Recreate'
  resources:
    requests:
      cpu: '100m'
      memory: '256Mi'
    limits:
      memory: '1Gi'
