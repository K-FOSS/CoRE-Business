{{- $_ := set .Values "secretManagement" .Values.mastodon.secretManagement -}}
{{- $_ := set .Values "redis" .Values.mastodon.redis -}}
{{- $remoteKey := default (printf "Social/Fediverse/%s/%s/%s/Mastodon" .Values.region .Values.datacenter .Values.cluster.name) .Values.secretManagement.remoteKey -}}
{{- $redisRemoteKey := default (printf "Storage/DragonFly/CoRE/%s/%s/%s/Creds" .Values.region .Values.datacenter .Values.cluster.name) .Values.redis.remoteRef.key -}}
{{- if and .Values.bluesky.enabled (not .Values.bluesky.existingSecret) -}}
{{- $blueskyRemoteKey := default (printf "Social/Fediverse/%s/%s/%s/Bluesky" .Values.region .Values.datacenter .Values.cluster.name) .Values.bluesky.secretManagement.remoteKey -}}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.bluesky.secretManagement.generatorName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  length: 32
  digits: 0
  symbols: 0
  allowRepeat: true
  secretKeys:
    - 'PDS_JWT_SECRET'
    - 'PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX'
  encoding: 'hex'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-generate" .Values.bluesky.secretManagement.secretName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-9'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: {{ .Values.bluesky.secretManagement.bootstrapSecretName | quote }}
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: 'Password'
          name: {{ .Values.bluesky.secretManagement.generatorName | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-pull" .Values.bluesky.secretManagement.secretName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  refreshInterval: '1h'
  secretStoreRef:
    {{- toYaml .Values.bluesky.secretManagement.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.bluesky.secretManagement.secretName | quote }}
    creationPolicy: 'Orphan'
    deletionPolicy: 'Retain'
  data:
    - secretKey: 'PDS_JWT_SECRET'
      remoteRef:
        key: {{ $blueskyRemoteKey | quote }}
        property: 'PDS_JWT_SECRET'
    - secretKey: 'PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX'
      remoteRef:
        key: {{ $blueskyRemoteKey | quote }}
        property: 'PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX'
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ printf "%s-push" .Values.bluesky.secretManagement.secretName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  refreshInterval: '1h'
  updatePolicy: 'Replace'
  deletionPolicy: 'None'
  secretStoreRefs:
    - {{- toYaml .Values.bluesky.secretManagement.secretStoreRef | nindent 6 }}
  selector:
    secret:
      name: {{ .Values.bluesky.secretManagement.bootstrapSecretName | quote }}
  data:
    - match:
        secretKey: 'PDS_JWT_SECRET'
        remoteRef:
          remoteKey: {{ $blueskyRemoteKey | quote }}
          property: 'PDS_JWT_SECRET'
    - match:
        secretKey: 'PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX'
        remoteRef:
          remoteKey: {{ $blueskyRemoteKey | quote }}
          property: 'PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX'
{{ end }}
