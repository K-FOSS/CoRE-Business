{{- include "bjw-s.common.loader.init" . -}}
{{- $_ := required "cluster.name is required" .Values.cluster.name -}}
{{- $_ := required "datacenter is required" .Values.datacenter -}}
{{- $_ := required "region is required" .Values.region -}}
{{- $_ := required "mastodon.domain is required" .Values.mastodon.domain -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" .Values.mastodon.domain) -}}
{{- fail "mastodon.domain must be a public DNS hostname without scheme, port or wildcard" -}}
{{- end -}}
{{- $_ := required "mastodon.user.connectionSecretName is required" .Values.mastodon.user.connectionSecretName -}}
{{- $_ := required "mastodon.user.s3CredentialsSecretName is required" .Values.mastodon.user.s3CredentialsSecretName -}}
{{- $_ := required "mastodon.s3.crossplaneProvider is required" .Values.mastodon.s3.crossplaneProvider -}}
{{- $_ := required "mastodon.s3.terraformProvider is required" .Values.mastodon.s3.terraformProvider -}}
{{- $_ := required "gateway.name is required" .Values.gateway.name -}}
{{- $_ := required "gateway.namespace is required" .Values.gateway.namespace -}}
{{- $_ := required "gateway.sectionName is required" .Values.gateway.sectionName -}}
{{- if .Values.mastodon.oidc.enabled }}
{{- $_ := required "mastodon.oidc.providerConfigRef is required" .Values.mastodon.oidc.providerConfigRef -}}
{{- end }}
{{- $_ := set .Values.route.mastodon "parentRefs" (list (dict "kind" "Gateway" "name" .Values.gateway.name "namespace" .Values.gateway.namespace "sectionName" .Values.gateway.sectionName)) -}}
{{- define "app-template.hardcodedValues" -}}
global:
  nameOverride: {{ .Release.Name | quote }}

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 991
    runAsGroup: 991
    fsGroup: 991
    fsGroupChangePolicy: 'OnRootMismatch'
    seccompProfile:
      type: 'RuntimeDefault'

serviceAccount:
  {{ .Release.Name }}:
    forceRename: {{ .Release.Name | quote }}
    enabled: true
  {{ .Values.secretManagement.vapid.serviceAccountName }}:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-wave: '-10'

controllers:
  web:
    annotations:
      argocd.argoproj.io/sync-wave: '20'
    strategy: 'RollingUpdate'
    rollingUpdate:
      unavailable: '0'
      surge: 1
    serviceAccount:
      identifier: {{ .Release.Name | quote }}
    containers:
      web:
        image:
          {{- toYaml .Values.mastodon.image | nindent 10 }}
        args: ['bundle', 'exec', 'rails', 'server', '-p', '3000']
        env:
          {{- include "mastodon.runtimeEnv" . | nindent 10 }}
        ports:
          - name: http
            containerPort: 3000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ['ALL']
        resources:
          {{- toYaml .Values.mastodon.resources.web | nindent 10 }}
        probes:
          startup:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 3000
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 3000
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 3000
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
  streaming:
    annotations:
      argocd.argoproj.io/sync-wave: '20'
    strategy: 'RollingUpdate'
    rollingUpdate:
      unavailable: '0'
      surge: 1
    serviceAccount:
      identifier: {{ .Release.Name | quote }}
    containers:
      streaming:
        image:
          {{- toYaml .Values.mastodon.streamingImage | nindent 10 }}
        args: ['node', './streaming/index.js']
        env:
          {{- include "mastodon.runtimeEnv" . | nindent 10 }}
          PORT: '4000'
        ports:
          - name: http
            containerPort: 4000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ['ALL']
        resources:
          {{- toYaml .Values.mastodon.resources.streaming | nindent 10 }}
        probes:
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/api/v1/streaming/health'
            port: 4000
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/api/v1/streaming/health'
            port: 4000
            spec:
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
          startup:
            enabled: true
            type: 'HTTP'
            path: '/api/v1/streaming/health'
            port: 4000
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
  sidekiq:
    annotations:
      argocd.argoproj.io/sync-wave: '20'
    strategy: 'RollingUpdate'
    rollingUpdate:
      unavailable: '0'
      surge: 1
    serviceAccount:
      identifier: {{ .Release.Name | quote }}
    containers:
      sidekiq:
        image:
          {{- toYaml .Values.mastodon.image | nindent 10 }}
        args: ['bundle', 'exec', 'sidekiq']
        env:
          {{- include "mastodon.runtimeEnv" . | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ['ALL']
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: ['sh', '-c', "ps aux | grep -q '[s]idekiq'"]
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ['sh', '-c', "ps aux | grep -q '[s]idekiq'"]
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ['sh', '-c', "ps aux | grep -q '[s]idekiq'"]
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
        resources:
          {{- toYaml .Values.mastodon.resources.sidekiq | nindent 10 }}
  migrate:
    enabled: {{ .Values.controllers.migrate.enabled }}
    type: 'job'
    serviceAccount:
      identifier: {{ .Release.Name | quote }}
    annotations:
      argocd.argoproj.io/hook: 'Sync'
      argocd.argoproj.io/hook-delete-policy: 'BeforeHookCreation,HookSucceeded'
      argocd.argoproj.io/sync-wave: '10'
    pod:
      restartPolicy: 'OnFailure'
    containers:
      migrate:
        image:
          {{- toYaml .Values.mastodon.image | nindent 10 }}
        args: ['bundle', 'exec', 'rails', 'db:migrate']
        env:
          {{- include "mastodon.runtimeEnv" . | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ['ALL']
        resources:
          {{- toYaml .Values.mastodon.resources.migrate | nindent 10 }}
  vapid:
    enabled: true
    type: 'job'
    serviceAccount:
      identifier: {{ .Values.secretManagement.vapid.serviceAccountName | quote }}
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
      argocd.argoproj.io/hook: 'Sync'
      argocd.argoproj.io/hook-delete-policy: 'BeforeHookCreation,HookSucceeded'
      argocd.argoproj.io/sync-wave: '-5'
    pod:
      automountServiceAccountToken: true
      restartPolicy: 'OnFailure'
    containers:
      vapid:
        image:
          {{- toYaml .Values.mastodon.image | nindent 10 }}
        command: ['ruby']
        args:
          - '-e'
          - |
            require 'json'
            require 'net/http'
            require 'openssl'
            require 'uri'

            output = IO.popen(['bundle', 'exec', 'rake', 'mastodon:webpush:generate_vapid_key'], &:read)
            private_key = output[/VAPID_PRIVATE_KEY[=:]\s*(\S+)/, 1] || output[/Private\s*->\s*(\S+)/, 1]
            public_key = output[/VAPID_PUBLIC_KEY[=:]\s*(\S+)/, 1] || output[/Public\s*->\s*(\S+)/, 1]
            abort 'Mastodon VAPID generator returned no key pair' unless private_key && public_key

            encryption_output = IO.popen(['bundle', 'exec', 'rake', 'db:encryption:init'], &:read)
            encryption_keys = {}
            ['ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY', 'ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT', 'ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY'].each do |key|
              encryption_keys[key] = encryption_output[/#{key}=([^\s]+)/, 1]
            end
            abort 'Mastodon encryption generator returned incomplete keys' unless encryption_keys.values.all?

            namespace = File.read('/var/run/secrets/kubernetes.io/serviceaccount/namespace').strip
            token = File.read('/var/run/secrets/kubernetes.io/serviceaccount/token').strip
            ca_file = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
            secret_name = '{{ .Values.secretManagement.vapid.bootstrapSecretName }}'
            uri = URI("https://kubernetes.default.svc/api/v1/namespaces/#{namespace}/secrets/#{secret_name}")
            body = {
              apiVersion: 'v1',
              kind: 'Secret',
              metadata: {
                name: secret_name,
                annotations: {
                  'argocd.argoproj.io/sync-options' => 'Prune=false,Delete=false'
                }
              },
              type: 'Opaque',
              stringData: {
                'VAPID_PRIVATE_KEY' => private_key,
                'VAPID_PUBLIC_KEY' => public_key
              }.merge(encryption_keys)
            }.to_json

            request = Net::HTTP::Get.new(uri)
            request['Authorization'] = "Bearer #{token}"
            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = true
            http.ca_file = ca_file
            existing = http.request(request)
            exit 0 if existing.is_a?(Net::HTTPSuccess)
            if existing.code == '404'
              create_uri = URI("https://kubernetes.default.svc/api/v1/namespaces/#{namespace}/secrets")
              request = Net::HTTP::Post.new(create_uri)
              request['Authorization'] = "Bearer #{token}"
              request['Content-Type'] = 'application/json'
              request.body = body
              response = http.request(request)
            else
              abort "Unable to inspect VAPID Secret: #{existing.code}"
            end
            abort "Unable to persist VAPID Secret: #{response.code}" unless response.is_a?(Net::HTTPSuccess)
        env:
          RAILS_ENV: 'production'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ['ALL']
        resources:
          requests:
            cpu: '50m'
            memory: '256Mi'
          limits:
            memory: '512Mi'

persistence:
  tmp:
    globalMounts:
      - path: '/tmp'
{{- end }}

{{- define "mastodon.secretRef" -}}
valueFrom:
  secretKeyRef:
    name: {{ .name | quote }}
    key: {{ .key | quote }}
    optional: false
{{- end }}

{{- define "mastodon.runtimeEnv" -}}
LOCAL_DOMAIN: {{ .Values.mastodon.domain | quote }}
WEB_DOMAIN: {{ .Values.mastodon.domain | quote }}
RAILS_ENV: 'production'
NODE_ENV: 'production'
RAILS_LOG_TO_STDOUT: 'true'
PORT: '3000'
PREPARED_STATEMENTS: 'false'
DB_HOST: {{ default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.mastodon.psql.host | quote }}
DB_PORT: {{ .Values.mastodon.psql.port | quote }}
DB_USER:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.connectionSecretName "key" "username") | nindent 2 }}
DB_PASS:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.connectionSecretName "key" "password") | nindent 2 }}
DB_NAME: {{ .Values.mastodon.psql.database | quote }}
REDIS_HOST: {{ default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.redis.host | quote }}
REDIS_PORT: {{ .Values.redis.port | quote }}
REDIS_PASSWORD:
  {{- include "mastodon.secretRef" (dict "name" .Values.redis.secretName "key" .Values.redis.passwordSecretKey) | nindent 2 }}
REDIS_DRIVER: 'ruby'
REDIS_URL: {{ printf "rediss://:$(REDIS_PASSWORD)@%s:%s" (default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.redis.host) (toString .Values.redis.port) | quote }}
CACHE_REDIS_PASSWORD:
  {{- include "mastodon.secretRef" (dict "name" .Values.redis.secretName "key" .Values.redis.passwordSecretKey) | nindent 2 }}
CACHE_REDIS_URL: {{ printf "rediss://:$(CACHE_REDIS_PASSWORD)@%s:%s" (default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.redis.host) (toString .Values.redis.port) | quote }}
SIDEKIQ_REDIS_PASSWORD:
  {{- include "mastodon.secretRef" (dict "name" .Values.redis.secretName "key" .Values.redis.passwordSecretKey) | nindent 2 }}
SIDEKIQ_REDIS_URL: {{ printf "rediss://:$(SIDEKIQ_REDIS_PASSWORD)@%s:%s" (default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.redis.host) (toString .Values.redis.port) | quote }}
SECRET_KEY_BASE:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.random.secretName "key" "SECRET_KEY_BASE") | nindent 2 }}
OTP_SECRET:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.random.secretName "key" "OTP_SECRET") | nindent 2 }}
VAPID_PUBLIC_KEY:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.vapid.secretName "key" "VAPID_PUBLIC_KEY") | nindent 2 }}
VAPID_PRIVATE_KEY:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.vapid.secretName "key" "VAPID_PRIVATE_KEY") | nindent 2 }}
ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.encryption.secretName "key" "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY") | nindent 2 }}
ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.encryption.secretName "key" "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT") | nindent 2 }}
ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.encryption.secretName "key" "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY") | nindent 2 }}
SMTP_SERVER: {{ .Values.mastodon.smtp.server | quote }}
SMTP_PORT: {{ .Values.mastodon.smtp.port | quote }}
SMTP_LOGIN:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.connectionSecretName "key" "username") | nindent 2 }}
SMTP_PASSWORD:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.connectionSecretName "key" "password") | nindent 2 }}
SMTP_FROM_ADDRESS: {{ .Values.mastodon.smtp.fromAddress | quote }}
SMTP_AUTH_METHOD: 'plain'
SMTP_ENABLE_STARTTLS: 'never'
SMTP_OPENSSL_VERIFY_MODE: 'peer'
SMTP_SSL: 'true'
SMTP_TLS: 'false'
S3_ENABLED: 'true'
S3_REGION: {{ .Values.mastodon.s3.region | quote }}
S3_BUCKET: {{ .Values.mastodon.s3.bucket | quote }}
S3_PROTOCOL: 'https'
S3_SIGNATURE_VERSION: 'v4'
# Backplane-managed S3 policies grant object access directly; do not send a
# public-read ACL, which can be denied by S3-compatible providers.
S3_PERMISSION: ''
# Mastodon inverts this variable when passing force_path_style to aws-sdk-s3.
S3_OVERRIDE_PATH_STYLE: 'false'
S3_HOSTNAME: {{ printf "s3.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region | quote }}
S3_ENDPOINT: {{ printf "https://s3.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region | quote }}
AWS_ACCESS_KEY_ID:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.s3CredentialsSecretName "key" "AccessKey") | nindent 2 }}
AWS_SECRET_ACCESS_KEY:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.s3CredentialsSecretName "key" "SecretAccessKey") | nindent 2 }}
OIDC_ENABLED: {{ .Values.mastodon.oidc.enabled | quote }}
{{- if .Values.mastodon.oidc.enabled }}
OIDC_DISPLAY_NAME: {{ .Values.mastodon.oidc.displayName | quote }}
OIDC_ISSUER:
  {{- include "mastodon.secretRef" (dict "name" (printf "%s-oidc" .Release.Name) "key" "OIDC_ISSUER_URL") | nindent 2 }}
OIDC_DISCOVERY: 'true'
OIDC_SCOPE: 'openid,profile,email'
OIDC_UID_FIELD: 'preferred_username'
OIDC_CLIENT_ID:
  {{- include "mastodon.secretRef" (dict "name" (printf "%s-oidc" .Release.Name) "key" "OIDC_CLIENT_ID") | nindent 2 }}
OIDC_CLIENT_SECRET:
  {{- include "mastodon.secretRef" (dict "name" (printf "%s-oidc" .Release.Name) "key" "OIDC_CLIENT_SECRET") | nindent 2 }}
OIDC_REDIRECT_URI: {{ printf "https://%s/auth/auth/openid_connect/callback" .Values.mastodon.domain | quote }}
OIDC_SECURITY_ASSUME_EMAIL_IS_VERIFIED: {{ .Values.mastodon.oidc.assumeEmailIsVerified | quote }}
OMNIAUTH_ONLY: {{ .Values.mastodon.oidc.only | quote }}
ONE_CLICK_SSO_LOGIN: 'true'
{{- end }}
{{- end }}
{{- $hardcodedValues := include "app-template.hardcodedValues" . | fromYaml -}}
{{- $_ := mustMergeOverwrite .Values $hardcodedValues -}}
{{- include "bjw-s.common.loader.generate" . -}}
