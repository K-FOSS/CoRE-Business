{{- include "bjw-s.common.loader.init" . -}}
{{- $_ := set .Values "redis" .Values.mastodon.redis -}}
{{- $_ := set .Values "secretManagement" .Values.mastodon.secretManagement -}}
{{- $_ := set .Values "monitoring" .Values.mastodon.monitoring -}}
{{- $_ := required "cluster.name is required" .Values.cluster.name -}}
{{- $_ := required "datacenter is required" .Values.datacenter -}}
{{- $_ := required "region is required" .Values.region -}}
{{- $_ := required "tenant.domain is required" .Values.tenant.domain -}}
{{- $_ := required "tenant.mail is required" .Values.tenant.mail -}}
{{- $_ := required "mail.server is required" .Values.mail.server -}}
{{- $_ := required "mail.port is required" .Values.mail.port -}}
{{- $_ := required "mastodon.domain is required" .Values.mastodon.domain -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" .Values.mastodon.domain) -}}
{{- fail "mastodon.domain must be a public DNS hostname without scheme, port or wildcard" -}}
{{- end -}}
{{- $_ := required "mastodon.user.connectionSecretName is required" .Values.mastodon.user.connectionSecretName -}}
{{- $_ := required "mastodon.user.s3CredentialsSecretName is required" .Values.mastodon.user.s3CredentialsSecretName -}}
{{- $_ := required "mastodon.user.s3GeneratedCredentialsSecretName is required" .Values.mastodon.user.s3GeneratedCredentialsSecretName -}}
{{- $_ := required "mastodon.s3.crossplaneProvider is required" .Values.mastodon.s3.crossplaneProvider -}}
{{- $_ := required "mastodon.s3.terraformProvider is required" .Values.mastodon.s3.terraformProvider -}}
{{- $_ := required "gateway.name is required" .Values.gateway.name -}}
{{- $_ := required "gateway.namespace is required" .Values.gateway.namespace -}}
{{- $_ := required "gateway.sectionName is required" .Values.gateway.sectionName -}}
{{- if .Values.mastodon.oidc.enabled }}
{{- $_ := required "mastodon.oidc.providerConfigRef is required" .Values.mastodon.oidc.providerConfigRef -}}
{{- end }}
{{- if .Values.bluesky.enabled }}
{{- $_ := required "bluesky.hostname is required when Bluesky is enabled" .Values.bluesky.hostname -}}
{{- if not .Values.bluesky.existingSecret }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" .Values.bluesky.hostname) }}
{{- fail "bluesky.hostname must be a public DNS hostname without scheme, port or wildcard" -}}
{{- end }}
{{- end }}
{{- if .Values.tranquil.enabled }}
{{- $_ := required "tranquil.hostname is required when Tranquil is enabled" .Values.tranquil.hostname -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" .Values.tranquil.hostname) }}
{{- fail "tranquil.hostname must be a public DNS hostname without scheme, port or wildcard" -}}
{{- end }}
{{- end }}
{{- define "app-template.hardcodedValues" -}}
global:
  nameOverride: {{ .Release.Name | quote }}

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 991
    runAsGroup: 991
    fsGroup: 991
    fsGroupChangePolicy: 'OnRootMismatch'
    seccompProfile:
      type: 'RuntimeDefault'

serviceAccount:
  {{ .Release.Name }}:
    forceRename: {{ .Release.Name | quote }}
    enabled: true
  {{ .Values.secretManagement.vapid.serviceAccountName }}:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-wave: '-10'

controllers:
  web:
    annotations:
      argocd.argoproj.io/sync-wave: '20'
    replicas: {{ .Values.mastodon.replicas.web }}
    strategy: 'RollingUpdate'
    rollingUpdate:
      unavailable: 1
      surge: 1
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'web'
                  app.kubernetes.io/instance: {{ .Release.Name | quote }}
                  app.kubernetes.io/name: {{ .Release.Name | quote }}
              topologyKey: {{ .Values.mastodon.scheduling.topologyKey | quote }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.mastodon.scheduling.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.mastodon.scheduling.whenUnsatisfiable | quote }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/controller: 'web'
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/name: {{ .Release.Name | quote }}
    serviceAccount:
      identifier: {{ .Release.Name | quote }}
    containers:
      web:
        image:
          {{- toYaml .Values.mastodon.image | nindent 10 }}
        args: ['bundle', 'exec', 'rails', 'server', '-p', '3000']
        env:
          {{- include "mastodon.runtimeEnv" . | nindent 10 }}
          MASTODON_PROMETHEUS_EXPORTER_ENABLED: {{ .Values.mastodon.monitoring.enabled | quote }}
          MASTODON_PROMETHEUS_EXPORTER_LOCAL: {{ .Values.mastodon.monitoring.enabled | quote }}
          MASTODON_PROMETHEUS_EXPORTER_HOST: {{ .Values.mastodon.monitoring.host | quote }}
          MASTODON_PROMETHEUS_EXPORTER_WEB_DETAILED_METRICS: {{ .Values.mastodon.monitoring.webDetailedMetrics | quote }}
          MASTODON_PROMETHEUS_EXPORTER_PORT: {{ .Values.mastodon.monitoring.port | quote }}
        ports:
          - name: http
            containerPort: 3000
          - name: metrics
            containerPort: {{ .Values.mastodon.monitoring.port }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ['ALL']
        resources:
          {{- toYaml .Values.mastodon.resources.web | nindent 10 }}
        probes:
          startup:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 3000
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 3000
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 3000
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
  streaming:
    annotations:
      argocd.argoproj.io/sync-wave: '20'
    replicas: {{ .Values.mastodon.replicas.streaming }}
    strategy: 'RollingUpdate'
    rollingUpdate:
      unavailable: 1
      surge: 1
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'streaming'
                  app.kubernetes.io/instance: {{ .Release.Name | quote }}
                  app.kubernetes.io/name: {{ .Release.Name | quote }}
              topologyKey: {{ .Values.mastodon.scheduling.topologyKey | quote }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.mastodon.scheduling.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.mastodon.scheduling.whenUnsatisfiable | quote }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/controller: 'streaming'
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/name: {{ .Release.Name | quote }}
    serviceAccount:
      identifier: {{ .Release.Name | quote }}
    containers:
      streaming:
        image:
          {{- toYaml .Values.mastodon.streamingImage | nindent 10 }}
        args: ['node', './streaming/index.js']
        env:
          {{- include "mastodon.runtimeEnv" . | nindent 10 }}
          PORT: '4000'
        ports:
          - name: http
            containerPort: 4000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ['ALL']
        resources:
          {{- toYaml .Values.mastodon.resources.streaming | nindent 10 }}
        probes:
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/api/v1/streaming/health'
            port: 4000
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/api/v1/streaming/health'
            port: 4000
            spec:
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
          startup:
            enabled: true
            type: 'HTTP'
            path: '/api/v1/streaming/health'
            port: 4000
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
  sidekiq:
    annotations:
      argocd.argoproj.io/sync-wave: '20'
    replicas: {{ .Values.mastodon.replicas.sidekiq }}
    strategy: 'RollingUpdate'
    rollingUpdate:
      unavailable: 1
      surge: 1
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'sidekiq'
                  app.kubernetes.io/instance: {{ .Release.Name | quote }}
                  app.kubernetes.io/name: {{ .Release.Name | quote }}
              topologyKey: {{ .Values.mastodon.scheduling.topologyKey | quote }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.mastodon.scheduling.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.mastodon.scheduling.whenUnsatisfiable | quote }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/controller: 'sidekiq'
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/name: {{ .Release.Name | quote }}
    serviceAccount:
      identifier: {{ .Release.Name | quote }}
    containers:
      sidekiq:
        image:
          {{- toYaml .Values.mastodon.image | nindent 10 }}
        args: ['bundle', 'exec', 'sidekiq']
        env:
          {{- include "mastodon.runtimeEnv" . | nindent 10 }}
          MASTODON_PROMETHEUS_EXPORTER_ENABLED: {{ .Values.mastodon.monitoring.enabled | quote }}
          MASTODON_PROMETHEUS_EXPORTER_LOCAL: {{ .Values.mastodon.monitoring.enabled | quote }}
          MASTODON_PROMETHEUS_EXPORTER_HOST: {{ .Values.mastodon.monitoring.host | quote }}
          MASTODON_PROMETHEUS_EXPORTER_SIDEKIQ_DETAILED_METRICS: {{ .Values.mastodon.monitoring.sidekiqDetailedMetrics | quote }}
          MASTODON_PROMETHEUS_EXPORTER_PORT: {{ .Values.mastodon.monitoring.port | quote }}
        ports:
          - name: metrics
            containerPort: {{ .Values.mastodon.monitoring.port }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ['ALL']
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: ['sh', '-c', "ps aux | grep -q '[s]idekiq'"]
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ['sh', '-c', "ps aux | grep -q '[s]idekiq'"]
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ['sh', '-c', "ps aux | grep -q '[s]idekiq'"]
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
        resources:
          {{- toYaml .Values.mastodon.resources.sidekiq | nindent 10 }}
  migrate:
    enabled: true
    type: 'job'
    serviceAccount:
      identifier: {{ .Release.Name | quote }}
    annotations:
      argocd.argoproj.io/hook: 'Sync'
      argocd.argoproj.io/hook-delete-policy: 'BeforeHookCreation,HookSucceeded'
      argocd.argoproj.io/sync-wave: '10'
    pod:
      restartPolicy: 'OnFailure'
    containers:
      migrate:
        image:
          {{- toYaml .Values.mastodon.image | nindent 10 }}
        args: ['bundle', 'exec', 'rails', 'db:migrate']
        env:
          {{- include "mastodon.runtimeEnv" . | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ['ALL']
        resources:
          {{- toYaml .Values.mastodon.resources.migrate | nindent 10 }}
  vapid:
    enabled: true
    type: 'job'
    serviceAccount:
      identifier: {{ .Values.secretManagement.vapid.serviceAccountName | quote }}
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
      argocd.argoproj.io/hook: 'Sync'
      argocd.argoproj.io/hook-delete-policy: 'BeforeHookCreation,HookSucceeded'
      argocd.argoproj.io/sync-wave: '-5'
    pod:
      automountServiceAccountToken: true
      restartPolicy: 'OnFailure'
    containers:
      vapid:
        image:
          {{- toYaml .Values.mastodon.image | nindent 10 }}
        command: ['ruby']
        args:
          - '-e'
          - |
            require 'json'
            require 'net/http'
            require 'openssl'
            require 'uri'

            output = IO.popen(['bundle', 'exec', 'rake', 'mastodon:webpush:generate_vapid_key'], &:read)
            private_key = output[/VAPID_PRIVATE_KEY[=:]\s*(\S+)/, 1] || output[/Private\s*->\s*(\S+)/, 1]
            public_key = output[/VAPID_PUBLIC_KEY[=:]\s*(\S+)/, 1] || output[/Public\s*->\s*(\S+)/, 1]
            abort 'Mastodon VAPID generator returned no key pair' unless private_key && public_key

            encryption_output = IO.popen(['bundle', 'exec', 'rake', 'db:encryption:init'], &:read)
            encryption_keys = {}
            ['ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY', 'ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT', 'ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY'].each do |key|
              encryption_keys[key] = encryption_output[/#{key}=([^\s]+)/, 1]
            end
            abort 'Mastodon encryption generator returned incomplete keys' unless encryption_keys.values.all?

            namespace = File.read('/var/run/secrets/kubernetes.io/serviceaccount/namespace').strip
            token = File.read('/var/run/secrets/kubernetes.io/serviceaccount/token').strip
            ca_file = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
            secret_name = '{{ .Values.secretManagement.vapid.bootstrapSecretName }}'
            uri = URI("https://kubernetes.default.svc/api/v1/namespaces/#{namespace}/secrets/#{secret_name}")
            body = {
              apiVersion: 'v1',
              kind: 'Secret',
              metadata: {
                name: secret_name,
                annotations: {
                  'argocd.argoproj.io/sync-options' => 'Prune=false,Delete=false'
                }
              },
              type: 'Opaque',
              stringData: {
                'VAPID_PRIVATE_KEY' => private_key,
                'VAPID_PUBLIC_KEY' => public_key
              }.merge(encryption_keys)
            }.to_json

            request = Net::HTTP::Get.new(uri)
            request['Authorization'] = "Bearer #{token}"
            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = true
            http.ca_file = ca_file
            existing = http.request(request)
            exit 0 if existing.is_a?(Net::HTTPSuccess)
            if existing.code == '404'
              create_uri = URI("https://kubernetes.default.svc/api/v1/namespaces/#{namespace}/secrets")
              request = Net::HTTP::Post.new(create_uri)
              request['Authorization'] = "Bearer #{token}"
              request['Content-Type'] = 'application/json'
              request.body = body
              response = http.request(request)
            else
              abort "Unable to inspect VAPID Secret: #{existing.code}"
            end
            abort "Unable to persist VAPID Secret: #{response.code}" unless response.is_a?(Net::HTTPSuccess)
        env:
          RAILS_ENV: 'production'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ['ALL']
        resources:
          requests:
            cpu: '50m'
            memory: '256Mi'
          limits:
            memory: '512Mi'

{{- end }}
{{- define "bluesky.hardcodedValues" -}}
{{- if .Values.bluesky.enabled }}
controllers:
    bluesky:
      type: 'deployment'
      replicas: {{ .Values.bluesky.replicas }}
      strategy: {{ .Values.bluesky.strategy | quote }}
      {{- if eq .Values.bluesky.strategy "RollingUpdate" }}
      rollingUpdate:
        unavailable: {{ .Values.bluesky.rollingUpdate.unavailable }}
        surge: {{ .Values.bluesky.rollingUpdate.surge | quote }}
      {{- end }}
      pod:
        terminationGracePeriodSeconds: {{ .Values.bluesky.terminationGracePeriodSeconds }}
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: 'OnRootMismatch'
      serviceAccount:
        identifier: {{ .Release.Name | quote }}
      containers:
        bluesky:
          image:
            {{- toYaml .Values.bluesky.image | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep {{ .Values.bluesky.terminationDrainSeconds }}']
          env:
            PDS_HOSTNAME: {{ .Values.bluesky.hostname | quote }}
            PDS_PORT: '3000'
            PDS_DATA_DIRECTORY: '/pds'
            PDS_BLOBSTORE_S3_BUCKET:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bluesky.user.connectionSecretName | quote }}
                  key: 'username'
            PDS_BLOBSTORE_S3_REGION: {{ .Values.bluesky.s3.region | quote }}
            PDS_BLOBSTORE_S3_ENDPOINT: {{ printf "https://s3.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region | quote }}
            PDS_BLOBSTORE_S3_FORCE_PATH_STYLE: 'true'
            PDS_BLOBSTORE_S3_ACCESS_KEY_ID:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bluesky.user.s3CredentialsSecretName | quote }}
                  key: 'AccessKey'
            PDS_BLOBSTORE_S3_SECRET_ACCESS_KEY:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bluesky.user.s3CredentialsSecretName | quote }}
                  key: 'SecretAccessKey'
            PDS_BLOB_UPLOAD_LIMIT: '314572800'
            PDS_DID_PLC_URL: 'https://plc.directory'
            PDS_BSKY_APP_VIEW_URL: 'https://api.bsky.app'
            PDS_BSKY_APP_VIEW_DID: 'did:web:api.bsky.app'
            PDS_REPORT_SERVICE_URL: 'https://mod.bsky.app'
            PDS_REPORT_SERVICE_DID: 'did:plc:ar7c4by46qjdydhdevvrndac'
            PDS_CRAWLERS: 'https://bsky.network'
            PDS_INVITE_REQUIRED: 'true'
            PDS_RATE_LIMITS_ENABLED: 'true'
            LOG_ENABLED: 'true'
            A_PDS_EMAIL_FROM_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bluesky.user.connectionSecretName | quote }}
                  key: 'username'
            PDS_EMAIL_FROM_ADDRESS: {{ printf "$(A_PDS_EMAIL_FROM_USERNAME)@%s" .Values.tenant.mail | quote }}
            PDS_JWT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.bluesky.secretManagement.secretName .Values.bluesky.existingSecret | quote }}
                  key: 'PDS_JWT_SECRET'
            PDS_ADMIN_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.bluesky.existingSecret }}{{ .Values.bluesky.existingSecret | quote }}{{ else }}{{ .Values.bluesky.user.connectionSecretName | quote }}{{ end }}
                  key: {{ if .Values.bluesky.existingSecret }}'PDS_ADMIN_PASSWORD'{{ else }}'password'{{ end }}
            PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX:
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.bluesky.secretManagement.secretName .Values.bluesky.existingSecret | quote }}
                  key: 'PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX'
            PDS_EMAIL_SMTP_URL:
              {{- if .Values.bluesky.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bluesky.existingSecret | quote }}
                  key: 'PDS_EMAIL_SMTP_URL'
              {{- else }}
              value: {{ printf "%s://$(A_PDS_EMAIL_SMTP_USERNAME):$(A_PDS_EMAIL_SMTP_PASSWORD)@%s:%s/" (ternary "smtps" "smtp" .Values.mail.tls) .Values.mail.server (toString .Values.mail.port) | quote }}
            A_PDS_EMAIL_SMTP_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bluesky.user.connectionSecretName | quote }}
                  key: 'password'
            A_PDS_EMAIL_SMTP_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bluesky.user.connectionSecretName | quote }}
                  key: 'username'
              {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: 'RuntimeDefault'
          resources:
            {{- toYaml .Values.bluesky.resources | nindent 12 }}
          probes:
            startup:
              enabled: true
              type: 'HTTP'
              path: '/xrpc/_health'
              port: 3000
              spec:
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 60
            readiness:
              enabled: true
              type: 'HTTP'
              path: '/xrpc/_health'
              port: 3000
            liveness:
              enabled: true
              type: 'HTTP'
              path: '/xrpc/_health'
              port: 3000
              spec:
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 5

service:
  bluesky:
    controller: 'bluesky'
    ports:
      http:
        port: 3000
        protocol: 'HTTP'
        appProtocol: 'kubernetes.io/ws'

persistence:
  bluesky-data:
    type: 'persistentVolumeClaim'
    forceRename: 'bsky-core'
    storageClass: 'longhorn'
    accessMode: 'ReadWriteOnce'
    size: '20Gi'
    retain: true
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    advancedMounts:
      bluesky:
        bluesky:
          - path: '/pds'

route:
  bluesky:
    kind: 'HTTPRoute'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames:
      - {{ .Values.bluesky.hostname | quote }}
      - {{ printf "*.%s" .Values.bluesky.hostname | quote }}
    parentRefs:
      - kind: 'Gateway'
        name: {{ .Values.gateway.name | quote }}
        namespace: {{ .Values.gateway.namespace | quote }}
        sectionName: {{ .Values.gateway.sectionName | quote }}
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        timeouts:
          request: '0s'
          backendRequest: '0s'
        backendRefs:
          - identifier: 'bluesky'
            port: 3000
{{- end }}
{{- end }}
{{- define "tranquil.hardcodedValues" -}}
{{- if .Values.tranquil.enabled }}
controllers:
  tranquil:
    type: 'deployment'
    replicas: {{ .Values.tranquil.replicas }}
    strategy: {{ .Values.tranquil.strategy | quote }}
    rollingUpdate:
      unavailable: {{ .Values.tranquil.rollingUpdate.unavailable }}
      surge: {{ .Values.tranquil.rollingUpdate.surge | quote }}
    pod:
      terminationGracePeriodSeconds: {{ .Values.tranquil.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ .Values.tranquil.imagePullSecret.name | quote }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: 'OnRootMismatch'
    serviceAccount:
      identifier: {{ .Release.Name | quote }}
    containers:
      tranquil:
        image:
          {{- toYaml .Values.tranquil.image | nindent 10 }}
        lifecycle:
          preStop:
            exec:
              command: ['sh', '-c', 'sleep {{ .Values.tranquil.terminationDrainSeconds }}']
        env:
          SERVER_HOST: '0.0.0.0'
          SERVER_PORT: '3000'
          PDS_HOSTNAME: {{ .Values.tranquil.hostname | quote }}
          DATABASE_URL: {{ printf "postgres://$(A_TRANQUIL_DB_USERNAME):$(A_TRANQUIL_DB_PASSWORD)@%s:%s/$(A_TRANQUIL_DB_USERNAME)" (default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.tranquil.psql.host) (toString .Values.tranquil.psql.port) | quote }}
          CACHE_BACKEND: {{ .Values.tranquil.cache.backend | quote }}
          REPO_BACKEND: 'postgres'
          A_TRANQUIL_CACHE_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.cache.secretName | quote }}
                key: {{ .Values.tranquil.cache.passwordSecretKey | quote }}
          VALKEY_URL: {{ printf "rediss://:$(A_TRANQUIL_CACHE_PASSWORD)@%s:%s" (default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.tranquil.cache.host) (toString .Values.tranquil.cache.port) | quote }}
          BLOB_STORAGE_BACKEND: 's3'
          AWS_REGION: {{ .Values.tranquil.s3.region | quote }}
          S3_BUCKET:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.user.connectionSecretName | quote }}
                key: 'username'
          S3_ENDPOINT: {{ printf "https://s3.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region | quote }}
          AWS_ACCESS_KEY_ID:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.user.s3CredentialsSecretName | quote }}
                key: 'AccessKey'
          AWS_SECRET_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.user.s3CredentialsSecretName | quote }}
                key: 'SecretAccessKey'
          A_TRANQUIL_DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.user.connectionSecretName | quote }}
                key: 'username'
          A_TRANQUIL_DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.user.connectionSecretName | quote }}
                key: 'password'
          JWT_SECRET:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.secretManagement.secretName | quote }}
                key: 'PDS_JWT_SECRET'
          DPOP_SECRET:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.secretManagement.secretName | quote }}
                key: 'DPOP_SECRET'
          MASTER_KEY:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.secretManagement.secretName | quote }}
                key: 'MASTER_KEY'
          SSO_OIDC_ENABLED: {{ .Values.tranquil.oidc.enabled | quote }}
          SSO_OIDC_CLIENT_ID:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.oidc.workspaceName | quote }}
                key: 'OIDC_CLIENT_ID'
          SSO_OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.oidc.workspaceName | quote }}
                key: 'OIDC_CLIENT_SECRET'
          SSO_OIDC_ISSUER:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.oidc.workspaceName | quote }}
                key: 'OIDC_ISSUER_URL'
          SSO_OIDC_NAME: {{ .Values.tranquil.oidc.displayName | quote }}
          A_PDS_EMAIL_FROM_USERNAME:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.user.connectionSecretName | quote }}
                key: 'username'
          MAIL_FROM_ADDRESS: {{ printf "$(A_PDS_EMAIL_FROM_USERNAME)@%s" .Values.tenant.mail | quote }}
          MAIL_SMARTHOST_HOST: {{ .Values.mail.server | quote }}
          MAIL_SMARTHOST_PORT: {{ .Values.mail.port | quote }}
          MAIL_SMARTHOST_TLS: {{ ternary "implicit" "starttls" .Values.mail.tls | quote }}
          MAIL_SMARTHOST_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.user.connectionSecretName | quote }}
                key: 'password'
          MAIL_SMARTHOST_USERNAME:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tranquil.user.connectionSecretName | quote }}
                key: 'username'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ['ALL']
          seccompProfile:
            type: 'RuntimeDefault'
        resources:
          {{- toYaml .Values.tranquil.resources | nindent 10 }}
        probes:
          startup:
            enabled: true
            type: 'HTTP'
            path: '/xrpc/_health'
            port: 3000
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/xrpc/_health'
            port: 3000
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/xrpc/_health'
            port: 3000
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
service:
  tranquil:
    controller: 'tranquil'
    ports:
      http:
        port: 3000
        protocol: 'HTTP'
        appProtocol: 'kubernetes.io/ws'
route:
  tranquil:
    kind: 'HTTPRoute'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames:
      - {{ .Values.tranquil.hostname | quote }}
      - {{ printf "*.%s" .Values.tranquil.hostname | quote }}
    parentRefs:
      - kind: 'Gateway'
        name: {{ .Values.gateway.name | quote }}
        namespace: {{ .Values.gateway.namespace | quote }}
        sectionName: {{ .Values.gateway.sectionName | quote }}
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        timeouts:
          request: '0s'
          backendRequest: '0s'
        backendRefs:
          - identifier: 'tranquil'
            port: 3000
{{- end }}
{{- end }}

{{- define "mastodon.resources" -}}
service:
  web:
    controller: 'web'
    ports:
      http:
        port: 3000
        protocol: 'HTTP'
      metrics:
        port: 9394
        protocol: 'HTTP'
  streaming:
    controller: 'streaming'
    ports:
      http:
        port: 4000
        protocol: 'HTTP'
        appProtocol: 'kubernetes.io/ws'
serviceMonitor:
  web:
    enabled: true
    service:
      identifier: 'web'
    endpoints:
      - port: 'metrics'
        path: '/metrics'
  streaming:
    enabled: true
    service:
      identifier: 'streaming'
    endpoints:
      - port: 'http'
        path: '/metrics'
podMonitor:
  sidekiq:
    enabled: true
    controller:
      identifier: 'sidekiq'
    podMetricsEndpoints:
      - port: 'metrics'
        path: '/metrics'
persistence:
  tmp:
    type: 'emptyDir'
    globalMounts:
      - path: '/tmp'
route:
  mastodon:
    kind: 'HTTPRoute'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames:
      - {{ .Values.mastodon.domain | quote }}
    parentRefs:
      - kind: 'Gateway'
        name: {{ .Values.gateway.name | quote }}
        namespace: {{ .Values.gateway.namespace | quote }}
        sectionName: {{ .Values.gateway.sectionName | quote }}
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/api/v1/streaming'
        timeouts:
          request: '0s'
          backendRequest: '0s'
        backendRefs:
          - identifier: 'streaming'
            port: 4000
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        timeouts:
          request: '0s'
          backendRequest: '0s'
        backendRefs:
          - identifier: 'web'
            port: 3000
{{- end }}

{{- define "mastodon.secretRef" -}}
valueFrom:
  secretKeyRef:
    name: {{ .name | quote }}
    key: {{ .key | quote }}
    optional: false
{{- end }}

{{- define "mastodon.runtimeEnv" -}}
LOCAL_DOMAIN: {{ .Values.mastodon.domain | quote }}
WEB_DOMAIN: {{ .Values.mastodon.domain | quote }}
RAILS_ENV: 'production'
NODE_ENV: 'production'
RAILS_LOG_TO_STDOUT: 'true'
PORT: '3000'
PREPARED_STATEMENTS: 'false'
DB_HOST: {{ default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.mastodon.psql.host | quote }}
DB_PORT: {{ .Values.mastodon.psql.port | quote }}
DB_USER:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.connectionSecretName "key" "username") | nindent 2 }}
DB_PASS:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.connectionSecretName "key" "password") | nindent 2 }}
DB_NAME: {{ .Values.mastodon.psql.database | quote }}
REDIS_HOST: {{ default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.redis.host | quote }}
REDIS_PORT: {{ .Values.redis.port | quote }}
REDIS_PASSWORD:
  {{- include "mastodon.secretRef" (dict "name" .Values.redis.secretName "key" .Values.redis.passwordSecretKey) | nindent 2 }}
REDIS_DRIVER: 'ruby'
REDIS_URL: {{ printf "rediss://:$(REDIS_PASSWORD)@%s:%s" (default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.redis.host) (toString .Values.redis.port) | quote }}
CACHE_REDIS_PASSWORD:
  {{- include "mastodon.secretRef" (dict "name" .Values.redis.secretName "key" .Values.redis.passwordSecretKey) | nindent 2 }}
CACHE_REDIS_URL: {{ printf "rediss://:$(CACHE_REDIS_PASSWORD)@%s:%s" (default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.redis.host) (toString .Values.redis.port) | quote }}
SIDEKIQ_REDIS_PASSWORD:
  {{- include "mastodon.secretRef" (dict "name" .Values.redis.secretName "key" .Values.redis.passwordSecretKey) | nindent 2 }}
SIDEKIQ_REDIS_URL: {{ printf "rediss://:$(SIDEKIQ_REDIS_PASSWORD)@%s:%s" (default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.redis.host) (toString .Values.redis.port) | quote }}
SECRET_KEY_BASE:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.random.secretName "key" "SECRET_KEY_BASE") | nindent 2 }}
OTP_SECRET:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.random.secretName "key" "OTP_SECRET") | nindent 2 }}
VAPID_PUBLIC_KEY:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.vapid.secretName "key" "VAPID_PUBLIC_KEY") | nindent 2 }}
VAPID_PRIVATE_KEY:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.vapid.secretName "key" "VAPID_PRIVATE_KEY") | nindent 2 }}
ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.encryption.secretName "key" "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY") | nindent 2 }}
ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.encryption.secretName "key" "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT") | nindent 2 }}
ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:
  {{- include "mastodon.secretRef" (dict "name" .Values.secretManagement.encryption.secretName "key" "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY") | nindent 2 }}
SMTP_SERVER: {{ .Values.mail.server | quote }}
SMTP_PORT: {{ .Values.mail.port | quote }}
SMTP_LOGIN:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.connectionSecretName "key" "username") | nindent 2 }}
SMTP_PASSWORD:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.connectionSecretName "key" "password") | nindent 2 }}
SMTP_FROM_ADDRESS: {{ printf "%s@mail.mylogin.space" .Values.mastodon.user.username | quote }}
SMTP_AUTH_METHOD: 'plain'
SMTP_ENABLE_STARTTLS: {{ if .Values.mail.tls }}'never'{{ else }}'auto'{{ end }}
SMTP_OPENSSL_VERIFY_MODE: 'peer'
SMTP_SSL: {{ .Values.mail.tls | quote }}
SMTP_TLS: 'false'
S3_ENABLED: 'true'
S3_REGION: {{ .Values.mastodon.s3.region | quote }}
S3_BUCKET: {{ .Values.mastodon.s3.bucket | quote }}
S3_PROTOCOL: 'https'
S3_SIGNATURE_VERSION: 'v4'
# Backplane-managed S3 policies grant object access directly; do not send a
# public-read ACL, which can be denied by S3-compatible providers.
S3_PERMISSION: ''
# Mastodon inverts this variable when passing force_path_style to aws-sdk-s3.
S3_OVERRIDE_PATH_STYLE: 'false'
S3_HOSTNAME: {{ printf "s3.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region | quote }}
S3_ENDPOINT: {{ printf "https://s3.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region | quote }}
AWS_ACCESS_KEY_ID:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.s3CredentialsSecretName "key" "AccessKey") | nindent 2 }}
AWS_SECRET_ACCESS_KEY:
  {{- include "mastodon.secretRef" (dict "name" .Values.mastodon.user.s3CredentialsSecretName "key" "SecretAccessKey") | nindent 2 }}
OIDC_ENABLED: {{ .Values.mastodon.oidc.enabled | quote }}
{{- if .Values.mastodon.oidc.enabled }}
OIDC_DISPLAY_NAME: {{ .Values.mastodon.oidc.displayName | quote }}
OIDC_ISSUER:
  {{- include "mastodon.secretRef" (dict "name" (printf "%s-oidc" .Release.Name) "key" "OIDC_ISSUER_URL") | nindent 2 }}
OIDC_DISCOVERY: 'true'
OIDC_SCOPE: 'openid,profile,email'
OIDC_UID_FIELD: 'preferred_username'
OIDC_CLIENT_ID:
  {{- include "mastodon.secretRef" (dict "name" (printf "%s-oidc" .Release.Name) "key" "OIDC_CLIENT_ID") | nindent 2 }}
OIDC_CLIENT_SECRET:
  {{- include "mastodon.secretRef" (dict "name" (printf "%s-oidc" .Release.Name) "key" "OIDC_CLIENT_SECRET") | nindent 2 }}
OIDC_REDIRECT_URI: {{ printf "https://%s/auth/auth/openid_connect/callback" .Values.mastodon.domain | quote }}
OIDC_SECURITY_ASSUME_EMAIL_IS_VERIFIED: {{ .Values.mastodon.oidc.assumeEmailIsVerified | quote }}
OMNIAUTH_ONLY: {{ .Values.mastodon.oidc.only | quote }}
ONE_CLICK_SSO_LOGIN: 'true'
{{- end }}
{{- end }}
{{- $hardcodedValues := include "app-template.hardcodedValues" . | fromYaml -}}
{{- $_ := mustMergeOverwrite .Values $hardcodedValues -}}
{{- $_ := set .Values "controllers" $hardcodedValues.controllers -}}
{{- $mastodonResources := include "mastodon.resources" . | fromYaml -}}
{{- $_ := set .Values "service" $mastodonResources.service -}}
{{- $_ := set .Values "serviceMonitor" $mastodonResources.serviceMonitor -}}
{{- $_ := set .Values "podMonitor" $mastodonResources.podMonitor -}}
{{- $_ := set .Values "persistence" $mastodonResources.persistence -}}
{{- $_ := set .Values "route" $mastodonResources.route -}}
{{- if .Values.bluesky.enabled }}
{{- $blueskyValues := include "bluesky.hardcodedValues" . | fromYaml -}}
{{- $_ := set .Values.controllers "bluesky" (index $blueskyValues.controllers "bluesky") -}}
{{- $_ := set .Values.service "bluesky" (index $blueskyValues.service "bluesky") -}}
{{- $_ := set .Values.persistence "bluesky-data" (index $blueskyValues.persistence "bluesky-data") -}}
{{- $_ := set .Values.route "bluesky" (index $blueskyValues.route "bluesky") -}}
{{- end }}
{{- if .Values.tranquil.enabled }}
{{- $tranquilValues := include "tranquil.hardcodedValues" . | fromYaml -}}
{{- $_ := set .Values.controllers "tranquil" (index $tranquilValues.controllers "tranquil") -}}
{{- $_ := set .Values.service "tranquil" (index $tranquilValues.service "tranquil") -}}
{{- $_ := set .Values.route "tranquil" (index $tranquilValues.route "tranquil") -}}
{{- end }}
