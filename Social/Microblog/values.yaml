# Required site inputs. No production credentials belong in Helm values.
pds:
  hostname: ''
  existingSecret: ''
  emailFromAddress: ''

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  # Must select a listener with certificates for hostname AND *.hostname.
  sectionName: ''

controllers:
  pds:
    type: 'deployment'
    replicas: 1
    strategy: 'Recreate'
    pod:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: 'OnRootMismatch'
    containers:
      pds:
        image:
          repository: 'ghcr.io/bluesky-social/pds'
          tag: '0.4.5027@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12'
          pullPolicy: 'IfNotPresent'
        env:
          PDS_HOSTNAME: '{{ .Values.pds.hostname }}'
          PDS_PORT: '3000'
          PDS_DATA_DIRECTORY: '/pds'
          PDS_BLOBSTORE_DISK_LOCATION: '/pds/blocks'
          PDS_BLOB_UPLOAD_LIMIT: '314572800'
          PDS_DID_PLC_URL: 'https://plc.directory'
          PDS_BSKY_APP_VIEW_URL: 'https://api.bsky.app'
          PDS_BSKY_APP_VIEW_DID: 'did:web:api.bsky.app'
          PDS_REPORT_SERVICE_URL: 'https://mod.bsky.app'
          PDS_REPORT_SERVICE_DID: 'did:plc:ar7c4by46qjdydhdevvrndac'
          PDS_CRAWLERS: 'https://bsky.network'
          PDS_INVITE_REQUIRED: 'true'
          PDS_RATE_LIMITS_ENABLED: 'true'
          LOG_ENABLED: 'true'
          PDS_EMAIL_FROM_ADDRESS: '{{ .Values.pds.emailFromAddress }}'
          PDS_JWT_SECRET:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.pds.existingSecret }}'
                key: 'PDS_JWT_SECRET'
          PDS_ADMIN_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.pds.existingSecret }}'
                key: 'PDS_ADMIN_PASSWORD'
          PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.pds.existingSecret }}'
                key: 'PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX'
          PDS_EMAIL_SMTP_URL:
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.pds.existingSecret }}'
                key: 'PDS_EMAIL_SMTP_URL'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ['ALL']
          seccompProfile:
            type: 'RuntimeDefault'
        resources:
          requests:
            cpu: '100m'
            memory: '256Mi'
          limits:
            memory: '1Gi'
        probes:
          startup:
            enabled: true
            type: 'HTTP'
            path: '/xrpc/_health'
            port: 3000
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/xrpc/_health'
            port: 3000
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/xrpc/_health'
            port: 3000
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5

service:
  pds:
    controller: 'pds'
    ports:
      http:
        port: 3000
        protocol: 'HTTP'

persistence:
  data:
    type: 'persistentVolumeClaim'
    storageClass: 'longhorn'
    accessMode: 'ReadWriteOnce'
    size: '20Gi'
    retain: true
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    globalMounts:
      - path: '/pds'
  tmp:
    type: 'emptyDir'
    globalMounts:
      - path: '/tmp'

route:
  pds:
    kind: HTTPRoute
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    # Populated from gateway by templates/common.yaml.
    hostnames:
      - '{{ .Values.pds.hostname }}'
      - '*.{{ .Values.pds.hostname }}'
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        timeouts:
          request: '0s'
          backendRequest: '0s'
        backendRefs:
          - identifier: 'pds'
            port: 3000
