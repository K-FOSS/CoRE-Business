# Site and cluster inputs are injected by the owning Backplane ApplicationSet.
cluster:
  name: ''
datacenter: ''
domain: 'mylogin.space'
region: ''

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'
  requestTimeout: '1m'

element:
  hostname: 'element.mylogin.space'
  image:
    repository: 'ghcr.io/element-hq/element-web'
    tag: 'v1.12.29@sha256:da32e88c8dafe2c3d4f40ca5e90ab2f43a7c9ac35f0977ec7662dcb4fdcd56d8'
    pullPolicy: 'IfNotPresent'
  resources:
    requests:
      cpu: '100m'
      memory: '128Mi'
    limits:
      memory: '512Mi'

mas:
  enabled: true
  replicas: 1
  hostname: 'matrix-auth.mylogin.space'
  keyGeneration:
    enabled: true
  image:
    repository: 'ghcr.io/element-hq/matrix-authentication-service'
    tag: '1.20.0@sha256:1b0cc87ca6bd6186172a123228cfc3be4c94522d5ecc71e7baeaf23e48ce883a'
    pullPolicy: 'IfNotPresent'
  user:
    name: 'matrix-mas'
    username: 'matrix-mas'
    connectionSecretName: 'matrix-mas-user'
  secretManagement:
    secretName: 'matrix-mas-runtime'
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'mainvault-core'
    remoteKey: 'Social/Matrix/MAS'
    matrixSecretKey: 'MATRIX_SECRET'
    encryptionKey: 'ENCRYPTION_KEY'
    signingKey: 'RSA_KEY'

synapse:
  hostname: 'matrix.mylogin.space'
  serverName: 'matrix.mylogin.space'
  replicas: 1
  image:
    repository: 'ghcr.io/element-hq/synapse'
    tag: 'v1.139.0'
    pullPolicy: 'IfNotPresent'
  user:
    name: 'matrix-synapse'
    username: 'matrix-synapse'
    connectionSecretName: 'matrix-synapse-user'
  psql:
    # This is the Backplane global/hub PostgreSQL service, not psql-local.
    host: 'psql-int.core-home1-talos-prod.home1.yvr.mylogin.space'
    port: 5432
    database: ''
    # Compatibility switch for the existing global database. Recreate it with
    # LC_COLLATE=C and LC_CTYPE=C before disabling this override.
    allowUnsafeLocale: true
    crossplaneProvider: 'psql-main'
    terraformProvider: 'psql'
  oidc:
    enabled: true
    providerConfigRef: 'authentik'
    issuerBaseUrl: 'https://idp.mylogin.space'
    applicationSlug: 'matrix'
    accessGroup: 'Matrix Users'
    displayName: 'mylogin.space'
    secretName: 'matrix-synapse-oidc'
  ldap:
    enabled: false
    bindPasswordKey: 'password'
  registration:
    enabled: false
  secretManagement:
    generatorName: 'matrix-synapse-secrets'
    secretName: 'matrix-synapse-runtime'
    bootstrapSecretName: 'matrix-synapse-runtime-bootstrap'
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'mainvault-core'
    remoteKey: 'Social/Matrix/Synapse'
  resources:
    requests:
      cpu: '500m'
      memory: '1Gi'
    limits:
      memory: '2Gi'
  storage:
    size: '50Gi'
    storageClass: 'longhorn'
    mediaStorePath: '/data/media_store'
    uploadsPath: '/data/uploads'

migration:
  # Deliberately false: the migration Job is never part of an ordinary sync.
  enabled: false
  mode: 'migrate'
  dryRunDatabase:
    host: ''
    port: 5432
    database: ''
    connectionSecretName: ''
  migrateApproved: true
  activeDeadlineSeconds: 1800
  resources:
    requests:
      cpu: '100m'
      memory: '256Mi'
    limits:
      cpu: '1'
      memory: '1Gi'
