# Site and cluster inputs are injected by the owning Backplane ApplicationSet.
cluster:
  name: ''
datacenter: ''
domain: 'mylogin.space'
region: ''

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'
  requestTimeout: '1m'

support:
  matrixId: '@kjones:matrix.mylogin.space'

turn:
  enabled: true
  hostname: 'nat.mylogin.space'
  ports: [3478]
  secret:
    name: 'matrix-turn-auth'
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'corevault-rootsecrets'
    remoteKey: 'Network/NATPuncher/yxl/dc1/core-dc1-talos-prod/TurnAuth'
    remoteProperty: 'Secret'
  allowGuests: true

element:
  hostname: 'element.mylogin.space'
  image:
    repository: 'ghcr.io/element-hq/element-web'
    tag: 'v1.12.35@sha256:406b48b80153818284a235fa3600b2a5b5b6b0aa0e4ef4896b36d8d3461352f3'
    pullPolicy: 'IfNotPresent'
  resources:
    requests:
      cpu: '100m'
      memory: '128Mi'
    limits:
      memory: '512Mi'

ketesa:
  hostname: 'matrix-admin.mylogin.space'
  image:
    repository: 'ghcr.io/etkecc/ketesa'
    tag: 'v1.5.2@sha256:1b9c40be1dcc3c7a4913c5231fa06a08e38ac0ab547ccb3858ad004151e04b1c'
    pullPolicy: 'IfNotPresent'
  resources:
    requests:
      cpu: '50m'
      memory: '64Mi'
    limits:
      memory: '256Mi'

mas:
  enabled: true
  replicas: 1
  hostname: 'matrix-auth.mylogin.space'
  keyGeneration:
    enabled: true
  image:
    repository: 'ghcr.io/element-hq/matrix-authentication-service'
    tag: '1.29.0@sha256:9247315c9e86096aaaa393c7b4b685dc506010e09ff4b89331ef2ed4854167af'
    pullPolicy: 'IfNotPresent'
  user:
    name: 'matrix-mas'
    username: 'matrix-mas'
    connectionSecretName: 'matrix-mas-user'
  secretManagement:
    secretName: 'matrix-mas-runtime'
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'mainvault-core'
    remoteKey: 'Social/Matrix/MAS'
    matrixSecretKey: 'MATRIX_SECRET'
    encryptionKey: 'ENCRYPTION_KEY'
    signingKey: 'RSA_KEY'

synapse:
  hostname: 'matrix.mylogin.space'
  serverName: 'matrix.mylogin.space'
  replicas: 1
  monitoring:
    enabled: true
    port: 9000
  image:
    repository: 'ghcr.io/element-hq/synapse'
    tag: 'v1.165.0@sha256:673b4223c81a7634fd07d832b939a58f97081cfdaae7cdd2d1664cdcf7611b62'
    pullPolicy: 'IfNotPresent'
  user:
    name: 'matrix-synapse'
    username: 'matrix-synapse'
    connectionSecretName: 'matrix-synapse-user'
  psql:
    # This is the Backplane global/hub PostgreSQL service, not psql-local.
    host: 'psql-int.core-home1-talos-prod.home1.yvr.mylogin.space'
    port: 5432
    database: ''
    # Compatibility switch for the existing global database. Recreate it with
    # LC_COLLATE=C and LC_CTYPE=C before disabling this override.
    allowUnsafeLocale: true
    crossplaneProvider: 'psql-main'
    terraformProvider: 'psql'
  oidc:
    enabled: true
    providerConfigRef: 'authentik'
    issuerBaseUrl: 'https://idp.mylogin.space'
    applicationSlug: 'matrix'
    accessGroup: 'Matrix Users'
    displayName: 'mylogin.space'
    secretName: 'matrix-synapse-oidc'
  ldap:
    enabled: false
    bindPasswordKey: 'password'
  registration:
    enabled: false
  secretManagement:
    generatorName: 'matrix-synapse-secrets'
    secretName: 'matrix-synapse-runtime'
    bootstrapSecretName: 'matrix-synapse-runtime-bootstrap'
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'mainvault-core'
    remoteKey: 'Social/Matrix/Synapse'
  resources:
    requests:
      cpu: '500m'
      memory: '1Gi'
    limits:
      memory: '2Gi'
  storage:
    size: '50Gi'
    storageClass: 'longhorn'
    mediaStorePath: '/data/media_store'
    uploadsPath: '/data/uploads'

migration:
  # Deliberately false: the migration Job is never part of an ordinary sync.
  enabled: false
  mode: 'migrate'
  dryRunDatabase:
    host: ''
    port: 5432
    database: ''
    connectionSecretName: ''
  migrateApproved: true
  activeDeadlineSeconds: 1800
  resources:
    requests:
      cpu: '100m'
      memory: '256Mi'
    limits:
      cpu: '1'
      memory: '1Gi'
