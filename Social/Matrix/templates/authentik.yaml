{{- if .Values.synapse.oidc.enabled }}
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: {{ printf "%s-oidc" .Release.Name | quote }}
spec:
  providerConfigRef:
    name: {{ .Values.synapse.oidc.providerConfigRef | quote }}
  writeConnectionSecretToRef:
    namespace: {{ .Release.Namespace | quote }}
    name: {{ .Values.synapse.oidc.secretName | quote }}
  forProvider:
    source: 'Inline'
    varmap:
      cluster_name: {{ .Values.cluster.name | quote }}
      datacenter: {{ .Values.datacenter | quote }}
      region: {{ .Values.region | quote }}
      application_slug: {{ .Values.synapse.oidc.applicationSlug | quote }}
      access_group: {{ .Values.synapse.oidc.accessGroup | quote }}
      issuer_base_url: {{ trimSuffix "/" .Values.synapse.oidc.issuerBaseUrl | quote }}
      external_url: {{ printf "https://%s" .Values.synapse.hostname | quote }}
      element_url: {{ printf "https://%s" .Values.element.hostname | quote }}
      mas_external_url: {{ printf "https://%s" .Values.mas.hostname | quote }}
    module: |
      variable "cluster_name" { type = string }
      variable "datacenter" { type = string }
      variable "region" { type = string }
      variable "application_slug" { type = string }
      variable "access_group" { type = string }
      variable "issuer_base_url" { type = string }
      variable "external_url" { type = string }
      variable "element_url" { type = string }
      variable "mas_external_url" { type = string }
      data "authentik_flow" "authorization" { slug = "default-provider-authorization-explicit-consent" }
      data "authentik_flow" "invalidation" { slug = "default-provider-invalidation-flow" }
      data "authentik_property_mapping_provider_scope" "scopes" {
        managed_list = ["goauthentik.io/providers/oauth2/scope-email", "goauthentik.io/providers/oauth2/scope-openid", "goauthentik.io/providers/oauth2/scope-profile"]
      }
      data "authentik_certificate_key_pair" "signing_key" { name = "tls" }
      resource "random_password" "client_secret" {
        length = 128
        lower = true
        numeric = true
        upper = true
        special = true
      }
      resource "authentik_provider_oauth2" "synapse" {
        name = "Matrix Synapse ${var.cluster_name} ${var.datacenter} ${var.region}"
        client_id = "${var.application_slug}-${var.region}-${var.datacenter}-${var.cluster_name}"
        client_secret = random_password.client_secret.result
        client_type = "confidential"
        signing_key = data.authentik_certificate_key_pair.signing_key.id
        allowed_redirect_uris = [
          { matching_mode = "strict", url = "${var.external_url}/_synapse/client/oidc/callback" },
          { matching_mode = "strict", url = "${var.mas_external_url}/upstream/callback/01JZ7K9Q3P6B4M2N8R5T1V0XCY" },
        ]
        property_mappings = data.authentik_property_mapping_provider_scope.scopes.ids
        authorization_flow = data.authentik_flow.authorization.id
        invalidation_flow = data.authentik_flow.invalidation.id
      }
      resource "authentik_application" "synapse" {
        name = "Matrix Synapse"
        slug = "${var.application_slug}-${var.region}-${var.datacenter}-${var.cluster_name}"
        group = "${var.datacenter}-${var.cluster_name}"
        meta_launch_url = "blank://blank"
        protocol_provider = authentik_provider_oauth2.synapse.id
      }
      resource "authentik_application" "element" {
        name = "Element"
        slug = "${var.application_slug}-element-${var.region}-${var.datacenter}-${var.cluster_name}"
        group = "${var.datacenter}-${var.cluster_name}"
        meta_launch_url = var.element_url
        meta_description = "Matrix client"
        meta_publisher = "Element"
        open_in_new_tab = true
      }
      resource "authentik_group" "synapse_users" {
        name = var.access_group
        is_superuser = false
      }
      resource "authentik_policy_binding" "application_access" {
        target = authentik_application.synapse.uuid
        group = authentik_group.synapse_users.id
        order = 0
      }
      resource "authentik_policy_binding" "element_access" {
        target = authentik_application.element.uuid
        group = authentik_group.synapse_users.id
        order = 0
      }
      output "OIDC_CLIENT_ID" {
        value = authentik_provider_oauth2.synapse.client_id
        sensitive = true
      }
      output "OIDC_CLIENT_SECRET" {
        value = random_password.client_secret.result
        sensitive = true
      }
      output "OIDC_ISSUER_URL" {
        value = "${var.issuer_base_url}/application/o/${var.application_slug}-${var.region}-${var.datacenter}-${var.cluster_name}/"
        sensitive = true
      }
{{- end }}
