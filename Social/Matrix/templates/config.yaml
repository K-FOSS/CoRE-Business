apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "synapse-%s-config" .Release.Name | quote }}
data:
  homeserver.yaml: |
    server_name: {{ .Values.synapse.serverName | quote }}
    public_baseurl: {{ printf "https://%s/" .Values.synapse.hostname | quote }}
    serve_server_wellknown: true
    include_profile_updates_in_sync: true
{{- if .Values.mas.enabled }}
    extra_well_known_client_content:
      org.matrix.msc2965.authentication:
        issuer: {{ printf "https://%s/" .Values.mas.hostname | quote }}
        account: {{ printf "https://%s/account/" .Values.mas.hostname | quote }}
    matrix_authentication_service:
      enabled: true
      endpoint: 'http://{{ .Release.Name }}-mas:8080'
      secret_path: '/run/mas/MATRIX_SECRET'
{{- end }}
    pid_file: /data/homeserver.pid
    listeners:
      - port: 8008
        type: http
        tls: false
        x_forwarded: true
        resources:
          - names: [client, federation]
    enable_media_repo: true
    enable_local_media_storage: true
    database:
      name: psycopg2
      args:
        user: __DB_USERNAME_JSON__
        password: __DB_PASSWORD_JSON__
        database: {{ default .Values.synapse.user.username .Values.synapse.psql.database | quote }}
        host: {{ .Values.synapse.psql.host | quote }}
        port: {{ .Values.synapse.psql.port }}
        cp_min: 5
        cp_max: 20
      allow_unsafe_locale: {{ .Values.synapse.psql.allowUnsafeLocale }}
    media_store_path: {{ .Values.synapse.storage.mediaStorePath | quote }}
    uploads_path: {{ .Values.synapse.storage.uploadsPath | quote }}
    signing_key_path: /data/{{ .Values.synapse.serverName }}.signing.key
    macaroon_secret_key: __MACAROON_SECRET_KEY_JSON__
    form_secret: __FORM_SECRET_JSON__
    trusted_key_servers:
      - server_name: matrix.org
    suppress_key_server_warning: true
    report_stats: false
    enable_registration: {{ .Values.synapse.registration.enabled }}
    password_config:
      enabled: false
{{- if .Values.turn.enabled }}
    turn_uris:
{{- range .Values.turn.ports }}
      - {{ printf "turn:%s:%d?transport=udp" $.Values.turn.hostname (int .) | quote }}
      - {{ printf "turn:%s:%d?transport=tcp" $.Values.turn.hostname (int .) | quote }}
{{- end }}
{{- if and .Values.turn.username .Values.turn.password }}
    turn_username: {{ .Values.turn.username | quote }}
    turn_password: {{ .Values.turn.password | quote }}
{{- end }}
    turn_allow_guests: {{ .Values.turn.allowGuests }}
{{- end }}
{{- if and .Values.synapse.oidc.enabled (not .Values.mas.enabled) }}
    oidc_providers:
      # Synapse stores this provider as oidc-authentik internally; its parser
      # adds the oidc- prefix to this YAML idp_id.
      - idp_id: 'authentik'
        idp_name: {{ .Values.synapse.oidc.displayName | quote }}
        discover: true
        issuer: __OIDC_ISSUER_JSON__
        client_id: __OIDC_CLIENT_ID_JSON__
        client_secret: __OIDC_CLIENT_SECRET_JSON__
        scopes: ['openid', 'profile', 'email']
        user_mapping_provider:
          config:
            localpart_template: '{{ "{{ user.preferred_username }}" }}'
            display_name_template: '{{ "{{ user.name|default(user.preferred_username) }}" }}'
            email_template: '{{ "{{ user.email }}" }}'
{{- end }}
{{- if .Values.synapse.ldap.enabled }}
    modules:
      - module: 'ldap_auth_provider.LdapAuthProviderModule'
        config:
          enabled: true
          mode: 'search'
          uri: {{ printf "ldaps://ldap-%s.%s:636" .Values.datacenter .Values.domain | quote }}
          start_tls: false
          base: {{ printf "ou=users,dc=ldap,dc=%s" (replace "." ",dc=" .Values.domain) | quote }}
          bind_dn: {{ printf "cn=%s,ou=users,dc=ldap,dc=%s" .Values.synapse.user.username (replace "." ",dc=" .Values.domain) | quote }}
          bind_password_file: '/run/ldap/{{ .Values.synapse.ldap.bindPasswordKey }}'
          attributes:
            uid: 'uid'
            mail: 'mail'
            name: 'displayName'
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "element-%s-config" .Release.Name | quote }}
data:
  config.json: |
    {
      "default_server_name": {{ .Values.synapse.serverName | quote }},
      "default_server_config": {
        "m.homeserver": {
          "base_url": {{ printf "https://%s" .Values.synapse.hostname | quote }}
        }
      },
      "disable_custom_urls": true,
      "brand": "Element",
      "features": {
        "feature_user_status": true
      }{{ if .Values.synapse.oidc.enabled }},
      "sso_redirect_options": {
        "immediate": true
      }{{ end }}
    }
