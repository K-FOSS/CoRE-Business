{{- include "bjw-s.common.loader.init" . -}}
{{- $_ := required "cluster.name must be injected by the owning ApplicationSet" .Values.cluster.name -}}
{{- $_ := required "datacenter must be injected by the owning ApplicationSet" .Values.datacenter -}}
{{- $_ := required "region must be injected by the owning ApplicationSet" .Values.region -}}
{{- $_ := required "synapse.hostname is required" .Values.synapse.hostname -}}
{{- $_ := required "synapse.serverName is required" .Values.synapse.serverName -}}
{{- $_ := required "synapse.psql.host must identify global PostgreSQL, not psql-local" .Values.synapse.psql.host -}}
{{- $_ := required "synapse.psql.crossplaneProvider is required" .Values.synapse.psql.crossplaneProvider -}}
{{- $_ := required "synapse.psql.terraformProvider is required" .Values.synapse.psql.terraformProvider -}}
{{- $_ := required "gateway.sectionName is required" .Values.gateway.sectionName -}}
{{- $_ := required "element.hostname is required" .Values.element.hostname -}}
{{- if not (has .Values.migration.mode (list "check" "dry-run" "migrate")) }}
{{- fail "migration.mode must be check, dry-run, or migrate" }}
{{- end }}
{{- if and .Values.migration.enabled (eq .Values.migration.mode "dry-run") }}
{{- $_ := required "migration.dryRunDatabase.host is required for dry-run" .Values.migration.dryRunDatabase.host -}}
{{- $_ := required "migration.dryRunDatabase.database is required for dry-run" .Values.migration.dryRunDatabase.database -}}
{{- if eq .Values.migration.dryRunDatabase.database .Values.mas.user.username }}
{{- fail "migration.dryRunDatabase.database must not be the production MAS database" }}
{{- end }}
{{- end }}
{{- if and .Values.migration.enabled (eq .Values.migration.mode "migrate") (not .Values.migration.migrateApproved) }}
{{- fail "migration.migrateApproved must be true before rendering a real migration Job" }}
{{- end }}
{{- if .Values.mas.enabled }}
{{- $_ := required "mas.hostname is required" .Values.mas.hostname -}}
{{- $_ := required "mas.user.connectionSecretName is required" .Values.mas.user.connectionSecretName -}}
{{- if not .Values.mas.keyGeneration.enabled }}
{{- $_ := required "mas.secretManagement.secretName is required when MAS key generation is disabled" .Values.mas.secretManagement.secretName -}}
{{- end }}
{{- end }}
{{- if and .Values.synapse.ldap.enabled (not .Values.synapse.ldap.existingSecret) }}
{{- fail "synapse.ldap.existingSecret is required when LDAP is enabled" }}
{{- end }}
{{- define "app-template.hardcodedValues" -}}
global:
  nameOverride: {{ .Release.Name | quote }}

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 991
    runAsGroup: 991
    fsGroup: 991
    fsGroupChangePolicy: 'OnRootMismatch'
    seccompProfile:
      type: 'RuntimeDefault'

controllers:
  synapse:
    replicas: {{ .Values.synapse.replicas }}
    strategy: 'Recreate'
    serviceAccount:
      name: 'default'
    initContainers:
        config:
          image:
            repository: {{ .Values.synapse.image.repository | quote }}
            tag: {{ .Values.synapse.image.tag | quote }}
            pullPolicy: {{ .Values.synapse.image.pullPolicy | quote }}
          command: ['python', '-c']
          args:
            - >-
              from pathlib import Path; import json, os; src = Path('/run/template/homeserver.yaml'); p = Path('/run/synapse/homeserver.yaml'); s = src.read_text(); s = s.replace('__DB_USERNAME_JSON__', json.dumps(os.environ['SYNAPSE_DB_USERNAME'])); s = s.replace('__DB_PASSWORD_JSON__', json.dumps(os.environ['SYNAPSE_DB_PASSWORD'])); s = s.replace('__MACAROON_SECRET_KEY_JSON__', json.dumps(os.environ['MACAROON_SECRET_KEY'])); s = s.replace('__FORM_SECRET_JSON__', json.dumps(os.environ['FORM_SECRET'])); s = s.replace('__OIDC_CLIENT_ID_JSON__', json.dumps(os.environ['OIDC_CLIENT_ID'])); s = s.replace('__OIDC_CLIENT_SECRET_JSON__', json.dumps(os.environ['OIDC_CLIENT_SECRET'])); s = s.replace('__OIDC_ISSUER_JSON__', json.dumps(os.environ['OIDC_ISSUER_URL'])); p.write_text(s)
          env:
            MACAROON_SECRET_KEY:
              secretKeyRef:
                name: {{ .Values.synapse.secretManagement.secretName | quote }}
                key: 'MACAROON_SECRET_KEY'
            FORM_SECRET:
              secretKeyRef:
                name: {{ .Values.synapse.secretManagement.secretName | quote }}
                key: 'FORM_SECRET'
            SYNAPSE_DB_PASSWORD:
              secretKeyRef:
                name: {{ .Values.synapse.user.connectionSecretName | quote }}
                key: 'password'
            SYNAPSE_DB_USERNAME:
              secretKeyRef:
                name: {{ .Values.synapse.user.connectionSecretName | quote }}
                key: 'username'
            OIDC_CLIENT_ID:
              secretKeyRef:
                name: {{ .Values.synapse.oidc.secretName | quote }}
                key: 'OIDC_CLIENT_ID'
            OIDC_CLIENT_SECRET:
              secretKeyRef:
                name: {{ .Values.synapse.oidc.secretName | quote }}
                key: 'OIDC_CLIENT_SECRET'
            OIDC_ISSUER_URL:
              secretKeyRef:
                name: {{ .Values.synapse.oidc.secretName | quote }}
                key: 'OIDC_ISSUER_URL'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
    containers:
      synapse:
        image:
          repository: {{ .Values.synapse.image.repository | quote }}
          tag: {{ .Values.synapse.image.tag | quote }}
          pullPolicy: {{ .Values.synapse.image.pullPolicy | quote }}
        command: ['python', '-m', 'synapse.app.homeserver']
        args: ['--config-path', '/run/synapse/homeserver.yaml']
        env: {}
        ports:
          - name: http
            containerPort: 8008
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        resources:
          {{- toYaml .Values.synapse.resources | nindent 10 }}
        probes:
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 8008
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 8008
            spec:
              initialDelaySeconds: 30
{{- if .Values.mas.enabled }}
  mas:
    replicas: {{ .Values.mas.replicas | default 1 }}
    serviceAccount:
      name: 'default'
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: 'OnRootMismatch'
    initContainers:
      config:
        image:
          repository: 'docker.io/library/busybox'
          tag: '1.37.0@sha256:4f93577242de6585bb7211f687673fc8a715571fdec8cf0901fd0724dc05dea2'
          pullPolicy: 'IfNotPresent'
        command: ['sh', '-c']
        args:
          - >-
            set -eu;
            awk 'function replace(line, token, value, pos) { while ((pos = index(line, token)) > 0) line = substr(line, 1, pos - 1) value substr(line, pos + length(token)); return line } { print replace(replace(replace(replace($0, "__DB_USERNAME__", ENVIRON["DB_USERNAME"]), "__DB_PASSWORD__", ENVIRON["DB_PASSWORD"]), "__OIDC_CLIENT_ID__", ENVIRON["OIDC_CLIENT_ID"]), "__OIDC_CLIENT_SECRET__", ENVIRON["OIDC_CLIENT_SECRET"]) }' /run/mas-template/config.yaml > /run/mas-runtime/config.yaml
        env:
          DB_USERNAME:
            secretKeyRef:
              name: {{ .Values.mas.user.connectionSecretName | quote }}
              key: 'username'
          DB_PASSWORD:
            secretKeyRef:
              name: {{ .Values.mas.user.connectionSecretName | quote }}
              key: 'password'
          OIDC_CLIENT_ID:
            secretKeyRef:
              name: {{ .Values.synapse.oidc.secretName | quote }}
              key: 'OIDC_CLIENT_ID'
          OIDC_CLIENT_SECRET:
            secretKeyRef:
              name: {{ .Values.synapse.oidc.secretName | quote }}
              key: 'OIDC_CLIENT_SECRET'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
    containers:
      mas:
        image:
          repository: {{ .Values.mas.image.repository | quote }}
          tag: {{ .Values.mas.image.tag | quote }}
          pullPolicy: {{ .Values.mas.image.pullPolicy | quote }}
        command: ['/usr/local/bin/mas-cli']
        args: ['--config', '/run/mas-runtime/config.yaml', 'server']
        ports:
          - name: http
            containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        probes:
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 8080
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 8080
            spec:
              initialDelaySeconds: 30
{{- end }}
{{- if .Values.migration.enabled }}
  masMigration:
    enabled: true
    type: 'job'
    forceRename: {{ printf "%s-mas-syn2mas" .Release.Name | quote }}
    serviceAccount:
      identifier: 'masMigration'
    job:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
    pod:
      restartPolicy: 'Never'
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: 'OnRootMismatch'
        seccompProfile:
          type: 'RuntimeDefault'
    initContainers:
      synapse-config:
        image:
          repository: {{ .Values.synapse.image.repository | quote }}
          tag: {{ .Values.synapse.image.tag | quote }}
          pullPolicy: {{ .Values.synapse.image.pullPolicy | quote }}
        command: ['python', '-c']
        args:
          - >-
            from pathlib import Path; import json, os; src = Path('/run/template/homeserver.yaml'); p = Path('/run/synapse/homeserver.yaml'); s = src.read_text(); s = s.replace('__DB_USERNAME_JSON__', json.dumps(os.environ['SYNAPSE_DB_USERNAME'])); s = s.replace('__DB_PASSWORD_JSON__', json.dumps(os.environ['SYNAPSE_DB_PASSWORD'])); s = s.replace('__MACAROON_SECRET_KEY_JSON__', json.dumps(os.environ['MACAROON_SECRET_KEY'])); s = s.replace('__FORM_SECRET_JSON__', json.dumps(os.environ['FORM_SECRET'])); s = s.replace('__OIDC_CLIENT_ID_JSON__', json.dumps(os.environ['OIDC_CLIENT_ID'])); s = s.replace('__OIDC_CLIENT_SECRET_JSON__', json.dumps(os.environ['OIDC_CLIENT_SECRET'])); s = s.replace('__OIDC_ISSUER_JSON__', json.dumps(os.environ['OIDC_ISSUER_URL'])); p.write_text(s)
        env:
          MACAROON_SECRET_KEY:
            secretKeyRef:
              name: {{ .Values.synapse.secretManagement.secretName | quote }}
              key: 'MACAROON_SECRET_KEY'
          FORM_SECRET:
            secretKeyRef:
              name: {{ .Values.synapse.secretManagement.secretName | quote }}
              key: 'FORM_SECRET'
          SYNAPSE_DB_PASSWORD:
            secretKeyRef:
              name: {{ .Values.synapse.user.connectionSecretName | quote }}
              key: 'password'
          SYNAPSE_DB_USERNAME:
            secretKeyRef:
              name: {{ .Values.synapse.user.connectionSecretName | quote }}
              key: 'username'
          OIDC_CLIENT_ID:
            secretKeyRef:
              name: {{ .Values.synapse.oidc.secretName | quote }}
              key: 'OIDC_CLIENT_ID'
          OIDC_CLIENT_SECRET:
            secretKeyRef:
              name: {{ .Values.synapse.oidc.secretName | quote }}
              key: 'OIDC_CLIENT_SECRET'
          OIDC_ISSUER_URL:
            secretKeyRef:
              name: {{ .Values.synapse.oidc.secretName | quote }}
              key: 'OIDC_ISSUER_URL'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
      mas-config:
        image:
          repository: 'docker.io/library/busybox'
          tag: '1.37.0@sha256:4f93577242de6585bb7211f687673fc8a715571fdec8cf0901fd0724dc05dea2'
          pullPolicy: 'IfNotPresent'
        command: ['sh', '-c']
        args:
          - >-
            set -eu;
            awk 'function escape(v) { gsub(/\\\\/, "\\\\\\\\", v); gsub(/&/, "\\\\&", v); return v } { gsub(/__DB_USERNAME__/, escape(ENVIRON["DB_USERNAME"])); gsub(/__DB_PASSWORD__/, escape(ENVIRON["DB_PASSWORD"])); gsub(/__OIDC_CLIENT_ID__/, escape(ENVIRON["OIDC_CLIENT_ID"])); gsub(/__OIDC_CLIENT_SECRET__/, escape(ENVIRON["OIDC_CLIENT_SECRET"])); print }' /run/mas-template/config.yaml > /run/mas-runtime/config.yaml
        env:
          DB_USERNAME:
            secretKeyRef:
              name: {{ if and (eq .Values.migration.mode "dry-run") .Values.migration.dryRunDatabase.connectionSecretName }}{{ .Values.migration.dryRunDatabase.connectionSecretName | quote }}{{ else }}{{ .Values.mas.user.connectionSecretName | quote }}{{ end }}
              key: 'username'
          DB_PASSWORD:
            secretKeyRef:
              name: {{ if and (eq .Values.migration.mode "dry-run") .Values.migration.dryRunDatabase.connectionSecretName }}{{ .Values.migration.dryRunDatabase.connectionSecretName | quote }}{{ else }}{{ .Values.mas.user.connectionSecretName | quote }}{{ end }}
              key: 'password'
          OIDC_CLIENT_ID:
            secretKeyRef:
              name: {{ .Values.synapse.oidc.secretName | quote }}
              key: 'OIDC_CLIENT_ID'
          OIDC_CLIENT_SECRET:
            secretKeyRef:
              name: {{ .Values.synapse.oidc.secretName | quote }}
              key: 'OIDC_CLIENT_SECRET'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
      database-safety:
        image:
          repository: 'docker.io/library/busybox'
          tag: '1.37.0@sha256:4f93577242de6585bb7211f687673fc8a715571fdec8cf0901fd0724dc05dea2'
          pullPolicy: 'IfNotPresent'
        command: ['sh', '-c']
        args:
          - >-
            set -eu;
            if [ "$MODE" = 'dry-run' ] && { [ "$MIGRATION_DB" = "$PRODUCTION_DB" ] || [ "$MIGRATION_HOST" = "$PRODUCTION_HOST" ] && [ "$MIGRATION_DB" = "$PRODUCTION_DB" ]; }; then echo 'refusing to run dry-run against the production MAS database' >&2; exit 2; fi
        env:
          MODE:
            value: {{ .Values.migration.mode | quote }}
          MIGRATION_HOST:
            value: {{ if eq .Values.migration.mode "dry-run" }}{{ .Values.migration.dryRunDatabase.host | quote }}{{ else }}{{ .Values.synapse.psql.host | quote }}{{ end }}
          MIGRATION_DB:
            value: {{ if eq .Values.migration.mode "dry-run" }}{{ .Values.migration.dryRunDatabase.database | quote }}{{ else }}{{ .Values.mas.user.username | quote }}{{ end }}
          PRODUCTION_HOST:
            value: {{ .Values.synapse.psql.host | quote }}
          PRODUCTION_DB:
            value: {{ .Values.mas.user.username | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
    containers:
      mas-migration:
        image:
          repository: {{ .Values.mas.image.repository | quote }}
          tag: {{ .Values.mas.image.tag | quote }}
          pullPolicy: {{ .Values.mas.image.pullPolicy | quote }}
        command: ['/usr/local/bin/mas-cli']
        args: {{ if eq .Values.migration.mode "check" }}['--config', '/run/mas-runtime/config.yaml', 'syn2mas', 'check', '--synapse-config', '/run/synapse/homeserver.yaml']{{ else if eq .Values.migration.mode "dry-run" }}['--config', '/run/mas-runtime/config.yaml', 'syn2mas', 'migrate', '--dry-run', '--synapse-config', '/run/synapse/homeserver.yaml']{{ else }}['--config', '/run/mas-runtime/config.yaml', 'syn2mas', 'migrate', '--synapse-config', '/run/synapse/homeserver.yaml']{{ end }}
        resources:
          {{- toYaml .Values.migration.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
{{- end }}
  element:
    replicas: 2
    serviceAccount:
      name: 'default'
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: 'OnRootMismatch'
    containers:
      element:
        image:
          repository: {{ .Values.element.image.repository | quote }}
          tag: {{ .Values.element.image.tag | quote }}
          pullPolicy: {{ .Values.element.image.pullPolicy | quote }}
        ports:
          - name: http
            containerPort: 8080
        env:
          ELEMENT_WEB_PORT: '8080'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        resources:
          {{- toYaml .Values.element.resources | nindent 10 }}
        probes:
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/config.json'
            port: 8080
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/config.json'
            port: 8080

persistence:
  runtime:
    type: 'emptyDir'
    advancedMounts:
      synapse:
        config:
          - path: '/run/synapse'
        synapse:
          - path: '/run/synapse'
  config:
    type: 'configMap'
    name: {{ printf "synapse-%s-config" .Release.Name | quote }}
    advancedMounts:
      synapse:
        config:
          - path: '/run/template'
  data:
    type: 'persistentVolumeClaim'
    storageClass: {{ .Values.synapse.storage.storageClass | quote }}
    accessMode: 'ReadWriteOnce'
    size: {{ .Values.synapse.storage.size | quote }}
    retain: true
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    advancedMounts:
      synapse:
        synapse:
          - path: '/data'
  element-config:
    type: 'configMap'
    name: {{ printf "element-%s-config" .Release.Name | quote }}
    advancedMounts:
      element:
        element:
          - path: '/app/config.json'
            subPath: 'config.json'
{{- if .Values.mas.enabled }}
  mas-template:
    type: 'configMap'
    name: {{ printf "mas-%s-config" .Release.Name | quote }}
    advancedMounts:
      mas:
        config:
          - path: '/run/mas-template'
  mas-runtime:
    type: 'emptyDir'
    advancedMounts:
      mas:
        config:
          - path: '/run/mas-runtime'
        mas:
          - path: '/run/mas-runtime'
  mas-secrets:
    type: 'secret'
    name: {{ .Values.mas.secretManagement.secretName | quote }}
    advancedMounts:
      synapse:
        synapse:
          - path: '/run/mas'
            readOnly: true
      mas:
        mas:
          - path: '/run/mas'
            readOnly: true
{{- end }}
{{- if .Values.migration.enabled }}
  migration-synapse-runtime:
    type: 'emptyDir'
    advancedMounts:
      masMigration:
        synapse-config:
          - path: '/run/synapse'
        mas-migration:
          - path: '/run/synapse'
  migration-mas-runtime:
    type: 'emptyDir'
    advancedMounts:
      masMigration:
        mas-config:
          - path: '/run/mas-runtime'
        mas-migration:
          - path: '/run/mas-runtime'
  mas-migration-template:
    type: 'configMap'
    name: {{ printf "mas-migration-%s-config" .Release.Name | quote }}
    advancedMounts:
      masMigration:
        mas-config:
          - path: '/run/mas-template'
  migration-synapse-template:
    type: 'configMap'
    name: {{ printf "synapse-%s-config" .Release.Name | quote }}
    advancedMounts:
      masMigration:
        synapse-config:
          - path: '/run/template'
  migration-mas-secrets:
    type: 'secret'
    name: {{ .Values.mas.secretManagement.secretName | quote }}
    advancedMounts:
      masMigration:
        mas-migration:
          - path: '/run/mas'
            readOnly: true
{{- end }}
{{- if .Values.synapse.ldap.enabled }}
  ldap:
    type: 'secret'
    name: {{ .Values.synapse.ldap.existingSecret | quote }}
    advancedMounts:
      synapse:
        synapse:
          - path: '/run/ldap'
            readOnly: true
{{- end }}

service:
  synapse:
    controller: 'synapse'
    ports:
      http:
        port: 8008
  element:
    controller: 'element'
    ports:
      http:
        port: 8080
        appProtocol: 'kubernetes.io/ws'
{{- if .Values.mas.enabled }}
  mas:
    controller: 'mas'
    ports:
      http:
        port: 8080
{{- end }}

route:
  synapse:
    kind: 'HTTPRoute'
    annotations:
      forecastle.stakater.com/expose: 'true'
      forecastle.stakater.com/instance: 'core'
      forecastle.stakater.com/appName: 'Matrix'
      forecastle.stakater.com/group: 'Social'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames:
      - {{ .Values.synapse.hostname | quote }}
    parentRefs:
      - name: {{ .Values.gateway.name | quote }}
        namespace: {{ .Values.gateway.namespace | quote }}
        sectionName: {{ .Values.gateway.sectionName | quote }}
    rules:
{{- if .Values.mas.enabled }}
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/_matrix/client/v1/login'
          - path:
              type: 'PathPrefix'
              value: '/_matrix/client/v3/login'
          - path:
              type: 'PathPrefix'
              value: '/_matrix/client/r0/login'
          - path:
              type: 'PathPrefix'
              value: '/_matrix/client/v1/logout'
          - path:
              type: 'PathPrefix'
              value: '/_matrix/client/v3/logout'
          - path:
              type: 'PathPrefix'
              value: '/_matrix/client/r0/logout'
          - path:
              type: 'PathPrefix'
              value: '/_matrix/client/v1/refresh'
          - path:
              type: 'PathPrefix'
              value: '/_matrix/client/v3/refresh'
          - path:
              type: 'PathPrefix'
              value: '/_matrix/client/r0/refresh'
        backendRefs:
          - identifier: 'mas'
            port: 8080
        timeouts:
          request: {{ .Values.gateway.requestTimeout | quote }}
{{- end }}
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        backendRefs:
          - identifier: 'synapse'
            port: 8008
        timeouts:
          request: {{ .Values.gateway.requestTimeout | quote }}
  element:
    kind: 'HTTPRoute'
    annotations:
      forecastle.stakater.com/expose: 'true'
      forecastle.stakater.com/instance: 'core'
      forecastle.stakater.com/appName: 'Element Web'
      forecastle.stakater.com/group: 'Social'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames:
      - {{ .Values.element.hostname | quote }}
    parentRefs:
      - name: {{ .Values.gateway.name | quote }}
        namespace: {{ .Values.gateway.namespace | quote }}
        sectionName: {{ .Values.gateway.sectionName | quote }}
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        backendRefs:
          - identifier: 'element'
            port: 8080
        timeouts:
          request: {{ .Values.gateway.requestTimeout | quote }}
{{- if .Values.mas.enabled }}
  mas:
    kind: 'HTTPRoute'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames:
      - {{ .Values.mas.hostname | quote }}
    parentRefs:
      - name: {{ .Values.gateway.name | quote }}
        namespace: {{ .Values.gateway.namespace | quote }}
        sectionName: {{ .Values.gateway.sectionName | quote }}
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        backendRefs:
          - identifier: 'mas'
            port: 8080
{{- end }}
{{- end }}

{{- $hardcodedValues := include "app-template.hardcodedValues" . | fromYaml -}}
{{- $_ := mustMergeOverwrite .Values $hardcodedValues -}}
{{- $_ := set .Values "controllers" $hardcodedValues.controllers -}}
{{- $_ := set .Values "service" $hardcodedValues.service -}}
