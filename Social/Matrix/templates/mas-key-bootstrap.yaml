{{- if and .Values.mas.enabled .Values.mas.keyGeneration.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-mas-key-bootstrap" .Release.Name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-mas-key-bootstrap" .Release.Name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
rules:
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['get', 'create']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-mas-key-bootstrap" .Release.Name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-mas-key-bootstrap" .Release.Name | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-mas-key-bootstrap" .Release.Name | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-mas-key-bootstrap" .Release.Name | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/hook: 'Sync'
    argocd.argoproj.io/hook-delete-policy: 'BeforeHookCreation'
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ printf "%s-mas-key-bootstrap" .Release.Name | quote }}
    spec:
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      serviceAccountName: {{ printf "%s-mas-key-bootstrap" .Release.Name | quote }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: mas-generate
          image: {{ printf "%s:%s" .Values.mas.image.repository .Values.mas.image.tag | quote }}
          command: ['/usr/local/bin/mas-cli']
          args: ['config', 'generate', '--output', '/run/mas-generated/config.yaml']
          volumeMounts:
            - name: generated-config
              mountPath: '/run/mas-generated'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      containers:
        - name: publish
          image: 'docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8'
          command: ['sh', '-c']
          args:
            - >-
              set -eu;
              api='https://kubernetes.default.svc';
              token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token);
              ca='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt';
              secret_url="$api/api/v1/namespaces/$POD_NAMESPACE/secrets/{{ .Values.mas.secretManagement.secretName }}";
              if wget -q --ca-certificate="$ca" --header="Authorization: Bearer $token" -O /dev/null "$secret_url"; then exit 0; fi;
              umask 077;
              awk '$1 == "secret:" { print $2; exit }' /run/mas-generated/config.yaml > /tmp/matrix-secret;
              awk '$1 == "encryption:" { print $2; exit }' /run/mas-generated/config.yaml > /tmp/encryption-key;
              sed -n '/^      -----BEGIN RSA PRIVATE KEY-----/,/^      -----END RSA PRIVATE KEY-----/ { s/^      //; p; }' /run/mas-generated/config.yaml > /tmp/rsa-key;
              test -s /tmp/matrix-secret && test -s /tmp/encryption-key && test -s /tmp/rsa-key;
              matrix_secret=$(base64 /tmp/matrix-secret | tr -d '\n');
              encryption_key=$(base64 /tmp/encryption-key | tr -d '\n');
              rsa_key=$(base64 /tmp/rsa-key | tr -d '\n');
              body=$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"{{ .Values.mas.secretManagement.secretName }}"},"type":"Opaque","data":{"MATRIX_SECRET":"%s","ENCRYPTION_KEY":"%s","RSA_KEY":"%s"}}' "$matrix_secret" "$encryption_key" "$rsa_key");
              wget -q --ca-certificate="$ca" --header="Authorization: Bearer $token" --header='Content-Type: application/json' --post-data="$body" -O /dev/null "$api/api/v1/namespaces/$POD_NAMESPACE/secrets";
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: generated-config
              mountPath: '/run/mas-generated'
      volumes:
        - name: generated-config
          emptyDir: {}
{{- end }}
