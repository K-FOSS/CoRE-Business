name: Kamailio LF heartbeat image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - AVoIP/image/kamailio-lf-heartbeat/**
      - .forgejo/workflows/kamailio-lf-heartbeat.yaml

permissions:
  contents: read

concurrency:
  group: kamailio-lf-heartbeat-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: docker
    container: {image: ubuntu:24.04}
    timeout-minutes: 180
    env:
      DOCKER_HOST: tcp://127.0.0.1:2376
      DOCKER_TLS_VERIFY: '1'
      DOCKER_CERT_PATH: /certs/client
    steps:
      - name: Bootstrap Docker Buildx prerequisites
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates docker.io git nodejs python3
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Register ARM64 binfmt support
        uses: https://github.com/docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
      - name: Configure immutable Forgejo image reference
        id: image
        shell: bash
        env:
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_SHA: ${{ forgejo.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          server = urlsplit(os.environ['FORGEJO_SERVER_URL'])
          if server.scheme != 'https' or not server.hostname or server.username or server.password:
              raise SystemExit('Expected an HTTPS Forgejo server URL without credentials')
          registry = server.netloc.lower()
          repository = os.environ['FORGEJO_REPOSITORY'].lower()
          tag = f"6.1.4-lf-heartbeat-{os.environ['FORGEJO_SHA']}"
          image = f"{registry}/{repository}/kamailio-lf-heartbeat:{tag}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'registry={registry}\nref={image}\ntag={tag}\n')
          PY
      - name: Build amd64 test image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: AVoIP/image/kamailio-lf-heartbeat
          file: AVoIP/image/kamailio-lf-heartbeat/Containerfile
          target: test
          platforms: linux/amd64
          load: true
          tags: local/kamailio-lf-heartbeat:test
      - name: Run WebSocket regression against the built image
        shell: bash
        run: AVoIP/image/kamailio-lf-heartbeat/run-integration.sh local/kamailio-lf-heartbeat:test docker
      - name: Log in to Forgejo registry
        if: ${{ forgejo.ref == 'refs/heads/main' }}
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.FORGEJO_REGISTRY_USERNAME || forgejo.repository_owner }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and publish immutable multi-platform image
        id: publish
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: AVoIP/image/kamailio-lf-heartbeat
          file: AVoIP/image/kamailio-lf-heartbeat/Containerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ forgejo.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.ref }}
          cache-to: type=inline
      - name: Record published image digest
        if: ${{ forgejo.ref == 'refs/heads/main' }}
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          printf 'Published tested image: `%s@%s`\n' "$IMAGE_REF" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
