name: Flowroute SMS receiver image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - AVoIP/image/flowroute-sms/**
      - .forgejo/workflows/flowroute-sms.yaml

concurrency:
  group: flowroute-sms-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    strategy:
      max-parallel: 1
      matrix:
        component: [web, api, webhook, admin]
    runs-on: docker
    container: {image: docker:29.1.3-cli-alpine3.23@sha256:4fa0ee1f3a7e4354c4ea34558b6d4ee32859baf4973d4c8ccc8e7fe3dd730c04}
    timeout-minutes: 60
    env:
      DOCKER_HOST: tcp://127.0.0.1:2376
      DOCKER_TLS_VERIFY: '1'
      DOCKER_CERT_PATH: /certs/client
    steps:
      - name: Bootstrap Docker Buildx prerequisites
        shell: sh
        run: apk add --no-cache bash ca-certificates nodejs python3
      - name: Check out repository
        uses: https://github.com/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
      - name: Configure Forgejo image references
        id: image
        shell: bash
        env:
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_SHA: ${{ forgejo.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          server = urlsplit(os.environ['FORGEJO_SERVER_URL'])
          if server.scheme != 'https' or not server.hostname or server.username or server.password:
              raise SystemExit('Expected an HTTPS Forgejo server URL without credentials')
          registry = server.netloc.lower()
          repository = os.environ['FORGEJO_REPOSITORY'].lower()
          image = f"{registry}/{repository}/flowroute-sms-${{ matrix.component }}"
          sha_tag = f"{image}:1-{os.environ['FORGEJO_SHA']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'registry={registry}\n')
              output.write(f'image={image}\n')
              output.write(f'sha_tag={sha_tag}\n')
          PY
      - name: Log in to Forgejo registry
        if: ${{ forgejo.ref == 'refs/heads/main' }}
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.FORGEJO_REGISTRY_USERNAME || forgejo.repository_owner }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and publish image
        id: publish
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: AVoIP/image/flowroute-sms
          file: AVoIP/image/flowroute-sms/Containerfile
          build-args: |
            COMPONENT=${{ matrix.component }}
          platforms: linux/amd64
          push: ${{ forgejo.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.sha_tag }}
      - name: Record published image digest
        if: ${{ forgejo.ref == 'refs/heads/main' }}
        env:
          IMAGE_REF: ${{ steps.image.outputs.sha_tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          printf 'Published tested image: `%s@%s`\n' "$IMAGE_REF" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
