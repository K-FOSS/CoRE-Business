{{- if and .Values.dawarich.enabled .Values.dawarich.oidc.enabled }}
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: {{ .Values.dawarich.oidc.workspaceName | quote }}
spec:
  providerConfigRef:
    name: {{ .Values.dawarich.oidc.providerConfigRef | quote }}
  writeConnectionSecretToRef:
    namespace: {{ .Release.Namespace | quote }}
    name: {{ .Values.dawarich.oidc.workspaceName | quote }}
  forProvider:
    source: 'Inline'
    varmap:
      cluster_name: {{ .Values.cluster.name | quote }}
      datacenter: {{ .Values.datacenter | quote }}
      region: {{ .Values.region | quote }}
      application_slug: {{ .Values.dawarich.oidc.applicationSlug | quote }}
      access_group: {{ .Values.dawarich.oidc.accessGroup | quote }}
      issuer_base_url: {{ trimSuffix "/" .Values.dawarich.oidc.issuerBaseUrl | quote }}
      external_url: {{ printf "https://%s" .Values.dawarich.hostname | quote }}
      display_name: {{ .Values.dawarich.oidc.displayName | quote }}
    module: |
      variable "cluster_name" { type = string }
      variable "datacenter" { type = string }
      variable "region" { type = string }
      variable "application_slug" { type = string }
      variable "access_group" { type = string }
      variable "issuer_base_url" { type = string }
      variable "external_url" { type = string }
      variable "display_name" { type = string }

      data "authentik_flow" "authorization" {
        slug = "default-provider-authorization-implicit-consent"
      }

      data "authentik_flow" "invalidation" {
        slug = "default-provider-invalidation-flow"
      }

      data "authentik_property_mapping_provider_scope" "scopes" {
        managed_list = [
          "goauthentik.io/providers/oauth2/scope-email",
          "goauthentik.io/providers/oauth2/scope-openid",
          "goauthentik.io/providers/oauth2/scope-profile",
        ]
      }

      data "authentik_group" "home_users" {
        name = var.access_group
      }

      resource "random_password" "client_secret" {
        length  = 48
        special = false
      }

      resource "authentik_provider_oauth2" "dawarich" {
        name               = "Dawarich ${var.cluster_name} ${var.datacenter} ${var.region}"
        client_id          = "${var.application_slug}-${var.region}-${var.datacenter}-${var.cluster_name}"
        client_secret      = random_password.client_secret.result
        authorization_flow = data.authentik_flow.authorization.id
        invalidation_flow  = data.authentik_flow.invalidation.id
        allowed_redirect_uris = [{ matching_mode = "strict", url = "${var.external_url}/users/auth/openid_connect/callback" }]
        property_mappings = data.authentik_property_mapping_provider_scope.scopes.ids
      }

      resource "authentik_application" "dawarich" {
        name              = var.display_name
        slug              = "${var.application_slug}-${var.region}-${var.datacenter}-${var.cluster_name}"
        group             = "Personal"
        protocol_provider = authentik_provider_oauth2.dawarich.id
      }

      resource "authentik_application_entitlement" "dawarich_access" {
        name        = "${data.authentik_group.home_users.id}-dawarich-ent"
        application = authentik_application.dawarich.uuid
      }

      resource "authentik_policy_binding" "entitlement_access" {
        target = authentik_application_entitlement.dawarich_access.id
        group  = data.authentik_group.home_users.id
        order  = 0
      }

      resource "authentik_policy_binding" "application_access" {
        target = authentik_application.dawarich.uuid
        group  = data.authentik_group.home_users.id
        order  = 0
      }

      output "OIDC_CLIENT_ID" {
        value     = authentik_provider_oauth2.dawarich.client_id
        sensitive = true
      }

      output "OIDC_CLIENT_SECRET" {
        value     = random_password.client_secret.result
        sensitive = true
      }

      output "OIDC_ISSUER_URL" {
        value     = "${var.issuer_base_url}/application/o/${var.application_slug}-${var.region}-${var.datacenter}-${var.cluster_name}/"
        sensitive = true
      }
{{- end }}
