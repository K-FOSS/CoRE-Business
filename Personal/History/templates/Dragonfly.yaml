{{- if .Values.dawarich.enabled }}
{{- $redis := .Values.dawarich.redis }}
{{- $host := default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) $redis.host }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $redis.secretName | quote }}
spec:
  refreshInterval: {{ $redis.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $redis.secretStoreRef.kind | quote }}
    name: {{ $redis.secretStoreRef.name | quote }}
  target:
    name: {{ $redis.secretName | quote }}
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
    template:
      engineVersion: 'v2'
      data:
        REDIS_URL: {{ printf "rediss://:{{ .password | urlquery | replace \"+\" \"%%20\" }}@%s:%v/%v" $host $redis.port $redis.database | quote }}
  data:
    - secretKey: 'password'
      remoteRef:
        key: {{ default (printf "Storage/DragonFly/CoRE/%s/%s/%s/Creds" .Values.region .Values.datacenter .Values.cluster.name) $redis.remoteRef.key | quote }}
        property: {{ $redis.remoteRef.property | quote }}
{{- end }}
