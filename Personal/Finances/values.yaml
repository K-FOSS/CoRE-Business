# Required site inputs are injected by the future owning Backplane ApplicationSet.
cluster:
  name: ''

datacenter: ''
region: ''

global:
  createDefaultServiceAccount: true
  # Keep generated Kubernetes names valid when the Backplane release name
  # includes the full site and repository path.
  fullnameOverride: 'core-business-finances'

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

authentik:
  providerConfigRef: 'authentik'
  application:
    displayName: 'Firefly III'
    group: 'Personal'
  outpost:
    name: 'aaa-myloginspace-proxy'
    namespace: 'core-prod'
    port: 80

firefly:
  hostname: 'firefly.mylogin.space'
  imageTag: 'latest'
  imageDigest: 'sha256:4409f9f0f87378ba95d40811352f4f49338d276bb638c1e6d18a5579f332fbe8'
  # Created once by External Secrets; keep this stable because changing APP_KEY
  # invalidates encrypted sessions and existing encrypted data.
  appKeySecret: 'firefly-app-key'
  database:
    # Defaults to psql-local.<cluster>.<datacenter>.<region>.mylogin.space.
    host: ''
    port: '5432'
    userSecret: 'firefly-database'
    passwordKey: 'password'
    usernameKey: 'username'
    crossplane:
      crossplaneProvider: ''
      terraformProvider: ''
  resources:
    requests:
      cpu: '50m'
      memory: '256Mi'
    limits:
      cpu: '1000m'
      memory: '1Gi'

# Opt-in diagnostic endpoint. It shares Firefly's hostname and Authentik
# provider, and is reachable at /auth-debug/headers when enabled.
httpbin:
  enabled: true
  imageTag: '2.25.0'

# WYGIWYH is an optional companion finance tracker. Enable only when its
# PostgreSQL User claim and persistent attachment storage have been reviewed.
wygiwyh:
  enabled: false
  hostname: 'wygiwyh.mylogin.space'
  imageTag: '0.22.1'
  secretKeySecret: 'wygiwyh-secret-key'
  database:
    userSecret: 'wygiwyh-database'
    databaseKey: 'database'
    passwordKey: 'password'
    usernameKey: 'username'
    crossplane:
      crossplaneProvider: ''
      terraformProvider: ''
  resources:
    requests:
      cpu: '50m'
      memory: '256Mi'
    limits:
      cpu: '1000m'
      memory: '1Gi'

# This Next.js dashboard reads from Firefly III and stores its local password
# and connection settings on its data volume.
financialDashboard:
  enabled: true
  hostname: 'ff-dash.mylogin.space'
  imageTag: '0.2.0'
  sessionSecretSecret: 'financial-dashboard-session-secret'
  resources:
    requests:
      cpu: '50m'
      memory: '128Mi'
    limits:
      cpu: '1000m'
      memory: '512Mi'
