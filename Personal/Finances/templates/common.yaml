{{- include "bjw-s.common.loader.init" . -}}

{{- define "app-template.hardcodedValues" -}}
controllers:
  app:
    type: 'deployment'
    replicas: 1
    strategy: 'Recreate'
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: 'RuntimeDefault'
    containers:
      firefly:
        image:
          repository: 'docker.io/fireflyiii/core'
          tag: ''
          pullPolicy: 'IfNotPresent'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        env: {}
        resources: {}
        probes:
          startup:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 8080
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 8080
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/health'
            port: 8080
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
  scheduler:
    type: 'cronjob'
    # CronJob metadata.name is limited to 52 characters because generated Job
    # names append a timestamp. Keep the site/release-derived name stable while
    # leaving room for the scheduler suffix.
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" . | trunc 42 | trimSuffix "-" }}-scheduler'
    cronjob:
      schedule: '* * * * *'
      concurrencyPolicy: 'Forbid'
      successfulJobsHistory: 1
      failedJobsHistory: 3
    pod:
      automountServiceAccountToken: false
      restartPolicy: 'OnFailure'
      securityContext:
        seccompProfile:
          type: 'RuntimeDefault'
    containers:
      scheduler:
        image:
          repository: 'docker.io/fireflyiii/core'
          tag: ''
          pullPolicy: 'IfNotPresent'
        command: ['/usr/local/bin/php', 'artisan', 'schedule:run']
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        env: {}
        resources: {}

service:
  app:
    controller: 'app'
    ports:
      http:
        port: 8080

persistence:
  upload:
    type: 'persistentVolumeClaim'
    storageClass: 'longhorn'
    accessMode: 'ReadWriteOnce'
    size: '10Gi'
    retain: true
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    advancedMounts:
      app:
        firefly:
          - path: '/var/www/html/storage/upload'
      scheduler:
        scheduler:
          - path: '/var/www/html/storage/upload'

route:
  app:
    kind: 'HTTPRoute'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames: []
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        backendRefs:
          - identifier: 'app'
            port: 8080
{{- end -}}

{{- $_ := mergeOverwrite .Values (include "app-template.hardcodedValues" . | fromYaml) -}}
{{- define "httpbin.config" -}}
controllers:
  httpbin:
    type: 'deployment'
    replicas: 1
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: 'RuntimeDefault'
    containers:
      httpbin:
        image:
          repository: 'ghcr.io/mccutchen/go-httpbin'
          tag: ''
          pullPolicy: 'IfNotPresent'
        command: ['/bin/go-httpbin']
        args: ['-port=8080', '-log-format=json']
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        env:
          PREFIX: '/auth-debug'
          EXCLUDE_HEADERS: ''
        resources:
          requests:
            cpu: '10m'
            memory: '32Mi'
          limits:
            cpu: '200m'
            memory: '128Mi'
        probes:
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/auth-debug/status/204'
            port: 8080
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/auth-debug/status/204'
            port: 8080
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
service:
  httpbin:
    controller: 'httpbin'
    ports:
      http:
        port: 8080
route:
  httpbin:
    kind: 'HTTPRoute'
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-httpbin'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames: []
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/auth-debug'
        backendRefs:
          - identifier: 'httpbin'
            port: 8080
{{- end -}}
{{- define "wygiwyh.config" -}}
controllers:
  wygiwyh:
    type: 'deployment'
    replicas: 1
    strategy: 'Recreate'
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: 'RuntimeDefault'
    containers:
      app:
        image:
          repository: 'docker.io/eitchtee/wygiwyh'
          tag: ''
          pullPolicy: 'IfNotPresent'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        env: {}
        resources: {}
        probes:
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/'
            port: 8000
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/'
            port: 8000
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
service:
  wygiwyh:
    controller: 'wygiwyh'
    ports:
      http:
        port: 8000
persistence:
  wygiwyh-media:
    type: 'persistentVolumeClaim'
    storageClass: 'longhorn'
    accessMode: 'ReadWriteOnce'
    size: '5Gi'
    retain: true
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    advancedMounts:
      wygiwyh:
        app:
          - path: '/usr/src/app/attachments'
route:
  wygiwyh:
    kind: 'HTTPRoute'
    hostnames: []
    labels:
      lan-mode: 'private'
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        backendRefs:
          - identifier: 'wygiwyh'
            port: 8000
{{- end -}}
{{- define "financialDashboard.config" -}}
controllers:
  financial-dashboard:
    type: 'deployment'
    replicas: 1
    strategy: 'Recreate'
    pod:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: 'RuntimeDefault'
    containers:
      app:
        image:
          repository: 'ghcr.io/giorobert88/financial-dashboard'
          tag: ''
          pullPolicy: 'IfNotPresent'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        env: {}
        resources: {}
        probes:
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/login'
            port: 3000
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/login'
            port: 3000
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
service:
  financial-dashboard:
    controller: 'financial-dashboard'
    ports:
      http:
        port: 3000
persistence:
  financial-dashboard-data:
    type: 'persistentVolumeClaim'
    storageClass: 'longhorn'
    accessMode: 'ReadWriteOnce'
    size: '1Gi'
    retain: true
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    advancedMounts:
      financial-dashboard:
        app:
          - path: '/app/data'
route:
  financial-dashboard:
    kind: 'HTTPRoute'
    hostnames: []
    labels:
      lan-mode: 'private'
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        backendRefs:
          - identifier: 'financial-dashboard'
            port: 3000
{{- end -}}
{{- if .Values.httpbin.enabled }}
{{- $_ := mergeOverwrite .Values (include "httpbin.config" . | fromYaml) -}}
{{- $_ := set .Values.controllers.httpbin.containers.httpbin.image "tag" .Values.httpbin.imageTag -}}
{{- $_ := set .Values.route.httpbin "hostnames" (list .Values.firefly.hostname) -}}
{{- $_ := set .Values.route.httpbin "parentRefs" (list (dict "kind" "Gateway" "name" .Values.gateway.name "namespace" .Values.gateway.namespace "sectionName" .Values.gateway.sectionName)) -}}
{{- end }}
{{- if .Values.wygiwyh.enabled }}
{{- $_ := required "wygiwyh.hostname is required" .Values.wygiwyh.hostname -}}
{{- $_ := required "wygiwyh.secretKeySecret is required" .Values.wygiwyh.secretKeySecret -}}
{{- $_ := required "wygiwyh.database.userSecret is required" .Values.wygiwyh.database.userSecret -}}
{{- $_ := required "wygiwyh.database.crossplane.crossplaneProvider must be injected by the owning ApplicationSet" .Values.wygiwyh.database.crossplane.crossplaneProvider -}}
{{- $_ := required "wygiwyh.database.crossplane.terraformProvider must be injected by the owning ApplicationSet" .Values.wygiwyh.database.crossplane.terraformProvider -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" .Values.wygiwyh.hostname) -}}
{{- fail "wygiwyh.hostname must be a public DNS hostname without scheme, port or wildcard" -}}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "wygiwyh.config" . | fromYaml) -}}
{{- $_ := set .Values.controllers.wygiwyh.containers.app.image "tag" .Values.wygiwyh.imageTag -}}
{{- $dbPassword := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.wygiwyh.database.userSecret "key" .Values.wygiwyh.database.passwordKey)) -}}
{{- $dbUsername := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.wygiwyh.database.userSecret "key" .Values.wygiwyh.database.usernameKey)) -}}
{{- $dbDatabase := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.wygiwyh.database.userSecret "key" .Values.wygiwyh.database.databaseKey)) -}}
{{- $secretKey := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.wygiwyh.secretKeySecret "key" "SECRET_KEY")) -}}
{{- $databaseHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.firefly.database.host -}}
{{- $env := dict
  "INTERNAL_PORT" "8000"
  "DJANGO_ALLOWED_HOSTS" .Values.wygiwyh.hostname
  "HTTPS_ENABLED" "true"
  "URL" (printf "https://%s" .Values.wygiwyh.hostname)
  "SECRET_KEY" $secretKey
  "DEBUG" "false"
  "SQL_DATABASE" $dbDatabase
  "SQL_USER" $dbUsername
  "SQL_PASSWORD" $dbPassword
  "SQL_HOST" $databaseHost
  "SQL_PORT" "5432"
  "TZ" "UTC"
}}
{{- $_ := set .Values.controllers.wygiwyh.containers.app "env" $env -}}
{{- $_ := set .Values.controllers.wygiwyh.containers.app "resources" .Values.wygiwyh.resources -}}
{{- $_ := set .Values.route.wygiwyh "hostnames" (list .Values.wygiwyh.hostname) -}}
{{- $_ := set .Values.route.wygiwyh "parentRefs" (list (dict "kind" "Gateway" "name" .Values.gateway.name "namespace" .Values.gateway.namespace "sectionName" .Values.gateway.sectionName)) -}}
{{- end }}
{{- if .Values.financialDashboard.enabled }}
{{- $_ := required "financialDashboard.hostname is required" .Values.financialDashboard.hostname -}}
{{- $_ := required "financialDashboard.sessionSecretSecret is required" .Values.financialDashboard.sessionSecretSecret -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" .Values.financialDashboard.hostname) -}}
{{- fail "financialDashboard.hostname must be a public DNS hostname without scheme, port or wildcard" -}}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "financialDashboard.config" . | fromYaml) -}}
{{- $_ := set (index .Values.controllers "financial-dashboard").containers.app.image "tag" .Values.financialDashboard.imageTag -}}
{{- $sessionSecret := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.financialDashboard.sessionSecretSecret "key" "SESSION_SECRET")) -}}
{{- $env := dict
  "PORT" "3000"
  "AUTH_FILE_PATH" "/app/data/.dashboard_auth"
  "SESSION_SECRET" $sessionSecret
}}
{{- $_ := set (index .Values.controllers "financial-dashboard").containers.app "env" $env -}}
{{- $_ := set (index .Values.controllers "financial-dashboard").containers.app "resources" .Values.financialDashboard.resources -}}
{{- $_ := set (index .Values.route "financial-dashboard") "hostnames" (list .Values.financialDashboard.hostname) -}}
{{- $_ := set (index .Values.route "financial-dashboard") "parentRefs" (list (dict "kind" "Gateway" "name" .Values.gateway.name "namespace" .Values.gateway.namespace "sectionName" .Values.gateway.sectionName)) -}}
{{- end }}
{{- $_ := required "firefly.hostname is required" .Values.firefly.hostname -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" .Values.firefly.hostname) -}}
{{- fail "firefly.hostname must be a public DNS hostname without scheme, port or wildcard" -}}
{{- end -}}
{{- $_ := required "cluster.name must be injected by the owning ApplicationSet" .Values.cluster.name -}}
{{- $_ := required "datacenter must be injected by the owning ApplicationSet" .Values.datacenter -}}
{{- $_ := required "region must be injected by the owning ApplicationSet" .Values.region -}}
{{- $_ := required "gateway.name is required" .Values.gateway.name -}}
{{- $_ := required "gateway.namespace is required" .Values.gateway.namespace -}}
{{- $_ := required "gateway.sectionName is required" .Values.gateway.sectionName -}}
{{- $_ := required "firefly.appKeySecret is required" .Values.firefly.appKeySecret -}}
{{- $_ := required "firefly.database.userSecret is required" .Values.firefly.database.userSecret -}}
{{- $_ := required "firefly.database.crossplane.crossplaneProvider must be injected by the owning ApplicationSet" .Values.firefly.database.crossplane.crossplaneProvider -}}
{{- $_ := required "firefly.database.crossplane.terraformProvider must be injected by the owning ApplicationSet" .Values.firefly.database.crossplane.terraformProvider -}}
{{- $_ := set .Values.controllers.app.containers.firefly.image "tag" .Values.firefly.imageTag -}}
{{- $_ := set .Values.controllers.scheduler.containers.scheduler.image "tag" .Values.firefly.imageTag -}}
{{- $dbPassword := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.firefly.database.userSecret "key" .Values.firefly.database.passwordKey)) -}}
{{- $dbUsername := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.firefly.database.userSecret "key" .Values.firefly.database.usernameKey)) -}}
{{- $appKeySecret := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.firefly.appKeySecret "key" "APP_KEY")) -}}
{{- $databaseHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.firefly.database.host -}}
{{/* Authentik's X-authentik-email is consumed by Firefly's remote user guard. */}}
{{- $env := dict
  "DB_CONNECTION" "pgsql"
  "DB_HOST" $databaseHost
  "DB_PORT" .Values.firefly.database.port
  "DB_DATABASE" $dbUsername
  "DB_USERNAME" $dbUsername
  "DB_PASSWORD" $dbPassword
  "APP_KEY" $appKeySecret
  "APP_URL" (printf "https://%s" .Values.firefly.hostname)
  "TRUSTED_PROXIES" "**"
  "AUTHENTICATION_GUARD" "remote_user_guard"
  "AUTHENTICATION_GUARD_HEADER" "HTTP_X_AUTHENTIK_EMAIL"
  "AUTHENTICATION_GUARD_EMAIL" "HTTP_X_AUTHENTIK_EMAIL"
  "DEFAULT_LANGUAGE" "en_US"
  "DEFAULT_LOCALE" "equal"
  "TZ" "UTC"
}}
{{- $_ := set .Values.controllers.app.containers.firefly "env" $env -}}
{{- $_ := set .Values.controllers.scheduler.containers.scheduler "env" $env -}}
{{- $_ := set .Values.controllers.app.containers.firefly "resources" .Values.firefly.resources -}}
{{- $_ := set .Values.controllers.scheduler.containers.scheduler "resources" .Values.firefly.resources -}}
{{- $_ := set .Values.route.app "hostnames" (list .Values.firefly.hostname) -}}
{{- $_ := set .Values.route.app "parentRefs" (list (dict "kind" "Gateway" "name" .Values.gateway.name "namespace" .Values.gateway.namespace "sectionName" .Values.gateway.sectionName)) -}}
{{- include "bjw-s.common.loader.generate" . -}}
