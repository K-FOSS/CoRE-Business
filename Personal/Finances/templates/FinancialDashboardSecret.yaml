{{- if .Values.financialDashboard.enabled }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-financial-dashboard-session-secret'
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  length: 64
  digits: 16
  symbols: 0
  allowRepeat: true
  secretKeys:
    - 'SESSION_SECRET'
  encoding: 'raw'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-financial-dashboard-session-secret'
  annotations:
    argocd.argoproj.io/sync-wave: '-9'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: '{{ .Values.financialDashboard.sessionSecretSecret }}'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: 'Password'
          name: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-financial-dashboard-session-secret'
{{- end }}
