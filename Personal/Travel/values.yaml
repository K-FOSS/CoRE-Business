# Site-specific values are injected by the owning Backplane ApplicationSet.
cluster:
  name: ''

datacenter: ''
region: ''

global:
  createDefaultServiceAccount: true
  fullnameOverride: 'adventurelog'

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

authentik:
  providerConfigRef: 'authentik'
  outpost:
    name: 'aaa-myloginspace-proxy'
    namespace: 'core-prod'
    port: 80
  applications:
    adventurelog:
      displayName: 'AdventureLog Forward Auth'
      slug: 'adventurelog-forward-auth'
      group: 'Personal'
    adventurelogApi:
      displayName: 'AdventureLog API Forward Auth'
      slug: 'adventurelog-api-forward-auth'
      group: 'Personal'
    trek:
      displayName: 'TREK Forward Auth'
      slug: 'trek-forward-auth'
      group: 'Personal'
    airtrail:
      displayName: 'AirTrail Forward Auth'
      slug: 'airtrail-forward-auth'
      group: 'Personal'

storage:
  className: 'longhorn'
  mediaSize: '10Gi'
  trekDataSize: '2Gi'
  trekUploadsSize: '10Gi'

adventurelog:
  hostname: 'adventurelog.mylogin.space'
  apiHostname: 'adventurelog-api.mylogin.space'
  image:
    frontendRepository: 'ghcr.io/seanmorley15/adventurelog-frontend'
    backendRepository: 'ghcr.io/seanmorley15/adventurelog-backend'
    tag: 'v0.13.0'
    frontendDigest: 'sha256:51ee22428b4192f4372b54f84c8b90cd710311ad99993c5045f53b51717dd3f7'
    backendDigest: 'sha256:0250d9cb0d745a8d768f31d3cdc68ac14bfa8b43dedfe0f550158e3861c12db7'
  database:
    # Defaults to psql-local.<cluster>.<datacenter>.<region>.mylogin.space.
    host: ''
    port: '5432'
    # AdventureLog uses the generated User secret's username as its database
    # name, matching the database created by the Backplane User resource.
    name: 'database'
    userSecret: 'adventurelog-database'
    databaseKey: 'username'
    usernameKey: 'username'
    passwordKey: 'password'
    crossplaneProvider: ''
    terraformProvider: ''
  runtimeSecret:
    generatorName: 'adventurelog-runtime-generator'
    secretName: 'adventurelog-runtime'
  adminSecret:
    generatorName: 'adventurelog-admin-generator'
    secretName: 'adventurelog-admin'
    # This database already contains the admin email; let the existing account
    # remain authoritative instead of rerunning the image's first-boot hook.
    bootstrap: false
    username: 'admin'
    email: 'admin@mylogin.space'
  smtp:
    host: 'mail.mylogin.space'
    port: '465'
    # Reuse the AdventureLog User connection Secret, as Tranquil does.
    secretName: 'adventurelog-database'
    usernameKey: 'username'
    passwordKey: 'password'
    useTls: 'false'
    useSsl: 'true'
    domain: 'mail.mylogin.space'
  oidc:
    providerConfigRef: 'authentik'
    issuerBaseUrl: 'https://idp.mylogin.space'
    applicationSlug: 'adventurelog'
    displayName: 'AdventureLog'
    accessGroup: 'Home Users'
    workspaceName: 'adventurelog-oidc'
  resources:
    frontend:
      requests:
        cpu: '100m'
        memory: '256Mi'
      limits:
        cpu: '1'
        memory: '1Gi'
    backend:
      requests:
        cpu: '100m'
        memory: '512Mi'
      limits:
        cpu: '2'
        memory: '2Gi'

trek:
  hostname: 'trek.mylogin.space'
  image:
    repository: 'docker.io/mauriceboe/trek'
    tag: '4.3.0'
    digest: 'sha256:3521a3a2f121f59c3a30253a8f34fc7941a41ea73e8a6450769ae60e81f1de2a'
  runtimeSecret:
    generatorName: 'trek-runtime-generator'
    secretName: 'trek-runtime'
  adminSecret:
    generatorName: 'trek-admin-generator'
    secretName: 'trek-admin'
    email: 'admin@mylogin.space'
  oidc:
    providerConfigRef: 'authentik'
    issuerBaseUrl: 'https://idp.mylogin.space'
    applicationSlug: 'trek'
    displayName: 'TREK'
    accessGroup: 'Home Users'
    workspaceName: 'trek-oidc'
  timeZone: 'UTC'
  resources:
    requests:
      cpu: '100m'
      memory: '256Mi'
    limits:
      cpu: '1'
      memory: '1Gi'

airtrail:
  hostname: 'airtrail.mylogin.space'
  image:
    repository: 'docker.io/johly/airtrail'
    tag: 'v3.12.0'
    digest: 'sha256:4de4ca7dd57a95dac88af3f3e0cd5309006d9f672859a58b28d0c1ca1c31986d'
  database:
    # AirTrail's DB_USERNAME and DB_DATABASE_NAME use the generated User
    # secret's username, matching the database created by the Backplane User.
    userSecret: 'airtrail-database'
    host: ''
    port: '5432'
    crossplaneProvider: ''
    terraformProvider: ''
