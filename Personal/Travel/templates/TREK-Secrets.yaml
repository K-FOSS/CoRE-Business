apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: '{{ .Values.trek.runtimeSecret.generatorName }}'
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  length: 64
  digits: 0
  symbols: 0
  allowRepeat: true
  encoding: 'hex'
  secretKeys:
    - 'ENCRYPTION_KEY'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ .Values.trek.runtimeSecret.generatorName }}'
  annotations:
    argocd.argoproj.io/sync-wave: '-9'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: '{{ .Values.trek.runtimeSecret.secretName }}'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: 'Password'
          name: '{{ .Values.trek.runtimeSecret.generatorName }}'
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: '{{ .Values.trek.adminSecret.generatorName }}'
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  length: 32
  digits: 1
  symbols: 0
  allowRepeat: true
  encoding: 'raw'
  secretKeys:
    - 'ADMIN_PASSWORD'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ .Values.trek.adminSecret.generatorName }}'
  annotations:
    argocd.argoproj.io/sync-wave: '-9'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: '{{ .Values.trek.adminSecret.secretName }}'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: 'Password'
          name: '{{ .Values.trek.adminSecret.generatorName }}'
