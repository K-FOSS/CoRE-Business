apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: 'adventurelog-database-user'
spec:
  name: 'AdventureLog database'
  psql:
    enabled: true
    createUserDatabase: true
    crossplane:
      crossplaneProvider: '{{ required "adventurelog.database.crossplaneProvider must be injected by the owning ApplicationSet" .Values.adventurelog.database.crossplaneProvider }}'
      terraformProvider: '{{ required "adventurelog.database.terraformProvider must be injected by the owning ApplicationSet" .Values.adventurelog.database.terraformProvider }}'
  writeConnectionSecretToRef:
    name: '{{ .Values.adventurelog.database.userSecret }}'
