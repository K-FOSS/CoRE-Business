{{- include "bjw-s.common.loader.init" . -}}

{{- define "adventurelog.hardcodedValues" -}}
controllers:
  frontend:
    type: 'deployment'
    replicas: 1
    strategy: 'Recreate'
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: 'RuntimeDefault'
    containers:
      frontend:
        image:
          repository: ''
          tag: ''
          digest: ''
          pullPolicy: 'IfNotPresent'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        env: {}
        resources: {}
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/health', port: 3000, scheme: 'HTTP'}
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/health', port: 3000, scheme: 'HTTP'}
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/health', port: 3000, scheme: 'HTTP'}
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
  backend:
    type: 'deployment'
    replicas: 1
    strategy: 'Recreate'
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: 'RuntimeDefault'
    containers:
      backend:
        image:
          repository: ''
          tag: ''
          digest: ''
          pullPolicy: 'IfNotPresent'
        env: {}
        resources: {}
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/health/', port: 80, scheme: 'HTTP'}
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/health/', port: 80, scheme: 'HTTP'}
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/health/', port: 80, scheme: 'HTTP'}
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
  trek:
    type: 'deployment'
    forceRename: 'core-personal-travel-trek'
    replicas: 1
    strategy: 'Recreate'
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: 'RuntimeDefault'
    containers:
      trek:
        image:
          repository: ''
          tag: ''
          digest: ''
          pullPolicy: 'IfNotPresent'
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
            add: ['CHOWN', 'SETUID', 'SETGID']
        env: {}
        resources: {}
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/api/health', port: 3000, scheme: 'HTTP'}
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/api/health', port: 3000, scheme: 'HTTP'}
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/api/health', port: 3000, scheme: 'HTTP'}
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
  airtrail:
    type: 'deployment'
    forceRename: 'core-personal-travel-airtrail'
    replicas: 1
    strategy: 'Recreate'
    pod:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: 'OnRootMismatch'
        seccompProfile:
          type: 'RuntimeDefault'
    containers:
      airtrail:
        image:
          repository: ''
          tag: ''
          digest: ''
          pullPolicy: 'IfNotPresent'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        env: {}
        resources: {}
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/', port: 3000, scheme: 'HTTP'}
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/', port: 3000, scheme: 'HTTP'}
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: '/', port: 3000, scheme: 'HTTP'}
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5

service:
  frontend:
    controller: 'frontend'
    ports:
      http:
        port: 3000
  backend:
    controller: 'backend'
    ports:
      http:
        port: 80
  trek:
    controller: 'trek'
    forceRename: 'core-personal-travel-trek'
    ports:
      http:
        port: 3000
  airtrail:
    controller: 'airtrail'
    forceRename: 'core-personal-travel-airtrail'
    ports:
      http:
        port: 3000

persistence:
  media:
    type: 'persistentVolumeClaim'
    storageClass: 'longhorn'
    accessMode: 'ReadWriteOnce'
    size: '10Gi'
    retain: true
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    advancedMounts:
      backend:
        backend:
          - path: '/code/media'
  trek-data:
    type: 'persistentVolumeClaim'
    forceRename: 'core-personal-travel-trek-data'
    storageClass: 'longhorn'
    accessMode: 'ReadWriteOnce'
    size: '2Gi'
    retain: true
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    advancedMounts:
      trek:
        trek:
          - path: '/app/data'
  trek-uploads:
    type: 'persistentVolumeClaim'
    forceRename: 'core-personal-travel-trek-uploads'
    storageClass: 'longhorn'
    accessMode: 'ReadWriteOnce'
    size: '10Gi'
    retain: true
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    advancedMounts:
      trek:
        trek:
          - path: '/app/uploads'
  trek-tmp:
    type: 'emptyDir'
    globalMounts:
      - path: '/tmp'
  airtrail-uploads:
    type: 'persistentVolumeClaim'
    forceRename: 'core-personal-travel-airtrail-uploads'
    storageClass: 'longhorn'
    accessMode: 'ReadWriteOnce'
    size: '10Gi'
    retain: true
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    advancedMounts:
      airtrail:
        airtrail:
          - path: '/app/uploads'

route:
  frontend:
    kind: 'HTTPRoute'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames: []
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        backendRefs:
          - identifier: 'frontend'
            port: 3000
  backend:
    kind: 'HTTPRoute'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames: []
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        backendRefs:
          - identifier: 'backend'
            port: 80
  trek:
    kind: 'HTTPRoute'
    forceRename: 'core-personal-travel-trek'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames: []
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        backendRefs:
          - identifier: 'trek'
            port: 3000
  airtrail:
    kind: 'HTTPRoute'
    forceRename: 'core-personal-travel-airtrail'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames: []
    rules:
      - matches:
          - path:
              type: 'PathPrefix'
              value: '/'
        backendRefs:
          - identifier: 'airtrail'
            port: 3000
{{- end -}}

{{- $_ := mergeOverwrite .Values (include "adventurelog.hardcodedValues" . | fromYaml) -}}
{{- $_ := required "cluster.name must be injected by the owning ApplicationSet" .Values.cluster.name -}}
{{- $_ := required "datacenter must be injected by the owning ApplicationSet" .Values.datacenter -}}
{{- $_ := required "region must be injected by the owning ApplicationSet" .Values.region -}}
{{- $_ := required "gateway.name is required" .Values.gateway.name -}}
{{- $_ := required "gateway.namespace is required" .Values.gateway.namespace -}}
{{- $_ := required "gateway.sectionName is required" .Values.gateway.sectionName -}}
{{- $_ := required "adventurelog.hostname is required" .Values.adventurelog.hostname -}}
{{- $_ := required "adventurelog.apiHostname is required" .Values.adventurelog.apiHostname -}}
{{- $_ := required "adventurelog.database.userSecret is required" .Values.adventurelog.database.userSecret -}}
{{- $_ := required "adventurelog.runtimeSecret.secretName is required" .Values.adventurelog.runtimeSecret.secretName -}}
{{- $_ := required "adventurelog.adminSecret.secretName is required" .Values.adventurelog.adminSecret.secretName -}}
{{- $_ := required "trek.hostname is required" .Values.trek.hostname -}}
{{- $_ := required "trek.runtimeSecret.secretName is required" .Values.trek.runtimeSecret.secretName -}}
{{- $_ := required "trek.adminSecret.secretName is required" .Values.trek.adminSecret.secretName -}}
{{- $_ := required "airtrail.hostname is required" .Values.airtrail.hostname -}}
{{- $_ := required "airtrail.database.userSecret is required" .Values.airtrail.database.userSecret -}}
{{- $_ := required "adventurelog.smtp.secretName is required" .Values.adventurelog.smtp.secretName -}}
{{- $_ := set .Values.controllers.frontend.containers.frontend.image "repository" .Values.adventurelog.image.frontendRepository -}}
{{- $_ := set .Values.controllers.frontend.containers.frontend.image "tag" .Values.adventurelog.image.tag -}}
{{- $_ := set .Values.controllers.frontend.containers.frontend.image "digest" .Values.adventurelog.image.frontendDigest -}}
{{- $_ := set .Values.controllers.backend.containers.backend.image "repository" .Values.adventurelog.image.backendRepository -}}
{{- $_ := set .Values.controllers.backend.containers.backend.image "tag" .Values.adventurelog.image.tag -}}
{{- $_ := set .Values.controllers.backend.containers.backend.image "digest" .Values.adventurelog.image.backendDigest -}}
{{- $dbPassword := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.adventurelog.database.userSecret "key" .Values.adventurelog.database.passwordKey)) -}}
{{- $dbUsername := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.adventurelog.database.userSecret "key" .Values.adventurelog.database.usernameKey)) -}}
{{- $dbName := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.adventurelog.database.userSecret "key" .Values.adventurelog.database.databaseKey)) -}}
{{- $secretKey := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.adventurelog.runtimeSecret.secretName "key" "SECRET_KEY")) -}}
{{- $adminPassword := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.adventurelog.adminSecret.secretName "key" "DJANGO_ADMIN_PASSWORD")) -}}
{{- $databaseHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.adventurelog.database.host -}}
{{- $frontendURL := printf "https://%s" .Values.adventurelog.hostname -}}
{{- $backendURL := printf "https://%s" .Values.adventurelog.apiHostname -}}
{{- $databaseEnv := dict
  "POSTGRES_PASSWORD" $dbPassword
  "PGHOST" $databaseHost
  "POSTGRES_DB" $dbName
  "POSTGRES_USER" $dbUsername
  "PGDATABASE" $dbName
  "PGUSER" $dbUsername
  "PGPASSWORD" $dbPassword
  "SECRET_KEY" $secretKey
  "DISABLE_REGISTRATION" "true"
  "FRONTEND_URL" $frontendURL
  "PUBLIC_URL" $backendURL
  "CSRF_TRUSTED_ORIGINS" (printf "%s,%s" $frontendURL $backendURL)
  "DEBUG" "False"
}}
{{- if .Values.adventurelog.adminSecret.bootstrap -}}
{{- $_ := set $databaseEnv "DJANGO_ADMIN_USERNAME" .Values.adventurelog.adminSecret.username -}}
{{- $_ := set $databaseEnv "DJANGO_ADMIN_PASSWORD" $adminPassword -}}
{{- $_ := set $databaseEnv "DJANGO_ADMIN_EMAIL" .Values.adventurelog.adminSecret.email -}}
{{- end -}}
{{- $frontendEnv := dict
  "ORIGIN" $frontendURL
  "FRONTEND_URL" $frontendURL
  "PUBLIC_SERVER_URL" "http://adventurelog-backend:80"
  "BODY_SIZE_LIMIT" "Infinity"
}}
{{- $_ := set .Values.controllers.frontend.containers.frontend "env" $frontendEnv -}}
{{- $_ := set .Values.controllers.frontend.containers.frontend "resources" .Values.adventurelog.resources.frontend -}}
{{- $_ := set .Values.controllers.backend.containers.backend "env" $databaseEnv -}}
{{- $_ := set .Values.controllers.backend.containers.backend "resources" .Values.adventurelog.resources.backend -}}
{{- $_ := set .Values.controllers.trek.containers.trek.image "repository" .Values.trek.image.repository -}}
{{- $_ := set .Values.controllers.trek.containers.trek.image "tag" .Values.trek.image.tag -}}
{{- $_ := set .Values.controllers.trek.containers.trek.image "digest" .Values.trek.image.digest -}}
{{- $trekEncryptionKey := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.trek.runtimeSecret.secretName "key" "ENCRYPTION_KEY")) -}}
{{- $trekAdminPassword := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.trek.adminSecret.secretName "key" "ADMIN_PASSWORD")) -}}
{{- $trekURL := printf "https://%s" .Values.trek.hostname -}}
{{- $trekEnv := dict
  "NODE_ENV" "production"
  "PORT" "3000"
  "TZ" .Values.trek.timeZone
  "APP_URL" $trekURL
  "ALLOWED_ORIGINS" $trekURL
  "FORCE_HTTPS" "true"
  "TRUST_PROXY" "1"
  "ENCRYPTION_KEY" $trekEncryptionKey
  "ADMIN_EMAIL" .Values.trek.adminSecret.email
  "ADMIN_PASSWORD" $trekAdminPassword
  "OIDC_ISSUER" (dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.trek.oidc.workspaceName "key" "OIDC_ISSUER")))
  "OIDC_CLIENT_ID" (dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.trek.oidc.workspaceName "key" "OIDC_CLIENT_ID")))
  "OIDC_CLIENT_SECRET" (dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.trek.oidc.workspaceName "key" "OIDC_CLIENT_SECRET")))
  "OIDC_DISPLAY_NAME" .Values.trek.oidc.displayName
  "OIDC_DISCOVERY_URL" (dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.trek.oidc.workspaceName "key" "OIDC_DISCOVERY_URL")))
  "OIDC_SCOPE" "openid email profile"
}}
{{- $_ := set .Values.controllers.trek.containers.trek "env" $trekEnv -}}
{{- $_ := set .Values.controllers.trek.containers.trek "resources" .Values.trek.resources -}}
{{- $_ := set .Values.controllers.airtrail.containers.airtrail.image "repository" .Values.airtrail.image.repository -}}
{{- $_ := set .Values.controllers.airtrail.containers.airtrail.image "tag" .Values.airtrail.image.tag -}}
{{- $_ := set .Values.controllers.airtrail.containers.airtrail.image "digest" .Values.airtrail.image.digest -}}
{{- $smtpUsername := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.adventurelog.smtp.secretName "key" .Values.adventurelog.smtp.usernameKey)) -}}
{{- $smtpPassword := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.adventurelog.smtp.secretName "key" .Values.adventurelog.smtp.passwordKey)) -}}
{{- $smtpEnv := dict
  "A_SMTP_USERNAME" $smtpUsername
  "DEFAULT_FROM_EMAIL" (printf "$(A_SMTP_USERNAME)@%s" .Values.adventurelog.smtp.domain)
  "EMAIL_HOST" .Values.adventurelog.smtp.host
  "EMAIL_HOST_PASSWORD" $smtpPassword
  "EMAIL_HOST_USER" $smtpUsername
  "EMAIL_PORT" .Values.adventurelog.smtp.port
  "EMAIL_USE_TLS" .Values.adventurelog.smtp.useTls
  "EMAIL_USE_SSL" .Values.adventurelog.smtp.useSsl
}}
{{- $_ := mergeOverwrite .Values.controllers.backend.containers.backend.env $smtpEnv -}}
{{- $airtrailDatabaseHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.airtrail.database.host -}}
{{- $airtrailUsername := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.airtrail.database.userSecret "key" "username")) -}}
{{- $airtrailPassword := dict "valueFrom" (dict "secretKeyRef" (dict "name" .Values.airtrail.database.userSecret "key" "password")) -}}
{{- $airtrailEnv := dict
  "A_DB_USERNAME" $airtrailUsername
  "BODY_SIZE_LIMIT" "20M"
  "DB_DATABASE_NAME" $airtrailUsername
  "DB_PASSWORD" $airtrailPassword
  "DB_URL" (printf "postgres://$(A_DB_USERNAME):$(DB_PASSWORD)@%s:%s/$(DB_DATABASE_NAME)" $airtrailDatabaseHost .Values.airtrail.database.port)
  "DB_USERNAME" $airtrailUsername
  "ORIGIN" (printf "https://%s" .Values.airtrail.hostname)
  "UPLOAD_LOCATION" "/app/uploads"
}}
{{- $_ := set .Values.controllers.airtrail.containers.airtrail "env" $airtrailEnv -}}
{{- $_ := set .Values.controllers.airtrail.containers.airtrail "resources" .Values.trek.resources -}}
{{- $_ := set .Values.persistence.media "storageClass" .Values.storage.className -}}
{{- $_ := set .Values.persistence.media "size" .Values.storage.mediaSize -}}
{{- $_ := set (index .Values.persistence "trek-data") "storageClass" .Values.storage.className -}}
{{- $_ := set (index .Values.persistence "trek-data") "size" .Values.storage.trekDataSize -}}
{{- $_ := set (index .Values.persistence "trek-uploads") "storageClass" .Values.storage.className -}}
{{- $_ := set (index .Values.persistence "trek-uploads") "size" .Values.storage.trekUploadsSize -}}
{{- $_ := set .Values.route.frontend "hostnames" (list .Values.adventurelog.hostname) -}}
{{- $_ := set .Values.route.backend "hostnames" (list .Values.adventurelog.apiHostname) -}}
{{- $_ := set .Values.route.trek "hostnames" (list .Values.trek.hostname) -}}
{{- $_ := set .Values.route.airtrail "hostnames" (list .Values.airtrail.hostname) -}}
{{- $parentRefs := list (dict "kind" "Gateway" "name" .Values.gateway.name "namespace" .Values.gateway.namespace "sectionName" .Values.gateway.sectionName) -}}
{{- $_ := set .Values.route.frontend "parentRefs" $parentRefs -}}
{{- $_ := set .Values.route.backend "parentRefs" $parentRefs -}}
{{- $_ := set .Values.route.trek "parentRefs" $parentRefs -}}
{{- $_ := set .Values.route.airtrail "parentRefs" $parentRefs -}}
{{- include "bjw-s.common.loader.generate" . -}}
