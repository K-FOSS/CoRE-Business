apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: 'airtrail-database-user'
spec:
  name: 'AirTrail database'
  psql:
    enabled: true
    createUserDatabase: true
    crossplane:
      crossplaneProvider: '{{ required "airtrail.database.crossplaneProvider must be injected by the owning ApplicationSet" .Values.airtrail.database.crossplaneProvider }}'
      terraformProvider: '{{ required "airtrail.database.terraformProvider must be injected by the owning ApplicationSet" .Values.airtrail.database.terraformProvider }}'
  writeConnectionSecretToRef:
    name: '{{ .Values.airtrail.database.userSecret }}'
