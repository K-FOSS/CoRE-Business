# Site-specific values are injected by the owning Backplane ApplicationSet.
cluster:
  name: ''

datacenter: ''
region: ''
clusterDNS: 'kube-dns.kube-system.svc.cluster.local'

global:
  createDefaultServiceAccount: true
  fullnameOverride: 'fitness'

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

opengym:
  hostname: 'gym.mylogin.space'
  imageTag: '1.3.5'
  mediaImage:
    repository: 'alpine/git'
    tag: '2.45.2'
  resources:
    web:
      requests:
        cpu: '25m'
        memory: '64Mi'
      limits:
        cpu: '500m'
        memory: '256Mi'
    api:
      requests:
        cpu: '25m'
        memory: '64Mi'
      limits:
        cpu: '500m'
        memory: '256Mi'

authentik:
  application:
    displayName: 'openGym'
    group: 'Personal'
