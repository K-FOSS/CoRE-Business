URL: 'https://mail.mylogin.space'

global:
  createDefaultServiceAccount: false

clusterDNS: 'k0s.resolvemy.host'

cluster:
  # Lovely names releases <cluster>-business-mail. Set this explicitly if that
  # convention changes.
  name: ''

credentialsSync:
  enabled: true
  refreshInterval: '1h'
  hubCluster: 'dc1-k3s-node1'
  remotePathPrefix: 'Mail/Clusters'
  secretStoreRef:
    kind: 'ClusterSecretStore'
    name: 'mainvault-core'

site:
  ldap:
    hostname: 'ldap-dc1.mylogin.space'
    port: '636'
  psql:
    hostname: 'psql-local.dc1-k3s-node1.dc1.yxl.mylogin.space'
    port: '5432'
    crossplaneProvider: 'psql-dc1-yxl'
    terraformProvider: 'psql-dc1-yxl'
  dragonfly:
    hostname: 'dragonfly.dc1-k3s-node1.dc1.yxl.mylogin.space'
    port: '6379'
    database: '25'
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'corevault-rootsecrets'
    remoteRef:
      key: 'Storage/DragonFly/CoRE/Creds'
      passwordProperty: 'Password'
  s3:
    crossplaneProvider: 's3-yxl-dc1-core'
    terraformProvider: 's3-yxl-dc1-core'

email:
  domain: mail.mylogin.space
  support: k@mylogin.space
  tls:
    secretName: myloginspace-default-certificates

  postfix:
    server: 10.1.1.25

simplelogin:
  enabled: false

dns:
  automagic:
    enabled: false

dkim-manager:
  image:

    # image.pullPolicy -- dkim-manager image pullPolicy.
    pullPolicy: Always

  controller:
    # controller.replicas -- Specify the number of replicas of the controller Pod.
    replicas: 2

    # controller.resources -- Specify resources.
    resources:
      requests:
        cpu: 100m
        memory: 20Mi

    # controller.terminationGracePeriodSeconds -- Specify terminationGracePeriodSeconds.
    terminationGracePeriodSeconds: 10

    # controller.extraArgs -- Optional additional arguments.
    extraArgs:
      - --leader-elect

  namespaced: true
  namespace: ""

  external-dns:
    enabled: false
    serviceAccount:
      create: false
    rbac:
      create: false
    env: []
    sources:
      - crd
    logFormat: json
    txtPrefix: dkim-manager
    extraArgs:
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --managed-record-types=TXT
