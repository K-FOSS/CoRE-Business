{{- if .Values.credentialsSync.enabled }}
{{- $isHub := eq (include "mail.isHub" .) "true" }}
{{- $databaseProperties := list
  (dict "secretKey" "username" "remoteProperty" "Username")
  (dict "secretKey" "password" "remoteProperty" "Password")
  (dict "secretKey" "database" "remoteProperty" "Database")
-}}
{{- $s3Properties := list
  (dict "secretKey" "AccessKey" "remoteProperty" "AccessKey")
  (dict "secretKey" "SecretAccessKey" "remoteProperty" "SecretAccessKey")
-}}
{{- $dkimProperties := list
  (dict "secretKey" "mail.mylogin.space.selector1.key" "remoteProperty" "PrivateKey")
-}}
{{- $credentials := list
  (dict "name" "Postfix/Database" "secret" (printf "%s-postfix" .Release.Name) "properties" $databaseProperties)
  (dict "name" "Maddy/Database" "secret" (printf "%s-maddy-creds" .Release.Name) "properties" $databaseProperties)
  (dict "name" "Maddy/S3" "secret" (printf "%s-maddy-s3-user" .Release.Name) "properties" $s3Properties)
  (dict "name" "DKIM/selector1" "secret" "selector1-mail-myloginspace" "properties" $dkimProperties)
-}}
{{- if .Values.simplelogin.enabled }}
{{- $credentials = append $credentials (dict "name" "SimpleLogin/Database" "secret" (printf "%s-simplelogin" .Release.Name) "properties" $databaseProperties) }}
{{- end }}
{{- range $credential := $credentials }}
---
{{- if $isHub }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ printf "%s-push" $credential.secret | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  refreshInterval: {{ $.Values.credentialsSync.refreshInterval | quote }}
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - {{- toYaml $.Values.credentialsSync.secretStoreRef | nindent 6 }}
  selector:
    secret:
      name: {{ $credential.secret | quote }}
  data:
    {{- range $property := $credential.properties }}
    - match:
        secretKey: {{ $property.secretKey | quote }}
        remoteRef:
          remoteKey: {{ include "mail.credentialsRemoteKey" (dict "root" $ "name" $credential.name) | quote }}
          property: {{ $property.remoteProperty | quote }}
    {{- end }}
{{- else }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-pull" $credential.secret | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: {{ $.Values.credentialsSync.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml $.Values.credentialsSync.secretStoreRef | nindent 4 }}
  target:
    name: {{ $credential.secret | quote }}
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    {{- range $property := $credential.properties }}
    - secretKey: {{ $property.secretKey | quote }}
      remoteRef:
        key: {{ include "mail.credentialsRemoteKey" (dict "root" $ "name" $credential.name) | quote }}
        property: {{ $property.remoteProperty | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
