{{- if .Values.simplelogin.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-mail-simplelogin-postfix-db-prod-sync
spec:
  secretStoreRef:
    {{- toYaml .Values.credentialsSync.secretStoreRef | nindent 4 }}

  target:
    name: business-mail-simplelogin-postfix-db-prod
    template:
      engineVersion: v2
      data:
        CONF_MYDOMAIN: '{{ .Values.email.domain }}'

        POSTGRES_HOSTS: {{ .Values.site.psql.hostname | quote }}

        POSTGRES_USER: '{{`{{ .Username }}`}}'
        POSTGRES_PASSWORD: '{{`{{ .Password }}`}}'

        DB_URI: '{{`postgresql://{{ .Username }}:{{ .Password }}@`}}{{ .Values.site.psql.hostname }}:{{ .Values.site.psql.port }}{{`/{{ .Database }}`}}'

        URL: '{{ .Values.URL }}'
  data:
    - secretKey: Database
      remoteRef:
        key: {{ include "mail.credentialsRemoteKey" (dict "root" . "name" "SimpleLogin/Database") | quote }}
        property: Database

    - secretKey: Password
      remoteRef:
        key: {{ include "mail.credentialsRemoteKey" (dict "root" . "name" "SimpleLogin/Database") | quote }}
        property: Password

    - secretKey: Username
      remoteRef:
        key: {{ include "mail.credentialsRemoteKey" (dict "root" . "name" "SimpleLogin/Database") | quote }}
        property: Username
{{- end }}
