---
{{- include "bjw-s.common.loader.init" . }}

{{- define "mail.hardcodedValues" -}}
global:
  nameOverride: {{ .Release.Name | quote }}

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: 'RuntimeDefault'
  labels:
    logs: 'loki-myloginspace'

controllers:
  dovecot:
    annotations: &mailReloaderAnnotations
      reloader.stakater.com/auto: 'true'
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 0
      surge: 1
    revisionHistoryLimit: 5
    pod:
      labels:
        app.kubernetes.io/component: 'dovecot'
    containers:
      dovecot:
        image:
          repository: 'dovecot/dovecot'
          tag: '2.4.4'
          pullPolicy: IfNotPresent
        securityContext:
          # Dovecot's master process starts as root so it can manage its
          # service users and mailbox access; it drops privileges internally.
          allowPrivilegeEscalation: false
          capabilities:
            add: ['CHOWN', 'DAC_OVERRIDE', 'SETGID', 'SETUID']
            drop: ['ALL']
        ports:
          - name: sasl
            containerPort: 12345
          - name: imap
            containerPort: 31143
          - name: imaps
            containerPort: 31993
          - name: pop3
            containerPort: 31110
          - name: pop3s
            containerPort: 31995
          - name: lmtp
            containerPort: 2525

  maddy:
    annotations: *mailReloaderAnnotations
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 0
      surge: 1
    revisionHistoryLimit: 5
    pod:
      labels:
        app.kubernetes.io/component: 'maddy'
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: 'OnRootMismatch'
        seccompProfile:
          type: 'RuntimeDefault'
    containers:
      maddy:
        image:
          repository: 'foxcpp/maddy'
          tag: '0.9.0'
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add: ['NET_BIND_SERVICE']
            drop: ['ALL']
        stdin: true
        tty: true
        env:
          S3_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-maddy-s3-user" .Release.Name | quote }}
                key: 'AccessKey'
          S3_SECRET_KEY:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-maddy-s3-user" .Release.Name | quote }}
                key: 'SecretAccessKey'
          PSQL_HOSTNAME: {{ .Values.site.psql.hostname | quote }}
          PSQL_PORT: {{ .Values.site.psql.port | quote }}
          PSQL_DATABASE:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-maddy-creds" .Release.Name | quote }}
                key: 'database'
          USERNAME:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-maddy-creds" .Release.Name | quote }}
                key: 'username'
          PASSWORD:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-maddy-creds" .Release.Name | quote }}
                key: 'password'
        ports:
          - name: lmtp
            containerPort: 2525
          - name: imaps
            containerPort: 993
          - name: imap
            containerPort: 143

  postfix:
    annotations: *mailReloaderAnnotations
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 0
      surge: 1
    revisionHistoryLimit: 5
    pod:
      labels:
        app.kubernetes.io/component: 'postfix'
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: 'kubernetes.io/hostname'
                labelSelector:
                  matchExpressions:
                    - key: 'app.kubernetes.io/component'
                      operator: In
                      values:
                        - 'postfix'
    containers:
      postfix:
        image:
          repository: 'kristianfoss/postfix'
          tag: 'core'
          digest: 'sha256:a799022b5250ecf83b3cb2d3a07ea6bf492a63a8fece7a1de1e5f37288305593'
          pullPolicy: IfNotPresent
        securityContext:
          # Postfix master starts as root to bind SMTP ports and manage its
          # internal service users; worker processes run with Postfix's users.
          allowPrivilegeEscalation: false
          capabilities:
            add: ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'NET_BIND_SERVICE', 'SETGID', 'SETUID']
            drop: ['ALL']
        resources:
          requests:
            cpu: '15m'
            memory: '105M'
          limits:
            cpu: '15m'
            memory: '105M'
        envFrom:
          - configMap: 'simplelogin-postfix-cfg'
        ports:
          - name: smtp
            containerPort: 25
          - name: smtp-tls
            containerPort: 465
          - name: smtp-starttls
            containerPort: 587
          - name: smtp-auth
            containerPort: 10025
      postfix-exporter:
        image:
          repository: 'ghcr.io/hsn723/postfix_exporter'
          tag: '0.20.0'
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop: ['ALL']
        args:
          - '--postfix.logfile_path=/dev/null'
        resources:
          requests:
            cpu: '10m'
            memory: '32Mi'
          limits:
            cpu: '100m'
            memory: '64Mi'
        ports:
          - name: metrics
            containerPort: 9154

  rspamd:
    annotations: *mailReloaderAnnotations
    replicas: 1
    pod:
      labels:
        app.kubernetes.io/component: 'rspam'
        app.kubernetes.io/worker: 'proxy'
      securityContext:
        runAsNonRoot: true
        runAsUser: 11333
        runAsGroup: 11333
        fsGroup: 11333
        fsGroupChangePolicy: 'OnRootMismatch'
        seccompProfile:
          type: 'RuntimeDefault'
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: 'kubernetes.io/hostname'
                labelSelector:
                  matchExpressions:
                    - key: 'app.kubernetes.io/worker'
                      operator: In
                      values:
                        - 'normal'
    containers:
      rspamd:
        image:
          repository: {{ .Values.rspamd.image.repository | quote }}
          tag: {{ .Values.rspamd.image.tag | quote }}
          pullPolicy: {{ .Values.rspamd.image.pullPolicy | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        ports:
          - name: proxy
            containerPort: 11332
          - name: normal
            containerPort: 11333
          - name: controller
            containerPort: 11334

  {{- if .Values.simplelogin.enabled }}
  simplelogin-api:
    annotations: *mailReloaderAnnotations
    replicas: 0
    pod:
      labels:
        app.kubernetes.io/component: 'api'
    initContainers:
      initdb:
        image:
          repository: 'simplelogin/app'
          tag: '3.4.0'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        command:
          - 'flask'
        args:
          - 'db'
          - 'upgrade'
        envFrom: &simpleloginEnv
          - secret: 'business-mail-simplelogin-db-prod'
          - configMap: 'simplelogin-config'
      initapp:
        image:
          repository: 'simplelogin/app'
          tag: '3.4.0'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        command:
          - 'python'
        args:
          - 'init_app.py'
        envFrom: *simpleloginEnv
    containers:
      api:
        image:
          repository: 'simplelogin/app'
          tag: '3.4.0'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        envFrom: *simpleloginEnv
        ports:
          - name: http
            containerPort: 7777

  simplelogin-mailhandler:
    annotations: *mailReloaderAnnotations
    replicas: 0
    pod:
      labels:
        app.kubernetes.io/component: 'mailhandler'
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: 'kubernetes.io/hostname'
              labelSelector:
                matchExpressions:
                  - key: 'app.kubernetes.io/name'
                    operator: In
                    values:
                      - 'simplelogin'
    containers:
      mailhandler:
        image:
          repository: 'simplelogin/app'
          tag: '3.4.0'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ['ALL']
        command:
          - 'python'
        args:
          - 'email_handler.py'
        envFrom: *simpleloginEnv
        ports:
          - name: smtp
            containerPort: 20381
  {{- end }}

service:
  dovecot:
    controller: 'dovecot'
    forceRename: 'dovecot'
    type: LoadBalancer
    allocateLoadBalancerNodePorts: false
    annotations: &mailLoadBalancerAnnotations
      purelb.io/allow-shared-ip: 'mail.mylogin.space'
      purelb.io/service-group: 'anycast'
      purelb.io/allow-local: 'true'
      purelb.io/addresses: '66.165.222.125'
    ports:
      imap:
        port: 143
        targetPort: imap
      imaps-default:
        port: 993
        targetPort: imaps
      sasl:
        port: 12345
        targetPort: sasl
      imap-transport:
        port: 2525
        targetPort: lmtp

  maddy:
    controller: 'maddy'
    forceRename: 'maddy'
    labels:
      lan-mode: 'private'
      wan-mode: 'public'
    annotations:
      external-dns.kubernetes.io/hostname: 'int-imap.mylogin.space'
      # TODO: Remove the legacy ExternalDNS annotation after all controllers use v0.22.0+.
      external-dns.alpha.kubernetes.io/hostname: 'int-imap.mylogin.space'
    ports:
      imap-default:
        port: 143
        targetPort: imap
        appProtocol: imap
      imaps-default:
        port: 993
        targetPort: imaps
        appProtocol: imaps

  postfix:
    controller: 'postfix'
    forceRename: 'postfix'
    type: LoadBalancer
    allocateLoadBalancerNodePorts: false
    annotations: *mailLoadBalancerAnnotations
    ports:
      smtp:
        port: 25
        targetPort: smtp
        appProtocol: smtp
      submissions:
        port: 465
        targetPort: smtp-tls
        appProtocol: submissions
      smtp-starttls:
        port: 587
        targetPort: smtp-starttls
        appProtocol: submission
      smtp-auth:
        port: 10025
        targetPort: smtp-auth

  postfix-metrics:
    controller: 'postfix'
    forceRename: 'postfix-metrics'
    labels:
      lan-mode: 'private'
    annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '9154'
    ports:
      metrics:
        port: 9154
        targetPort: metrics

  rspamd:
    controller: 'rspamd'
    forceRename: 'rspamd'
    labels:
      lan-mode: 'private'
      wan-mode: 'public'
    annotations:
      external-dns.kubernetes.io/hostname: 'int-rspamd.mylogin.space'
      # TODO: Remove the legacy ExternalDNS annotation after all controllers use v0.22.0+.
      external-dns.alpha.kubernetes.io/hostname: 'int-rspamd.mylogin.space'
    ports:
      proxy:
        port: 11332
        targetPort: proxy
      normal:
        port: 11333
        targetPort: normal
      controller:
        port: 11334
        targetPort: controller

  {{- if .Values.simplelogin.enabled }}
  simplelogin-api:
    controller: 'simplelogin-api'
    forceRename: 'simplelogin-api'
    ports:
      http:
        port: 80
        targetPort: http
  simplelogin-mailhandler:
    controller: 'simplelogin-mailhandler'
    forceRename: 'simplelogin-mailhandler'
    ports:
      smtp:
        port: 20381
        targetPort: smtp
  {{- end }}

persistence:
  dovecot-config:
    type: configMap
    name: 'business-mail-dovecot-config'
    advancedMounts:
      dovecot:
        dovecot:
          - path: '/etc/dovecot/dovecot.conf'
            subPath: 'dovecot.conf'
  dovecot-auth:
    type: secret
    name: 'business-mail-dovecot-auth-config'
    advancedMounts:
      dovecot:
        dovecot:
          - path: '/etc/dovecot/dovecot-ldap.conf'
            subPath: 'dovecot-ldap.conf.ext'
  dovecot-namespace:
    type: configMap
    name: 'business-mail-dovecot-namespaces'
    advancedMounts:
      dovecot:
        dovecot:
          - path: '/etc/dovecot/namespaces'
  maddy-config:
    type: configMap
    name: 'business-mail-maddy-config'
    advancedMounts:
      maddy:
        maddy:
          - path: '/data/maddy.conf'
            subPath: 'maddy.conf'
          - path: '/data/checkScript.sh'
            subPath: 'checkScript.sh'
  postfix-misc:
    type: configMap
    name: 'simplelogin-postfix-misc-config'
    advancedMounts:
      postfix:
        postfix:
          - path: '/etc/postfix/master.cf'
            subPath: 'master.cf'
  postfix-public-sockets:
    type: emptyDir
    advancedMounts:
      postfix:
        postfix:
          - path: '/var/spool/postfix/public'
        postfix-exporter:
          - path: '/var/spool/postfix/public'
            readOnly: true
  postfix-ldap:
    type: secret
    name: 'business-mail-postfix-auth-config'
    advancedMounts:
      postfix:
        postfix:
          - path: '/etc/postfix/ldap.cf'
            subPath: 'ldap.cf'
          - path: '/etc/postfix/ldap-in.cf'
            subPath: 'ldap-in.cf'
          - path: '/etc/postfix/ldap-auth.cf'
            subPath: 'ldap-auth.cf'
  rspamd-config:
    type: configMap
    name: 'business-mail-rspamd'
    advancedMounts:
      rspamd:
        rspamd:
          - path: '/etc/rspamd/override.d/worker-proxy.inc'
            subPath: 'worker-proxy.inc'
          - path: '/etc/rspamd/override.d/worker-normal.inc'
            subPath: 'worker-normal.inc'
          - path: '/etc/rspamd/override.d/worker-controller.inc'
            subPath: 'worker-controller.inc'
          - path: '/etc/rspamd/local.d/dkim_signing.conf'
            subPath: 'dkim_signing.conf'
          - path: '/etc/rspamd/local.d/mx_check.conf'
            subPath: 'mx_check.conf'
          - path: '/etc/rspamd/local.d/phishing.conf'
            subPath: 'phishing.conf'
          - path: '/etc/rspamd/local.d/replies.conf'
            subPath: 'replies.conf'
          - path: '/etc/rspamd/local.d/surbl.conf'
            subPath: 'surbl.conf'
          - path: '/etc/rspamd/local.d/url_reputation.conf'
            subPath: 'url_reputation.conf'
          - path: '/etc/rspamd/local.d/url_tags.conf'
            subPath: 'url_tags.conf'
          {{ if .Values.rspamd.redis.enabled }}
          - path: '/etc/rspamd/local.d/classifier-bayes.conf'
            subPath: 'classifier-bayes.conf'
          {{ else }}
          - path: '/etc/rspamd/local.d/statistics_group.conf'
            subPath: 'statistics_group.conf'
          {{ end }}
  {{ if .Values.rspamd.redis.enabled }}
  rspamd-dragonfly:
    type: secret
    name: 'business-mail-rspamd-dragonfly'
    advancedMounts:
      rspamd:
        rspamd:
          - path: '/etc/rspamd/local.d/redis.conf'
            subPath: 'redis.conf'
  {{ end }}
  tls-certs:
    type: secret
    name: {{ .Values.email.tls.secretName | quote }}
    advancedMounts:
      dovecot:
        dovecot:
          - path: '/etc/tls/mail'
      maddy:
        maddy:
          - path: '/etc/tls/mail'
      postfix:
        postfix:
          - path: '/etc/tls/mail'
  dkim-secrets:
    type: secret
    name: 'selector1-mail-myloginspace'
    advancedMounts:
      dovecot:
        dovecot:
          - path: '/secret/dkim.key'
            subPath: 'mail.mylogin.space.selector1.key'
      postfix:
        postfix:
          - path: '/secret/dkim.key'
            subPath: 'mail.mylogin.space.selector1.key'
      rspamd:
        rspamd:
          - path: '/secret/dkim.key'
            subPath: 'mail.mylogin.space.selector1.key'
      {{- if .Values.simplelogin.enabled }}
      simplelogin-api:
        initdb:
          - path: '/secret/dkim.key'
            subPath: 'mail.mylogin.space.selector1.key'
        initapp:
          - path: '/secret/dkim.key'
            subPath: 'mail.mylogin.space.selector1.key'
        api:
          - path: '/secret/dkim.key'
            subPath: 'mail.mylogin.space.selector1.key'
      simplelogin-mailhandler:
        mailhandler:
          - path: '/secret/dkim.key'
            subPath: 'mail.mylogin.space.selector1.key'
      {{- end }}
  simplelogin-data:
    type: persistentVolumeClaim
    forceRename: 'simplelogin-data'
    accessMode: ReadWriteOnce
    size: '300Mi'
    {{- if .Values.simplelogin.enabled }}
    advancedMounts:
      simplelogin-api:
        initdb:
          - path: '/code/static/upload'
        initapp:
          - path: '/code/static/upload'
        api:
          - path: '/code/static/upload'
      simplelogin-mailhandler:
        mailhandler:
          - path: '/code/static/upload'
    {{- else }}
    # A non-empty advancedMounts map prevents the dormant PVC from being
    # mounted globally while SimpleLogin is disabled.
    advancedMounts:
      dovecot: {}
    {{- end }}
  {{- if .Values.simplelogin.enabled }}
  simplelogin-env:
    type: secret
    name: 'business-mail-simplelogin-db-prod'
    advancedMounts:
      simplelogin-mailhandler:
        mailhandler:
          - path: '/code/.env'
            subPath: 'SLENV'
  simplelogin-dkim-public:
    type: configMap
    name: 'simplelogin-dkim-public-cert'
    advancedMounts:
      simplelogin-mailhandler:
        mailhandler:
          - path: '/secret/dkim.pub.key'
            subPath: 'dkim.pub.key'
  {{- end }}

{{- if .Values.simplelogin.enabled }}
route:
  simplelogin:
    enabled: true
    kind: HTTPRoute
    forceRename: {{ printf "%s-simplelogin" .Release.Name | quote }}
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        namespace: 'kuadrant-core-prod'
        name: 'main-gw'
    hostnames:
      - 'simplelogin.mylogin.space'
    rules:
      - backendRefs:
          - identifier: 'simplelogin-api'
            port: 80
{{- end }}
{{- end -}}

{{- $_ := mergeOverwrite .Values (include "mail.hardcodedValues" . | fromYaml) -}}
{{ include "bjw-s.common.loader.generate" . }}
