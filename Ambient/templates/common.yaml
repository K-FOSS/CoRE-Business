---
{{- include "bjw-s.common.loader.init" . }}

{{- define "app-template.hardcodedValues" -}}
global:
  nameOverride: 'core-ambient'
  fullnameOverride: core-ambient

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

controllers:
  moodist:
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    revisionHistoryLimit: 3
    replicas: {{ .Values.replicas }}

    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/controller: moodist
              app.kubernetes.io/instance: {{ .Release.Name | quote }}

    podDisruptionBudget:
      minAvailable: 1

    containers:
      moodist:
        image:
          repository: {{ .Values.image | quote }}
          tag: {{ .Values.tag | quote }}
          digest: {{ .Values.digest | quote }}
          pullPolicy: IfNotPresent

        resources:
          {{- toYaml .Values.resources | nindent 10 }}

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 12

        ports:
          - name: http
            containerPort: 8080

networkpolicies:
  moodist:
    enabled: true
    controller: moodist
    policyTypes:
      - Egress
    rules:
      egress: []

service:
  moodist:
    # -- Enables or disables the service
    enabled: true

    # -- Configure which controller this service should target
    controller: moodist

    # -- Make this the primary service for this controller (used in probes, notes, etc...).
    # If there is more than 1 service targeting the controller, make sure that only 1 service is
    # marked as primary.
    primary: false

    # -- Set the service type
    type: ClusterIP

    # -- Specify the externalTrafficPolicy for the service. Options: Cluster, Local
    # -- [[ref](https://kubernetes.io/docs/tutorials/services/source-ip/)]
    #externalTrafficPolicy: Local

    # -- Specify the ip policy. Options: SingleStack, PreferDualStack, RequireDualStack
    ipFamilyPolicy:
    # -- The ip families that should be used. Options: IPv4, IPv6
    ipFamilies: []

    # -- Provide additional annotations which may be required.
    #annotations:

    # -- Provide additional labels which may be required.
    labels: {}

    # -- Allow adding additional match labels
    extraSelectorLabels: {}

    ports:
      http:
        # -- Enables or disables the port
        enabled: true

        # -- Make this the primary port (used in probes, notes, etc...)
        # If there is more than 1 service, make sure that only 1 port is marked as primary.
        primary: true

        # -- The port number
        port: 80

        targetPort: http

        # -- Port protocol.
        # Support values are `HTTP`, `HTTPS`, `TCP` and `UDP`.
        # HTTP and HTTPS spawn a TCP service and get used for internal URL and name generation
        protocol: TCP

        # -- Specify the appProtocol value for the Service.
        # [[ref]](https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol)
        appProtocol:

route:
  moodist:
    enabled: true
    kind: HTTPRoute
    labels:
      {{- toYaml .Values.route.moodist.labels | nindent 6 }}
    hostnames:
      {{- range $domain := .Values.domains }}
      - {{ $domain | quote }}
      {{- end }}
    annotations:
      {{- toYaml .Values.route.moodist.annotations | nindent 6 }}
    parentRefs:
      -
        group: gateway.networking.k8s.io
        kind: Gateway
        name: {{ .Values.gateway.name | quote }}
        sectionName: {{ .Values.gateway.sectionName | quote }}
        namespace: {{ .Values.gateway.namespace | quote }}
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - kind: Service
            port: 80
            identifier: moodist
            weight: 1
  {{- if .Values.k8gb.enabled }}
  moodist-k8gb:
    enabled: true
    kind: HTTPRoute
    labels:
      {{- toYaml (index .Values.route "moodist-k8gb").labels | nindent 6 }}
    annotations:
      {{- toYaml (index .Values.route "moodist-k8gb").annotations | nindent 6 }}
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: {{ .Values.gateway.name | quote }}
        namespace: {{ .Values.gateway.namespace | quote }}
        sectionName: {{ .Values.gateway.sectionName | quote }}
    hostnames:
      {{- range $domain := .Values.domains }}
      - {{ printf "%s.%s" (first (splitList "." $domain)) $.Values.k8gb.domain | quote }}
      {{- end }}
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - kind: Service
            identifier: moodist
            port: 80
            weight: 1
  {{- end }}

{{- end -}}
{{- $_ := mergeOverwrite .Values (include "app-template.hardcodedValues" . | fromYaml) -}}

{{/* Render the templates */}}
{{ include "bjw-s.common.loader.generate" . }}
