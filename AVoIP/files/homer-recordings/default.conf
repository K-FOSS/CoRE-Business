server {
  listen __PORT__;
  server_name _;
  server_tokens off;

  add_header Cache-Control 'no-store' always;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header X-Frame-Options 'SAMEORIGIN' always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; media-src 'self'; frame-ancestors 'self'" always;

  location = /recordings { return 308 /recordings/; }
  location = /recordings/ {
    root /usr/share/nginx/html;
    index index.html;
  }
  location = /recordings/index.html {
    default_type text/html;
    alias /usr/share/nginx/html/recordings/index.html;
  }
  location = /recordings/player.js {
    default_type application/javascript;
    alias /usr/share/nginx/html/recordings/player.js;
  }
  location = /recordings/files/ {
    alias /recordings/;
    autoindex on;
    autoindex_format json;
  }
  location ~ '^/recordings/files/([0-9a-fA-F-]{36}\.wav)$' {
    alias /recordings/$1;
    types { audio/wav wav; }
    default_type application/octet-stream;
    limit_except GET { deny all; }
  }
  location /recordings/files/ { return 404; }
  location / { return 404; }
}
