server {
  listen 8090;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 64m;
  client_body_temp_path /tmp;

  location = __PATH__ {
    return 308 __PATH__/;
  }

  location = __PATH__/ {
    alias /usr/share/nginx/html/index.html;
    add_header Cache-Control 'no-store';
  }

  location = __PATH__/app.js {
    alias /usr/share/nginx/html/app.js;
    default_type application/javascript;
    add_header Cache-Control 'no-store';
  }

  location = __PATH__/style.css {
    alias /usr/share/nginx/html/style.css;
    default_type text/css;
    add_header Cache-Control 'no-store';
  }

  location = __PATH__/files/ {
    alias /var/lib/avoip/sounds/;
    autoindex on;
    autoindex_format json;
    autoindex_exact_size off;
    autoindex_localtime off;
    add_header Cache-Control 'no-store';
    limit_except GET { deny all; }
  }

  location ~ "^__PATH__/files/(?<audio_file>[A-Za-z0-9][A-Za-z0-9_-]{0,63}\.wav)$" {
    alias /var/lib/avoip/sounds/$audio_file;
    default_type audio/wav;
    add_header Cache-Control 'no-store';
    dav_methods PUT;
    dav_access user:rw group:rw all:r;
    create_full_put_path on;
    limit_except GET HEAD PUT { deny all; }
  }

  location / {
    return 404;
  }
}
