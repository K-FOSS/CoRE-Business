'openapi': '3.1.0'
'info':
  'title': 'CoRE Caller Intelligence API proposal'
  'version': '0.1.0'
  'description': 'Design only; no deployed endpoint. Private mTLS evaluation and separately authorized Authentik
    management. See api.md for semantic requirements.'
'paths':
  '/v1/caller/evaluate':
    'post':
      'operationId': 'evaluateCaller'
      'summary': 'Evaluate initial inbound call using local intelligence only'
      'security':
      - 'sbcMTLS': []
      'responses':
        '200':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/EvaluationResult'
              'example':
                'correlation_id': '00000000-0000-4000-8000-000000000001'
                'normalized_caller':
                  'number': '+14165550100'
                  'status': 'valid'
                  'assigned_region': 'CA'
                  'region_status': 'resolved'
                  'metadata_version': 'fixture-metadata-v1'
                'called_did': '+12025550100'
                'evaluated_scopes':
                - 'tenant_id': '00000000-0000-4000-8000-000000000002'
                  'type': 'did'
                  'id': 'fixture-did'
                'identity':
                  'status': 'unknown'
                  'confidence': 0
                  'contact_match': false
                  'businesses': []
                'authentication': &id001
                  'status': 'not_present'
                  'attestation': null
                  'provenance': 'fixture-carrier-profile'
                  'verified_at': null
                  'origin_bound': false
                  'destination_bound': false
                'reputation':
                  'risk': null
                  'raw_score': 0
                  'confidence': 0
                  'model_revision': 'fixture-model-v1'
                  'labels':
                  - 'unknown'
                'matched_rules':
                - 'symbol': 'UNKNOWN_CALLER'
                  'rule_id': null
                  'evidence_refs': []
                  'evidence_summary': 'No reviewed local identity.'
                  'confidence': 0
                  'score_contribution': 0
                  'dimension': 'identity'
                  'suggested_action': null
                  'shadowed': false
                'decision':
                  'action': 'normal'
                  'suggested_action': 'normal'
                  'mode': 'observe'
                  'winning_rule_id': null
                  'explanation': 'Unknown caller; preserve existing routing.'
                  'degraded': false
                  'fallback_reason': null
                  'decision_expires_at': '2026-10-18T12:00:30Z'
                'policy_revision': 'fixture-policy-v1'
                'cache_status': 'miss'
                'freshness':
                - 'source': 'local-policy'
                  'observed_at': '2026-10-18T12:00:00Z'
                  'retrieved_at': '2026-10-18T12:00:00Z'
                  'refresh_after': null
                  'source_expires_at': null
                  'stale': false
                  'license_revision': null
                'paid_lookup_used': false
                'enrichment_scheduled': false
                'evaluation_ms': 2
        '400': &id002
          'description': 'Invalid bounded input'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
        '401': &id003
          'description': 'Missing or invalid authentication'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
        '403': &id004
          'description': 'Scope not authorized'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
        '404': &id005
          'description': 'Object absent or not visible'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
        '409': &id006
          'description': 'Idempotency conflict or incompatible state'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
        '422': &id007
          'description': 'Invalid policy/lookup semantics'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
        '429': &id008
          'description': 'Rate/quota limit; no automatic overage'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
        '503': &id009
          'description': 'Control plane unavailable; SBC retains normal-routing fallback'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
      'requestBody':
        'required': true
        'content':
          'application/json':
            'schema':
              '$ref': '#/components/schemas/EvaluationRequest'
            'example':
              'correlation_id': '00000000-0000-4000-8000-000000000001'
              'transaction_key': 'fixture-hmac-transaction-0001'
              'site': 'yvr'
              'call_kind': 'initial_inbound'
              'caller':
                'raw': '+14165550100'
                'presentation': 'present'
                'source': 'from'
                'trust_profile_id': 'fixture-carrier-profile'
              'called_did': '+12025550100'
              'authentication': *id001
  '/v1/caller/lookup/{number}':
    'get':
      'operationId': 'getCallerLookup'
      'summary': 'Read authorized cached/local facts and latest job state; never spend'
      'security':
      - 'authentikBearer': []
      'responses':
        '200':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/LookupResult'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
      'parameters':
      - 'name': 'number'
        'in': 'path'
        'required': true
        'schema':
          '$ref': '#/components/schemas/E164'
  '/v1/caller/lookup':
    'post':
      'operationId': 'requestCallerLookup'
      'summary': 'Queue explicitly requested eligible features under quota'
      'security':
      - 'authentikBearer': []
      'responses':
        '202':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/LookupResult'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
      'requestBody':
        'required': true
        'content':
          'application/json':
            'schema':
              '$ref': '#/components/schemas/LookupRequest'
      'parameters':
      - &id010
        'name': 'Idempotency-Key'
        'in': 'header'
        'required': true
        'schema':
          'type': 'string'
          'minLength': 16
          'maxLength': 128
        'description': 'Required for mutation; tenant/principal/method/path/body bound, retained at least 24h. Different
          body returns 409.'
  '/v1/caller/businesses':
    'get':
      'operationId': 'listBusinesses'
      'summary': 'Search authorized reviewed and candidate directory entries'
      'security':
      - 'authentikBearer': []
      'responses':
        '200':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/BusinessPage'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
      'parameters':
      - &id011
        'name': 'cursor'
        'in': 'query'
        'required': false
        'schema':
          'type': 'string'
          'maxLength': 1024
      - &id012
        'name': 'limit'
        'in': 'query'
        'required': false
        'schema':
          'type': 'integer'
          'minimum': 1
          'maximum': 100
          'default': 50
      - 'name': 'q'
        'in': 'query'
        'required': false
        'schema':
          'type': 'string'
          'maxLength': 256
    'post':
      'operationId': 'createBusiness'
      'summary': 'Create candidate business for review'
      'security':
      - 'authentikBearer': []
      'responses':
        '201':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Business'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
      'requestBody':
        'required': true
        'content':
          'application/json':
            'schema':
              '$ref': '#/components/schemas/BusinessInput'
      'parameters':
      - *id010
  '/v1/caller/rules':
    'get':
      'operationId': 'listRules'
      'summary': 'List rules visible in authorized scopes'
      'security':
      - 'authentikBearer': []
      'responses':
        '200':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/RulePage'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
      'parameters':
      - *id011
      - *id012
      - 'name': 'scope_id'
        'in': 'query'
        'required': false
        'schema':
          'type': 'string'
          'maxLength': 128
    'post':
      'operationId': 'createRule'
      'summary': 'Create draft or activate an authorized policy revision'
      'security':
      - 'authentikBearer': []
      'responses':
        '201':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Rule'
          'headers':
            'ETag':
              'schema':
                'type': 'string'
              'description': 'Version required for later mutation'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
      'requestBody':
        'required': true
        'content':
          'application/json':
            'schema':
              '$ref': '#/components/schemas/RuleInput'
      'parameters':
      - *id010
  '/v1/caller/rules/{id}':
    'patch':
      'operationId': 'patchRule'
      'summary': 'Change a rule with optimistic concurrency'
      'security':
      - 'authentikBearer': []
      'responses':
        '200':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Rule'
          'headers':
            'ETag':
              'schema':
                'type': 'string'
              'description': 'Updated rule version'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
        '412':
          'description': 'Stale rule version'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
        '428':
          'description': 'If-Match required'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
      'requestBody':
        'required': true
        'content':
          'application/json':
            'schema':
              '$ref': '#/components/schemas/RulePatch'
      'parameters':
      - 'name': 'id'
        'in': 'path'
        'required': true
        'schema': &id013
          'type': 'string'
          'format': 'uuid'
      - &id014
        'name': 'If-Match'
        'in': 'header'
        'required': true
        'schema':
          'type': 'string'
          'minLength': 1
          'maxLength': 128
        'description': 'Opaque rule version ETag; stale returns 412, missing returns 428.'
      - *id010
    'delete':
      'operationId': 'deleteRule'
      'summary': 'Tombstone rule and publish invalidation; return convergence status'
      'security':
      - 'authentikBearer': []
      'responses':
        '202':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Rule'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
        '412':
          'description': 'Stale rule version'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
        '428':
          'description': 'If-Match required'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Error'
      'parameters':
      - 'name': 'id'
        'in': 'path'
        'required': true
        'schema': *id013
      - *id014
      - *id010
  '/v1/caller/history':
    'get':
      'operationId': 'listHistory'
      'summary': 'List own authorized call history; numbers are access controlled'
      'security':
      - 'authentikBearer': []
      'responses':
        '200':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/HistoryPage'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
      'parameters':
      - *id011
      - *id012
      - 'name': 'since'
        'in': 'query'
        'required': false
        'schema': &id015
          'type': 'string'
          'format': 'date-time'
      - 'name': 'until'
        'in': 'query'
        'required': false
        'schema': *id015
  '/v1/caller/providers':
    'get':
      'operationId': 'listProviders'
      'summary': 'Read permitted redacted capability and health summaries'
      'security':
      - 'authentikBearer': []
      'responses':
        '200':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/ProviderPage'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
      'parameters':
      - *id011
      - *id012
  '/v1/caller/budget':
    'get':
      'operationId': 'getBudget'
      'summary': 'Read authorized period counters and estimates versus reconciliation'
      'security':
      - 'authentikBearer': []
      'responses':
        '200':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Budget'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
  '/v1/caller/simulate':
    'post':
      'operationId': 'simulatePolicy'
      'summary': 'Simulate owned scope without SIP action, paid work or report side effects'
      'security':
      - 'authentikBearer': []
      'responses':
        '200':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/EvaluationResult'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
      'requestBody':
        'required': true
        'content':
          'application/json':
            'schema':
              '$ref': '#/components/schemas/EvaluationRequest'
  '/v1/caller/reports':
    'post':
      'operationId': 'reportCaller'
      'summary': 'Submit bounded unreviewed report; never immediately change global reputation'
      'security':
      - 'authentikBearer': []
      'responses':
        '201':
          'description': 'Success'
          'content':
            'application/json':
              'schema':
                '$ref': '#/components/schemas/Report'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '422': *id007
        '429': *id008
        '503': *id009
      'requestBody':
        'required': true
        'content':
          'application/json':
            'schema':
              '$ref': '#/components/schemas/ReportInput'
      'parameters':
      - *id010
'components':
  'securitySchemes':
    'sbcMTLS':
      'type': 'mutualTLS'
      'description': 'Dedicated SBC client identity and verified server TLS; map cert identity to site/tenant/DID
        permissions.'
    'authentikBearer':
      'type': 'http'
      'scheme': 'bearer'
      'bearerFormat': 'JWT'
      'description': 'Authentik access token, validated issuer/audience/expiry/signature and application scopes;
        never trust an arbitrary user header.'
  'schemas':
    'E164':
      'type': 'string'
      'pattern': '^\+[1-9][0-9]{1,14}$'
      'maxLength': 16
      'description': 'Canonical E.164 syntax; numbering-plan validation is additional.'
    'Action':
      'type': 'string'
      'enum':
      - 'normal'
      - 'warn'
      - 'challenge'
      - 'voicemail'
      - 'reject'
    'Scope':
      'type': 'object'
      'additionalProperties': false
      'properties':
        'tenant_id': *id013
        'type':
          'type': 'string'
          'enum':
          - 'platform'
          - 'tenant'
          - 'did'
          - 'extension'
          - 'user'
        'id':
          'type': 'string'
          'maxLength': 128
        'issuer':
          'type': 'string'
          'format': 'uri'
        'subject':
          'type': 'string'
          'maxLength': 256
      'required':
      - 'tenant_id'
      - 'type'
      - 'id'
      'description': 'Resolved from authenticated ownership; issuer/subject required for user scope. Client scope
        is a hint subject to authorization.'
    'CallerInput':
      'type': 'object'
      'additionalProperties': false
      'properties':
        'raw':
          'anyOf':
          - 'type': 'string'
            'maxLength': 256
          - 'type': 'null'
        'presentation':
          'type': 'string'
          'enum':
          - 'present'
          - 'withheld'
          - 'unknown'
        'source':
          'type': 'string'
          'enum':
          - 'trusted_pai'
          - 'from'
          - 'carrier_verified'
          - 'none'
        'trust_profile_id':
          'type': 'string'
          'maxLength': 128
      'required':
      - 'raw'
      - 'presentation'
      - 'source'
      'description': 'No arbitrary headers or display-name authority. SBC validates source and asserted-identity
        selection.'
    'Authentication':
      'type': 'object'
      'additionalProperties': false
      'properties':
        'status':
          'type': 'string'
          'enum':
          - 'valid'
          - 'invalid'
          - 'unavailable'
          - 'not_present'
        'attestation':
          'anyOf':
          - 'type': 'string'
            'enum':
            - 'A'
            - 'B'
            - 'C'
          - 'type': 'null'
        'provenance':
          'type': 'string'
          'maxLength': 128
        'verified_at':
          'anyOf':
          - *id015
          - 'type': 'null'
        'origin_bound': &id016
          'type': 'boolean'
        'destination_bound': *id016
      'required':
      - 'status'
      - 'attestation'
      - 'provenance'
      - 'verified_at'
      - 'origin_bound'
      - 'destination_bound'
    'EvaluationRequest':
      'type': 'object'
      'additionalProperties': false
      'properties':
        'correlation_id': *id013
        'transaction_key':
          'type': 'string'
          'minLength': 16
          'maxLength': 256
        'site':
          'type': 'string'
          'maxLength': 64
        'call_kind':
          'type': 'string'
          'enum':
          - 'initial_inbound'
        'caller':
          '$ref': '#/components/schemas/CallerInput'
        'called_did':
          '$ref': '#/components/schemas/E164'
        'authentication':
          '$ref': '#/components/schemas/Authentication'
        'scope_hint':
          '$ref': '#/components/schemas/Scope'
      'required':
      - 'correlation_id'
      - 'transaction_key'
      - 'site'
      - 'call_kind'
      - 'caller'
      - 'called_did'
      - 'authentication'
      'description': 'transaction_key is an SBC-generated HMAC over SIP transaction facts, stable across replicas.
        Tenant/site/DID authorization derives from mTLS principal, not a claimed tenant.'
    'NormalizedCaller':
      'type': 'object'
      'additionalProperties': false
      'properties':
        'number':
          'anyOf':
          - '$ref': '#/components/schemas/E164'
          - 'type': 'null'
        'status':
          'type': 'string'
          'enum':
          - 'valid'
          - 'withheld'
          - 'malformed'
          - 'unknown'
          - 'non_geographic'
        'assigned_region':
          'anyOf':
          - 'type': 'string'
            'pattern': '^[A-Z]{2}$'
          - 'type': 'null'
        'region_status':
          'type': 'string'
          'enum':
          - 'resolved'
          - 'ambiguous'
          - 'unknown'
          - 'non_geographic'
        'metadata_version':
          'type': 'string'
      'required':
      - 'number'
      - 'status'
      - 'assigned_region'
      - 'region_status'
      - 'metadata_version'
    'BusinessMatch':
      'type': 'object'
      'additionalProperties': false
      'properties':
        'id': *id013
        'parent_id':
          'anyOf':
          - *id013
          - 'type': 'null'
        'name':
          'type': 'string'
          'maxLength': 256
        'status':
          'type': 'string'
          'enum':
          - 'candidate'
          - 'reviewed'
          - 'verified'
          - 'disputed'
        'association_confidence': &id017
          'type': 'number'
          'minimum': 0
          'maximum': 1
        'categories':
          'type': 'array'
          'items':
            'type': 'string'
            'maxLength': 64
        'evidence_refs':
          'type': 'array'
          'items': *id013
        'expires_at':
          'anyOf':
          - *id015
          - 'type': 'null'
      'required':
      - 'id'
      - 'parent_id'
      - 'name'
      - 'status'
      - 'association_confidence'
      - 'categories'
      - 'evidence_refs'
      - 'expires_at'
    'Identity':
      'type': 'object'
      'additionalProperties': false
      'properties':
        'status':
          'type': 'string'
          'enum':
          - 'unknown'
          - 'candidate'
          - 'reviewed'
          - 'verified'
          - 'disputed'
        'confidence': *id017
        'contact_match': *id016
        'businesses':
          'type': 'array'
          'items':
            '$ref': '#/components/schemas/BusinessMatch'
      'required':
      - 'status'
      - 'confidence'
      - 'contact_match'
      - 'businesses'
    'Reputation':
      'type': 'object'
      'additionalProperties': false
      'properties':
        'risk':
          'anyOf':
          - 'type': 'number'
            'minimum': 0
            'maximum': 100
          - 'type': 'null'
        'raw_score':
          'type': 'number'
        'confidence': *id017
        'model_revision':
          'type': 'string'
        'labels':
          'type': 'array'
          'items':
            'type': 'string'
            'maxLength': 64
      'required':
      - 'risk'
      - 'raw_score'
      - 'confidence'
      - 'model_revision'
      - 'labels'
    'RuleMatch':
      'type': 'object'
      'additionalProperties': false
      'properties':
        'symbol':
          'type': 'string'
          'maxLength': 80
        'rule_id':
          'anyOf':
          - *id013
          - 'type': 'null'
        'evidence_refs':
          'type': 'array'
          'items': *id013
        'evidence_summary':
          'type': 'string'
          'maxLength': 512
        'confidence': *id017
        'score_contribution':
          'type': 'number'
        'dimension':
          'type': 'string'
