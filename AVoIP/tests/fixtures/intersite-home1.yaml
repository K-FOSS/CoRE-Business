cluster:
  name: 'core-home1-talos-prod'
  domain: 'k8s.home1.resolvemy.host'
datacenter: 'home1'
region: 'yvr'
sip:
  globalHost: 'sip.resolvemy.host'
  tls:
    issuerName: 'core-tls-vault'
freeswitch:
  enabled: true
  interSite:
    enabled: true
    peerName: 'yxl'
    extension: '7101'
    ivrExtension: '7102'
  ivr:
    enabled: true
    extensions: ['7101', '9090', '66', '1234']
asterisk:
  sipCore:
    enabled: true
    hostname: 'sipcore.mylogin.space'
    allowedOrigins: ['https://home.mylogin.space']
    inboundVoiceExtension: '7101'
    extensions:
      - number: '7101'
        secret:
          remoteKey: 'AVoIP/SIPCore/YVR/Home1/7101'
          property: 'Password'
        allowCallsTo: ['9090', '66', '1234']
kamailio:
  enabled: true
  instances:
    - name: 'carrier'
      enabled: true
      role: 'carrier-sbc'
      publicExposure:
        enabled: true
      carrierOutbound:
        enabled: true
        sniHost: 'sip-outbound.core-home1-talos-prod.home1.yvr.resolvemy.host'
        clientIdentity:
          enabled: true
          issuerName: 'core-tls-vault'
        peer:
          cidr: '172.20.56.0/21'
          sanHostname: 'core-home1-talos-prod-business-avo-kamailio-internal.core-prod.svc.k8s.home1.resolvemy.host'
          serviceHost: 'core-home1-talos-prod-business-avo-kamailio-internal.core-prod.svc.k8s.home1.resolvemy.host'
          controller: 'kamailio-internal'
          secretName: 'core-home1-kamailio-peer-mtls'
      interSite:
        peers:
          - name: 'yxl'
            cidr: '172.20.48.0/22'
            sanHostname: 'core-dc1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k3s.dc1.resolvemy.host'
            serviceIP: '10.44.3.190'
            serviceHost: 'core-dc1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k3s.dc1.resolvemy.host'
            serverName: 'sip-outbound.core-dc1-talos-prod.dc1.yxl.resolvemy.host'
            allowedUsers: ['7101', '7102']
    - name: 'internal'
      enabled: true
      role: 'private-sbc'
      topology:
        redis:
          database: 52
          secretName: 'avoip-kamailio-internal-topos'
