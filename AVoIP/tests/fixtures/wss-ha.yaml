cluster:
  name: core-home1-talos-prod
  domain: cluster.local
datacenter: home1
region: yvr
sip:
  tls:
    issuerName: kjdev-cluster
asterisk:
  sipCore:
    enabled: true
    kamailioInstance: internal-wss
    hostname: sipcore.mylogin.space
    allowedOrigins:
      - https://home.mylogin.space
    extensions:
      - number: '7101'
        secret:
          remoteKey: AVoIP/SIPCore/YVR/Home1/7101
          property: Password
kamailio:
  instances:
    - name: carrier
      enabled: true
      role: carrier-sbc
      replicas: 3
      carrierOutbound:
        enabled: true
        clientIdentity:
          enabled: true
          issuerName: kjdev-cluster
        peer:
          secretName: flowroute-ca
          cidr: 192.0.2.0/24
          sanHostname: flowroute.test
          serviceHost: flowroute.test
          controller: flowroute
        gatewayServiceHost: gateway.test
    - name: internal
      enabled: true
      role: private-sbc
      replicas: 1
      registrar:
        database:
          enabled: true
          host: postgres.test
          username: kamailio-test
          secretName: kamailio-test-registrar-db
      topology:
        redis:
          database: 52
          secretName: avoip-kamailio-internal-topos
    - name: internal-wss
      enabled: true
      role: private-sbc
      replicas: 3
      websocketHA:
        enabled: true
      topology:
        redis:
          database: 53
          secretName: avoip-kamailio-internal-wss-topos
