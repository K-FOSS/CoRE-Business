global:
  # BJW-S common should use Kubernetes' namespace default ServiceAccount.
  createDefaultServiceAccount: false

env: 'prod'

# The BJW-S loader reads this map during chart initialization; the local
# common template populates it with the enabled Asterisk/FreeSWITCH controllers.
controllers: {}

# Service type and metadata shared by every generated Service, with
# per-Service overrides.
# Keys are generated Service names: asterisk, kamailio, kamailio-pub,
# freeswitch, freeswitch-rtp, rtpengine, rtpengine-media,
# rtpengine-valkey-proxy, homer-heplify, homer-web, and homer-recordings.
# Per-Service type, annotations, labels, and LoadBalancer class are configurable.
# Annotations and labels merge with chart defaults. The chart does not set ExternalDNS hostname
# annotations on Services by default; site-specific overrides remain supported.
# Chart users supply provider-specific annotations and classes here.
# `loadBalancerClass` applies only to LoadBalancer Services; setting a class on
# an existing Service may require Service recreation because Kubernetes makes
# it immutable.
serviceOptions:
  defaults:
    type: ''
    annotations: {}
    labels: {}
    loadBalancerClass: ''
  asterisk:
    type: 'ClusterIP'
    annotations: {}
    # Optional policy metadata; no wan-mode/lan-mode label is set by default.
    labels: {}
  asterisk-rtp:
    type: 'LoadBalancer'
    annotations: {}
    labels: {}
    loadBalancerClass: ''
  kamailio:
    type: 'ClusterIP'
    annotations: {}
    # Optional policy metadata; no wan-mode/lan-mode label is set by default.
    labels: {}
  kamailio-pub:
    type: 'LoadBalancer'
    annotations: {}
    labels: {}
    loadBalancerClass: ''
  freeswitch:
    type: 'ClusterIP'
    annotations: {}
    # Optional policy metadata; no wan-mode/lan-mode label is set by default.
    labels: {}
  freeswitch-rtp:
    type: 'LoadBalancer'
    annotations: {}
    labels: {}
    loadBalancerClass: ''
  rtpengine:
    type: 'ClusterIP'
    annotations: {}
    labels: {}
  rtpengine-media:
    type: 'LoadBalancer'
    annotations: {}
    labels: {}
    loadBalancerClass: ''
  rtpengine-valkey-proxy:
    type: 'ClusterIP'
    annotations: {}
    labels: {}
  homer-heplify:
    type: 'ClusterIP'
    annotations: {}
    labels: {}
  homer-web:
    type: 'ClusterIP'
    annotations: {}
    labels: {}
  homer-recordings:
    type: 'ClusterIP'
    annotations: {}
    labels: {}
    loadBalancerClass: ''
  # The Home1 media Service uses its own public address for TURN traffic. The
  # AIO image resolves this hostname during startup to advertise its endpoint.
  talk-hpb-media:
    type: 'LoadBalancer'
    annotations:
      kube-vip.io/forwardUPNP: 'true'
      external-dns.alpha.kubernetes.io/hostname: 'talk-media.mylogin.space'
    labels:
      wan-mode: 'public'
    loadBalancerClass: 'kube-vip.io/kube-vip-class'

# Additional independent workloads (PBXs, organization services, voice workers).
# Each entry has name, enabled, controller (BJW-S controller values), services,
# configMaps, persistence, and networking. See docs/NETWORKING.md.
functions: []

# Per-controller interface/placement controls for every enabled workload.
# Keys: asterisk, freeswitch, kamailio, rtpengine, homer-web, or function names.
# Empty defaults preserve the cluster CNI and existing workload configuration.
workloadNetworking: {}

datacenter: 'dc1'

region: 'yxl'

cluster:
  name: 'dc1-k3s-node1'
  # Supplied by the owning ApplicationSet for each selected cluster.
  domain: 'cluster.local'
  type: 'spoke'

  hub:
    cluster:
      name: 'core-dc1-talos-prod'
      datacenter: 'dc1'
      region: 'yxl'

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

flowroute:
  # Carrier egress is selected at the SIP border; application peers never
  # route directly to this hostname.
  outboundHost: 'us-west-or.sip.flowroute.com'
  signalingCIDRs:
    - '34.210.91.112/28'
    - '34.226.36.32/28'

sip:
  globalHost: 'sip.resolvemy.host'
  # Empty derives sip.<cluster>.<datacenter>.<region>.resolvemy.host.
  siteHost: ''
  globalRouting:
    # K8GB DNS ownership is opt-in until the delegated public DNS zone and
    # provider path are ready in CoRE-Backplane.
    enabled: false
    primaryGeoTag: ''
    dnsTtlSeconds: 30
    dnsZoneNegTTL: 30
    doFinalize: false
  tls:
    issuerName: 'kjdev-cluster'

avoip:
  # Supplied by the owning ApplicationSet for clusters with FreeSWITCH enabled.
  did: ''

fax:
  # Supplied by the owning Backplane ApplicationSet at each site.
  did: ''

kamailio:
  # Merge order: defaults, then selected roleDefaults, then each named instance.
  # Site value files replace this whole instances list; copy every desired entry.
  # Map values merge recursively; listeners, destinations and env lists replace.
  roleDefaults:
    carrier-sbc:
      functions:
        sanity: true
        classification: true
        transactions: true
        dialog: true
        authorization: true
        recordRoute: true
        backendSelection: true
        topology: true
        media: true
        sipTrace: true
    private-sbc:
      replicas: 1
      websocketHA:
        # Opt in on a separate named private-sbc instance dedicated to WSS.
        # The ordinary internal SBC remains a one-replica Deployment.
        enabled: false
        # Keep the old single-replica owner rendering the SIP Core listeners
        # and return Service after Asterisk selects a parallel HA instance.
        legacyOwner: false
        # Permit a separate HA instance to render beside the currently selected
        # private SBC during a staged migration.
        pilot: false
        drainSeconds: 120
        endpointRemovalDelaySeconds: 10
        terminationGracePeriodSeconds: 150
        podDisruptionBudget:
          minAvailable: 2
        rolloutPartition: 0
        # Send unsolicited Pong frames to keep the upgraded stream active
        # without evicting clients that do not return Ping frames through an
        # intermediary. Asterisk OPTIONS remains the SIP flow health check.
        keepaliveMechanism: 2
        compatibility:
          lfOnlyHeartbeat:
            # Home Assistant SIP Core sends an exact LF/LF text frame. This
            # stays off unless the dedicated patched image and module setting
            # are explicitly selected for a WSS edge instance.
            enabled: false
            image:
              repository: ''
              tag: ''
              digest: ''
      websocket:
        # Backward-compatible Ping/Pong probe for the legacy private SBC.
        keepaliveTimeoutSeconds: 15
        keepaliveMechanism: 1
      resources:
        requests:
          cpu: '100m'
          memory: '256Mi'
      # SIP Core's dedicated TLS/WebSocket proxy needs headroom for TLS
      # handshakes and the topology module. The implicit Kamailio default is
      # too small for this workload under load.
      shmSizeMb: 128
      publicExposure:
        enabled: false
      sipLogging:
        carrierTraffic: false
        postToposResponses: false
        rawInbound: false
        # Log sanitized SIP Core ingress, Asterisk return traffic, and replies.
        # This omits SIP message bodies and authentication headers.
        sipCore: true
        diagnostics:
          enabled: false
          sdp: false
      # This role has no carrier route and accepts no peer until explicitly
      # configured for a site. Direct TLS peers never send PROXY headers.
      privateRouting:
        peers: []
        destinations: []
        routes: []
      registrar:
        enabled: false
        realm: ''
        accessPeerName: ''
        allowedUsers: []
        database:
          host: ''
          port: 5432
          username: ''
          secretName: ''
          terraformProvider: ''
          crossplaneProvider: ''
        maxContacts: 2
        minExpires: 120
        maxExpires: 600
      podDisruptionBudget:
        minAvailable: 0
      functions:
        sanity: true
        classification: true
        transactions: true
        dialog: true
        authorization: true
        recordRoute: true
        backendSelection: true
        topology: true
        media: false
        sipTrace: false
  instances:
    - name: 'carrier'
      enabled: true
      role: 'carrier-sbc'
      replicas: 3
  defaults:
    # Optional per-instance workload overrides. Empty values preserve the
    # existing carrier manifest. extraEnv is a replace-only list; entries may
    # use secretKeyRef, never inline credentials.
    serviceAccountName: 'default'
    podAnnotations: {}
    podLabels: {}
    resources: {}
    websocket:
      keepaliveTimeoutSeconds: 60
      keepaliveMechanism: 1
    securityContext:
      pod: {}
      container: {}
    scheduling:
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
    extraEnv: []
    services:
      private:
        annotations: {}
        labels: {}
        type: ''
      public:
        annotations: {}
        labels: {}
        type: ''
        loadBalancerClass: ''
    # Listener transport enablement and the direct Service host live under
    # publicExposure.sip; the private TLS listener remains mandatory.
    listeners:
      bindAddress: '0.0.0.0'
    # Kamailio's implicit shared memory default is 64 MiB. Private SBC role
    # defaults raise this for SIP Core TLS handshakes and topology state.
    shmSizeMb: 64
    tcpChildren: 4
    replicas: 3
    rollingUpdate:
      # BJW-S 5.0.1 uses the field name `surge`; keep zero quoted so its
      # truthiness check still renders Kubernetes maxSurge: 0.
      surge: '0'
      unavailable: 1
    podDisruptionBudget:
      minAvailable: 2

    topology:
      enabled: true
      redis:
        # Site-local Dragonfly is the SIP topology store. This is intentionally
        # separate from RTPEngine's Valkey state and from any cross-site store.
        secretName: 'avoip-kamailio-topos'
        serverKey: 'server'
        # Empty derives the site-scoped Dragonfly identity used by other stacks:
        # dragonfly.<cluster>.<datacenter>.<region>.mylogin.space
        host: ''
        port: 6379
        proxyPort: 16379
        tlsServerName: ''
        database: 51
        secretStoreRef:
          kind: 'ClusterSecretStore'
          name: 'corevault-rootsecrets'
        remoteRef:
          key: ''
          property: 'Password'

    sip:
      serviceHost: ''

    sipLogging:
      # Optional compact request/response markers; ACK and failure logs remain on.
      enabled: true

      # Log complete authorized carrier-facing SIP messages in both directions.
      # This includes Authorization, identity headers, SDP, and MESSAGE bodies;
      # keep enabled only while investigating a carrier signaling issue.
      carrierTraffic: true

      # Temporary SIP wire diagnostics: PRE-TOPOS-STRIP replies plus corex's
      # final network-send buffer for CSeq 1 INVITE 180/200 responses. Complete
      # messages can contain PII/SDP; keep disabled outside a controlled trace.
      postToposResponses: true

      # Temporary full-message receive logging. Disable after the ACK investigation.
      rawInbound: true
      # Adds socket/ACL/transaction decision markers without dumping SIP bodies.
      diagnostics:
        # Temporarily enabled while investigating the recurring 30-second call
        # failure. This emits routing/transaction markers and no full SIP body.
        enabled: true
        # Kamailio core debug level used only while diagnostics are enabled.
        coreDebug: 2
        # Log sanitized SIP routing metadata and SDP before/after RTPEngine.
        # Disable after the media investigation because SDP can expose endpoint
        # addresses and codec details.
        sdp: true
    publicExposure:
      enabled: true
      sip:
        # Enables the public SIPS/TLS Gateway route and TLS listener.
        enabled: true
        # Optional cleartext signaling transports; these do not affect RTP or
        # RTPEngine's separate UDP media/control paths.
        udpEnabled: false
        tcpEnabled: false
        directService:
          # When enabled, create the kamailio-pub Service with only the public
          # signaling transports enabled above. Private TLS/5062 is never added.
          enabled: false
          # Empty derives kamailio-pub.<cluster>.<datacenter>.<region>.resolvemy.host.
          # Enabled UDP/TCP sockets advertise this direct carrier-facing identity.
          hostname: ''
    backend:
      # The default backend is the chart's FreeSWITCH service when both are enabled.
      serviceName: ''
      # FreeSWITCH's kamailio profile is TLS-only on the private service port.
      servicePort: 5061
      # Coarse source guard for the private TLS listener. The chart NetworkPolicy
      # limits port 5062 to FreeSWITCH pods when using the default backend.
      podCIDR: '172.16.0.0/12'
    carrierOutbound:
      # New calls remain denied. The existing carrier TLS listener needs
      # Envoy's PROXY v2 header, so a future internal caller must use the
      # existing Gateway with a separately authenticated SNI identity.
      enabled: false
      gatewayServiceHost: ''
      gatewayNamespace: 'kube-system'
      sniHost: ''
      peer:
        cidr: ''
        sanHostname: ''
        serviceHost: ''
        controller: ''
      testRoute:
        extension: ''
        peerName: ''
        destination: ''
        callerId: ''
      limits:
        callsPerMinute: 1
        concurrentCalls: 1
        maxDurationSeconds: 600
    privateRouting:
      # peers: [{cidr: '10.0.0.10/32', sanHostname: 'pbx.example', controller: 'asterisk', name: 'pbx', allowedUsers: ['1000']}]
      # destinations: [{setId: 10, uri: 'sips:pbx.example:5061', controller: 'asterisk'}]
      # routes: [{user: '1000', setId: 10}]
      peers: []
      destinations: []
      routes: []
    registrar:
      enabled: false
      realm: ''
      accessPeerName: ''
      allowedUsers: []
      database:
        host: ''
        port: 5432
        username: ''
        secretName: ''
        terraformProvider: ''
        crossplaneProvider: ''
      maxContacts: 2
      minExpires: 120
      maxExpires: 600
    networkPolicy:
      envoy:
        # Match the Envoy Gateway data-plane pods, not carrier source CIDRs.
        # Override these labels if the installed GatewayClass uses different
        # data-plane labels.
        namespace: 'kube-system'
        podName: 'envoy'
    # Legacy override; leave empty to derive the site SIP identity.
    advertisedHost: ''
    advertisedTLSPort: 5061
    image:
      # renovate: datasource=docker depName=ghcr.io/kamailio/kamailio
      repository: 'ghcr.io/kamailio/kamailio'
      tag: '6.1.4-bookworm'
      digest: 'sha256:c54f770ab74ae64588cc174e206aa337108cc777b6162d738189d1cb0c32d116'
      pullPolicy: 'IfNotPresent'

rtpengine:
  # Enable RTPEngine per cluster, including spokes that provide local media
  # handling. Set the media address for each cluster in its injected values.
  enabled: true
  # The Valkey proxy supplies the
  # primary-only Redis endpoint required for shared call-state failover.
  replicas: 1
  controlPort: 22222
  recovery:
    # Probe the stable control Service frequently and retry soon after a
    # timeout marks it unavailable during an RTPEngine rollout or outage.
    disableTimeoutSeconds: 5
    aggressiveRedetection: true
    pingIntervalSeconds: 5
  valkey:
    # The ValkeyCluster is watched by the Backplane-installed operator in
    # valkey-operator-system. HAProxy selects its current primary for RTPEngine.
    enabled: true
    namespace: 'valkey-operator-system'
    clusterName: 'avoip-rtpengine'
    clusterHost: 'valkey-avoip-rtpengine.valkey-operator-system.svc.cluster.local'
    host: ''
    port: 6379
    proxy:
      replicas: 2
      port: 6379
      healthPort: 8404
      image:
        repository: 'docker.io/library/haproxy'
        tag: '3.2.12-alpine'
        digest: 'sha256:15ef8657ec12e7b19d5b6b6b6fcf6839a0e3cdae85d275be6c867e8a2690f33f'
        pullPolicy: 'IfNotPresent'
    database: 0
    secretName: 'avoip-rtpengine-valkey'
    passwordKey: 'password'
    generatorName: 'avoip-rtpengine-valkey-generator'
    bootstrapSecretName: 'avoip-rtpengine-valkey-bootstrap'
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'corevault-rootsecrets'
    remoteRef:
      key: ''
      property: 'Password'
    shards: 1
    replicas: 2
    clusterNodeTimeout: '5000'
    spreadMode: 'Required'
    persistence:
      storageClass: 'longhorn'
      size: '1Gi'
      reclaimPolicy: 'Retain'
    subscribeKeyspace: 0
    # Valkey's default disables notifications required for RTPEngine switchover.
    notifyKeyspaceEvents: 'KEA'
    activeSwitchover: true
  image:
    repository: 'forge.core-dc1-talos-prod.dc1.yxl.writemy.codes/core/core-docker/rtpengine'
    tag: 'mr13.5.1.27-build-90'
    digest: 'sha256:405145b8c791a6c2d0f264e332c3159e621e9f6acad8486224e1c1110af90e5f'
    pullPolicy: 'IfNotPresent'
  media:
    address: '66.165.222.103'
    min: 11000
    max: 13050
    # Route public RTP/UDPTL through any node to a ready RTPEngine endpoint.
    # Unlike carrier SIP, RTPEngine media does not authorize source CIDRs.
    externalTrafficPolicy: 'Cluster'
  logging:
    # Temporary T.38 troubleshooting verbosity. Disable after the fax test.
    enabled: true
    level: 6
    controlLevel: 6
    spandspLevel: 6
    rtcpLevel: 6

diagnostics:
  netshoot:
    # Keep a network troubleshooting shell in each enabled AVoIP service pod.
    enabled: true
    image:
      repository: 'nicolaka/netshoot'
      tag: 'v0.16'
      digest: 'sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70'
      pullPolicy: 'IfNotPresent'

homer:
  # Homer 11 is enabled per cluster when Kamailio is enabled. The owning
  # ApplicationSet can override this for clusters that should not retain local
  # SIP capture.
  enabled: true
  disabledClusters:
    - 'dc1-k3s-node1'
  hostname: ''
  capture:
    hepPort: 9060
    hepTCPPort: 9061
    httpPort: 9080
    metricsPort: 9096
    retentionDays: 14
  web:
    image:
      repository: 'ghcr.io/sipcapture/homer'
      tag: '11.0.350'
      digest: 'sha256:aff429f3eb826eac36b45bfc9cc6d230c24042ba722012b868f2f5fd1aa19b13'
      pullPolicy: 'IfNotPresent'
    # Homer coordinator serves the UI and v4 API on 8080. The separate ingest
    # HTTP listener remains on homer.capture.httpPort.
    port: 8080
  recordings:
    # FreeSWITCH recordings are served under the Homer hostname for its iframe widget.
    enabled: true
    port: 8088
    retentionDays: 2
    image:
      repository: 'nginxinc/nginx-unprivileged'
      tag: '1.29.3-alpine'
      digest: 'sha256:5aea7cc516b419e3526f47dd1531be31a56a046cfe44754d94f9383e13e2ee99'
      pullPolicy: 'IfNotPresent'
  storage:
    storageClass:
      name: 'avoip-homer-rwx'
      numberOfReplicas: '2'
      migratable: 'false'
      backupTargetName: 'default'
    persistence:
      enabled: true
      storageClass: 'avoip-homer-rwx'
      accessMode: 'ReadWriteMany'
      size: '10Gi'
      retain: true
    retentionDays: 14
  oidc:
    providerConfigRef: 'authentik'
    issuerBaseUrl: 'https://idp.mylogin.space'
    applicationSlug: 'avoip-homer'
    clientId: 'avoip-homer'
    accessGroup: 'Home Users'
    displayName: 'Phone Debug'
    workspaceName: 'avoip-homer-oidc'
  forwardAuth:
    providerConfigRef: 'authentik'
    accessGroup: 'Home Users'
    displayName: ''
    workspaceName: 'avoip-homer-forward-auth'
  authentikOutpost:
    name: 'aaa-myloginspace-proxy'
    namespace: 'core-prod'
    port: 80

# Nextcloud Talk HPB is colocated with the Home1 Office deployment. The cluster
# guard in the renderer keeps this workload out of the DC1 AVoIP applications.
talkHpb:
  enabled: true
  clusterName: 'core-home1-talos-prod'
  hostname: 'talk.mylogin.space'
  mediaHostname: 'talk-media.mylogin.space'
  nextcloudHostname: 'office.mylogin.space'
  turn:
    port: 3478
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'corevault-rootsecrets'
    remoteKey: 'Network/NATPuncher/yxl/dc1/core-dc1-talos-prod/TurnAuth'
    remoteProperty: 'Secret'
  secrets:
    name: 'avoip-talk-hpb'
    generatorName: 'avoip-talk-hpb-generator'
    bootstrapName: 'avoip-talk-hpb-bootstrap'
    turnName: 'avoip-talk-hpb-turn'
    remoteKey: 'AVoIP/Talk/YVR/Home1/Creds'
  image:
    repository: 'ghcr.io/nextcloud-releases/aio-talk'
    # Versioned AIO build containing signaling 2.1.1, Janus, NATS and eturnal.
    tag: '20260916_075031'
    pullPolicy: 'IfNotPresent'

jitsi:
  domain: 'meet.mylogin.space'
  tls:
    secretName: 'myloginspace-default-certificates'

# LiveKit is an independent WebRTC SFU. Site selection and the public signaling
# hostname/media Service allocation are injected by the owning ApplicationSet.
livekit:
  enabled: false
  hostname: ''
  redis:
    secretName: 'avoip-livekit-redis'
    passwordKey: 'password'
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'corevault-rootsecrets'
    remoteRef:
      key: ''
      property: 'Password'
  secrets:
    name: 'avoip-livekit-keys'
    generatorName: 'avoip-livekit-keys-generator'
    bootstrapName: 'avoip-livekit-keys-bootstrap'
    remoteKey: ''
  media:
    service:
      loadBalancerClass: ''
      annotations: {}
      labels: {}

# Official upstream chart defaults are overridden for CoRE site networking.
livekit-server:
  replicaCount: 1
  # Media uses the dedicated LoadBalancer Service. Do not bind the LiveKit pod
  # to the node network or reserve host ports.
  podHostNetwork: false
  terminationGracePeriodSeconds: 18000
  deploymentStrategy:
    type: Recreate
  serviceAccount:
    create: false
    name: 'default'
  resources:
    requests:
      cpu: '2000m'
      memory: '2Gi'
    limits:
      cpu: '4000m'
      memory: '4Gi'
  affinity: {}
  livekit:
    port: 7880
    log_level: 'info'
    rtc:
      tcp_port: 7881
      udp_port: 7882
      # The single UDP mux port replaces the upstream 50000-60000 range.
      port_range_start: null
      port_range_end: null
      use_external_ip: true
    redis:
      address: ''
      db: 155
      username: 'default'
      tls:
        enabled: true
        insecure: false
        server_name: ''
    key_file: '/etc/livekit/keys.yaml'
  storeKeysInSecret:
    enabled: true
    existingSecret: 'avoip-livekit-keys'
    keys: {}

network:
  externalIP: '66.165.222.101'
  egressIP: ''
  # Leave Cilium egress pinning disabled unless the cluster has a working
  # CiliumEgressGatewayPolicy path. Normal SIP egress is source NATed at the
  # VyOS WAN-GW/NAT function routers to their VRRP address; the hub's observed
  # Flowroute-facing source is 66.165.222.97.
  ciliumEgressGateway:
    enabled: false

asterisk:
  enabled: true
  logging:
    # Temporary troubleshooting verbosity routed to the container console.
    # PJSIP packet traces can contain caller identities and SIP headers.
    enabled: true
    verbose: 5
    debug: 3
    pjsip: true
  sip:
    serviceHost: ''
  # Asterisk and FreeSWITCH communicate over the cluster network. PJSIP
  # advertises the stable Asterisk service FQDN for SIP signaling; set an
  # external media address only when media must be advertised outside the pod.
  externalMediaAddress: ''
  sipCore:
    # Enables the SIP Core browser client path through the existing HTTPS
    # Gateway. It does not enable PSTN dialing or create public RTP exposure.
    enabled: false
    # Route SIP Core WebSocket signaling through this dedicated private SBC.
    # The selected instance must be enabled with role private-sbc.
    kamailioInstance: 'internal'
    # Optional Envoy backend selector for staged cutover/rollback. Empty follows
    # kamailioInstance; the selected instance above remains Asterisk's SIP path owner.
    ingressKamailioInstance: ''
    hostname: ''
    gatewaySectionName: ''
    allowedOrigins: []
    httpPort: 8088
    backendTrafficPolicy:
      # Keep a quiet but connected WebSocket stream open; Kamailio sends
      # client keepalive pings every 15 seconds on the private role.
      streamIdleTimeout: '1h'
    routeTimeouts:
      # Zero disables the request-duration cap for long-lived WebSocket streams.
      request: '0s'
      backendRequest: '0s'
    # Private TLS ingress used only for Asterisk-originated calls to registered
    # SIP Core WebSocket contacts. The normal Kamailio/FreeSWITCH listener stays
    # on 5062; this port is restricted to the Asterisk workload.
    privateEgressPort: 5063
    echoExtension: '9090'
    ggAudioExtension: '66'
    ggAudioDestination: 'gg-audio'
    helloCallbackExtension: '1234'
    ggCallbackCallerIdName: 'Important Message'
    ggCallbackDelaySeconds: 60
    ggCallbackRingTimeoutSeconds: 30
    secretStoreRef:
      kind: 'ClusterSecretStore'
      name: 'corevault-rootsecrets'
    media:
      # Browser RTP needs an externally reachable UDP path. Enable only with
      # provider-specific settings under serviceOptions.asterisk-rtp.
      enabled: false
      address: ''
    # Configure SIP passwords in CoreVault, one property per extension.
    # The chart only creates ExternalSecrets and mounts their values at runtime.
    extensions: []
    # Example:
    # extensions:
    #   - number: '7101'
    #     secret:
    #       remoteKey: 'AVoIP/SIPCore/YVR/Home1/7101'
    #       property: 'Password'
    #     allowCallsTo: ['9090', '7102']
    # `allowedOrigins` must list the HTTPS origin(s) hosting Home Assistant,
    # not the SIP/WSS hostname (for example: ['https://ha.example.net']).
    #
    # Endpoint secrets must be random 32+ character hexadecimal passwords.
    # The chart reserves `echoExtension` and `ggAudioExtension` as local test
    # destinations. `allowCallsTo` may name another configured extension; it
    # can never match a PSTN dial.
  # Stable locally administered Asterisk Entity ID; do not derive it from the
  # pod network interface because pod MAC addresses are not deployment state.
  entityID: '02:dc:1a:22:2a:01'
  cdr:
    enabled: true
    host: ''
    port: 5432
    table: 'cdr'
    terraformProvider: ''
    crossplaneProvider: ''
  image:
    # renovate: datasource=docker depName=forge.core-dc1-talos-prod.dc1.yxl.writemy.codes/core/core-docker/asterisk
    repository: 'forge.core-dc1-talos-prod.dc1.yxl.writemy.codes/core/core-docker/asterisk'
    tag: '20'
    digest: ''
    pullPolicy: 'IfNotPresent'
  rtp:
    min: 10000
    max: 10100
  turn:
    # Enable only after the Asterisk image includes openssl for REST credential generation.
    enabled: false
    hostname: 'nat.mylogin.space'
    port: 3478
    username: 'asterisk'
    # Asterisk loads fixed TURN credentials at startup; restart before expiry.
    credentialLifetimeSeconds: '31536000'
    secret:
      name: 'matrix-turn-auth'
      key: 'TURN_SHARED_SECRET'

freeswitch:
  enabled: true
  ldap:
    # Temporarily disable mod_xml_ldap while the Asterisk peer uses its static
    # Secret-backed directory entry. Enable only after the LDAP callback is
    # verified stable under SIP authentication lookups.
    enabled: false
  sip:
    serviceHost: ''
  asterisk:
    # Dedicated TLS listener for Asterisk, separate from the Kamailio backend.
    tlsPort: 5064
  publicExposure:
    enabled: false
    # Public FreeSWITCH RTP address; provider-specific Service allocation is
    # configured by chart users through serviceOptions.freeswitch-rtp.
    address: '66.165.222.103'
    sip:
      # Retained for compatibility with injected values; public SIP routes
      # terminate at Kamailio and are never rendered for FreeSWITCH.
      enabled: true
      tcpEnabled: false
      udpEnabled: false
    kamailio:
      # Private Kamailio-to-FreeSWITCH SIP is TLS-only on 5061.
      backendPort: 5061
    # Kamailio's pod source range as seen by the private FreeSWITCH profile.
    podCIDR: '172.16.0.0/12'
  preBridgeAudio:
    # Do not interrupt the answered bridge while fetching/playing a remote
    # sound asset. Enable explicitly only when a post-answer prompt is wanted.
    enabled: false
    url: 'http://10.1.1.84/Sounds/gg-sound-effect.mp3'
  sms:
    enabled: true
  sipLogging:
    # Sofia raw SIP request/response tracing is enabled by default for call
    # troubleshooting. It can be disabled when production trace volume or
    # signaling metadata exposure is not acceptable.
    enabled: true
    # Sofia profile transaction diagnostics (0-9). Raise temporarily when
    # investigating which 2xx response is waiting for an ACK.
    sofiaDebug: 9
  media:
    # Snapshot per-call RTP statistics only when explicitly enabled.
    diagnostics:
      enabled: true
      # Temporary inbound-call recording for Homer playback and fax troubleshooting.
      # Disable after the capture is complete because recordings contain call audio.
      callRecording:
        enabled: true
        path: '/var/spool/freeswitch/fax'
  image:
    # renovate: datasource=docker depName=forge.core-dc1-talos-prod.dc1.yxl.writemy.codes/core/core-docker/freeswitch
    repository: 'forge.core-dc1-talos-prod.dc1.yxl.writemy.codes/core/core-docker/freeswitch'
    # Pull the tested image by digest without resolving a mutable tag.
    tag: ''
    digest: 'sha256:b5cf4593a3b733decd5b78160d41f6c17a99c9f903112a89feff925e78c40fab'
    pullPolicy: 'IfNotPresent'
  fax:
    enabled: true
    spoolPath: '/var/spool/freeswitch/fax'
    ident: 'AVoIP'
    header: 'AVoIP'
    t38:
      # Flowroute initially sends G.711 fax audio. Request T.38 after this
      # many 20 ms packets; keep it non-zero (0 is not "immediate").
      rxReinvitePacketCount: 20
      # The current Flowroute fax path is validated only through 9600 bps.
      disableV17: true
      useEcm: false
    # The owning ApplicationSet enables this for Home1/YVR, where G.711 fax
    # reception works and T.38 has not been validated. Other sites retain the
    # T.38-capable default until their own call results justify an override.
    g711Only:
      enabled: false
    persistence:
      enabled: true
      storageClass: 'longhorn'
      accessMode: 'ReadWriteOnce'
      size: '1Gi'
      retain: true
  cdr:
    enabled: true
    # Defaults to the site-local endpoint for the rendered cluster.
    host: ''
    port: 5432
    table: 'cdr'
    legs: 'ab'
    # Empty values derive psql-<datacenter>-<region> from the rendered site.
    terraformProvider: ''
    crossplaneProvider: ''
  rtp:
    min: 11000
    max: 11050

jitsi-meet:
  # Default values for jitsi-meet.
  # This is a YAML-formatted file.
  # Declare variables to be passed into your templates.
  enabled: false

  global:
    podLabels: {}
    podAnnotations: {}
  imagePullSecrets: []

  nameOverride: ""
  fullnameOverride: ""

  enableAuth: false
  enableGuests: true
  publicURL: https://meet.mylogin.space

  tz: America/Winnipeg

  image:
    pullPolicy: IfNotPresent

  web:
    replicaCount: 0

    extraVolumeMounts:
      - name: extra-config
        subPath: custom-config.js
        mountPath: /config/custom-config.js

    extraVolumes:
      - name: extra-config
        configMap:
          name: business-avoip-jitsiweb-config

    image:
      repository: jitsi/web
      tag: stable-7648-1

    extraEnvs:
      ENABLE_TRANSCRIPTIONS: 'true'
      DESKTOP_SHARING_FRAMERATE_MIN: '15'
      DESKTOP_SHARING_FRAMERATE_MAX: '120'
      RESOLUTION: '2560'
      RESOLUTION_MIN: '720'
      RESOLUTION_WIDTH: '1440'
      RESOLUTION_WIDTH_MIN: '1280'
      ENABLE_MULTI_STREAM: 'true'

    service:
      type: ClusterIP
      port: 80
      externalIPs: []

    ingress:
      enabled: false

    # Useful for ingresses that don't support http-to-https redirect by themself, (namely: GKE),
    httpRedirect: false

    # When tls-termination by the ingress is not wanted, enable this and set web.service.type=Loadbalancer
    httpsEnabled: false

    ## Resolver IP for nginx.
    ## Set this to ClusterIP of your `kube-dns` service
    ## when using websockets and discovering JVB's address
    ## via k8s services.
    resolverIP: 10.0.8.10

    podLabels: {}
    podAnnotations: {}
    podSecurityContext: {}
      # fsGroup: 2000

    securityContext: {}
      # capabilities:
      #   drop:
      #   - ALL
      # readOnlyRootFilesystem: true
      # runAsNonRoot: true
      # runAsUser: 1000

    resources: {}
      # We usually recommend not to specify default resources and to leave this as a conscious
      # choice for the user. This also increases chances charts run on environments with little
      # resources, such as Minikube. If you do want to specify resources, uncomment the following
      # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 100m
      #   memory: 128Mi

    nodeSelector: {}

    tolerations: []

    affinity: {}

  jicofo:
    replicaCount: 0
    image:
      repository: jitsi/jicofo
      tag: stable

    xmpp:
      user: focus

    livenessProbe:
      tcpSocket:
        port: 8888

    readinessProbe:
      tcpSocket:
        port: 8888

    podLabels: {}
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    extraEnvs: {}

  jvb:
    replicaCount: 0
    image:
      repository: jitsi/jvb
      tag: stable

    xmpp:
      user: jvb

    stunServers: 'nat.ipaddr.network:3478'


    useHostPort: false

    UDPPort: 10000

    service:
      enabled: true
      type: ClusterIP
      externalIPs:
        - 66.165.222.101
      ## Annotations to be added to the service (if LoadBalancer is used)
      ##
      annotations: {}

    breweryMuc: jvbbrewery

    livenessProbe: {}

    readinessProbe: {}

    podLabels: {}
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

    publicIP: 66.165.222.101
    extraEnvs: {}

    websockets:
      ## Set to 'true' to enable Colibri WebSocket support in JVB:
      enabled: true
      ## Uncomment this to set JVB server ID manually,
      ## Or use one of pre-defined values:
      ## * "podIP" will fetch JVB pod's IP address from K8s metadata;
      ## * "service" will use JVB service name generated by Helm.
      ##
      ## Don't forget to set `web.resolverIP` to your cluster's
      ## DNS service IP when setting this to "service"!
      ##
      ## (default is "podIP")
      serverID: service

    metrics:
      enabled: false
      prometheusAnnotations: false
      image:
        repository: docker.io/systemli/prometheus-jitsi-meet-exporter
        tag: 1.1.9
        pullPolicy: IfNotPresent
      serviceMonitor:
        enabled: true
        selector:
          release: prometheus-operator
        interval: 10s
        # honorLabels: false

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 20m
          memory: 32Mi
    
  octo:
    enabled: false


  jibri:
    ## Enabling Jibri will allow users to record
    ## and/or stream their meetings (e.g. to YouTube).
    enabled: false

    ## Enable persistent storage for local recordings.
    ## If disabled, jibri pod will use a transient
    ## emptyDir-backed storage instead.
    persistence:
      enabled: false
      size: 4Gi
      ## Set this to existing PVC name if you have one.
      existingClaim:
      storageClassName:

    shm:
      ## Set to true to enable "/dev/shm" mount.
      ## May be required by built-in Chromium.
      enabled: false
      ## If "true", will use host's shared memory dir,
      ## and if "false" — an emptyDir mount.
      # useHost: false
      # size: 256Mi

    image:
      repository: jitsi/jibri
      tag: stable

    breweryMuc: jibribrewery
    timeout: 90

    ## jibri XMPP user credentials:
    xmpp:
      user: jibri

    ## recorder XMPP user credentials:
    recorder:
      user: recorder

    livenessProbe:
      exec:
        command: ["pgrep", "java"]

    readinessProbe:
      exec:
        command: ["pgrep", "java"]

    extraEnvs: {}

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name:

  xmpp:
    domain: meet.mylogin.space

    authDomain:
    mucDomain:
    internalMucDomain:
    guestDomain:

  extraCommonEnvs: {}

  prosody:
    enabled: true
    persistence:
      enabled: false
    server:
    extraEnvFrom:
    - secretRef:
        name: '{{ include "prosody.fullname" . }}-jicofo'
    - secretRef:
        name: '{{ include "prosody.fullname" . }}-jvb'
    - configMapRef:
        name: '{{ include "prosody.fullname" . }}-common'
    ## Uncomment this if you want to use jibri:
    # - secretRef:
    #     name: '{{ include "prosody.fullname" . }}-jibri'
    image:
      repository: jitsi/prosody
      tag: 'stable'
