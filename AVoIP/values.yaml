global:
  # BJW-S common should use Kubernetes' namespace default ServiceAccount.
  createDefaultServiceAccount: false

env: 'prod'

# The BJW-S loader reads this map during chart initialization; the local
# common template populates it with the enabled Asterisk/FreeSWITCH controllers.
controllers: {}

datacenter: 'dc1'

region: 'yxl'

cluster:
  name: 'dc1-k3s-node1'
  # Supplied by the owning ApplicationSet for each selected cluster.
  domain: 'cluster.local'
  type: 'spoke'

  hub:
    cluster:
      name: 'core-dc1-talos-prod'
      datacenter: 'dc1'
      region: 'yxl'

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  # The owning Gateway must define tls-sip as protocol TLS with
  # tls.mode: Terminate and forward the decrypted stream to Kamailio with
  # PROXY protocol v2.
  sectionName: 'https-myloginspace'

flowroute:
  signalingCIDRs:
    - '34.210.91.112/28'
    - '34.226.36.32/28'

kamailio:
  enabled: true
  sipLogging:
    # Compact SIP request, relay, response, and rejection markers only.
    enabled: true
    # Adds socket/ACL/transaction decision markers without dumping SIP bodies.
    diagnostics:
      enabled: true
      # Kamailio core debug level used only while diagnostics are enabled.
      coreDebug: 2
  publicExposure:
    enabled: true
    sip:
      enabled: true
  backend:
    # The default backend is the chart's FreeSWITCH service when both are enabled.
    serviceName: ''
    servicePort: 5090
    # Only this private source range may send established-dialog requests from
    # the backend side through Kamailio. Initial requests from this range remain
    # rejected and public carrier sources are still checked separately below.
    podCIDR: '172.16.0.0/12'
  # These addresses are used in SIP Via/Contact/Record-Route headers and never
  # come from the wildcard bind.
  advertisedHost: 'sip.resolvemy.host'
  advertisedUDPPort: 5060
  advertisedTLSPort: 5081
  image:
    # renovate: datasource=docker depName=ghcr.io/kamailio/kamailio
    repository: 'ghcr.io/kamailio/kamailio'
    tag: '6.1.4-bookworm'
    digest: 'sha256:c54f770ab74ae64588cc174e206aa337108cc777b6162d738189d1cb0c32d116'
    pullPolicy: 'IfNotPresent'

rtpengine:
  # Deploy RTPEngine independently. Kamailio/FreeSWITCH integration is enabled
  # only when those components are also enabled; this toggle controls the
  # RTPEngine workload, control Service, and public media Service itself.
  enabled: true
  controlPort: 22222
  image:
    repository: 'forge.core-dc1-talos-prod.dc1.yxl.writemy.codes/core/core-docker/rtpengine'
    tag: 'mr13.5.1.27-build-70'
    digest: 'sha256:49a4a0ab99ecbea4efe350601d39aac8279388291434c261466cd7b84cd66bbe'
    pullPolicy: 'IfNotPresent'
  media:
    address: '66.165.222.103'
    min: 11000
    max: 11050
  logging:
    # Temporary T.38 troubleshooting verbosity. Disable after the fax test.
    enabled: true
    level: 7
    controlLevel: 7
    spandspLevel: 7
    rtcpLevel: 7

diagnostics:
  netshoot:
    # Keep a network troubleshooting shell in each enabled AVoIP service pod.
    enabled: true
    image:
      repository: 'nicolaka/netshoot'
      tag: 'v0.16'
      digest: 'sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70'
      pullPolicy: 'IfNotPresent'

homer:
  # Homer is enabled on the hub only. The owning ApplicationSet supplies the
  # hub/spoke cluster type; keep this opt-in for standalone renders.
  enabled: true
  hostname: 'homer.mylogin.space'
  capture:
    image:
      repository: 'ghcr.io/sipcapture/heplify-server'
      tag: '1.60.9'
      digest: 'sha256:9beb52592888cc62437ee11ab7d7f4e68bc2a41ca0b23542eb59800f54d8f3d2'
      pullPolicy: 'IfNotPresent'
    hepPort: 9060
    hepTCPPort: 9061
    metricsPort: 9096
    retentionDays: 14
  web:
    image:
      repository: 'ghcr.io/sipcapture/homer-app'
      tag: '1.5.21'
      digest: 'sha256:76a4bf3ad106ae8c7b6cced00eca31a6fd26f5d851eb0e1fe2b539c904e5d167'
      pullPolicy: 'IfNotPresent'
    port: 9080
  database:
    host: ''
    port: 5432
    userSecret: ''
    username: 'homer'
    dataDatabase: 'homer_data'
    configDatabase: 'homer_config'
    crossplaneProvider: ''
    terraformProvider: ''
  oidc:
    providerConfigRef: 'authentik'
    issuerBaseUrl: 'https://idp.mylogin.space'
    applicationSlug: 'avoip-homer'
    clientId: 'avoip-homer'
    accessGroup: 'Home Users'
    displayName: 'AVoIP Homer'
    workspaceName: 'avoip-homer-oidc'
  forwardAuth:
    providerConfigRef: 'authentik'
    accessGroup: 'Home Users'
    displayName: 'AVoIP Homer Forward Auth'
    workspaceName: 'avoip-homer-forward-auth'
  authentikOutpost:
    name: 'aaa-myloginspace-proxy'
    namespace: 'core-prod'
    port: 80

jitsi:
  domain: 'meet.mylogin.space'
  tls:
    secretName: 'myloginspace-default-certificates'

network:
  externalIP: '66.165.222.101'
  egressIP: '66.165.222.101'
  # Leave Cilium egress pinning disabled unless the cluster has a working
  # CiliumEgressGatewayPolicy path. Normal node/NAT egress may use 66.165.222.98
  # or 66.165.222.99 at the site edge.
  ciliumEgressGateway:
    enabled: false

asterisk:
  enabled: false
  # Asterisk and FreeSWITCH communicate over the cluster pod network. Leave
  # external media/signaling addresses unset so PJSIP advertises the pod IP.
  localNet: '172.16.0.0/12'
  externalMediaAddress: ''
  externalSignalingAddress: ''
  # Stable locally administered Asterisk Entity ID; do not derive it from the
  # pod network interface because pod MAC addresses are not deployment state.
  entityID: '02:dc:1a:22:2a:01'
  cdr:
    enabled: true
    host: ''
    port: 5432
    table: 'cdr'
    terraformProvider: ''
    crossplaneProvider: ''
  image:
    # renovate: datasource=docker depName=forge.core-dc1-talos-prod.dc1.yxl.writemy.codes/core/core-docker/asterisk
    repository: 'forge.core-dc1-talos-prod.dc1.yxl.writemy.codes/core/core-docker/asterisk'
    tag: '20'
    digest: ''
    pullPolicy: 'IfNotPresent'
  rtp:
    min: 10000
    max: 10100

freeswitch:
  enabled: false
  publicExposure:
    enabled: true
    # PureLB address reserved for the public FreeSWITCH RTP service.
    address: '66.165.222.103'
    sip:
      # Retained for compatibility with injected values; public SIP routes
      # terminate at Kamailio and are never rendered for FreeSWITCH.
      enabled: true
      tcpEnabled: false
      udpEnabled: false
    kamailio:
      backendPort: 5090
    # Kamailio's pod source range as seen by the private FreeSWITCH profile.
    podCIDR: '172.16.0.0/12'
  preBridgeAudio:
    enabled: true
    url: 'https://static.mylogin.space/black_alert.mp3'
  sms:
    enabled: true
  sipLogging:
    # Sofia raw SIP request/response tracing is enabled by default for call
    # troubleshooting. It can be disabled when production trace volume or
    # signaling metadata exposure is not acceptable.
    enabled: true
  media:
    # Snapshot per-call RTP statistics only when explicitly enabled.
    diagnostics:
      enabled: true
      # Temporary inbound-call recording for fax-tone/T.38 troubleshooting.
      # Disable after the capture is complete because recordings contain call audio.
      callRecording:
        enabled: true
        path: '/var/spool/freeswitch/fax'
  image:
    # renovate: datasource=docker depName=forge.core-dc1-talos-prod.dc1.yxl.writemy.codes/core/core-docker/freeswitch
    repository: 'forge.core-dc1-talos-prod.dc1.yxl.writemy.codes/core/core-docker/freeswitch'
    # Forgejo build tags are immutable; latest-build-64 is the successful build
    # for Core-Docker run 64, which includes the FreeSWITCH dependency fix.
    tag: 'latest'
    digest: 'sha256:0355ade37781ac9e5f5ecfd29aa1d094d31f96a462c6f4d2f343268aaacefec1'
    pullPolicy: 'IfNotPresent'
  did: '18077893501'
  fax:
    enabled: true
    spoolPath: '/var/spool/freeswitch/fax'
    ident: 'AVoIP'
    header: 'AVoIP'
    t38:
      # Flowroute initially sends G.711 fax audio. Request T.38 after this
      # many 20 ms packets; keep it non-zero (0 is not "immediate").
      rxReinvitePacketCount: 20
      # The current Flowroute fax path is validated only through 9600 bps.
      disableV17: true
      useEcm: false
    detection:
      # Temporary diagnostics for the generic fax-tone detector.
      verbose: true
      expires: 10
      sleep: 0
    testMode:
      # Enable for a deterministic public fax test. Roll back to false to
      # restore the shared voice/fax detection path.
      enabled: false
      did: '18077893501'
    knownSenders:
      - '+18772333839'
      - '+13072199333'
    persistence:
      enabled: true
      storageClass: 'longhorn'
      accessMode: 'ReadWriteOnce'
      size: '1Gi'
      retain: true
  cdr:
    enabled: true
    # Defaults to the site-local endpoint for the rendered cluster.
    host: ''
    port: 5432
    table: 'cdr'
    legs: 'ab'
    # Empty values derive psql-<datacenter>-<region> from the rendered site.
    terraformProvider: ''
    crossplaneProvider: ''
  rtp:
    min: 11000
    max: 11050

jitsi-meet:
  # Default values for jitsi-meet.
  # This is a YAML-formatted file.
  # Declare variables to be passed into your templates.
  enabled: false

  global:
    podLabels: {}
    podAnnotations: {}
  imagePullSecrets: []

  nameOverride: ""
  fullnameOverride: ""

  enableAuth: false
  enableGuests: true
  publicURL: https://meet.mylogin.space

  tz: America/Winnipeg

  image:
    pullPolicy: IfNotPresent

  web:
    replicaCount: 0

    extraVolumeMounts:
      - name: extra-config
        subPath: custom-config.js
        mountPath: /config/custom-config.js

    extraVolumes:
      - name: extra-config
        configMap:
          name: business-avoip-jitsiweb-config

    image:
      repository: jitsi/web
      tag: stable-7648-1

    extraEnvs:
      ENABLE_TRANSCRIPTIONS: 'true'
      DESKTOP_SHARING_FRAMERATE_MIN: '15'
      DESKTOP_SHARING_FRAMERATE_MAX: '120'
      RESOLUTION: '2560'
      RESOLUTION_MIN: '720'
      RESOLUTION_WIDTH: '1440'
      RESOLUTION_WIDTH_MIN: '1280'
      ENABLE_MULTI_STREAM: 'true'

    service:
      type: ClusterIP
      port: 80
      externalIPs: []

    ingress:
      enabled: false

    # Useful for ingresses that don't support http-to-https redirect by themself, (namely: GKE),
    httpRedirect: false

    # When tls-termination by the ingress is not wanted, enable this and set web.service.type=Loadbalancer
    httpsEnabled: false

    ## Resolver IP for nginx.
    ## Set this to ClusterIP of your `kube-dns` service
    ## when using websockets and discovering JVB's address
    ## via k8s services.
    resolverIP: 10.0.8.10

    podLabels: {}
    podAnnotations: {}
    podSecurityContext: {}
      # fsGroup: 2000

    securityContext: {}
      # capabilities:
      #   drop:
      #   - ALL
      # readOnlyRootFilesystem: true
      # runAsNonRoot: true
      # runAsUser: 1000

    resources: {}
      # We usually recommend not to specify default resources and to leave this as a conscious
      # choice for the user. This also increases chances charts run on environments with little
      # resources, such as Minikube. If you do want to specify resources, uncomment the following
      # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 100m
      #   memory: 128Mi

    nodeSelector: {}

    tolerations: []

    affinity: {}

  jicofo:
    replicaCount: 0
    image:
      repository: jitsi/jicofo
      tag: stable

    xmpp:
      user: focus

    livenessProbe:
      tcpSocket:
        port: 8888

    readinessProbe:
      tcpSocket:
        port: 8888

    podLabels: {}
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    extraEnvs: {}

  jvb:
    replicaCount: 0
    image:
      repository: jitsi/jvb
      tag: stable

    xmpp:
      user: jvb

    stunServers: 'nat.ipaddr.network:3478'


    useHostPort: false

    UDPPort: 10000

    service:
      enabled: true
      type: ClusterIP
      externalIPs:
        - 66.165.222.101
      ## Annotations to be added to the service (if LoadBalancer is used)
      ##
      annotations: {}

    breweryMuc: jvbbrewery

    livenessProbe: {}

    readinessProbe: {}

    podLabels: {}
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

    publicIP: 66.165.222.101
    extraEnvs: {}

    websockets:
      ## Set to 'true' to enable Colibri WebSocket support in JVB:
      enabled: true
      ## Uncomment this to set JVB server ID manually,
      ## Or use one of pre-defined values:
      ## * "podIP" will fetch JVB pod's IP address from K8s metadata;
      ## * "service" will use JVB service name generated by Helm.
      ##
      ## Don't forget to set `web.resolverIP` to your cluster's
      ## DNS service IP when setting this to "service"!
      ##
      ## (default is "podIP")
      serverID: service

    metrics:
      enabled: false
      prometheusAnnotations: false
      image:
        repository: docker.io/systemli/prometheus-jitsi-meet-exporter
        tag: 1.1.9
        pullPolicy: IfNotPresent
      serviceMonitor:
        enabled: true
        selector:
          release: prometheus-operator
        interval: 10s
        # honorLabels: false

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 20m
          memory: 32Mi
    
  octo:
    enabled: false


  jibri:
    ## Enabling Jibri will allow users to record
    ## and/or stream their meetings (e.g. to YouTube).
    enabled: false

    ## Enable persistent storage for local recordings.
    ## If disabled, jibri pod will use a transient
    ## emptyDir-backed storage instead.
    persistence:
      enabled: false
      size: 4Gi
      ## Set this to existing PVC name if you have one.
      existingClaim:
      storageClassName:

    shm:
      ## Set to true to enable "/dev/shm" mount.
      ## May be required by built-in Chromium.
      enabled: false
      ## If "true", will use host's shared memory dir,
      ## and if "false" — an emptyDir mount.
      # useHost: false
      # size: 256Mi

    image:
      repository: jitsi/jibri
      tag: stable

    breweryMuc: jibribrewery
    timeout: 90

    ## jibri XMPP user credentials:
    xmpp:
      user: jibri

    ## recorder XMPP user credentials:
    recorder:
      user: recorder

    livenessProbe:
      exec:
        command: ["pgrep", "java"]

    readinessProbe:
      exec:
        command: ["pgrep", "java"]

    extraEnvs: {}

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name:

  xmpp:
    domain: meet.mylogin.space

    authDomain:
    mucDomain:
    internalMucDomain:
    guestDomain:

  extraCommonEnvs: {}

  prosody:
    enabled: true
    persistence:
      enabled: false
    server:
    extraEnvFrom:
    - secretRef:
        name: '{{ include "prosody.fullname" . }}-jicofo'
    - secretRef:
        name: '{{ include "prosody.fullname" . }}-jvb'
    - configMapRef:
        name: '{{ include "prosody.fullname" . }}-common'
    ## Uncomment this if you want to use jibri:
    # - secretRef:
    #     name: '{{ include "prosody.fullname" . }}-jibri'
    image:
      repository: jitsi/prosody
      tag: 'stable'
