{{- define "avoip.kamailio.certificate" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- $ownerService := "" -}}
{{- $ownerHostSuffix := "" -}}
{{- $ownerStatefulSet := "" -}}
{{- if (.Values.kamailio.websocketHA | default dict).enabled -}}
  {{- $ownerService = include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "owner") -}}
  {{- $ownerHostSuffix = printf "%s.%s.svc.%s" $ownerService .Release.Namespace (required "cluster.domain is required for SIP owner TLS SANs" .Values.cluster.domain) -}}
  {{- $ownerStatefulSet = printf "core-kamailio-%s" .Values.kamailio.name -}}
{{- end -}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "sip-tls") }}'
spec:
  secretName: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "sip-tls") }}'
  dnsNames:
    - '{{ include "avoip.sip.serviceHost" (dict "root" . "component" $component "override" .Values.kamailio.sip.serviceHost) }}'
    {{- if and .Values.asterisk.enabled .Values.asterisk.sipCore.enabled (or (eq .Values.kamailio.name .Values.asterisk.sipCore.kamailioInstance) (.Values.kamailio.websocketHA | default dict).enabled (.Values.kamailio.websocketHA | default dict).legacyOwner) }}
    - '{{ include "avoip.sip.sipCoreReturnHost" (dict "root" .) }}'
    {{- if (.Values.kamailio.websocketHA | default dict).enabled }}
    {{ range $ordinal := until (int .Values.kamailio.replicas) }}
    # ACME rejects a DNS name covered by a wildcard SAN in the same request.
    # Issue exact per-pod identities so strict SIP TLS clients can validate
    # the Path target without an ambiguous wildcard match.
    - '{{ printf "%s-%d.%s" $ownerStatefulSet $ordinal $ownerHostSuffix }}'
    {{ end }}
    {{- end }}
    {{- end }}
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.enabled }}
    - '{{ include "avoip.sip.siteHost" . }}'
    - '{{ .Values.sip.globalHost }}'
    {{- end }}
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.enabled .Values.kamailio.publicExposure.sip.directService.enabled }}
    - '{{ include "avoip.sip.kamailioPubHost" . }}'
    {{- end }}
  {{- if and .Values.kamailio.carrierOutbound.clientIdentity.enabled (eq .Values.kamailio.role "private-sbc") }}
  commonName: '{{ printf "%s.svc" $component }}'
  usages:
    - 'server auth'
  {{- end }}
  issuerRef:
    kind: ClusterIssuer
    name: '{{ if and .Values.kamailio.carrierOutbound.clientIdentity.enabled (eq .Values.kamailio.role "private-sbc") }}{{ required "kamailio.carrierOutbound.clientIdentity.issuerName is required" .Values.kamailio.carrierOutbound.clientIdentity.issuerName }}{{ else }}{{ required "sip.tls.issuerName is required" .Values.sip.tls.issuerName }}{{ end }}'
{{- if .Values.kamailio.carrierOutbound.clientIdentity.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "sip-mtls") }}'
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  secretName: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "sip-mtls") }}'
  commonName: '{{ printf "%s.svc" $component }}'
  dnsNames:
    - '{{ include "avoip.sip.serviceHost" (dict "root" . "component" $component "override" .Values.kamailio.sip.serviceHost) }}'
  usages:
    - 'digital signature'
    - 'key encipherment'
    - 'client auth'
  issuerRef:
    kind: ClusterIssuer
    name: '{{ required "kamailio.carrierOutbound.clientIdentity.issuerName is required" .Values.kamailio.carrierOutbound.clientIdentity.issuerName }}'
{{- end }}
{{ end }}
{{- $root := . -}}
{{- range $instance := (include "avoip.kamailio.instances" $root | fromYamlArray) -}}
{{- if $instance.enabled -}}
{{- $values := deepCopy $root.Values -}}
{{- $_ := set $values "kamailio" $instance -}}
{{- $ctx := dict "Values" $values "Release" $root.Release "Chart" $root.Chart "Files" $root.Files "Capabilities" $root.Capabilities -}}
{{ include "avoip.kamailio.certificate" $ctx }}
{{ end }}
{{ end }}
{{- if .Values.freeswitch.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: '{{ include "avoip.fullname" . }}-freeswitch-sip-tls'
spec:
  secretName: '{{ include "avoip.fullname" . }}-freeswitch-sip-tls'
  dnsNames:
    - '{{ include "avoip.sip.serviceHost" (dict "root" . "component" "freeswitch") }}'
  issuerRef:
    kind: ClusterIssuer
    name: '{{ required "sip.tls.issuerName is required" .Values.sip.tls.issuerName }}'
{{- end }}
{{- if .Values.asterisk.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: '{{ include "avoip.fullname" . }}-asterisk-sip-tls'
spec:
  secretName: '{{ include "avoip.fullname" . }}-asterisk-sip-tls'
  dnsNames:
    - '{{ include "avoip.sip.serviceHost" (dict "root" . "component" "asterisk") }}'
  issuerRef:
    kind: ClusterIssuer
    name: '{{ required "sip.tls.issuerName is required" .Values.sip.tls.issuerName }}'
{{- end }}
{{- if and .Values.freeswitch.enabled .Values.freeswitch.flowrouteOutbound.enabled }}
{{- $flowrouteIssuer := dict "name" "" -}}
{{- $flowrouteIssuerCount := 0 -}}
{{- range $instance := (include "avoip.kamailio.instances" . | fromYamlArray) -}}
  {{- if and $instance.enabled (eq $instance.role "private-sbc") $instance.carrierOutbound.enabled $instance.carrierOutbound.clientIdentity.enabled -}}
    {{- $_ := set $flowrouteIssuer "name" $instance.carrierOutbound.clientIdentity.issuerName -}}
    {{- $flowrouteIssuerCount = add1 $flowrouteIssuerCount -}}
  {{- end -}}
{{- end -}}
{{- if ne $flowrouteIssuerCount 1 -}}
  {{- fail "freeswitch.flowrouteOutbound.enabled requires exactly one enabled private Kamailio with Vault clientIdentity" -}}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: '{{ include "avoip.fullname" . }}-freeswitch-flowroute-client-tls'
spec:
  secretName: '{{ include "avoip.fullname" . }}-freeswitch-flowroute-client-tls'
  dnsNames:
    - '{{ include "avoip.sip.serviceHost" (dict "root" . "component" "freeswitch") }}'
  usages:
    - 'digital signature'
    - 'key encipherment'
    - 'server auth'
    - 'client auth'
  issuerRef:
    kind: ClusterIssuer
    name: '{{ $flowrouteIssuer.name }}'
{{- end }}
