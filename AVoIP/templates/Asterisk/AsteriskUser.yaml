{{- if .Values.asterisk.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
---
apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: {{ $fullName }}-asterisk

spec:
  name: 'Asterisk'
  serviceAccount: true
  groups:
    - 'LDAPService'

  writeConnectionSecretToRef:
    name: '{{ $fullName }}-asterisk'
{{- end }}
