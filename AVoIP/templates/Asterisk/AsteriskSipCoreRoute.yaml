{{- if and .Values.asterisk.enabled .Values.asterisk.sipCore.enabled }}
{{- $hostname := required "asterisk.sipCore.hostname is required when SIP Core is enabled" .Values.asterisk.sipCore.hostname -}}
{{- range $name, $duration := .Values.asterisk.sipCore.routeTimeouts -}}
  {{- if not (regexMatch "^(0s|[1-9][0-9]*(s|m|h))$" (toString $duration)) -}}
    {{- fail (printf "asterisk.sipCore.routeTimeouts.%s must be 0s or a positive duration in seconds, minutes, or hours" $name) -}}
  {{- end -}}
{{- end -}}
{{- $kamailioService := "" -}}
{{- $routeInstanceName := default .Values.asterisk.sipCore.kamailioInstance .Values.asterisk.sipCore.ingressKamailioInstance -}}
{{- $tlsRouteInstanceName := default $routeInstanceName .Values.asterisk.sipCore.tls.ingressKamailioInstance -}}
{{- $tlsKamailioService := "" -}}
{{- range $instance := (include "avoip.kamailio.instances" . | fromYamlArray) -}}
  {{- if and $instance.enabled (eq $instance.name $routeInstanceName) (eq $instance.role "private-sbc") -}}
    {{- $kamailioService = include "avoip.kamailio.resourceName" (dict "root" $ "instance" $instance) -}}
  {{- end -}}
  {{- if and $instance.enabled (eq $instance.name $tlsRouteInstanceName) (eq $instance.role "private-sbc") -}}
    {{- $tlsKamailioService = include "avoip.kamailio.resourceName" (dict "root" $ "instance" $instance) -}}
  {{- end -}}
{{- end -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ include "avoip.resourceNameWithSuffix" (dict "root" . "suffix" "sipcore-wss") }}'
  annotations:
    external-dns.alpha.kubernetes.io/hostname: '{{ $hostname }}'

  labels:
    wan-mode: 'public'
spec:
  parentRefs:
    - kind: 'Gateway'
      name: '{{ .Values.gateway.name }}'
      namespace: '{{ .Values.gateway.namespace }}'
      sectionName: '{{ default .Values.gateway.sectionName .Values.asterisk.sipCore.gatewaySectionName }}'
  hostnames:
    - '{{ $hostname }}'
  rules:
    - matches:
        - path:
            type: 'Exact'
            value: '/ws'
      backendRefs:
        - group: ''
          kind: 'Service'
          name: '{{ required "Asterisk SIP Core requires the enabled private Kamailio Service" $kamailioService }}'
          port: {{ .Values.asterisk.sipCore.httpPort }}
      timeouts:
        backendRequest: '{{ .Values.asterisk.sipCore.routeTimeouts.backendRequest }}'
        request: '{{ .Values.asterisk.sipCore.routeTimeouts.request }}'
{{- if .Values.asterisk.sipCore.tls.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: '{{ include "avoip.resourceNameWithSuffix" (dict "root" . "suffix" "sipcore-tls") }}'
  labels:
    wan-mode: 'public'
spec:
  parentRefs:
    - kind: 'Gateway'
      name: '{{ .Values.gateway.name }}'
      namespace: '{{ .Values.gateway.namespace }}'
      sectionName: '{{ .Values.asterisk.sipCore.tls.gatewaySectionName }}'
  hostnames:
    - '{{ $hostname }}'
  rules:
    - backendRefs:
        - group: ''
          kind: 'Service'
          name: '{{ required "SIP Core TLS requires the enabled private Kamailio Service" $tlsKamailioService }}'
          port: {{ .Values.asterisk.sipCore.tls.port }}
          weight: 1
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: '{{ include "avoip.resourceNameWithSuffix" (dict "root" . "suffix" "sipcore-tls-proxy-protocol") }}'
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: TLSRoute
      name: '{{ include "avoip.resourceNameWithSuffix" (dict "root" . "suffix" "sipcore-tls") }}'
  proxyProtocol:
    version: V2
{{- end }}
{{- end }}
