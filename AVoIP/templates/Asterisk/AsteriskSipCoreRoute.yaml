{{- if and .Values.asterisk.enabled .Values.asterisk.sipCore.enabled }}
{{- $hostname := required "asterisk.sipCore.hostname is required when SIP Core is enabled" .Values.asterisk.sipCore.hostname -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ include "avoip.resourceNameWithSuffix" (dict "root" . "suffix" "asterisk-sipcore-wss") }}'
  annotations:
    external-dns.alpha.kubernetes.io/hostname: '{{ $hostname }}'
    wan-mode: 'public'
spec:
  parentRefs:
    - kind: 'Gateway'
      name: '{{ .Values.gateway.name }}'
      namespace: '{{ .Values.gateway.namespace }}'
      sectionName: '{{ default .Values.gateway.sectionName .Values.asterisk.sipCore.gatewaySectionName }}'
  hostnames:
    - '{{ $hostname }}'
  rules:
    - matches:
        - path:
            type: 'Exact'
            value: '/ws'
      backendRefs:
        - group: ''
          kind: 'Service'
          name: '{{ include "avoip.fullname" . }}-asterisk'
          port: {{ .Values.asterisk.sipCore.httpPort }}
{{- end }}
