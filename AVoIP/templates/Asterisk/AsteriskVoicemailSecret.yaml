{{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- $inboundExtension := toString .Values.asterisk.sipCore.inboundVoiceExtension -}}
{{- $pinSecret := .Values.asterisk.voicemail.pinSecret -}}
{{- $found := false -}}
{{- range .Values.asterisk.sipCore.extensions }}
{{- if and (eq (toString .number) $inboundExtension) .secret.remoteKey }}
{{- $found = true }}
{{- end }}
{{- end }}
{{- if or (not .Values.asterisk.sipCore.enabled) (not (regexMatch "^[0-9]{2,8}$" $inboundExtension)) (not $found) }}
{{- fail "asterisk.voicemail requires SIP Core's configured inboundVoiceExtension and its matching CoreVault-backed extension" }}
{{- end }}
{{- if or (not $pinSecret.remoteKey) (not $pinSecret.property) }}
{{- fail "asterisk.voicemail.pinSecret.remoteKey and property are required" }}
{{- end }}
{{- $accessCode := default .Values.freeswitch.voicemail.accessCode .Values.asterisk.voicemail.accessCode -}}
{{- if not (regexMatch "^\\*[0-9]{2,4}$" $accessCode) }}
{{- fail "asterisk.voicemail.accessCode must be * followed by two to four digits" }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $fullName }}-asterisk-voicemail-pin'
spec:
  refreshInterval: '1h'
  secretStoreRef:
    kind: '{{ $.Values.asterisk.sipCore.secretStoreRef.kind }}'
    name: '{{ $.Values.asterisk.sipCore.secretStoreRef.name }}'
  target:
    name: '{{ $fullName }}-asterisk-voicemail-pin'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
  data:
    - secretKey: 'pin'
      remoteRef:
        key: '{{ $pinSecret.remoteKey }}'
        property: '{{ $pinSecret.property }}'
{{- end }}
