{{- if .Values.asterisk.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- if .Values.asterisk.sipCore.enabled -}}
  {{- $sipExtensions := dict -}}
  {{- if not (include "avoip.rtpengine.enabled" . | trim) -}}
    {{- fail "Asterisk SIP Core requires the existing RTPEngine for WebRTC media" -}}
  {{- end -}}
  {{- $sipCoreKamailioFound := false -}}
  {{- range $instance := (include "avoip.kamailio.instances" . | fromYamlArray) -}}
    {{- if and $instance.enabled (eq $instance.name $.Values.asterisk.sipCore.kamailioInstance) (eq $instance.role "private-sbc") -}}
      {{- $sipCoreKamailioFound = true -}}
    {{- end -}}
  {{- end -}}
  {{- if not $sipCoreKamailioFound -}}
    {{- fail "Asterisk SIP Core requires a configured enabled private-sbc matching asterisk.sipCore.kamailioInstance" -}}
  {{- end -}}
  {{- if not .Values.freeswitch.enabled -}}
    {{- fail "Asterisk SIP Core requires the existing media-enabled AVoIP stack" -}}
  {{- end -}}
  {{- if not (or (hasPrefix "http://" .Values.freeswitch.preBridgeAudio.url) (hasPrefix "https://" .Values.freeswitch.preBridgeAudio.url)) -}}
    {{- fail "freeswitch.preBridgeAudio.url must be an HTTP(S) URL when SIP Core is enabled for GG audio" -}}
  {{- end -}}
  {{- if .Values.asterisk.sipCore.media.enabled -}}
    {{- fail "Asterisk SIP Core media must use RTPEngine; disable asterisk.sipCore.media direct Asterisk exposure" -}}
  {{- end -}}
  {{- if not (regexMatch "^[a-zA-Z0-9.-]+$" .Values.asterisk.sipCore.hostname) -}}
    {{- fail "asterisk.sipCore.hostname must be a DNS hostname when SIP Core is enabled" -}}
  {{- end -}}
  {{- if not .Values.asterisk.sipCore.extensions -}}
    {{- fail "asterisk.sipCore.extensions must contain at least one extension when SIP Core is enabled" -}}
  {{- end -}}
  {{- if or (lt (int .Values.asterisk.sipCore.privateEgressPort) 1024) (gt (int .Values.asterisk.sipCore.privateEgressPort) 65535) -}}
    {{- fail "asterisk.sipCore.privateEgressPort must be a TCP port from 1024 through 65535" -}}
  {{- end -}}
  {{- if or (eq (int .Values.asterisk.sipCore.privateEgressPort) 5060) (eq (int .Values.asterisk.sipCore.privateEgressPort) 5061) (eq (int .Values.asterisk.sipCore.privateEgressPort) 5062) (eq (int .Values.asterisk.sipCore.privateEgressPort) (int .Values.asterisk.sipCore.httpPort)) -}}
    {{- fail "asterisk.sipCore.privateEgressPort must not collide with the existing SIP or WebSocket ports" -}}
  {{- end -}}
  {{- if not (regexMatch "^[1-9][0-9]*(s|m|h)$" (toString .Values.asterisk.sipCore.backendTrafficPolicy.streamIdleTimeout)) -}}
    {{- fail "asterisk.sipCore.backendTrafficPolicy.streamIdleTimeout must be a positive duration in seconds, minutes, or hours" -}}
  {{- end -}}
  {{- if not .Values.asterisk.sipCore.allowedOrigins -}}
    {{- fail "asterisk.sipCore.allowedOrigins must include the Home Assistant HTTPS origin when SIP Core is enabled" -}}
  {{- end -}}
  {{- range .Values.asterisk.sipCore.allowedOrigins -}}
    {{- if not (regexMatch "^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$" .) -}}
      {{- fail (printf "invalid Asterisk SIP Core HTTPS origin %s" .) -}}
    {{- end -}}
  {{- end -}}
  {{- if not (regexMatch "^[0-9]{2,8}$" (toString .Values.asterisk.sipCore.echoExtension)) -}}
    {{- fail "asterisk.sipCore.echoExtension must be 2-8 digits when SIP Core is enabled" -}}
  {{- end -}}
  {{- if not (regexMatch "^[0-9]{2,8}$" (toString .Values.asterisk.sipCore.ggAudioExtension)) -}}
    {{- fail "asterisk.sipCore.ggAudioExtension must be 2-8 digits when SIP Core is enabled" -}}
  {{- end -}}
  {{- if not (regexMatch "^[0-9]{2,8}$" (toString .Values.asterisk.sipCore.helloCallbackExtension)) -}}
    {{- fail "asterisk.sipCore.helloCallbackExtension must be 2-8 digits when SIP Core is enabled" -}}
  {{- end -}}
  {{- if not (regexMatch "^[a-zA-Z0-9_.-]+$" (toString .Values.asterisk.sipCore.ggAudioDestination)) -}}
    {{- fail "asterisk.sipCore.ggAudioDestination must be a valid SIP user when SIP Core is enabled" -}}
  {{- end -}}
  {{- if eq (toString .Values.asterisk.sipCore.ggAudioExtension) (toString .Values.asterisk.sipCore.echoExtension) -}}
    {{- fail "asterisk.sipCore.ggAudioExtension must differ from echoExtension" -}}
  {{- end -}}
  {{- if or (eq (toString .Values.asterisk.sipCore.helloCallbackExtension) (toString .Values.asterisk.sipCore.echoExtension)) (eq (toString .Values.asterisk.sipCore.helloCallbackExtension) (toString .Values.asterisk.sipCore.ggAudioExtension)) -}}
    {{- fail "asterisk.sipCore.helloCallbackExtension must differ from echoExtension and ggAudioExtension" -}}
  {{- end -}}
  {{- if or (not .Values.asterisk.sipCore.secretStoreRef.kind) (not .Values.asterisk.sipCore.secretStoreRef.name) -}}
    {{- fail "asterisk.sipCore.secretStoreRef kind and name are required when SIP Core is enabled" -}}
  {{- end -}}
  {{- if and .Values.asterisk.sipCore.media.enabled (not (regexMatch "^[0-9a-fA-F:.]+$" (toString .Values.asterisk.sipCore.media.address))) -}}
    {{- fail "asterisk.sipCore.media.address must be an IP literal when SIP Core media exposure is enabled" -}}
  {{- end -}}
  {{- range $extension := .Values.asterisk.sipCore.extensions -}}
    {{- if not (regexMatch "^[0-9]{2,8}$" (toString $extension.number)) -}}
      {{- fail "Asterisk SIP Core extension numbers must be 2-8 digits" -}}
    {{- end -}}
    {{- if hasKey $sipExtensions (toString $extension.number) -}}
      {{- fail (printf "duplicate Asterisk SIP Core extension %s" $extension.number) -}}
    {{- end -}}
    {{- if eq (toString $extension.number) (toString $.Values.asterisk.sipCore.echoExtension) -}}
      {{- fail "asterisk.sipCore.echoExtension must not be assigned to a SIP Core user" -}}
    {{- end -}}
    {{- if eq (toString $extension.number) (toString $.Values.asterisk.sipCore.ggAudioExtension) -}}
      {{- fail "asterisk.sipCore.ggAudioExtension must not be assigned to a SIP Core user" -}}
    {{- end -}}
    {{- if eq (toString $extension.number) (toString $.Values.asterisk.sipCore.helloCallbackExtension) -}}
      {{- fail "asterisk.sipCore.helloCallbackExtension must not be assigned to a SIP Core user" -}}
    {{- end -}}
    {{- if or (lt (int (default 2 $extension.maxContacts)) 1) (gt (int (default 2 $extension.maxContacts)) 10) -}}
      {{- fail (printf "Asterisk SIP Core extension %s maxContacts must be between 1 and 10" $extension.number) -}}
    {{- end -}}
    {{- $_ := set $sipExtensions (toString $extension.number) true -}}
    {{- $_ := required (printf "Asterisk SIP Core extension %s requires secret.remoteKey" $extension.number) $extension.secret.remoteKey -}}
    {{- $_ := required (printf "Asterisk SIP Core extension %s requires secret.property" $extension.number) $extension.secret.property -}}
  {{- end -}}
  {{- range $extension := .Values.asterisk.sipCore.extensions -}}
    {{- range $target := $extension.allowCallsTo -}}
      {{- if and (ne (toString $target) (toString $.Values.asterisk.sipCore.echoExtension)) (ne (toString $target) (toString $.Values.asterisk.sipCore.ggAudioExtension)) (ne (toString $target) (toString $.Values.asterisk.sipCore.helloCallbackExtension)) (not (hasKey $sipExtensions (toString $target))) -}}
        {{- fail (printf "Asterisk SIP Core extension %s may call only configured extensions or reserved test destinations; invalid target %s" $extension.number $target) -}}
      {{- end -}}
      {{- if not (regexMatch "^[0-9]{2,8}$" (toString $target)) -}}
        {{- fail (printf "Asterisk SIP Core target %s must be 2-8 digits" $target) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if and .Values.asterisk.turn.enabled .Values.asterisk.sipCore.enabled -}}
  {{- if not (regexMatch "^[A-Za-z0-9.-]+$" .Values.asterisk.turn.hostname) -}}
    {{- fail "asterisk.turn.hostname must be a DNS hostname when TURN is enabled" -}}
  {{- end -}}
  {{- if or (lt (int .Values.asterisk.turn.port) 1) (gt (int .Values.asterisk.turn.port) 65535) -}}
    {{- fail "asterisk.turn.port must be between 1 and 65535" -}}
  {{- end -}}
  {{- if not (regexMatch "^[A-Za-z0-9._-]+$" .Values.asterisk.turn.username) -}}
    {{- fail "asterisk.turn.username must contain only letters, digits, dot, underscore, or hyphen" -}}
  {{- end -}}
  {{- if or (lt (int .Values.asterisk.turn.credentialLifetimeSeconds) 86400) (gt (int .Values.asterisk.turn.credentialLifetimeSeconds) 31536000) -}}
    {{- fail "asterisk.turn.credentialLifetimeSeconds must be between one day and one year" -}}
  {{- end -}}
  {{- $_ := required "asterisk.turn.secret.name is required when TURN is enabled" .Values.asterisk.turn.secret.name -}}
  {{- $_ := required "asterisk.turn.secret.key is required when TURN is enabled" .Values.asterisk.turn.secret.key -}}
  {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.asterisk.turn.secret.name) -}}
    {{- fail "asterisk.turn.secret.name must be a Kubernetes Secret name" -}}
  {{- end -}}
  {{- if not (regexMatch "^[A-Za-z0-9._-]+$" .Values.asterisk.turn.secret.key) -}}
    {{- fail "asterisk.turn.secret.key must be a valid Kubernetes Secret data key" -}}
  {{- end -}}
{{- end -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-asterisk-config-tpl

data:
  pjsip.conf: |-
    ; AVoIP's active PJSIP peers.
    ; Flowroute is terminated by FreeSWITCH; Asterisk only peers with FreeSWITCH.

    [global]
    type=global
    endpoint_identifier_order=username,auth_username,ip,anonymous

    ; The entrypoint writes outbound and inbound SIP Digest auth objects from
    ; the External Secrets generated peer Secret at startup. Credentials never
    ; enter this ConfigMap.
    #include /tmp/avoip-pjsip-auth.conf

    [transport-tls]
    type=transport
    protocol=tls
    bind=0.0.0.0:5061
    external_signaling_address={{ include "avoip.sip.serviceHost" (dict "root" . "component" "asterisk") }}
    external_signaling_port=5061
    cert_file=/etc/asterisk/tls/tls.crt
    priv_key_file=/etc/asterisk/tls/tls.key
    ca_list_file=/etc/ssl/certs/ca-certificates.crt
    method=tlsv1_2
    verify_client=no
    verify_server=yes
    ; Do not mark the FreeSWITCH pod subnet local on this transport: PJSIP
    ; otherwise skips external_signaling_address Contact rewriting for it.
    {{- with $.Values.asterisk.externalMediaAddress }}
    external_media_address={{ . }}
    {{- end }}
    {{- if .Values.asterisk.sipCore.enabled }}

    ; Envoy terminates WSS and proxies WebSocket to Kamailio. Kamailio sends
    ; SIP to this endpoint over private TLS and controls browser media through
    ; the existing RTPEngine.

    ; The WebRTC credentials and endpoints are materialized from mounted
    ; Secret files by the Asterisk startup wrapper.
    #include /tmp/avoip-sipcore-pjsip.conf
    {{- end }}

    {{- if .Values.freeswitch.enabled }}
    [freeswitch]
    type=endpoint
    transport=transport-tls
    outbound_auth=freeswitch-auth
    auth=freeswitch-inbound-auth
    trust_id_outbound=yes
    from_user=freeswitch
    from_domain={{ include "avoip.sip.serviceHost" (dict "root" . "component" "freeswitch") }}
    identify_by=username,auth_username
    aors=freeswitch
    context=from-external
    disallow=all
    allow=ulaw
    direct_media=no

    [freeswitch]
    type=aor
    contact=sip:{{ include "avoip.sip.serviceHost" (dict "root" . "component" "freeswitch") }}:{{ .Values.freeswitch.asterisk.tlsPort }};transport=tls
    {{- end }}
{{- end }}
