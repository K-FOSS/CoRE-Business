{{- if .Values.asterisk.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-asterisk-config-tpl

data:
  pjsip.conf: |-
    ; AVoIP's active PJSIP peers.
    ; Flowroute is terminated by FreeSWITCH; Asterisk only peers with FreeSWITCH.

    [transport-udp]
    type=transport
    protocol=udp
    bind=0.0.0.0
    local_net=10.4.0.0/16
    external_media_address={{ $.Values.network.externalIP }}
    external_signaling_address={{ $.Values.network.externalIP }}

    [freeswitch]
    type=endpoint
    transport=transport-udp
    trust_id_inbound=yes
    trust_id_outbound=yes
    aors=freeswitch
    context=from-external
    disallow=all
    allow=ulaw
    direct_media=no
    ice_support=yes

    [freeswitch]
    type=identify
    endpoint=freeswitch
    match=10.0.0.0/8

    [freeswitch]
    type=aor
    contact=sip:{{ $fullName }}-freeswitch.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}
{{- end }}
