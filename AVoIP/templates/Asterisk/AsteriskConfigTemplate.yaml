{{- if .Values.asterisk.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-asterisk-config-tpl

data:
  pjsip.conf: |-
    ; AVoIP's active PJSIP peers.
    ; Flowroute is terminated by FreeSWITCH; Asterisk only peers with FreeSWITCH.

    ; The entrypoint writes this auth object from the mylogin.space User
    ; connection Secret at startup. Credentials never enter this ConfigMap.
    #include /tmp/avoip-pjsip-auth.conf

    [transport-tls]
    type=transport
    protocol=tls
    bind=0.0.0.0:5061
    cert_file=/etc/asterisk/tls/tls.crt
    priv_key_file=/etc/asterisk/tls/tls.key
    ca_list_file=/etc/ssl/certs/ca-certificates.crt
    method=tlsv1_2
    verify_client=no
    verify_server=yes
    local_net={{ $.Values.asterisk.localNet }}
{{- with $.Values.asterisk.externalMediaAddress }}
    external_media_address={{ . }}
{{- end }}
{{- with $.Values.asterisk.externalSignalingAddress }}
    external_signaling_address={{ . }}
{{- end }}

    [freeswitch]
    type=endpoint
    transport=transport-tls
    outbound_auth=freeswitch-auth
    trust_id_inbound=yes
    trust_id_outbound=yes
    aors=freeswitch
    context=from-external
    disallow=all
    allow=ulaw
    direct_media=no
    ice_support=yes

    [freeswitch]
    type=identify
    endpoint=freeswitch
    match=10.0.0.0/8
    match=172.16.0.0/12

    [freeswitch]
    type=aor
    contact=sip:{{ include "avoip.sip.serviceHost" (dict "root" . "component" "freeswitch") }}:5062;transport=tls
{{- end }}
