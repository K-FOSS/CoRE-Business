{{- if .Values.asterisk.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- $cdrHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.asterisk.cdr.host -}}
{{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
  {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" .Values.asterisk.voicemail.messagesTable) }}
    {{- fail "asterisk.voicemail.messagesTable must be a plain SQL identifier" }}
  {{- end }}
  {{- if not (regexMatch "^[A-Za-z0-9 _.-]+$" .Values.asterisk.voicemail.odbcDriver) }}
    {{- fail "asterisk.voicemail.odbcDriver must be a registered ODBC driver name" }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-asterisk-configs

data:
  asterisk.conf: |
    [options]
    languageprefix=yes
    entityid={{ .Values.asterisk.entityID }}
    systemname=avoip-asterisk

  modules.conf: |
    [modules]
    autoload=yes
    require = chan_pjsip.so
    require = res_pjsip_endpoint_identifier_user.so
    require = res_pjsip_endpoint_identifier_ip.so
    require = res_pjsip_endpoint_identifier_anonymous.so
    require = res_http_media_cache.so
    noload => chan_iax2.so
    noload => chan_alsa.so
    noload => chan_mobile.so
    noload => app_adsiprog.so
    noload => app_getcpeid.so
    noload => res_adsi.so
    noload => res_config_ldap.so
    noload => res_config_pgsql.so
    noload => res_pjsip_phoneprov_provider.so
    noload => res_phoneprov.so
    noload => res_musiconhold.so
    noload => res_smdi.so
    {{- if .Values.asterisk.cdr.enabled }}
    require = cdr_pgsql.so
    {{- else }}
    noload => cdr_pgsql.so
    {{- end }}
    noload => cdr_csv.so
    noload => cdr_custom.so
    noload => cdr_sqlite3_custom.so
    noload => cel_custom.so
    noload => cel_sqlite3_custom.so
    noload => cel_pgsql.so
    noload => res_hep.so
    noload => res_hep_pjsip.so
    noload => res_hep_rtcp.so
    noload => chan_sip.so
    noload => app_voicemail_imap.so
    {{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
    require = res_odbc.so
    require = res_config_odbc.so
    noload => app_voicemail.so
    require = app_voicemail_odbc.so
    {{- else }}
    noload => app_voicemail.so
    noload => app_voicemail_odbc.so
    {{- end }}
    noload => app_fax.so
    noload => app_faxdetect.so
    noload => res_fax.so
    noload => res_fax_spandsp.so

  logger.conf: |
    [general]

    [logfiles]
    console => notice,warning,error,verbose,debug
    messages.log => notice,warning,error

  cli.conf: |
    [general]
    [defaults]
    [startup_commands]
    {{- if .Values.asterisk.logging.enabled }}
    core set verbose {{ .Values.asterisk.logging.verbose }} = yes
    core set debug {{ .Values.asterisk.logging.debug }} = yes
    {{- if and .Values.asterisk.logging.pjsip (not .Values.asterisk.sipCore.enabled) (not .Values.freeswitch.enabled) }}
    pjsip set logger on = yes
    {{- end }}
    {{- end }}

  cdr.conf: |
    [general]
    enable=yes
    batch=yes
    safeshutdown=yes

  res_odbc.conf: |
    {{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
    # ODBC credentials are generated into the writable runtime directory.
    #include /tmp/avoip-res_odbc.conf
    {{- else }}
    [general]
    {{- end }}

  extconfig.conf: |
    [settings]
    {{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
    voicemail => odbc,avoip-voicemail,voicemail
    {{- end }}

  voicemail.conf: |
    [general]
    format=wav|wav49|gsm
    attach=no
    minpassword=4
    {{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
    odbcstorage=avoip-voicemail
    odbctable={{ .Values.asterisk.voicemail.messagesTable }}
    {{- end }}
    [default]

  cdr_pgsql.conf: |
    #include /tmp/avoip-cdr_pgsql.conf

  rtp.conf: |
    [general]
    rtpstart={{ .Values.asterisk.rtp.min }}
    rtpend={{ .Values.asterisk.rtp.max }}
    icesupport=true
    {{- if and .Values.asterisk.turn.enabled .Values.asterisk.sipCore.enabled }}
    #include /tmp/avoip-turn.conf
    {{- end }}

  extensions.conf: |
    [general]
    static=yes
    writeprotect=no
    clearglobalvars=no

    [from-external]
    {{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
    ; External callers entering the voice IVR must authenticate to a mailbox.
    exten => {{ default .Values.freeswitch.voicemail.accessCode .Values.asterisk.voicemail.accessCode }},1,VoiceMailMain()
      same => n,Hangup()
    ; VoiceMail() sends callers who press 0 during a greeting to this extension.
    exten => o,1,VoiceMailMain()
      same => n,Hangup()
    {{- end }}
    {{- range (list .Values.avoip.did .Values.fax.did) }}
    {{- if . }}
    ; Keep this leg in ringing state until the selected SIP Core endpoint answers.
    {{- if $.Values.asterisk.sipCore.inboundVoiceExtension }}
    exten => {{ . }},1,Dial(PJSIP/{{ $.Values.asterisk.sipCore.inboundVoiceExtension }},30)
      {{- if and (or $.Values.asterisk.voicemail.enabled $.Values.freeswitch.voicemail.enabled) (eq (toString .) (toString $.Values.fax.did)) }}
      same => n,GotoIf($["${DIALSTATUS}" = "CANCEL"]?done)
      same => n,NoOp(AVoIP voicemail fallback dialstatus=${DIALSTATUS} mailbox={{ $.Values.asterisk.sipCore.inboundVoiceExtension }} cause=${HANGUPCAUSE})
      same => n,VoiceMail({{ $.Values.asterisk.sipCore.inboundVoiceExtension }}@default,u)
      same => n(done),Hangup()
      {{- else }}
      same => n,Hangup()
      {{- end }}
    {{- else }}
    {{- if and (or $.Values.asterisk.voicemail.enabled $.Values.freeswitch.voicemail.enabled) (eq (toString .) (toString $.Values.fax.did)) }}
    exten => {{ . }},1,Answer()
      same => n,VoiceMail({{ default $.Values.asterisk.sipCore.inboundVoiceExtension $.Values.asterisk.voicemail.mailbox }}@default,u)
      same => n,Hangup()
    {{- else }}
    exten => {{ . }},1,Answer()
      same => n,Echo()
      same => n,Playback(hello-world)
      same => n,Playback(hello-world)
      same => n,Playback(hello-world)
      same => n,Playback(hello-world)
      same => n,Hangup()
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if and .Values.asterisk.voicemail.enabled (not .Values.asterisk.sipCore.enabled) .Values.freeswitch.ivr.enabled }}
    ; Voicemail-only sites use the local mailbox as the IVR destination.
    exten => {{ default .Values.asterisk.sipCore.inboundVoiceExtension .Values.asterisk.voicemail.mailbox }},1,VoiceMail({{ default .Values.asterisk.sipCore.inboundVoiceExtension .Values.asterisk.voicemail.mailbox }}@default,u)
      same => n,Hangup()
    {{- end }}
      {{- if and .Values.asterisk.sipCore.enabled .Values.asterisk.sipCore.inboundVoiceExtension }}
    ; The authenticated YVR FreeSWITCH peer may deliver this exact transfer
    ; extension after the carrier mTLS route has authorized it.
    exten => {{ .Values.asterisk.sipCore.inboundVoiceExtension }},1,Dial(PJSIP/{{ .Values.asterisk.sipCore.inboundVoiceExtension }},30)
      same => n,Hangup()
      {{- end }}
    {{- if and .Values.freeswitch.ivr.enabled .Values.asterisk.sipCore.enabled }}
    ; These exact destinations are reachable only after FreeSWITCH validates
    ; caller DTMF against freeswitch.ivr.extensions.
    {{- range .Values.freeswitch.ivr.extensions }}
    {{- if ne (toString .) (toString $.Values.asterisk.sipCore.inboundVoiceExtension) }}
    {{- if eq (toString .) (toString $.Values.asterisk.sipCore.echoExtension) }}
    exten => {{ . }},1,Answer()
      same => n,Echo()
      same => n,Hangup()
    {{- else if eq (toString .) (toString $.Values.asterisk.sipCore.ggAudioExtension) }}
    exten => {{ . }},1,Dial(PJSIP/{{ $.Values.asterisk.sipCore.ggAudioDestination }}@freeswitch,30)
      same => n,Hangup()
    {{- else if eq (toString .) (toString $.Values.asterisk.sipCore.helloCallbackExtension) }}
    {{- if gt (len $.Values.asterisk.sipCore.extensions) 0 }}
    exten => {{ . }},1,Goto(from-sipcore-{{ (index $.Values.asterisk.sipCore.extensions 0).number }},{{ . }},1)
    {{- else }}
      {{- fail "the IVR hello callback destination requires at least one Asterisk SIP Core extension" }}
    {{- end }}
    {{- else }}
    exten => {{ . }},1,Dial(PJSIP/{{ . }},30)
      same => n,Hangup()
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.asterisk.sipCore.enabled }}

    {{- range .Values.asterisk.sipCore.extensions }}
    ; Each SIP Core account has its own context and exact extension allowlist.
    [from-sipcore-{{ .number }}]
    {{- if and (or $.Values.asterisk.voicemail.enabled $.Values.freeswitch.voicemail.enabled) (eq (toString .number) (toString $.Values.asterisk.sipCore.inboundVoiceExtension)) }}
    ; Keep mailbox access limited to the direct extension owner.
    exten => {{ default $.Values.freeswitch.voicemail.accessCode $.Values.asterisk.voicemail.accessCode }},1,VoiceMailMain({{ .number }}@default)
      same => n,Hangup()
    {{- end }}
    {{- range .allowCallsTo }}
    {{- if and (ne (toString .) (toString $.Values.asterisk.sipCore.echoExtension)) (ne (toString .) (toString $.Values.asterisk.sipCore.ggAudioExtension)) (ne (toString .) (toString $.Values.asterisk.sipCore.helloCallbackExtension)) }}
    exten => {{ . }},1,Dial(PJSIP/{{ . }},30)
      same => n,Hangup()
    {{- end }}
    {{- end }}
    {{- if and $.Values.asterisk.sipCore.outboundNANP.enabled (has (toString .number) $.Values.asterisk.sipCore.outboundNANP.extensions) }}
    ; PSTN egress is limited to the configured NANP-enabled account.
    exten => _+1NXXNXXXXXX,1,Set(CALLERID(num)={{ .number }})
      same => n,Set(CHANNEL(hangup_handler_push)=sipcore-outbound-hangup,s,1)
      same => n,NoOp(AVoIP outbound start linkedid=${CHANNEL(linkedid)} uniqueid=${UNIQUEID} browser_call_id=${PJSIP_HEADER(read,Call-ID)} extension={{ .number }} destination=${EXTEN})
      same => n,Dial(PJSIP/${EXTEN}@freeswitch,120,gb(sipcore-outbound-headers^s^1))
      same => n,NoOp(AVoIP outbound result linkedid=${CHANNEL(linkedid)} uniqueid=${UNIQUEID} browser_call_id=${PJSIP_HEADER(read,Call-ID)} destination=${EXTEN} dialstatus=${DIALSTATUS} hangupcause=${HANGUPCAUSE} causekeys=${HANGUPCAUSE_KEYS()})
      same => n,Hangup()
    {{- end }}
    {{- $echoAllowed := false -}}
    {{- range .allowCallsTo }}{{- if eq (toString .) (toString $.Values.asterisk.sipCore.echoExtension) }}{{- $echoAllowed = true }}{{- end }}{{- end }}
    {{- if $echoAllowed }}
    exten => {{ $.Values.asterisk.sipCore.echoExtension }},1,Answer()
      same => n,Echo()
      same => n,Hangup()
    {{- end }}
    ; FreeSWITCH authenticates this request against the Asterisk peer identity
    ; and streams the configured GG audio to this SIP Core caller.
    exten => {{ $.Values.asterisk.sipCore.ggAudioExtension }},1,Dial(PJSIP/{{ $.Values.asterisk.sipCore.ggAudioDestination }}@freeswitch,30,g)
      same => n,Hangup()
    ; Reserved callback service: greet the authenticated source extension, end
    ; that leg, then wait for its PJSIP AOR to answer before starting GG audio.
    exten => {{ $.Values.asterisk.sipCore.helloCallbackExtension }},1,Answer()
      same => n,NoOp(AVoIP callback greeting start uniqueid=${UNIQUEID} native=${CHANNEL(audionativeformat)} read=${CHANNEL(audioreadformat)} write=${CHANNEL(audiowriteformat)})
      same => n,Playback(hello-world)
      same => n,NoOp(AVoIP callback greeting complete uniqueid=${UNIQUEID} native=${CHANNEL(audionativeformat)} read=${CHANNEL(audioreadformat)} write=${CHANNEL(audiowriteformat)})
      same => n,Set(CHANNEL(hangup_handler_push)=sipcore-callback-{{ .number }},s,1)
      same => n,Hangup()
    exten => _X!,1,Hangup(21)
    [sipcore-callback-{{ .number }}]
    ; Run the callback independently of the already-hung-up source channel,
    ; after the configured delay following the hello-world call.
    ; Originate enters the GG destination only after the Local callback channel
    ; answers, which happens after a registered SIP Core contact answers.
    exten => s,1,Originate(Local/s@sipcore-callback-contact-{{ .number }}/n,exten,from-sipcore-{{ .number }},{{ $.Values.asterisk.sipCore.ggAudioExtension }},1,{{ add (int $.Values.asterisk.sipCore.ggCallbackDelaySeconds) (int $.Values.asterisk.sipCore.ggCallbackRingTimeoutSeconds) 10 }},a)
      same => n,Return()
    ; Dial the AOR through its PJSIP endpoint so Asterisk applies the Path
    ; stored for the selected contact. Explicit contact URIs from
    ; PJSIP_DIAL_CONTACTS failed before reaching the WSS edge in YVR.
    [sipcore-callback-contact-{{ .number }}]
    exten => s,1,Wait({{ $.Values.asterisk.sipCore.ggCallbackDelaySeconds }})
      same => n,Set(CALLERID(name)={{ $.Values.asterisk.sipCore.ggCallbackCallerIdName }})
      same => n,Dial(PJSIP/{{ .number }},{{ $.Values.asterisk.sipCore.ggCallbackRingTimeoutSeconds }})
      same => n,Hangup()
    {{- end }}
    ; Correlation IDs cross the Asterisk-to-FreeSWITCH B2BUA boundary. The
    ; browser and carrier Call-IDs remain distinct SIP dialogs.
    [sipcore-outbound-headers]
    exten => s,1,Set(PJSIP_HEADER(add,X-Core-Call-Linkedid)=${CHANNEL(linkedid)})
      same => n,Set(PJSIP_HEADER(add,X-Core-Origin-Uniqueid)=${CHANNEL(uniqueid)})
      same => n,Return()
    [sipcore-outbound-hangup]
    exten => s,1,Set(AVOIP_CAUSE_KEYS=${HANGUPCAUSE_KEYS()})
      same => n,NoOp(AVoIP outbound hangup linkedid=${CHANNEL(linkedid)} uniqueid=${UNIQUEID} dialstatus=${DIALSTATUS} caller_cause=${HANGUPCAUSE} causekeys=${AVOIP_CAUSE_KEYS})
      same => n(cause_loop),GotoIf($[${LEN(${AVOIP_CAUSE_KEYS})}=0]?cause_done)
      same => n,Set(ARRAY(AVOIP_CAUSE_CHANNEL)=${AVOIP_CAUSE_KEYS})
      same => n,Set(AVOIP_CAUSE_KEYS=${AVOIP_CAUSE_KEYS:${LEN(${AVOIP_CAUSE_CHANNEL})}})
      same => n,NoOp(AVoIP outbound leg channel=${AVOIP_CAUSE_CHANNEL} ast_cause=${HANGUPCAUSE(${AVOIP_CAUSE_CHANNEL},ast)} tech_cause=${HANGUPCAUSE(${AVOIP_CAUSE_CHANNEL},tech)})
      same => n,GotoIf($[${LEN(${AVOIP_CAUSE_KEYS})}=0]?cause_done)
      same => n,Set(AVOIP_CAUSE_KEYS=${AVOIP_CAUSE_KEYS:1})
      same => n,Goto(cause_loop)
      same => n(cause_done),Return()
    [carrier-outbound-deny]
    exten => _X!,1,Hangup(21)
    {{- end }}

{{- end }}
