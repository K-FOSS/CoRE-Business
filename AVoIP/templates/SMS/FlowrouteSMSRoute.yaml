{{- if and .Values.flowrouteSMS.enabled }}
{{- $hostname := required "flowrouteSMS.hostname is required when enabled" .Values.flowrouteSMS.hostname -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ include "avoip.resourceNameWithSuffix" (dict "root" . "suffix" "flowroute-sms") }}'
  annotations:
    external-dns.alpha.kubernetes.io/hostname: '{{ $hostname }}'
  labels:
    wan-mode: 'public'
spec:
  parentRefs:
    - kind: 'Gateway'
      name: '{{ .Values.gateway.name }}'
      namespace: '{{ .Values.gateway.namespace }}'
      sectionName: '{{ .Values.gateway.sectionName }}'
  hostnames:
    - '{{ $hostname }}'
  rules:
    - matches:
        - path:
            type: 'PathPrefix'
            value: '/flowroute/'
        - path:
            type: 'PathPrefix'
            value: '/providers/'
      backendRefs:
        - group: ''
          kind: 'Service'
          name: '{{ include "avoip.resourceNameWithSuffix" (dict "root" . "suffix" "flowroute-sms-webhook") }}'
          port: 8080
{{- end }}
{{- if and .Values.flowrouteSMS.enabled .Values.flowrouteSMS.media.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ include "avoip.resourceNameWithSuffix" (dict "root" . "suffix" "flowroute-sms-media") }}'
  annotations:
    external-dns.alpha.kubernetes.io/hostname: '{{ .Values.flowrouteSMS.media.hostname }}'
  labels:
    wan-mode: 'public'
spec:
  parentRefs:
    - kind: 'Gateway'
      name: '{{ .Values.gateway.name }}'
      namespace: '{{ .Values.gateway.namespace }}'
      sectionName: '{{ .Values.gateway.sectionName }}'
  hostnames:
    - '{{ .Values.flowrouteSMS.media.hostname }}'
  rules:
    - matches:
        - path:
            type: 'PathPrefix'
            value: '/media/'
      backendRefs:
        - group: ''
          kind: 'Service'
          name: '{{ include "avoip.resourceNameWithSuffix" (dict "root" . "suffix" "flowroute-sms-media") }}'
          port: 8080
{{- end }}
