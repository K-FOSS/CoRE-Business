{{- if and .Values.flowrouteSMS.enabled .Values.flowrouteSMS.media.enabled }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: '{{ .Values.flowrouteSMS.media.proxySecretName }}-generator'
spec:
  length: 64
  digits: 0
  symbols: 0
  allowRepeat: true
  encoding: 'hex'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ .Values.flowrouteSMS.media.proxySecretName }}'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: '{{ .Values.flowrouteSMS.media.proxySecretName }}'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
    template:
      engineVersion: 'v2'
      data:
        secret: '{{ `{{ .password }}` }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: 'Password'
          name: '{{ .Values.flowrouteSMS.media.proxySecretName }}-generator'
{{- end }}
