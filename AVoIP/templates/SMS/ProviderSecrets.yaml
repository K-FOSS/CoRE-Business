{{- if or .Values.flowrouteSMS.enabled (and .Values.avoipAdmin.enabled .Values.freeswitch.enabled) }}
{{- $root := . -}}
{{- $groups := dict -}}
{{- range $env, $credential := .Values.flowrouteSMS.providerCredentials -}}
  {{- if not (regexMatch "^SMS_PROVIDER_[A-Z0-9_]{1,100}$" $env) }}{{ fail "provider credential names must start with SMS_PROVIDER_" }}{{ end }}
  {{- $_ := required "provider credential Secret name required" $credential.name -}}
  {{- $_ := required "provider credential Secret key required" $credential.key -}}
  {{- $entries := get $groups $credential.name | default list -}}
  {{- $_ := set $groups $credential.name (append $entries $credential) -}}
{{- end -}}
{{- range $name, $entries := $groups }}
{{- $managed := false -}}
{{- range $entries }}{{ if .remoteRef }}{{ $managed = true }}{{ end }}{{ end }}
{{- if $managed }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $name }}'
spec:
  secretStoreRef:
    kind: '{{ $root.Values.flowrouteSMS.providerSecretStoreRef.kind }}'
    name: '{{ $root.Values.flowrouteSMS.providerSecretStoreRef.name }}'
  target:
    name: '{{ $name }}'
    creationPolicy: 'Owner'
  data:
    {{- range $entries }}
    - secretKey: '{{ .key }}'
      remoteRef:
        key: '{{ required "all keys of a managed provider Secret need remoteRef.key" (.remoteRef | default dict).key }}'
        property: '{{ required "provider remoteRef.property required" (.remoteRef | default dict).property }}'
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
