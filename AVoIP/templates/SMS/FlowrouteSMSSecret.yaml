{{- if and .Values.flowrouteSMS.enabled .Values.flowrouteSMS.legacyFlowroute.enabled }}
{{- $name := include "avoip.resourceNameWithSuffix" (dict "root" . "suffix" "sms-callback") -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $name }}'
spec:
  secretStoreRef:
    kind: 'ClusterSecretStore'
    name: 'corevault-rootsecrets'
  target:
    name: '{{ $name }}'
    creationPolicy: 'Owner'
  data:
    - secretKey: '{{ .Values.flowrouteSMS.callbackSecret.key }}'
      remoteRef:
        key: 'AVoIP/SIP/FlowRoute/SMS'
        property: 'CallbackToken'
{{- end }}
{{- if and .Values.flowrouteSMS.enabled .Values.flowrouteSMS.inbox.enabled .Values.flowrouteSMS.legacyFlowroute.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ include "avoip.fullname" . }}-flowroute-sms-send'
spec:
  secretStoreRef:
    kind: 'ClusterSecretStore'
    name: 'corevault-rootsecrets'
  target:
    name: '{{ include "avoip.fullname" . }}-flowroute-sms-send'
    creationPolicy: 'Owner'
  data:
    - secretKey: 'AccessKey'
      remoteRef:
        key: 'AVoIP/SIP/FlowRoute/SMS'
        property: 'AccessKey'
    - secretKey: 'SecretKey'
      remoteRef:
        key: 'AVoIP/SIP/FlowRoute/SMS'
        property: 'SecretKey'
{{- end }}
