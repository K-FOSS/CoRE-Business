{{- if .Values.freeswitch.voicemail.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- $inboundExtension := toString .Values.asterisk.sipCore.inboundVoiceExtension -}}
{{- range .Values.asterisk.sipCore.extensions }}
{{- if eq (toString .number) $inboundExtension }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $fullName }}-freeswitch-voicemail-pin'
spec:
  refreshInterval: '1h'
  secretStoreRef:
    kind: '{{ $.Values.asterisk.sipCore.secretStoreRef.kind }}'
    name: '{{ $.Values.asterisk.sipCore.secretStoreRef.name }}'
  target:
    name: '{{ $fullName }}-freeswitch-voicemail-pin'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
  data:
    - secretKey: 'pin'
      remoteRef:
        key: '{{ .secret.remoteKey }}'
        property: '{{ $.Values.freeswitch.voicemail.pinProperty }}'
{{- end }}
{{- end }}
{{- end }}
