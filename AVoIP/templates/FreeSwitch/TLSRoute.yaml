{{- if and .Values.freeswitch.enabled .Values.freeswitch.publicExposure.enabled .Values.freeswitch.publicExposure.sip.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ $fullName }}-freeswitch

  labels:
    wan-mode: public
    lan-mode: private
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: tls-sip

  hostnames:
    - sip.resolvemy.host

  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ $fullName }}-ext-freeswitch
          port: 5061
          weight: 1
{{- end }}
