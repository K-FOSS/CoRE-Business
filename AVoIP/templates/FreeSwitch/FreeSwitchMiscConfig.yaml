{{- if .Values.freeswitch.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- $freeswitchRtpEnd := .Values.freeswitch.rtp.max -}}
{{- if and (include "avoip.rtpengine.enabled" . | trim) (include "avoip.kamailio.carrier.enabled" . | trim) }}
{{- $freeswitchRtpEnd = sub (.Values.rtpengine.media.max | int) 1 -}}
{{- end }}
{{- $cdrHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.freeswitch.cdr.host -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-freeswitch-misc-configs

data:
  {{- if .Values.freeswitch.ldap.enabled }}
  ldap.conf.xml: |
    <configuration name="xml_ldap.conf" description="LDAP directory gateway">
      <bindings>
        <binding name="directory">
          <param name="filter" value="(&amp;(objectClass=user)(cn=%s))" bindings="directory"/>
          <param name="basedn" value="ou=users,dc=ldap,dc=mylogin,dc=space"/>
          <param name="url" value="ldaps://ldap-{{ .Values.datacenter }}.mylogin.space"/>
          <param name="binddn" value="cn=$${username},ou=users,dc=ldap,dc=mylogin,dc=space"/>
          <param name="bindpass" value="$${password}"/>
          <trans>
            <tran name="id" mapfrom="uid"/>
          </trans>
        </binding>
      </bindings>
    </configuration>
  {{- end }}

  {{- if .Values.asterisk.enabled }}
  asterisk-peer.xml: |
    <include>
      <domain name="$${domain}">
        <groups>
          <group name="default">
            <users>
              <user id="freeswitch">
                <params>
                  <param name="password" value="$${asterisk_peer_password}"/>
                </params>
                <variables>
                  <variable name="user_context" value="from-asterisk"/>
                </variables>
              </user>
            </users>
          </group>
        </groups>
      </domain>
    </include>
  {{- end }}

  opus.conf.xml: |
    <configuration name="opus.conf">
      <settings>
        <param name="use-vbr" value="1"/>
        <param name="complexity" value="10"/>
        <param name="keep-fec-enabled" value="1"/>
        <param name="maxaveragebitrate" value="0"/>
        <param name="maxplaybackrate" value="0"/>
        <param name="mono" value="0"/>
      </settings>
    </configuration>

  modules.conf.xml: |
    <configuration name="modules.conf" description="Modules">
      <modules>
        <load module="mod_console"/>
        <load module="mod_logfile"/>
        <load module="mod_sofia"/>
        {{- if $.Values.freeswitch.ldap.enabled }}
        <load module="mod_xml_ldap"/>
        {{- end }}
        {{- if $.Values.freeswitch.sms.enabled }}
        <load module="mod_sms"/>
        <load module="mod_sms_flowroute"/>
        {{- end }}
        <load module="mod_dialplan_xml"/>
        <load module="mod_dptools"/>
        <load module="mod_tone_stream"/>
        <load module="mod_shout"/>
        <!-- Required by the temporary inbound-call WAV capture. -->
        <load module="mod_sndfile"/>
        <load module="mod_spandsp"/>
        {{- if $.Values.freeswitch.cdr.enabled }}
        <load module="mod_cdr_pg_csv"/>
        {{- end }}
        <load module="mod_commands"/>
        <load module="mod_event_socket"/>
        <load module="mod_opus"/>
      </modules>
    </configuration>

  console.conf.xml: |
    <configuration name="console.conf" description="Console Logger">
      <mappings>
        <map name="all" value="console,debug,info,notice,warning,err,crit,alert"/>
      </mappings>
      <settings>
        <param name="colorize" value="false"/>
        <param name="log_event" value="DEBUG"/>
        <param name="all" value="DEBUG"/>
        <param name="loglevel" value="$${console_loglevel}"/>
      </settings>
    </configuration>

  switch.conf.xml: |
    <configuration name="switch.conf" description="Core Configuration">
      <settings>
        <param name="colorize-console" value="false"/>
        <param name="dialplan-timestamps" value="false"/>
        <param name="max-db-handles" value="50"/>
        <param name="db-handle-timeout" value="10"/>
        <param name="max-sessions" value="1000"/>
        <param name="sessions-per-second" value="30"/>
        <param name="loglevel" value="info"/>
        <param name="rtp-start-port" value="{{ .Values.freeswitch.rtp.min }}"/>
        <param name="rtp-end-port" value="{{ $freeswitchRtpEnd }}"/>
        <param name="rtp-enable-zrtp" value="false"/>
      </settings>
    </configuration>

  logfile.conf.xml: |
    <configuration name="logfile.conf" description="File Logging">
      <settings>
        <param name="rotate-on-hup" value="true"/>
      </settings>
      <profiles>
        <profile name="default">
          <settings>
            <param name="logfile" value="/dev/stdout"/>
            <param name="rollover" value="0"/>
            <param name="uuid" value="true"/>
          </settings>
          <mappings>
            <map name="all" value="console,debug,info,notice,warning,err,crit,alert"/>
          </mappings>
        </profile>
      </profiles>
    </configuration>

  event_socket.conf.xml: |
    <configuration name="event_socket.conf" description="Event Socket">
      <settings>
        <param name="listen-ip" value="127.0.0.1"/>
        <param name="listen-port" value="8021"/>
        <param name="password" value="$${password}"/>
      </settings>
    </configuration>

  cdr_pg_csv.conf.xml: |
    <configuration name="cdr_pg_csv.conf" description="PostgreSQL CDR Format">
      <settings>
        <param name="db-info" value="host={{ $cdrHost }} port={{ $.Values.freeswitch.cdr.port }} dbname=$${username} user=$${username} password=$${password} connect_timeout=10"/>
        <param name="db-table" value="{{ $.Values.freeswitch.cdr.table }}"/>
        <param name="legs" value="{{ $.Values.freeswitch.cdr.legs }}"/>
        <param name="spool-dir" value="/var/log/freeswitch/cdr-pg-csv"/>
        <param name="spool-format" value="csv"/>
        <param name="rotate-on-hup" value="true"/>
      </settings>
      <schema>
        <field var="local_ip_v4" column="local_ip_v4"/>
        <field var="caller_id_name" column="caller_id_name"/>
        <field var="caller_id_number" column="caller_id_number"/>
        <field var="destination_number" column="destination_number"/>
        <field var="context" column="context"/>
        <field var="start_stamp" column="start_stamp"/>
        <field var="answer_stamp" column="answer_stamp"/>
        <field var="end_stamp" column="end_stamp"/>
        <field var="duration" column="duration" quote="false"/>
        <field var="billsec" column="billsec" quote="false"/>
        <field var="hangup_cause" column="hangup_cause"/>
        <field var="uuid" column="uuid"/>
        <field var="bleg_uuid" column="bleg_uuid"/>
        <field var="accountcode" column="accountcode"/>
        <field var="read_codec" column="read_codec"/>
        <field var="write_codec" column="write_codec"/>
      </schema>
    </configuration>

  spandsp.conf.xml: |
    <configuration name="spandsp.conf" description="SpanDSP config">
      <fax-settings>
        <param name="use-ecm" value="true"/>
        <param name="verbose" value="false"/>
        <param name="enable-t38" value="true"/>
        <param name="enable-t38-request" value="true"/>
        <param name="ident" value="{{ $.Values.freeswitch.fax.ident }}"/>
        <param name="header" value="{{ $.Values.freeswitch.fax.header }}"/>
        <param name="spool-dir" value="{{ $.Values.freeswitch.fax.spoolPath }}"/>
        <param name="file-prefix" value="faxrx"/>
      </fax-settings>
    </configuration>

  acl.conf.xml: |
    <configuration name="acl.conf" description="Network Lists">
      <network-lists>
        <list name="asterisk" default="deny">
          <node type="allow" cidr="10.0.0.0/8"/>
          <node type="allow" cidr="172.16.0.0/12"/>
        </list>
      <list name="flowroute" default="deny">
        {{- range $.Values.flowroute.signalingCIDRs }}
        <node type="allow" cidr="{{ . }}"/>
        {{- end }}
      </list>
      <list name="kamailio" default="deny">
        <node type="allow" cidr="10.0.0.0/8"/>
        <node type="allow" cidr="172.16.0.0/12"/>
        <node type="allow" cidr="{{ $.Values.freeswitch.publicExposure.podCIDR }}"/>
      </list>
      </network-lists>
    </configuration>

  sofia.conf.xml: |
    <configuration name="sofia.conf" description="Sofia Endpoint">
      <global_settings>
        <param name="log-level" value="0"/>
        <param name="debug-presence" value="0"/>
        {{- if and .Values.freeswitch.homer.sipCapture (ne (include "avoip.homer.enabled" . | trim) "") }}
        <param name="capture-server" value="udp:{{ $fullName }}-homer-heplify.{{ .Release.Namespace }}.svc.{{ default "cluster.local" .Values.cluster.domain }}:{{ .Values.homer.capture.hepPort }};hep=3;capture_id=102"/>
        {{- end }}
      </global_settings>
      <profiles>
        <X-PRE-PROCESS cmd="include" data="../sip_profiles/*.xml"/>
      </profiles>
    </configuration>
{{- end }}
