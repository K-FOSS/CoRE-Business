{{- if .Values.freeswitch.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- if and .Values.freeswitch.fax.enabled (le (int .Values.freeswitch.fax.t38.rxReinvitePacketCount) 0) }}
{{- fail "freeswitch.fax.t38.rxReinvitePacketCount must be greater than zero" }}
{{- end }}
{{- if .Values.freeswitch.interSite.enabled }}
{{- if or (not .Values.asterisk.enabled) (not .Values.asterisk.sipCore.enabled) (not (regexMatch "^[0-9]{2,8}$" (toString .Values.freeswitch.interSite.extension))) (ne (toString .Values.freeswitch.interSite.extension) (toString .Values.asterisk.sipCore.inboundVoiceExtension)) (not (regexMatch "^[a-z][a-z0-9-]*$" (toString .Values.freeswitch.interSite.peerName))) }}
{{- fail "freeswitch.interSite requires SIP Core, the configured inboundVoiceExtension, and an inter-site peer name" }}
{{- end }}
{{- end }}
{{- if and .Values.dids.asterisk .Values.dids.ivr (eq (toString .Values.dids.asterisk) (toString .Values.dids.ivr)) }}
{{- fail "dids.asterisk and dids.ivr must identify different inbound destinations" }}
{{- end }}
{{- range $role, $did := .Values.dids }}
{{- if and $did (not (or (regexMatch "^\\+?[0-9]{10,15}$" (toString $did)) (regexMatch "^<path:[A-Za-z0-9_./#-]+>$" (toString $did)))) }}
{{- fail (printf "dids.%s must be a phone number or a Vault-backed placeholder" $role) }}
{{- end }}
{{- end }}
{{- if and .Values.freeswitch.ivr.enabled .Values.dids.ivr }}
{{- if or (lt (int .Values.freeswitch.ivr.attempts) 1) (gt (int .Values.freeswitch.ivr.attempts) 10) (lt (int .Values.freeswitch.ivr.timeoutMs) 1000) (gt (int .Values.freeswitch.ivr.timeoutMs) 30000) (eq (len .Values.freeswitch.ivr.messages) 0) }}
{{- fail "freeswitch.ivr requires 1-10 attempts, a 1000-30000 ms timeout, and at least one example message" }}
{{- end }}
{{- if or (not (regexMatch "^/usr/share/freeswitch/sounds/avoip-shared/[a-z0-9_-]+\\.wav$" (toString .Values.freeswitch.ivr.openingPrompt))) (not (regexMatch "^/usr/share/freeswitch/sounds/avoip-shared/[a-z0-9_-]+\\.wav$" (toString .Values.freeswitch.ivr.menuPrompt))) (not (regexMatch "^/usr/share/freeswitch/sounds/avoip-shared/[a-z0-9_-]+\\.wav$" (toString .Values.freeswitch.ivr.invalidPrompt))) (not (regexMatch "^/usr/share/freeswitch/sounds/avoip-shared/[a-z0-9_-]+\\.wav$" (toString .Values.freeswitch.ivr.exitPrompt))) }}
{{- fail "freeswitch.ivr prompt paths must be WAV files in /usr/share/freeswitch/sounds/avoip-shared" }}
{{- end }}
{{- $ivrDigits := dict -}}
{{- range .Values.freeswitch.ivr.messages }}
{{- if or (not (regexMatch "^[1-9]$" (toString .digit))) (not (regexMatch "^/usr/share/freeswitch/sounds/avoip-shared/[a-z0-9_-]+\\.wav$" (toString .prompt))) }}
{{- fail "each freeswitch.ivr.messages item requires a single DTMF digit and a WAV prompt in the shared sound library" }}
{{- end }}
{{- if hasKey $ivrDigits (toString .digit) }}
{{- fail "freeswitch.ivr.messages DTMF digits must be unique" }}
{{- end }}
{{- $_ := set $ivrDigits (toString .digit) true }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-freeswitch-dialplan-configs

  labels:
    app.kubernetes.io/name: {{ $fullName }}-freeswitch
data:
  public.xml: |
    <include>
      <context name="public">
        {{- if $.Values.freeswitch.interSite.enabled }}
        <extension name="authorized-inter-site-extension">
          <condition field="destination_number" expression="^{{ $.Values.freeswitch.interSite.extension }}$"/>
          <condition field="sip_h_X-Core-InterSite" expression="^{{ $.Values.freeswitch.interSite.peerName }}$">
            <action application="log" data="INFO AVoIP authorized inter-site transfer peer={{ $.Values.freeswitch.interSite.peerName }} extension=${destination_number}"/>
            <action application="ring_ready"/>
            <action application="bridge" data="sofia/gateway/asterisk/${destination_number}"/>
          </condition>
        </extension>
        {{- end }}
        {{- if $.Values.dids.asterisk }}
        <extension name="asterisk-destination-did">
          <condition field="destination_number" expression="^{{ $.Values.dids.asterisk }}$">
            <action application="set" data="outside_call=true"/>
            <action application="log" data="INFO AVoIP Asterisk destination DID ${destination_number}: bridging to the local Asterisk gateway"/>
            <action application="ring_ready"/>
            <action application="bridge" data="sofia/gateway/asterisk/${destination_number}"/>
          </condition>
        </extension>
        {{- end }}
        {{- if and $.Values.freeswitch.ivr.enabled $.Values.dids.ivr }}
        <extension name="sample-ivr-did">
          <condition field="destination_number" expression="^{{ $.Values.dids.ivr }}$">
            <action application="set" data="outside_call=true"/>
            <action application="log" data="INFO AVoIP sample IVR entered destination=${destination_number} caller=${caller_id_number}"/>
            <action application="answer"/>
            <action application="transfer" data="sample-ivr-menu XML sample-ivr"/>
          </condition>
        </extension>
        {{- end }}
        {{- if $.Values.freeswitch.fax.enabled }}
        <extension name="fax-receive">
          <condition field="destination_number" expression="^fax-receive$">
            <action application="log" data="INFO AVoIP fax receive start caller=${caller_id_number} did=${fax_original_destination} uuid=${uuid}"/>
            <!-- The dedicated DID starts with G.711 and may negotiate T.38. -->
            {{- if $.Values.freeswitch.fax.g711Only.enabled }}
            <action application="set" data="fax_enable_t38=false"/>
            <action application="set" data="fax_enable_t38_request=false"/>
            <action application="set" data="fax_verbose=true"/>
            {{- else }}
            <action application="set" data="fax_enable_t38=true"/>
            <action application="set" data="fax_enable_t38_request=true"/>
            {{- end }}
            <action application="set" data="fax_verbose=true"/>
            <action application="set" data="fax_t38_rx_reinvite_packet_count={{ $.Values.freeswitch.fax.t38.rxReinvitePacketCount }}"/>
            <action application="set" data="fax_disable_v17={{ $.Values.freeswitch.fax.t38.disableV17 }}"/>
            <action application="set" data="fax_use_ecm={{ $.Values.freeswitch.fax.t38.useEcm }}"/>
            {{- if $.Values.freeswitch.fax.g711Only.enabled }}
            <action application="set" data="absolute_codec_string=PCMU"/>
            {{- else }}
            <action application="set" data="absolute_codec_string=PCMU,PCMA"/>
            {{- end }}
            <action application="set" data="log_audio_stats_on_hangup=true"/>
            {{- if $.Values.freeswitch.media.diagnostics.callRecording.enabled }}
            <condition field="avoip_audio_recording_started" expression="^$">
              <action application="record_session" data="{{ $.Values.freeswitch.media.diagnostics.callRecording.path }}/${uuid}.wav"/>
              <action application="set" data="avoip_audio_recording_started=true"/>
            </condition>
            {{- end }}
            <action application="set" data="execute_on_media=log INFO AVoIP RTP media established"/>
            <action application="log" data="INFO AVoIP fax parameters uuid=${uuid} call_id=${sip_call_id} caller=${caller_id_number} did=${fax_original_destination} local=${local_media_ip}:${local_media_port} remote=${remote_media_ip}:${remote_media_port} read_codec=${read_codec} write_codec=${write_codec} t38=${fax_t38_status} rx_reinvite_packets=${fax_t38_rx_reinvite_packet_count} enable_t38=${fax_enable_t38} enable_t38_request=${fax_enable_t38_request} disable_v17=${fax_disable_v17} use_ecm=${fax_use_ecm}"/>
            <!-- Send provisional ringback before answering the fax endpoint. -->
            <action application="ring_ready"/>
            <action application="answer"/>
            <action application="set_media_stats"/>
            <action application="log" data="INFO AVoIP RTP before rxfax uuid=${uuid} call_id=${sip_call_id} local=${local_media_ip}:${local_media_port} remote=${remote_media_ip}:${remote_media_port} read_codec=${read_codec} write_codec=${write_codec} negotiated_codec=${rtp_use_codec_string} t38=${fax_t38_status} in_packets=${rtp_audio_in_packet_count} out_packets=${rtp_audio_out_packet_count} in_bytes=${rtp_audio_in_media_bytes} out_bytes=${rtp_audio_out_media_bytes}"/>
            <action application="rxfax" data="{{ $.Values.freeswitch.fax.spoolPath }}/${uuid}.tif"/>
            <action application="set_media_stats"/>
            <action application="log" data="INFO AVoIP RTP after rxfax uuid=${uuid} call_id=${sip_call_id} local=${local_media_ip}:${local_media_port} remote=${remote_media_ip}:${remote_media_port} read_codec=${read_codec} write_codec=${write_codec} negotiated_codec=${rtp_use_codec_string} t38=${fax_t38_status} in_packets=${rtp_audio_in_packet_count} out_packets=${rtp_audio_out_packet_count} in_bytes=${rtp_audio_in_media_bytes} out_bytes=${rtp_audio_out_media_bytes}"/>
            <action application="log" data="INFO AVoIP fax result uuid=${uuid} call_id=${sip_call_id} caller=${caller_id_number} did=${fax_original_destination} success=${fax_success} result_code=${fax_result_code} result=${fax_result_text} t38=${fax_t38_status} ecm=${fax_ecm_status} pages=${fax_document_transferred_pages} total_pages=${fax_document_total_pages} remote_station=${fax_remote_station_id} rate=${fax_transfer_rate} resolution=${fax_image_resolution} file={{ $.Values.freeswitch.fax.spoolPath }}/${uuid}.tif fax_filename=${fax_filename} in_packets=${rtp_audio_in_packet_count} out_packets=${rtp_audio_out_packet_count} in_bytes=${rtp_audio_in_media_bytes} out_bytes=${rtp_audio_out_media_bytes}"/>
            <action application="hangup"/>
          </condition>
        </extension>
        {{- end }}
        <extension name="flowroute-rendezvous">
          <condition field="destination_number" expression="^flowroute$">
            <!-- Flowroute uses flowroute@sip.resolvemy.host as the rendezvous
                 user; route the DID carried in the To URI into the normal
                 voice or dedicated fax extension. -->
            <action application="set" data="called_did=${sip_to_user}"/>
            <action application="set" data="called_did=${regex(${called_did}|^\+?([0-9]+)$|%1)}"/>
            <action application="log" data="INFO Flowroute called DID normalized to ${called_did}"/>
            <action application="transfer" data="${called_did} XML public"/>
            <action application="log" data="WARNING AVoIP rejecting Flowroute rendezvous with unsupported To user ${sip_to_user}"/>
            <action application="hangup" data="CALL_REJECTED"/>
          </condition>
        </extension>
        <extension name="reject-unmatched-public-destination">
          <condition field="destination_number" expression="^.+$">
            <action application="log" data="WARNING AVoIP rejecting unmatched public destination ${destination_number}; outbound FreeSWITCH calling is disabled"/>
            <action application="hangup" data="CALL_REJECTED"/>
          </condition>
        </extension>
      </context>
      {{- if and $.Values.freeswitch.ivr.enabled $.Values.dids.ivr }}
      <context name="sample-ivr">
        <extension name="sample-ivr-menu">
          <condition field="destination_number" expression="^sample-ivr-menu$">
            <action application="playback" data="{{ $.Values.freeswitch.ivr.openingPrompt }}"/>
            <action application="play_and_get_digits" data="1 1 {{ $.Values.freeswitch.ivr.attempts }} {{ $.Values.freeswitch.ivr.timeoutMs }} # {{ $.Values.freeswitch.ivr.menuPrompt }} {{ $.Values.freeswitch.ivr.invalidPrompt }} ivr_choice ^[0-9]$"/>
            <action application="transfer" data="${ivr_choice} XML sample-ivr"/>
          </condition>
        </extension>
        {{- range $.Values.freeswitch.ivr.messages }}
        <extension name="example-message-{{ .digit }}">
          <condition field="destination_number" expression="^{{ .digit }}$">
            <action application="log" data="INFO AVoIP sample IVR message selected digit={{ .digit }}"/>
            <action application="playback" data="{{ .prompt }}"/>
            <action application="transfer" data="sample-ivr-menu XML sample-ivr"/>
          </condition>
        </extension>
        {{- end }}
        <extension name="sample-ivr-exit">
          <condition field="destination_number" expression="^0$">
            <action application="playback" data="{{ $.Values.freeswitch.ivr.exitPrompt }}"/>
            <action application="hangup"/>
          </condition>
        </extension>
        <extension name="sample-ivr-invalid-digit">
          <condition field="destination_number" expression="^[1-9]$">
            <action application="playback" data="{{ $.Values.freeswitch.ivr.invalidPrompt }}"/>
            <action application="transfer" data="sample-ivr-menu XML sample-ivr"/>
          </condition>
        </extension>
        <extension name="sample-ivr-invalid">
          <condition field="destination_number" expression="^$">
            <action application="hangup" data="NO_USER_RESPONSE"/>
          </condition>
        </extension>
      </context>
      {{- end }}
    </include>

  asterisk.xml: |
    <include>
      <context name="from-asterisk">
        {{- if and $.Values.asterisk.enabled $.Values.asterisk.sipCore.enabled }}
        <extension name="gg-audio">
          <condition field="${channel_name}" expression="^sofia/asterisk/"/>
          <condition field="${sip_authorized}" expression="^true$"/>
          <condition field="${sip_auth_username}" expression="^freeswitch$"/>
          <condition field="destination_number" expression="^{{ $.Values.asterisk.sipCore.ggAudioDestination }}$">
            <action application="log" data="INFO AVoIP authenticated Asterisk GG audio start uuid=${uuid} call_id=${sip_call_id} local=${local_media_ip}:${local_media_port} remote=${remote_media_ip}:${remote_media_port} read_codec=${read_codec} write_codec=${write_codec}"/>
            <action application="answer"/>
            {{- if $.Values.asterisk.sipCore.callbackAudioDiagnostics.enabled }}
            <action application="set" data="log_audio_stats_on_hangup=true"/>
            <action application="set_media_stats"/>
            <action application="set" data="execute_on_media=log INFO AVoIP callback RTP established uuid=${uuid} call_id=${sip_call_id} local=${local_media_ip}:${local_media_port} remote=${remote_media_ip}:${remote_media_port} read_codec=${read_codec} write_codec=${write_codec}"/>
            <action application="log" data="INFO AVoIP callback RTP pre-roll uuid=${uuid} lead_in_ms={{ $.Values.asterisk.sipCore.callbackAudioDiagnostics.rtpLeadInMs }} out_packets=${rtp_audio_out_packet_count} out_bytes=${rtp_audio_out_media_bytes}"/>
            {{- if gt (int $.Values.asterisk.sipCore.callbackAudioDiagnostics.rtpLeadInMs) 0 }}
            <action application="playback" data="silence_stream://{{ $.Values.asterisk.sipCore.callbackAudioDiagnostics.rtpLeadInMs }}"/>
            {{- end }}
            {{- end }}
            <action application="log" data="INFO AVoIP callback GG stream begin uuid=${uuid} call_id=${sip_call_id} read_codec=${read_codec} write_codec=${write_codec} out_packets=${rtp_audio_out_packet_count} out_bytes=${rtp_audio_out_media_bytes}"/>
            <action application="playback" data="shout://{{ trimPrefix "http://" (trimPrefix "https://" $.Values.freeswitch.preBridgeAudio.url) }}"/>
            {{- if $.Values.asterisk.sipCore.callbackAudioDiagnostics.enabled }}
            <action application="set_media_stats"/>
            <action application="log" data="INFO AVoIP callback GG stream complete uuid=${uuid} call_id=${sip_call_id} read_codec=${read_codec} write_codec=${write_codec} out_packets=${rtp_audio_out_packet_count} out_bytes=${rtp_audio_out_media_bytes}"/>
            {{- end }}
            <action application="hangup"/>
          </condition>
        </extension>
        {{- end }}
        <!-- Add other site-specific destinations and transfer scripts here. -->
      </context>
    </include>

  default.xml: |
    <include>
      <context name="default"/>
    </include>
{{- end }}
