{{- if .Values.freeswitch.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- $voicemailEnabled := or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled -}}
{{- $voicemailAccessCode := default .Values.freeswitch.voicemail.accessCode .Values.asterisk.voicemail.accessCode -}}
{{- if and .Values.freeswitch.fax.enabled (le (int .Values.freeswitch.fax.t38.rxReinvitePacketCount) 0) }}
{{- fail "freeswitch.fax.t38.rxReinvitePacketCount must be greater than zero" }}
{{- end }}
{{- if and .Values.freeswitch.fax.enabled .Values.fax.did (eq (toString .Values.fax.did) (toString .Values.avoip.did)) }}
{{- fail "fax.did must differ from avoip.did" }}
{{- end }}
{{- if .Values.freeswitch.interSite.enabled }}
{{- if or (not .Values.asterisk.enabled) (not .Values.asterisk.sipCore.enabled) (not (regexMatch "^[0-9]{2,8}$" (toString .Values.freeswitch.interSite.extension))) (ne (toString .Values.freeswitch.interSite.extension) (toString .Values.asterisk.sipCore.inboundVoiceExtension)) (not (regexMatch "^[a-z][a-z0-9-]*$" (toString .Values.freeswitch.interSite.peerName))) }}
{{- fail "freeswitch.interSite requires SIP Core, the configured inboundVoiceExtension, and an inter-site peer name" }}
{{- end }}
{{- if and .Values.freeswitch.ivr.enabled (or (not (regexMatch "^[0-9]{2,8}$" (toString .Values.freeswitch.interSite.ivrExtension))) (eq (toString .Values.freeswitch.interSite.ivrExtension) (toString .Values.freeswitch.interSite.extension))) }}
{{- fail "freeswitch.interSite.ivrExtension must be a distinct numeric ingress extension when inter-site IVR routing is enabled" }}
{{- end }}
{{- if and $.Values.freeswitch.ivr.enabled $.Values.freeswitch.interSite.ivrExtension }}
{{- if or (not (regexMatch "^[0-9]+$" (toString $.Values.freeswitch.interSite.ivrAnswerDelayMs))) (gt (int $.Values.freeswitch.interSite.ivrAnswerDelayMs) 60000) }}
{{- fail "freeswitch.interSite.ivrAnswerDelayMs must be an integer from 0 through 60000" }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.freeswitch.ivr.enabled }}
{{- if or (not .Values.asterisk.enabled) (and (not .Values.asterisk.sipCore.enabled) (not .Values.asterisk.voicemail.enabled)) (eq (len .Values.freeswitch.ivr.extensions) 0) (lt (int .Values.freeswitch.ivr.timeoutMs) 1000) (gt (int .Values.freeswitch.ivr.timeoutMs) 60000) (lt (int .Values.freeswitch.ivr.digitTimeoutMs) 500) (gt (int .Values.freeswitch.ivr.digitTimeoutMs) 5000) }}
{{- fail "freeswitch.ivr requires SIP Core or Asterisk voicemail, at least one permitted extension, a 1000-60000 ms input timeout, and a 500-5000 ms digit timeout" }}
{{- end }}
{{- if and $voicemailEnabled (not (regexMatch "^\\*[0-9]{2,4}$" $voicemailAccessCode)) }}
{{- fail "enabled voicemail requires an access code of * followed by two to four digits" }}
{{- end }}
{{- $ivrExtensions := dict -}}
{{- range .Values.freeswitch.ivr.extensions }}
{{- $extension := toString . -}}
{{- if not (regexMatch "^[0-9]{2,8}$" $extension) }}
{{- fail "freeswitch.ivr.extensions must contain numeric extensions from 2 to 8 digits" }}
{{- end }}
{{- if hasKey $ivrExtensions $extension }}
{{- fail "freeswitch.ivr.extensions must be unique" }}
{{- end }}
{{- $_ := set $ivrExtensions $extension true }}
{{- $authorized := or (eq $extension (toString $.Values.asterisk.sipCore.inboundVoiceExtension)) (and $.Values.asterisk.voicemail.enabled (eq $extension (toString (default $.Values.asterisk.sipCore.inboundVoiceExtension $.Values.asterisk.voicemail.mailbox)))) (eq $extension (toString $.Values.asterisk.sipCore.echoExtension)) (eq $extension (toString $.Values.asterisk.sipCore.ggAudioExtension)) (and $.Values.asterisk.sipCore.enabled (eq $extension (toString $.Values.asterisk.sipCore.soundClipExtension))) (eq $extension (toString $.Values.asterisk.sipCore.helloCallbackExtension)) -}}
{{- range $.Values.asterisk.sipCore.extensions }}
{{- if eq $extension (toString .number) }}{{- $authorized = true }}{{- end }}
{{- end }}
{{- if not $authorized }}
{{- fail (printf "freeswitch.ivr.extensions destination %s is not a configured Asterisk SIP Core destination" $extension) }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-freeswitch-dialplan-configs

  labels:
    app.kubernetes.io/name: {{ $fullName }}-freeswitch
data:
  public.xml: |
    <include>
      {{- if and .Values.avoipAdmin.enabled .Values.avoipAdmin.routing.enabled }}
      <context name="core-managed-entry">
        <extension name="managed-entry">
          <condition field="${channel_name}" expression="^sofia/core-managed/"/>
          <condition field="${sip_h_X-Core-Extension}" expression="^[0-9]{2,12}$">
            <action application="transfer" data="${destination_number} XML core-managed-outbound"/>
            <anti-action application="transfer" data="${destination_number} XML core-managed-inbound"/>
          </condition>
        </extension>
      </context>
      {{- end }}
      <context name="public">
        {{- if and $.Values.avoipAdmin.enabled $.Values.avoipAdmin.routing.enabled }}
        <extension name="bridged-call-callback">
          <condition field="destination_number" expression="^bridged-call-callback$">
            <action application="answer"/>
            <action application="set" data="hangup_after_bridge=true"/>
            <action application="set" data="bridge_early_media=false"/>
            <action application="set" data="bridged_call_stage=awaiting_confirmation"/>
            <condition field="${bridged_confirmation_required}" expression="^true$">
              <action application="play_and_get_digits" data="1 1 1 {{ $.Values.avoipAdmin.bridgedCalls.confirmationTimeoutSeconds }}000 '' silence_stream://1000 silence_stream://1000 bridged_call_confirmation ^1$ 1000"/>
              <action application="transfer" data="bridged-call-confirmed XML public"/>
            </condition>
            <condition field="${bridged_confirmation_required}" expression="^false$">
              <action application="set" data="bridged_call_stage=calling_extension"/>
              <action application="set" data="bridge_answer_timeout={{ $.Values.avoipAdmin.bridgedCalls.extensionRingTimeoutSeconds }}"/>
              <action application="sched_hangup" data="+{{ $.Values.avoipAdmin.bridgedCalls.maximumDurationSeconds }} NORMAL_CLEARING"/>
              <action application="export" data="nolocal:api_on_answer=uuid_setvar ${uuid} bridged_call_stage connected"/>
              <action application="bridge" data="${bridged_call_target}"/>
            </condition>
          </condition>
        </extension>
        <extension name="bridged-call-confirmed">
          <condition field="destination_number" expression="^bridged-call-confirmed$">
            <condition field="${bridged_call_confirmation}" expression="^1$">
              <action application="set" data="bridged_call_stage=calling_extension"/>
              <action application="set" data="bridge_answer_timeout={{ $.Values.avoipAdmin.bridgedCalls.extensionRingTimeoutSeconds }}"/>
              <action application="sched_hangup" data="+{{ $.Values.avoipAdmin.bridgedCalls.maximumDurationSeconds }} NORMAL_CLEARING"/>
              <action application="export" data="nolocal:api_on_answer=uuid_setvar ${uuid} bridged_call_stage connected"/>
              <action application="bridge" data="${bridged_call_target}"/>
              <anti-action application="hangup" data="NO_USER_RESPONSE"/>
            </condition>
            <anti-action application="hangup" data="NO_USER_RESPONSE"/>
          </condition>
        </extension>
        {{- end }}
        {{- if $.Values.freeswitch.interSite.enabled }}
        <extension name="authorized-inter-site-extension">
          <condition field="destination_number" expression="^{{ $.Values.freeswitch.interSite.extension }}$"/>
          <condition field="${sip_h_X-Core-InterSite}" expression="^{{ $.Values.freeswitch.interSite.peerName }}$">
            <action application="log" data="INFO AVoIP authorized inter-site transfer peer={{ $.Values.freeswitch.interSite.peerName }} extension=${destination_number} uuid=${uuid} call_id=${sip_call_id} backend=asterisk"/>
            <action application="ring_ready"/>
            {{- include "avoip.freeswitch.inboundBridgePolicy" $ | nindent 12 }}
            <action application="bridge" data="sofia/gateway/asterisk/${destination_number}"/>
            {{- include "avoip.freeswitch.inboundBridgeFallback" $ | nindent 12 }}
          </condition>
        </extension>
        {{- if and $.Values.freeswitch.ivr.enabled $.Values.freeswitch.interSite.ivrExtension }}
        <extension name="authorized-inter-site-ivr">
          <condition field="destination_number" expression="^{{ $.Values.freeswitch.interSite.ivrExtension }}$"/>
          <condition field="${sip_h_X-Core-InterSite}" expression="^{{ $.Values.freeswitch.interSite.peerName }}$">
            <action application="log" data="INFO AVoIP authorized inter-site IVR peer={{ $.Values.freeswitch.interSite.peerName }} extension=${destination_number} uuid=${uuid} call_id=${sip_call_id} backend=silent-ivr-entry answer_delay_ms={{ $.Values.freeswitch.interSite.ivrAnswerDelayMs }}"/>
            <action application="ring_ready"/>
            {{- if gt (int $.Values.freeswitch.interSite.ivrAnswerDelayMs) 0 }}
            <!-- Signal ringing while the channel waits; the shared IVR answers
                 after the delay. Do not pre_answer before that handoff. -->
            <action application="sleep" data="{{ $.Values.freeswitch.interSite.ivrAnswerDelayMs }}"/>
            {{- end }}
            <action application="transfer" data="silent-ivr-entry XML public"/>
          </condition>
        </extension>
        {{- end }}
        {{- end }}
        <extension name="did-post-answer">
          <condition field="destination_number" expression="^did-post-answer$">
            {{- if $.Values.freeswitch.media.diagnostics.enabled }}
            <action application="set" data="log_audio_stats_on_hangup=true"/>
            <action application="set_media_stats"/>
            <action application="log" data="INFO AVoIP inbound media answer uuid=${uuid} call_id=${sip_call_id} local=${local_media_ip}:${local_media_port} remote=${remote_media_ip}:${remote_media_port} read_codec=${read_codec} write_codec=${write_codec} in_packets=${rtp_audio_in_packet_count} out_packets=${rtp_audio_out_packet_count} in_bytes=${rtp_audio_in_media_bytes} out_bytes=${rtp_audio_out_media_bytes}"/>
            {{- end }}
            {{- if $.Values.freeswitch.media.diagnostics.callRecording.enabled }}
            <action application="record_session" data="{{ $.Values.freeswitch.media.diagnostics.callRecording.path }}/${uuid}.wav"/>
            {{- end }}
            {{- if $.Values.freeswitch.preBridgeAudio.enabled }}
            <action application="playback" data="shout://{{ trimPrefix "http://" (trimPrefix "https://" $.Values.freeswitch.preBridgeAudio.url) }}"/>
            {{- end }}
            {{- if and $.Values.freeswitch.fax.enabled $.Values.freeswitch.fax.autoDetect }}
            <action application="log" data="INFO AVoIP managed DID fax detection enabled uuid=${uuid} did=${fax_original_destination}"/>
            <action application="spandsp_start_fax_detect" data="transfer 'fax-receive XML public' 20"/>
            {{- end }}
          </condition>
        </extension>
        {{- if $.Values.freeswitch.ivr.enabled }}
        <extension name="silent-ivr-entry">
          <condition field="destination_number" expression="^silent-ivr-entry$">
            <action application="answer"/>
            <action application="log" data="INFO AVoIP silent extension IVR ready caller=${caller_id_number}"/>
            {{- $ivrDestinations := $.Values.freeswitch.ivr.extensions -}}
            {{- if $.Values.asterisk.sipCore.enabled }}
            {{- $ivrDestinations = uniq (append $ivrDestinations (toString $.Values.asterisk.sipCore.soundClipExtension)) -}}
            {{- end }}
            {{- $ivrPattern := join "|" $ivrDestinations -}}
            {{- if $voicemailEnabled }}
            {{- $voicemailDigits := trimPrefix "*" $voicemailAccessCode -}}
            {{- $ivrPattern = printf "%s|%s|\\%s" $ivrPattern $voicemailDigits $voicemailAccessCode -}}
            {{- end }}
            <action application="play_and_get_digits" data="2 8 1 {{ $.Values.freeswitch.ivr.timeoutMs }} # {{ $.Values.freeswitch.ivr.greeting }} silence_stream://1000 ivr_extension ^({{ $ivrPattern }})$ {{ $.Values.freeswitch.ivr.digitTimeoutMs }}"/>
            <action application="transfer" data="${ivr_extension} XML silent-ivr-targets"/>
          </condition>
        </extension>
        <extension name="silent-ivr-invalid">
          <condition field="destination_number" expression="^$">
            <action application="log" data="INFO AVoIP silent extension IVR received no valid destination caller=${caller_id_number}"/>
            <action application="hangup" data="NO_USER_RESPONSE"/>
          </condition>
        </extension>
        {{- end }}
        {{- if $.Values.freeswitch.fax.enabled }}
        <extension name="fax-receive">
          <condition field="destination_number" expression="^fax-receive$">
            <action application="log" data="INFO AVoIP fax receive start caller=${caller_id_number} did=${fax_original_destination} uuid=${uuid}"/>
            <!-- The dedicated DID starts with G.711 and may negotiate T.38. -->
            {{- if $.Values.freeswitch.fax.g711Only.enabled }}
            <action application="set" data="fax_enable_t38=false"/>
            <action application="set" data="fax_enable_t38_request=false"/>
            <action application="set" data="fax_verbose=true"/>
            {{- else }}
            <action application="set" data="fax_enable_t38=true"/>
            <action application="set" data="fax_enable_t38_request=true"/>
            {{- end }}
            <action application="set" data="fax_verbose=true"/>
            <action application="set" data="fax_t38_rx_reinvite_packet_count={{ $.Values.freeswitch.fax.t38.rxReinvitePacketCount }}"/>
            <action application="set" data="fax_disable_v17={{ $.Values.freeswitch.fax.t38.disableV17 }}"/>
            <action application="set" data="fax_use_ecm={{ $.Values.freeswitch.fax.t38.useEcm }}"/>
            {{- if $.Values.freeswitch.fax.g711Only.enabled }}
            <action application="set" data="absolute_codec_string=PCMU"/>
            {{- else }}
            <action application="set" data="absolute_codec_string=PCMU,PCMA"/>
            {{- end }}
            <action application="set" data="log_audio_stats_on_hangup=true"/>
            {{- if $.Values.freeswitch.media.diagnostics.callRecording.enabled }}
            <condition field="avoip_audio_recording_started" expression="^$">
              <action application="record_session" data="{{ $.Values.freeswitch.media.diagnostics.callRecording.path }}/${uuid}.wav"/>
              <action application="set" data="avoip_audio_recording_started=true"/>
            </condition>
            {{- end }}
            <action application="set" data="execute_on_media=log INFO AVoIP RTP media established"/>
            <action application="log" data="INFO AVoIP fax parameters uuid=${uuid} call_id=${sip_call_id} caller=${caller_id_number} did=${fax_original_destination} local=${local_media_ip}:${local_media_port} remote=${remote_media_ip}:${remote_media_port} read_codec=${read_codec} write_codec=${write_codec} t38=${fax_t38_status} rx_reinvite_packets=${fax_t38_rx_reinvite_packet_count} enable_t38=${fax_enable_t38} enable_t38_request=${fax_enable_t38_request} disable_v17=${fax_disable_v17} use_ecm=${fax_use_ecm}"/>
            <!-- Send provisional ringback before answering the fax endpoint. -->
            <action application="ring_ready"/>
            <action application="answer"/>
            <action application="set_media_stats"/>
            <action application="log" data="INFO AVoIP RTP before rxfax uuid=${uuid} call_id=${sip_call_id} local=${local_media_ip}:${local_media_port} remote=${remote_media_ip}:${remote_media_port} read_codec=${read_codec} write_codec=${write_codec} negotiated_codec=${rtp_use_codec_string} t38=${fax_t38_status} in_packets=${rtp_audio_in_packet_count} out_packets=${rtp_audio_out_packet_count} in_bytes=${rtp_audio_in_media_bytes} out_bytes=${rtp_audio_out_media_bytes}"/>
            <action application="rxfax" data="{{ $.Values.freeswitch.fax.spoolPath }}/${uuid}.tif"/>
            <action application="set_media_stats"/>
            <action application="log" data="INFO AVoIP RTP after rxfax uuid=${uuid} call_id=${sip_call_id} local=${local_media_ip}:${local_media_port} remote=${remote_media_ip}:${remote_media_port} read_codec=${read_codec} write_codec=${write_codec} negotiated_codec=${rtp_use_codec_string} t38=${fax_t38_status} in_packets=${rtp_audio_in_packet_count} out_packets=${rtp_audio_out_packet_count} in_bytes=${rtp_audio_in_media_bytes} out_bytes=${rtp_audio_out_media_bytes}"/>
            <action application="log" data="INFO AVoIP fax result uuid=${uuid} call_id=${sip_call_id} caller=${caller_id_number} did=${fax_original_destination} success=${fax_success} result_code=${fax_result_code} result=${fax_result_text} t38=${fax_t38_status} ecm=${fax_ecm_status} pages=${fax_document_transferred_pages} total_pages=${fax_document_total_pages} remote_station=${fax_remote_station_id} rate=${fax_transfer_rate} resolution=${fax_image_resolution} file={{ $.Values.freeswitch.fax.spoolPath }}/${uuid}.tif fax_filename=${fax_filename} in_packets=${rtp_audio_in_packet_count} out_packets=${rtp_audio_out_packet_count} in_bytes=${rtp_audio_in_media_bytes} out_bytes=${rtp_audio_out_media_bytes}"/>
            <action application="hangup"/>
          </condition>
        </extension>
        {{- end }}
        <extension name="reject-unmatched-public-destination">
          <condition field="destination_number" expression="^.+$">
            <action application="log" data="WARNING AVoIP rejecting unmatched public destination=${destination_number} uuid=${uuid} call_id=${sip_call_id} profile=${sofia_profile_name} context=${context} request_uri=${sip_req_uri} to_user=${sip_to_user} inter_site_marker=${sip_h_X-Core-InterSite} source=${sip_network_ip}"/>
            <action application="hangup" data="CALL_REJECTED"/>
          </condition>
        </extension>
      </context>
      {{- if $.Values.freeswitch.ivr.enabled }}
      <context name="silent-ivr-targets">
        {{- if $voicemailEnabled }}
        <extension name="silent-ivr-voicemail">
          <condition field="destination_number" expression="^(\*{{ trimPrefix "*" $voicemailAccessCode }}|{{ trimPrefix "*" $voicemailAccessCode }})$">
            <action application="log" data="INFO AVoIP silent IVR forwarding caller=${caller_id_number} to Asterisk voicemail access code {{ $voicemailAccessCode }}"/>
            <action application="set" data="hangup_after_bridge=true"/>
            {{- include "avoip.freeswitch.inboundBridgePolicy" $ | nindent 12 }}
            <action application="bridge" data="sofia/gateway/asterisk/{{ $voicemailAccessCode }}"/>
            {{- include "avoip.freeswitch.inboundBridgeFallback" $ | nindent 12 }}
            <action application="hangup"/>
          </condition>
        </extension>
        {{- end }}
        {{- range $.Values.freeswitch.ivr.extensions }}
        <extension name="silent-ivr-destination-{{ . }}">
          <condition field="destination_number" expression="^{{ . }}$">
            {{- if eq (toString .) (toString $.Values.asterisk.sipCore.ggAudioExtension) }}
            <action application="log" data="INFO AVoIP silent IVR playing GG audio and hanging up caller=${caller_id_number}"/>
            <action application="answer"/>
            <action application="playback" data="shout://{{ trimPrefix "http://" (trimPrefix "https://" $.Values.freeswitch.preBridgeAudio.url) }}"/>
            <action application="hangup" data="NORMAL_CLEARING"/>
            {{- else if and $.Values.asterisk.sipCore.enabled (eq (toString .) (toString $.Values.asterisk.sipCore.soundClipExtension)) }}
            <action application="log" data="INFO AVoIP silent IVR playing sound clip caller=${caller_id_number}"/>
            <action application="answer"/>
            <action application="playback" data="shout://{{ trimPrefix "http://" (trimPrefix "https://" $.Values.freeswitch.soundClip.url) }}"/>
            <action application="hangup" data="NORMAL_CLEARING"/>
            {{- else if eq (toString .) (toString $.Values.asterisk.sipCore.helloCallbackExtension) }}
            <!-- Asterisk intentionally clears this inbound leg after it has
                 accepted the callback request and started the return call.
                 Do not turn that expected teardown into the generic GG error. -->
            <action application="log" data="INFO AVoIP silent IVR handing callback request to Asterisk uuid=${uuid} call_id=${sip_call_id}"/>
            <action application="set" data="hangup_after_bridge=true"/>
            {{- include "avoip.freeswitch.inboundBridgePolicy" $ | nindent 12 }}
            <action application="bridge" data="sofia/gateway/asterisk/${destination_number}"/>
            <action application="hangup" data="NORMAL_CLEARING"/>
            {{- else }}
            <action application="log" data="INFO AVoIP silent IVR forwarding caller=${caller_id_number} to local Asterisk destination=${destination_number}"/>
            <action application="set" data="hangup_after_bridge=true"/>
            {{- include "avoip.freeswitch.inboundBridgePolicy" $ | nindent 12 }}
            <action application="bridge" data="sofia/gateway/asterisk/${destination_number}"/>
            {{- include "avoip.freeswitch.inboundBridgeFallback" $ | nindent 12 }}
            <action application="hangup"/>
            {{- end }}
          </condition>
        </extension>
        {{- end }}
        {{- if and $.Values.asterisk.sipCore.enabled (not (has (toString $.Values.asterisk.sipCore.soundClipExtension) $.Values.freeswitch.ivr.extensions)) }}
        <extension name="silent-ivr-sound-clip">
          <condition field="destination_number" expression="^{{ $.Values.asterisk.sipCore.soundClipExtension }}$">
            <action application="log" data="INFO AVoIP silent IVR playing sound clip caller=${caller_id_number}"/>
            <action application="answer"/>
            <action application="playback" data="shout://{{ trimPrefix "http://" (trimPrefix "https://" $.Values.freeswitch.soundClip.url) }}"/>
            <action application="hangup" data="NORMAL_CLEARING"/>
          </condition>
        </extension>
        {{- end }}
        <extension name="silent-ivr-invalid-destination">
          <condition field="destination_number" expression="^$">
            <action application="log" data="INFO AVoIP silent IVR ended without a valid extension caller=${caller_id_number}"/>
            <action application="hangup" data="NO_USER_RESPONSE"/>
          </condition>
        </extension>
      </context>
      {{- end }}
    </include>

  asterisk.xml: |
    <include>
      <context name="from-asterisk">
        {{- if and $.Values.asterisk.enabled $.Values.asterisk.sipCore.enabled }}
        <extension name="gg-audio">
          <condition field="${channel_name}" expression="^sofia/asterisk/"/>
          <condition field="${sip_authorized}" expression="^true$"/>
          <condition field="${sip_auth_username}" expression="^freeswitch$"/>
          <condition field="destination_number" expression="^{{ $.Values.asterisk.sipCore.ggAudioDestination }}$">
            <action application="log" data="INFO AVoIP authenticated Asterisk GG audio start uuid=${uuid} call_id=${sip_call_id} local=${local_media_ip}:${local_media_port} remote=${remote_media_ip}:${remote_media_port} read_codec=${read_codec} write_codec=${write_codec}"/>
            <action application="answer"/>
            {{- if $.Values.asterisk.sipCore.callbackAudioDiagnostics.enabled }}
            <action application="set" data="log_audio_stats_on_hangup=true"/>
            <action application="set_media_stats"/>
            <action application="set" data="execute_on_media=log INFO AVoIP callback RTP established uuid=${uuid} call_id=${sip_call_id} local=${local_media_ip}:${local_media_port} remote=${remote_media_ip}:${remote_media_port} read_codec=${read_codec} write_codec=${write_codec}"/>
            <action application="log" data="INFO AVoIP callback RTP pre-roll uuid=${uuid} lead_in_ms={{ $.Values.asterisk.sipCore.callbackAudioDiagnostics.rtpLeadInMs }} out_packets=${rtp_audio_out_packet_count} out_bytes=${rtp_audio_out_media_bytes}"/>
            {{- if gt (int $.Values.asterisk.sipCore.callbackAudioDiagnostics.rtpLeadInMs) 0 }}
            <action application="playback" data="silence_stream://{{ $.Values.asterisk.sipCore.callbackAudioDiagnostics.rtpLeadInMs }}"/>
            {{- end }}
            {{- end }}
            <action application="log" data="INFO AVoIP callback GG stream begin uuid=${uuid} call_id=${sip_call_id} read_codec=${read_codec} write_codec=${write_codec} out_packets=${rtp_audio_out_packet_count} out_bytes=${rtp_audio_out_media_bytes}"/>
            <action application="playback" data="shout://{{ trimPrefix "http://" (trimPrefix "https://" $.Values.freeswitch.preBridgeAudio.url) }}"/>
            {{- if $.Values.asterisk.sipCore.callbackAudioDiagnostics.enabled }}
            <action application="set_media_stats"/>
            <action application="log" data="INFO AVoIP callback GG stream complete uuid=${uuid} call_id=${sip_call_id} read_codec=${read_codec} write_codec=${write_codec} out_packets=${rtp_audio_out_packet_count} out_bytes=${rtp_audio_out_media_bytes}"/>
            {{- end }}
            <action application="hangup"/>
          </condition>
        </extension>
        <extension name="clang-audio">
          <condition field="${channel_name}" expression="^sofia/asterisk/"/>
          <condition field="${sip_authorized}" expression="^true$"/>
          <condition field="${sip_auth_username}" expression="^freeswitch$"/>
          <condition field="destination_number" expression="^{{ $.Values.asterisk.sipCore.soundClipDestination }}$">
            <action application="log" data="INFO AVoIP authenticated sound clip playback start uuid=${uuid} call_id=${sip_call_id}"/>
            <action application="answer"/>
            <action application="playback" data="shout://{{ trimPrefix "http://" (trimPrefix "https://" $.Values.freeswitch.soundClip.url) }}"/>
            <action application="hangup" data="NORMAL_CLEARING"/>
          </condition>
        </extension>
        {{- end }}
        <!-- Add other site-specific destinations and transfer scripts here. -->
      </context>
    </include>

  default.xml: |
    <include>
      <context name="default"/>
    </include>
{{- end }}
