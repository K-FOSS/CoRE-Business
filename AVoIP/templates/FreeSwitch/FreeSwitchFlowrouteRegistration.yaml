{{- if and .Values.freeswitch.enabled .Values.freeswitch.flowrouteOutbound.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- $privateComponent := include "avoip.kamailio.component" (dict "name" .Values.asterisk.sipCore.kamailioInstance) -}}
{{- $kamailioHost := include "avoip.sip.serviceHost" (dict "root" . "component" $privateComponent) -}}
{{- if not (regexMatch "^[a-z0-9.-]+$" (toString .Values.freeswitch.flowrouteOutbound.regionalHost)) -}}
  {{- fail "freeswitch.flowrouteOutbound.regionalHost must be a regional Flowroute SIP hostname" -}}
{{- end -}}
{{- if or (not .Values.asterisk.enabled) (not .Values.freeswitch.highAvailability.enabled) -}}
  {{- fail "Flowroute registration requires Asterisk and FreeSWITCH high availability" -}}
{{- end -}}
{{- if lt (int .Values.freeswitch.highAvailability.replicas) 2 -}}
  {{- fail "freeswitch.highAvailability.replicas must be at least 2 for Flowroute HA" -}}
{{- end -}}
{{- if lt (int .Values.freeswitch.highAvailability.minAvailable) 1 -}}
  {{- fail "freeswitch.highAvailability.minAvailable must be at least 1 for Flowroute HA" -}}
{{- end -}}
{{- if or (lt (int .Values.freeswitch.flowrouteOutbound.tlsPort) 1024) (gt (int .Values.freeswitch.flowrouteOutbound.tlsPort) 65535) -}}
  {{- fail "freeswitch.flowrouteOutbound.tlsPort must be a TCP port from 1024 through 65535" -}}
{{- end -}}
{{- if or (eq (int .Values.freeswitch.flowrouteOutbound.tlsPort) (int .Values.freeswitch.publicExposure.kamailio.backendPort)) (eq (int .Values.freeswitch.flowrouteOutbound.tlsPort) (int .Values.freeswitch.asterisk.tlsPort)) -}}
  {{- fail "freeswitch.flowrouteOutbound.tlsPort must differ from the Kamailio and Asterisk FreeSWITCH listeners" -}}
{{- end -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $fullName }}-freeswitch-flowroute'
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: '1h'
  secretStoreRef:
    kind: '{{ .Values.freeswitch.flowrouteOutbound.secretStoreRef.kind }}'
    name: '{{ .Values.freeswitch.flowrouteOutbound.secretStoreRef.name }}'
  target:
    name: '{{ $fullName }}-freeswitch-flowroute'
    creationPolicy: 'Owner'
    template:
      engineVersion: v2
      data:
        flowroute.xml: |
          <profile name="flowroute">
            <gateways>
              {{- if and .Values.avoipAdmin.enabled .Values.avoipAdmin.upstreams }}
              <X-PRE-PROCESS cmd="include" data="/etc/freeswitch/upstreams/*.xml"/>
              {{- end }}
              <gateway name="flowroute">
                <param name="username" value="{{ `{{ .username }}` }}"/>
                <param name="auth-username" value="{{ `{{ .username }}` }}"/>
                <param name="password" value="{{ `{{ .password }}` }}"/>
                <param name="proxy" value="{{ $.Values.freeswitch.flowrouteOutbound.regionalHost }}"/>
                <param name="register-proxy" value="{{ $.Values.freeswitch.flowrouteOutbound.regionalHost }}"/>
                <param name="register-transport" value="udp"/>
                <param name="expire-seconds" value="600"/>
                <param name="register" value="true"/>
                <param name="retry-seconds" value="30"/>
                <param name="ping" value="25"/>
                <param name="caller-id-in-from" value="true"/>
                <param name="outbound-proxy" value="sips:{{ $kamailioHost }}:5062;transport=tls"/>
              </gateway>
              <!-- Keep registration transport explicit for the Flowroute
                   SIP-REG inbound route. Outbound calls use the separate
                   TLS-only gateway below so their Contact advertises the
                   listener that carrier Kamailio can reach. -->
              <gateway name="flowroute-tls">
                <param name="username" value="{{ `{{ .username }}` }}"/>
                <param name="auth-username" value="{{ `{{ .username }}` }}"/>
                <param name="password" value="{{ `{{ .password }}` }}"/>
                <param name="proxy" value="{{ $.Values.freeswitch.flowrouteOutbound.regionalHost }}"/>
                <param name="from-domain" value="{{ include "avoip.sip.siteHost" $ }}"/>
                <param name="register-transport" value="tls"/>
                <param name="register" value="false"/>
                <param name="caller-id-in-from" value="true"/>
                <param name="outbound-proxy" value="sips:{{ $kamailioHost }}:5062;transport=tls"/>
              </gateway>
            </gateways>
            <settings>
              <param name="context" value="public"/>
              <param name="sip-port" value="5080"/>
              <param name="sip-ip" value="$${local_ip_v4}"/>
              <param name="rtp-ip" value="$${local_ip_v4}"/>
              <!-- Keep bridged RTP breaks interruptible so inbound SIP BYE
                   handling is not held until a timerless RTP poll expires. -->
              <param name="rtp-timer-name" value="soft"/>
              <param name="rtp-notimer-during-bridge" value="false"/>
              <!-- Advertise the Flowroute Sofia listener on this owner pod;
                   carrier Kamailio hides this target with TOPOS. -->
              <param name="ext-sip-ip" value="$${local_ip_v4}"/>
              <param name="ext-sip-port" value="{{ $.Values.freeswitch.flowrouteOutbound.tlsPort }}"/>
              <!-- RFC 4733 telephone-event uses the same dynamic payload on
                   this carrier profile as the existing external profile. -->
              <param name="rfc2833-pt" value="101"/>
              <!-- TLS is available for the non-registering outbound gateway;
                   the registered inbound SIP-REG gateway remains UDP. -->
              <param name="tls" value="true"/>
              <param name="tls-only" value="false"/>
              <!-- The registration gateway uses UDP on sip-port. Do not let
                   Sofia create a plain TCP listener that can collide with
                   the TLS owner listener after a profile reload. -->
              <param name="bind-params" value="transport=udp"/>
              <param name="tls-sip-port" value="{{ $.Values.freeswitch.flowrouteOutbound.tlsPort }}"/>
              <!-- Keep the TLS listener URI explicit. The outbound gateway's
                   generated Contact must match this listening transport. -->
              <param name="tls-bind-params" value="transport=tls"/>
              <param name="reuse-connections" value="true"/>
              <param name="tls-cert-dir" value="/etc/freeswitch/tls-flowroute"/>
              <param name="tls-verify-date" value="true"/>
              <param name="tls-verify-policy" value="subjects_out"/>
              <param name="tls-verify-depth" value="3"/>
              <param name="tls-version" value="$${sip_tls_version}"/>
              <param name="tls-ciphers" value="$${sip_tls_ciphers}"/>
            </settings>
          </profile>
  data:
    - secretKey: username
      remoteRef:
        key: '{{ .Values.freeswitch.flowrouteOutbound.remoteRef.key }}'
        property: '{{ .Values.freeswitch.flowrouteOutbound.remoteRef.usernameProperty }}'
    - secretKey: password
      remoteRef:
        key: '{{ .Values.freeswitch.flowrouteOutbound.remoteRef.key }}'
        property: '{{ .Values.freeswitch.flowrouteOutbound.remoteRef.passwordProperty }}'
{{- end }}
