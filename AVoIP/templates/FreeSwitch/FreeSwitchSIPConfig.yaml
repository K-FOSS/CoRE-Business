{{- if .Values.freeswitch.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- if and .Values.asterisk.enabled (or (lt (int .Values.freeswitch.asterisk.tlsPort) 1024) (gt (int .Values.freeswitch.asterisk.tlsPort) 65535)) -}}
{{- fail "freeswitch.asterisk.tlsPort must be a TCP port from 1024 through 65535" -}}
{{- end -}}
{{- if and .Values.asterisk.enabled (eq (int .Values.freeswitch.asterisk.tlsPort) (int .Values.freeswitch.publicExposure.kamailio.backendPort)) -}}
{{- fail "freeswitch.asterisk.tlsPort must differ from freeswitch.publicExposure.kamailio.backendPort" -}}
{{- end -}}
{{- if and .Values.asterisk.enabled (eq (int .Values.freeswitch.asterisk.tlsPort) 5061) -}}
{{- fail "freeswitch.asterisk.tlsPort must differ from the FreeSWITCH public TLS listener on 5061" -}}
{{- end -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-freeswitch-sip-configs

data:
  internal.xml: |
    <!-- The chart-managed asterisk profile owns the internal SIP port. -->
  internal-ipv6.xml: |
    <!-- Disable the image default IPv6 internal profile. -->
  external-ipv6.xml: |
    <!-- Disable the image default IPv6 external profile. -->
  asterisk.xml: |
    <profile name="asterisk">
        {{- if .Values.asterisk.enabled }}
        <gateways>
          <gateway name="asterisk">
            <param name="username" value="freeswitch"/>
            <param name="from-user" value="freeswitch"/>
            <param name="password" value="$${asterisk_peer_password}"/>
            <param name="realm" value="{{ include "avoip.sip.serviceHost" (dict "root" . "component" "asterisk") }}"/>
            <param name="from-domain" value="{{ include "avoip.sip.serviceHost" (dict "root" . "component" "freeswitch") }}"/>
            <param name="proxy" value="{{ include "avoip.sip.serviceHost" (dict "root" . "component" "asterisk") }}:5061;transport=tls"/>
            <param name="register-transport" value="tls"/>
            <param name="register" value="false"/>
            <param name="cid-type" value="pid"/>
            <param name="rfc-5626" value="true"/>
          </gateway>
        </gateways>
        {{- else }}
        <!-- Asterisk peer is disabled for this site. -->
        {{- end }}
        <settings>
            <param name="sip-port" value="5060"/>
            <param name="tls" value="true"/>
            <param name="tls-only" value="true"/>
            <param name="tls-sip-port" value="$${asterisk_tls_port}"/>
            <param name="tls-cert-dir" value="/etc/freeswitch/tls"/>
            <param name="tls-verify-date" value="true"/>
            <param name="tls-verify-policy" value="out"/>
            <param name="tls-verify-depth" value="3"/>
            <param name="auth-calls" value="true"/>
            <param name="sip-trace" value="false"/>
            <param name="context" value="from-asterisk"/>
            <param name="rtp-ip" value="$${local_ip_v4}"/>
            <param name="rtp-timer-name" value="soft"/>
            <param name="rtp-notimer-during-bridge" value="false"/>
            <param name="sip-ip" value="$${local_ip_v4}"/>
            <param name="sip-domain" value="$${private_sip_host}"/>
            <param name="ext-sip-ip" value="host:$${private_sip_host}"/>
            <param name="ext-sip-port" value="$${internal_tls_port}"/>
            <param name="inbound-codec-prefs" value="PCMU"/>
            <param name="outbound-codec-prefs" value="PCMU"/>
        </settings>
    </profile>
  external.xml: |
  {{- if (include "avoip.kamailio.carrier.enabled" . | trim) }}
    <!-- Public SIP terminates at Kamailio; do not start a second edge profile. -->
  {{- else }}
    <profile name="external">
      <gateways>
        <X-PRE-PROCESS cmd="include" data="external/*.xml"/>
      </gateways>
      <aliases>
      </aliases>
      <domains>
        <domain name="all" alias="false" parse="true"/>
      </domains>
      <settings>
        <param name="debug" value="0"/>
        <param name="sip-trace" value="{{ ternary "true" "false" $.Values.freeswitch.sipLogging.enabled }}"/>
        <param name="sip-capture" value="no"/>
        <param name="apply-inbound-acl" value="flowroute"/>
        <param name="rfc2833-pt" value="101"/>
        <param name="sip-port" value="$${external_sip_port}"/>
        <param name="dialplan" value="XML"/>
        <param name="context" value="public"/>
        <param name="dtmf-duration" value="2000"/>
        <param name="inbound-codec-prefs" value="$${global_codec_prefs}"/>
        <param name="outbound-codec-prefs" value="$${outbound_codec_prefs}"/>
        <param name="hold-music" value="$${hold_music}"/>
        <param name="rtp-timer-name" value="soft"/>
        <param name="local-network-acl" value="localnet.auto"/>
        <param name="manage-presence" value="false"/>
        <param name="inbound-codec-negotiation" value="generous"/>
        <param name="nonce-ttl" value="60"/>
        <param name="auth-calls" value="false"/>
        <param name="inbound-late-negotiation" value="true"/>
        <param name="rtp-ip" value="$${local_ip_v4}"/>
        <param name="rtp-timer-name" value="soft"/>
        <param name="rtp-notimer-during-bridge" value="false"/>
        <param name="sip-ip" value="$${local_ip_v4}"/>
        <param name="ext-rtp-ip" value="$${external_rtp_ip}"/>
        <param name="ext-sip-ip" value="host:$${external_sip_ip}"/>
        <param name="rtp-timeout-sec" value="300"/>
        <param name="rtp-hold-timeout-sec" value="1800"/>
        <param name="tls" value="$${external_ssl_enable}"/>
        <param name="tls-only" value="false"/>
        <param name="tls-bind-params" value="transport=tls"/>
        <param name="tls-sip-port" value="$${external_tls_port}"/>
        <param name="tls-cert-dir" value="/etc/freeswitch/tls" />
        <param name="tls-passphrase" value=""/>
        <param name="tls-verify-date" value="true"/>
        <param name="tls-verify-policy" value="subjects_out"/>
        <param name="tls-verify-depth" value="2"/>
        <param name="tls-verify-in-subjects" value=""/>
        <param name="tls-version" value="$${sip_tls_version}"/>
        <param name="tls-ciphers" value="$${sip_tls_ciphers}"/>
      </settings>
    </profile>
  {{- end }}
  kamailio.xml: |
    <profile name="kamailio">
      <settings>
        <param name="debug" value="{{ $.Values.freeswitch.sipLogging.sofiaDebug }}"/>
        <param name="sip-port" value="5060"/>
        <!-- Kamailio signaling is TLS-only; tls-only suppresses the plain
             UDP/TCP sip-port and binds only the TLS port. -->
        <param name="tls" value="true"/>
        <param name="tls-only" value="true"/>
        <param name="tls-bind-params" value="transport=tls"/>
        <param name="tls-sip-port" value="{{ $.Values.freeswitch.publicExposure.kamailio.backendPort }}"/>
        <param name="tls-cert-dir" value="/etc/freeswitch/tls"/>
        <param name="tls-verify-date" value="true"/>
        <param name="tls-verify-policy" value="subjects_out"/>
        <param name="tls-version" value="$${sip_tls_version}"/>
        <param name="tls-ciphers" value="$${sip_tls_ciphers}"/>
        <param name="dialplan" value="XML"/>
        <param name="context" value="public"/>
        <param name="auth-calls" value="false"/>
        <param name="apply-inbound-acl" value="kamailio"/>
        <param name="sip-trace" value="{{ ternary "true" "false" $.Values.freeswitch.sipLogging.enabled }}"/>
        <param name="sip-ip" value="$${local_ip_v4}"/>
        <param name="rtp-ip" value="$${local_ip_v4}"/>
        <param name="rtp-timer-name" value="soft"/>
        <param name="rtp-notimer-during-bridge" value="false"/>
        <param name="sip-domain" value="$${external_sip_ip}"/>
        <param name="ext-sip-ip" value="host:$${external_sip_ip}"/>
        <param name="ext-sip-port" value="{{ $.Values.freeswitch.publicExposure.kamailio.backendPort }}"/>
        <param name="ext-rtp-ip" value="$${external_rtp_ip}"/>
        <param name="inbound-late-negotiation" value="true"/>
        <param name="inbound-codec-prefs" value="$${global_codec_prefs}"/>
        <param name="outbound-codec-prefs" value="$${outbound_codec_prefs}"/>
      </settings>
    </profile>
{{- end }}
