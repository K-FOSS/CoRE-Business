{{- if .Values.livekit.enabled }}
{{- $livekit := .Values.livekit }}
{{- $redisRemoteKey := default (printf "Storage/DragonFly/CoRE/%s/%s/%s/Creds" .Values.region .Values.datacenter .Values.cluster.name) $livekit.redis.remoteRef.key }}
{{- $keyRemoteKey := default (printf "AVoIP/LiveKit/%s/%s/%s/Creds" .Values.region .Values.datacenter .Values.cluster.name) $livekit.secrets.remoteKey }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: '{{ $livekit.secrets.generatorName }}'
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  length: 64
  digits: 0
  symbols: 0
  allowRepeat: true
  encoding: 'hex'
  secretKeys:
    - 'APIKey'
    - 'APISecret'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $livekit.secrets.bootstrapName }}-generate'
  annotations:
    argocd.argoproj.io/sync-wave: '-9'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: '{{ $livekit.secrets.bootstrapName }}'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: 'Password'
          name: '{{ $livekit.secrets.generatorName }}'
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: '{{ $livekit.secrets.name }}-push'
  annotations:
    argocd.argoproj.io/sync-wave: '-8'
spec:
  refreshInterval: '1h'
  updatePolicy: 'Replace'
  deletionPolicy: 'None'
  secretStoreRefs:
    - kind: '{{ $livekit.redis.secretStoreRef.kind }}'
      name: '{{ $livekit.redis.secretStoreRef.name }}'
  selector:
    secret:
      name: '{{ $livekit.secrets.bootstrapName }}'
  data:
    - match:
        secretKey: 'APIKey'
        remoteRef:
          remoteKey: '{{ $keyRemoteKey }}'
          property: 'APIKey'
    - match:
        secretKey: 'APISecret'
        remoteRef:
          remoteKey: '{{ $keyRemoteKey }}'
          property: 'APISecret'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $livekit.secrets.name }}'
  annotations:
    argocd.argoproj.io/sync-wave: '-7'
spec:
  refreshInterval: '1h'
  secretStoreRef:
    kind: '{{ $livekit.redis.secretStoreRef.kind }}'
    name: '{{ $livekit.redis.secretStoreRef.name }}'
  target:
    name: '{{ $livekit.secrets.name }}'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
    template:
      engineVersion: 'v2'
      type: 'Opaque'
      data:
        keys.yaml: '{{ `{{ dict .APIKey .APISecret | toJson }}` }}'
  data:
    - secretKey: 'APIKey'
      remoteRef:
        key: '{{ $keyRemoteKey }}'
        property: 'APIKey'
    - secretKey: 'APISecret'
      remoteRef:
        key: '{{ $keyRemoteKey }}'
        property: 'APISecret'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $livekit.redis.secretName }}'
  annotations:
    argocd.argoproj.io/sync-wave: '-7'
spec:
  refreshInterval: '1h'
  secretStoreRef:
    kind: '{{ $livekit.redis.secretStoreRef.kind }}'
    name: '{{ $livekit.redis.secretStoreRef.name }}'
  target:
    name: '{{ $livekit.redis.secretName }}'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
  data:
    - secretKey: '{{ $livekit.redis.passwordKey }}'
      remoteRef:
        key: '{{ $redisRemoteKey }}'
        property: '{{ $livekit.redis.remoteRef.property }}'
{{- end }}
