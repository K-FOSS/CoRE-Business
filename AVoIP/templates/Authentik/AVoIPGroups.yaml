{{- $authentik := .Values.avoip.authentik -}}
{{- if and $authentik.enabled (eq .Values.region $authentik.primaryRegion) }}
{{- $_ := required "avoip.authentik.providerConfigRef is required" $authentik.providerConfigRef -}}
{{- $_ := required "avoip.authentik.workspaceName is required" $authentik.workspaceName -}}
{{- $_ := required "avoip.authentik.usersGroup is required" $authentik.usersGroup -}}
{{- $_ := required "avoip.authentik.adminsGroup is required" $authentik.adminsGroup -}}
{{- $_ := required "avoip.authentik.adminsMailAcceptingGeneralIds is required" $authentik.adminsMailAcceptingGeneralIds -}}
---
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: '{{ $authentik.workspaceName }}'
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  providerConfigRef:
    name: '{{ $authentik.providerConfigRef }}'
  forProvider:
    source: 'Inline'
    initArgs: ['-upgrade']
    varmap:
      users_group: '{{ $authentik.usersGroup }}'
      admins_group: '{{ $authentik.adminsGroup }}'
      admins_mail_accepting_general_ids:
{{- $authentik.adminsMailAcceptingGeneralIds | toYaml | nindent 8 }}
    module: |
      variable "users_group" { type = string }
      variable "admins_group" { type = string }
      variable "admins_mail_accepting_general_ids" { type = list(string) }

      # Read the live attributes so existing SMS number assignments survive.
      data "authentik_group" "current_admins" {
        name          = var.admins_group
        include_users = false
      }

      resource "authentik_group" "avoip_users" {
        name         = var.users_group
        is_superuser = false
        attributes   = jsonencode({ avoip_role = "user" })

        lifecycle {
          ignore_changes = [attributes]
        }
      }

      resource "authentik_group" "avoip_admins" {
        name         = var.admins_group
        is_superuser = false
        attributes = jsonencode(merge(
          try(jsondecode(data.authentik_group.current_admins.attributes), {}),
          {
            avoip_role             = "admin"
            mailacceptinggeneralid = var.admins_mail_accepting_general_ids
          }
        ))
      }
{{- end }}
