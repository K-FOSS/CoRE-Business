{{- if .Values.kamailio.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- $backendService := default (printf "%s-freeswitch" $fullName) .Values.kamailio.backend.serviceName -}}
{{- $siteHost := include "avoip.sip.siteHost" . -}}
{{- $publicSipHost := include "avoip.sip.publicHost" . -}}
{{- $kamailioHost := include "avoip.sip.serviceHost" (dict "root" . "component" "kamailio") -}}
{{- $freeswitchHost := default (printf "%s.%s.svc.%s" $backendService $.Release.Namespace (required "cluster.domain is required for SIP backend routing" $.Values.cluster.domain)) .Values.freeswitch.sip.serviceHost -}}
{{- $rawSipLogging := or .Values.kamailio.sipLogging.diagnostics.enabled (default false .Values.kamailio.sipLogging.rawInbound) -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-kamailio-config
data:
  kamailio.cfg: |
    debug={{ if .Values.kamailio.sipLogging.diagnostics.enabled }}{{ .Values.kamailio.sipLogging.diagnostics.coreDebug }}{{ else }}0{{ end }}
    corelog=-1
    log_stderror=yes

    # children controls UDP workers. SIP is TLS here, so size TCP/TLS workers
    # explicitly instead of assuming children affects the signaling path.
    children=2
    tcp_children={{ default 4 .Values.kamailio.tcpChildren }}

    auto_aliases=no

    {{- if $rawSipLogging }}
    # Required for event_route[core:msg-received].
    received_route_mode=1
    {{- end }}

    {{- if or .Values.kamailio.sipLogging.diagnostics.enabled .Values.kamailio.sipLogging.diagnostics.sdp }}
    onsend_route_reply=1
    {{- end }}

    # Envoy passes the encrypted TLS stream and prepends PROXY v2 so the
    # original carrier address is retained by Kamailio.
    tcp_accept_haproxy=yes

    enable_tls=1

    listen=tls:0.0.0.0:5061 advertise "{{ $publicSipHost }}":{{ .Values.kamailio.advertisedTLSPort }} name "public_tls"
    listen=tls:0.0.0.0:5062 advertise "{{ $kamailioHost }}":5062 name "private_tls"

    alias="{{ .Values.sip.globalHost }}:{{ .Values.kamailio.advertisedTLSPort }}"
    alias="{{ $siteHost }}:{{ .Values.kamailio.advertisedTLSPort }}"
    alias="{{ $kamailioHost }}:5062"

    loadmodule "tm.so"
    loadmodule "sl.so"
    loadmodule "rr.so"
    loadmodule "corex.so"
    loadmodule "maxfwd.so"
    loadmodule "sanity.so"
    loadmodule "pv.so"
    loadmodule "siputils.so"
    loadmodule "textops.so"
    loadmodule "xlog.so"
    loadmodule "tls.so"

    modparam("tls", "config", "/etc/kamailio/tls.cfg")
    modparam("tls", "xavp_cfg", "tls")

    {{- if (include "avoip.homer.enabled" . | trim) }}
    loadmodule "siptrace.so"
    {{- end }}

    {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
    loadmodule "rtpengine.so"
    loadmodule "textopsx.so"
    {{- end }}

    # The private FreeSWITCH-facing paired RR needs socket metadata. The public
    # representation is sanitized in reply_route before reaching the carrier.
    modparam("rr", "sockname_mode", 1)
    modparam("sanity", "autodrop", 0)

    {{- if (include "avoip.homer.enabled" . | trim) }}
    modparam("siptrace", "trace_on", 1)
    modparam("siptrace", "trace_mode", 1)
    modparam("siptrace", "trace_to_database", 0)
    modparam(
      "siptrace",
      "duplicate_uri",
      "sip:{{ $fullName }}-homer-heplify.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}:{{ $.Values.homer.capture.hepTCPPort }};transport=tcp"
    )
    modparam("siptrace", "hep_mode_on", 1)
    modparam("siptrace", "hep_version", 3)
    modparam("siptrace", "hep_capture_id", 101)
    {{- end }}

    {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
    modparam(
      "rtpengine",
      "rtpengine_sock",
      "udp:{{ $fullName }}-rtpengine.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}:{{ $.Values.rtpengine.controlPort }}"
    )
    modparam(
      "rtpengine",
      "rtpengine_disable_tout",
      {{ .Values.rtpengine.recovery.disableTimeoutSeconds }}
    )
    modparam(
      "rtpengine",
      "aggressive_redetection",
      {{ if .Values.rtpengine.recovery.aggressiveRedetection }}1{{ else }}0{{ end }}
    )
    modparam(
      "rtpengine",
      "ping_interval",
      {{ .Values.rtpengine.recovery.pingIntervalSeconds }}
    )

    route[MEDIA_INITIAL] {
      if (!has_body("application/sdp")) {
        return;
      }

      if (!rtpengine_manage("replace-origin external internal")) {
        xlog(
          "L_ERR",
          "RTPEngine initial SDP handling failed callid=$ci method=$rm source=$si:$sp\n"
        );
        sl_send_reply("503", "Media Relay Unavailable");
        exit;
      }
    }

    route[MEDIA_DIALOG] {
      if (has_body("application/sdp")) {
        if (!rtpengine_manage("replace-origin")) {
          xlog(
            "L_ERR",
            "RTPEngine dialog SDP handling failed callid=$ci method=$rm source=$si:$sp\n"
          );

          if (!is_method("ACK")) {
            sl_send_reply("488", "Media Relay Unavailable");
          }

          exit;
        }
      } else if (is_method("BYE|CANCEL")) {
        rtpengine_manage();
      }
    }
    {{- end }}

    #
    # Raw receive diagnostics
    #
    # This runs before request_route/reply_route and therefore tells us whether
    # the SIP bytes reached Kamailio at all.
    #
    {{- if $rawSipLogging }}
    event_route[core:msg-received] {
      xlog(
        "L_INFO",
        "SIP RX RAW pod=$env(POD_NAME) proto=$rcv(sproto) source=$rcv(srcip):$rcv(srcport) recv=$rcv(rcvip):$rcv(rcvport) bytes=$rcv(len)\n--- SIP RX BEGIN ---\n$rcv(buf)\n--- SIP RX END ---\n"
      );
    }

    # Capture traffic that reached the SIP core but could not be parsed.
    event_route[core:receive-parse-error] {
      xlog(
        "L_ERR",
        "SIP RX PARSE-ERROR pod=$env(POD_NAME) proto=$proto source=$si:$sp recv=$Ri:$Rp bytes=$ml\n--- SIP BAD BEGIN ---\n$mb\n--- SIP BAD END ---\n"
      );
    }
    {{- end }}

    request_route {
      if (is_method("ACK")) {
        xlog(
          "L_INFO",
          "SIP ack ingress pod=$env(POD_NAME) callid=$ci cseq=$hdr(CSeq) conn=$conid recv=$Ri:$Rp proto=$proto source=$si:$sp ruri=$ru route=$hdr(Route)\n"
        );
      }

      if (!sanity_check("1511", "7")) {
        xlog(
          "L_WARN",
          "SIP reject reason=malformed pod=$env(POD_NAME) method=$rm source=$si:$sp callid=$ci\n"
        );
        exit;
      }

      if (!mf_process_maxfwd_header("10")) {
        xlog(
          "L_WARN",
          "SIP reject reason=max-forwards pod=$env(POD_NAME) method=$rm source=$si:$sp callid=$ci\n"
        );

        if (!is_method("ACK")) {
          sl_send_reply("483", "Too Many Hops");
        }

        exit;
      }

      # Public TLS receives Envoy's passthrough TLS + PROXY v2.
      if ($proto == "tls" && $Rp == 5061) {
        {{- range .Values.flowroute.signalingCIDRs }}
        if (src_ip == {{ . }}) {
          $var(side) = "carrier";
          route(FROM_CARRIER);
          exit;
        }
        {{- end }}
      }

      # Private listener is exclusively for the trusted backend network.
      if (
        $proto == "tls" &&
        $Rp == 5062 &&
        src_ip == {{ .Values.kamailio.backend.podCIDR }}
      ) {
        $var(side) = "backend";
        route(FROM_BACKEND);
        exit;
      }

      xlog(
        "L_WARN",
        "SIP reject reason=source-or-socket pod=$env(POD_NAME) method=$rm source=$si:$sp recv=$Ri:$Rp proto=$proto callid=$ci\n"
      );

      if (!is_method("ACK")) {
        sl_send_reply("403", "Source Not Authorized");
      }

      exit;
    }

    route[FROM_CARRIER] {
      force_rport();

      if (is_method("REGISTER")) {
        sl_send_reply("403", "Registration Disabled");
        exit;
      }

      if (is_method("OPTIONS")) {
        sl_send_reply("200", "Keepalive");
        exit;
      }

      # ACK for a negative final belongs to the INVITE transaction. ACK for
      # a 2xx response is a separate transaction and continues via the route set.
      if (is_method("ACK")) {
        t_check_trans();
      }

      if (is_method("CANCEL")) {
        if (t_check_trans()) {
          {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
          # CANCEL is handled before MEDIA_DIALOG, so explicitly delete the
          # media session here. rtpengine_manage() maps CANCEL to delete.
          rtpengine_manage();
          {{- end }}

          set_send_socket_name("private_tls");
          route(RELAY);
        }

        sl_send_reply("481", "Call Does Not Exist");
        exit;
      }

      if (has_totag()) {
        route(IN_DIALOG);
        exit;
      }

      if (is_method("ACK")) {
        xlog(
          "L_WARN",
          "SIP ack drop reason=no-dialog-route pod=$env(POD_NAME) callid=$ci cseq=$hdr(CSeq) source=$si:$sp\n"
        );
        exit;
      }

      if (is_method("INVITE|MESSAGE|INFO|UPDATE|PRACK|REFER|NOTIFY")) {
        route(INITIAL_BACKEND);
        exit;
      }

      xlog(
        "L_WARN",
        "SIP reject reason=unsupported-initial pod=$env(POD_NAME) method=$rm callid=$ci\n"
      );
      sl_send_reply("405", "Method Not Allowed");
      exit;
    }

    route[FROM_BACKEND] {
      if (is_method("ACK")) {
        t_check_trans();
      }

      if (is_method("CANCEL")) {
        if (t_check_trans()) {
          {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
          rtpengine_manage();
          {{- end }}

          set_send_socket_name("public_tls");
          route(RELAY);
        }

        sl_send_reply("481", "Call Does Not Exist");
        exit;
      }

      if (has_totag()) {
        route(IN_DIALOG);
        exit;
      }

      xlog(
        "L_WARN",
        "SIP reject reason=backend-initial pod=$env(POD_NAME) method=$rm source=$si:$sp callid=$ci\n"
      );

      if (!is_method("ACK")) {
        sl_send_reply("403", "Source Not Authorized");
      }

      exit;
    }

    route[INITIAL_BACKEND] {
      # Internally preserve the rich paired RR representation. Carrier-facing
      # responses are normalized below.
      record_route_preset(
        "{{ $kamailioHost }}:5062;transport=tls;sn=private_tls",
        "{{ $publicSipHost }}:{{ .Values.kamailio.advertisedTLSPort }};transport=tls;sn=public_tls"
      );

      add_rr_param(";r2=on");

      {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
      route(MEDIA_INITIAL);
      {{- end }}

      route(TO_BACKEND);
      route(RELAY);
      exit;
    }

    route[IN_DIALOG] {
      if (!is_method("ACK|BYE|UPDATE|INVITE|INFO|REFER|PRACK|NOTIFY")) {
        route(REJECT_DIALOG);
      }

      if (!is_present_hf("Route")) {
        route(REJECT_DIALOG);
      }

      # Carrier requests should target the public Contact previously exposed.
      if ($var(side) == "carrier" && $rd != "{{ $publicSipHost }}") {
        route(REJECT_DIALOG);
      }

      if ($var(side) == "carrier") {
        # Carrier-visible RR:
        #
        #   <sips:PUBLIC_HOST:5061;lr>
        #
        # Do not depend on private sn=/ftag=/r2 metadata.
        if (
          $(route_uri{uri.host}) != "{{ $publicSipHost }}" ||
          $(route_uri{uri.port}) != "{{ .Values.kamailio.advertisedTLSPort }}"
        ) {
          route(REJECT_DIALOG);
        }

        # Contact itself points at this proxy. Force loose-route semantics and
        # skip strict R-URI detection.
        if (!loose_route_mode("1")) {
          route(REJECT_DIALOG);
        }

        route(TO_BACKEND);
      } else {
        # Backend requests must use the private internal RR identity.
        if (
          $(route_uri{uri.host}) != "{{ $kamailioHost }}" ||
          $(route_uri{uri.port}) != "5062" ||
          $(route_uri{uri.transport}) != "tls" ||
          $(route_uri{uri.param,sn}) != "private_tls"
        ) {
          route(REJECT_DIALOG);
        }

        # r2=on represents the paired RR set, so one loose_route invocation
        # processes the corresponding route pair.
        if (!loose_route_mode("1")) {
          route(REJECT_DIALOG);
        }

        route(TO_CARRIER);
      }

      {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
      route(MEDIA_DIALOG);
      {{- end }}

      if (is_method("ACK")) {
        xlog(
          "L_INFO",
          "SIP ack decision=relay pod=$env(POD_NAME) callid=$ci cseq=$hdr(CSeq) side=$var(side) recv=$Ri:$Rp source=$si:$sp ruri=$ru route=$route_uri next=$du socket=$fsn\n"
        );
      }

      {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
      if (!is_method("ACK")) {
        xlog(
          "L_INFO",
          "SIP dialog decision=relay pod=$env(POD_NAME) callid=$ci method=$rm side=$var(side) ruri=$ru route=$route_uri next=$du socket=$fsn\n"
        );
      }
      {{- end }}

      route(RELAY);
      exit;
    }

    route[REJECT_DIALOG] {
      xlog(
        "L_WARN",
        "SIP dialog reject pod=$env(POD_NAME) callid=$ci method=$rm cseq=$hdr(CSeq) side=$var(side) source=$si:$sp recv=$Ri:$Rp ruri=$ru route=$hdr(Route)\n"
      );

      if (!is_method("ACK")) {
        sl_send_reply("481", "Call Does Not Exist");
      }

      exit;
    }

    route[TO_BACKEND] {
      # One FreeSWITCH replica today. Replace this static Service destination
      # with dispatcher/dialog-affine selection before adding FS replicas.
      $du = "sip:{{ $freeswitchHost }}:{{ .Values.kamailio.backend.servicePort }};transport=tls";
      $xavp(tls=>server_name) = "{{ $freeswitchHost }}";
      set_send_socket_name("private_tls");
    }

    route[TO_CARRIER] {
      if ($du == $null || $du == "") {
        $du = $ru;
      }

      set_send_socket_name("public_tls");
    }

    route[RELAY] {
      if (!t_relay()) {
        xlog(
          "L_ERR",
          "SIP relay failure pod=$env(POD_NAME) callid=$ci method=$rm side=$var(side) recv=$Ri:$Rp next=$du socket=$fsn\n"
        );

        if (!is_method("ACK")) {
          sl_reply_error();
        }

        exit;
      }

      {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
      xlog(
        "L_INFO",
        "SIP relay queued pod=$env(POD_NAME) callid=$ci method=$rm side=$var(side) next=$du socket=$fsn\n"
      );
      {{- end }}

      exit;
    }

    {{- if or .Values.freeswitch.enabled .Values.kamailio.sipLogging.enabled }}
    reply_route {
      if (t_check_trans()) {
        $var(reply_transaction) = "matched";
      } else {
        $var(reply_transaction) = "unmatched";
      }

      # Response whose top Via names the private listener is coming from
      # FreeSWITCH toward the carrier.
      if (
        is_method("INVITE|UPDATE") &&
        $hdr(Via) =~ "{{ $kamailioHost }}:5062"
      ) {
        # Hide the private member of our paired RR.
        if ($(hdr(Record-Route)[*]) =~ "sn=private_tls") {
          if (!remove_hf_match(
                "Record-Route",
                "in",
                "{{ $kamailioHost }}:5062;transport=tls;sn=private_tls"
              )) {
            xlog(
              "L_ERR",
              "SIP reply drop reason=private-record-route-removal pod=$env(POD_NAME) callid=$ci status=$rs\n"
            );
            drop;
          }
        }

        # Normalize the public RR to:
        #
        #   <sips:PUBLIC_HOST:5061;lr>
        #
        # This representation has now been verified on the serialized wire.
        if ($(hdr(Record-Route)[*]) =~ "sn=public_tls") {
          if (!subst_hf(
                "Record-Route",
                "/;transport=tls;sn=public_tls;ftag=[^;>]+;lr;r2=on/;lr/",
                "a"
              )) {
            xlog(
              "L_ERR",
              "SIP reply drop reason=public-record-route-rewrite pod=$env(POD_NAME) callid=$ci status=$rs routes=$(hdr(Record-Route)[*])\n"
            );
            drop;
          }
        }

        # INVITE/UPDATE responses may refresh the remote target. Never expose
        # the backend Contact to the carrier.
        if (
          $rs =~ "^(1[0-9][0-9]|2[0-9][0-9])$" &&
          is_present_hf("Contact")
        ) {
          if (!subst_hf(
                "Contact",
                "/<sips?:([^@>]+)@[^;>]+(;[^>]*)?>/<sips:\\1@{{ $publicSipHost }}:{{ .Values.kamailio.advertisedTLSPort }}>/",
                "a"
              )) {
            xlog(
              "L_ERR",
              "SIP reply drop reason=contact-rewrite pod=$env(POD_NAME) callid=$ci status=$rs\n"
            );
            drop;
          }
        }
      }

      {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
      if (has_body("application/sdp")) {
        if (!rtpengine_manage("replace-origin")) {
          xlog(
            "L_ERR",
            "RTPEngine reply SDP handling failed callid=$ci status=$rs\n"
          );
          drop;
        }

        if (!msg_apply_changes()) {
          xlog(
            "L_ERR",
            "RTPEngine reply body apply failed callid=$ci status=$rs\n"
          );
          drop;
        }
      } else if (
        $var(reply_transaction) == "matched" &&
        $rs =~ "[3-6][0-9][0-9]"
      ) {
        rtpengine_manage();
      }
      {{- end }}

      {{- if .Values.kamailio.sipLogging.enabled }}
      xlog(
        "L_INFO",
        "SIP reply pod=$env(POD_NAME) callid=$ci cseq=$hdr(CSeq) status=$rs source=$si:$sp recv=$Ri:$Rp\n"
      );
      {{- end }}

      return(1);
    }
    {{- end }}

    #
    # Actual serialized-wire diagnostics
    #
    onsend_route {
      if ($snd(buf) =~ "^ACK ") {
        xlog(
          "L_INFO",
          "SIP ack send pod=$env(POD_NAME) callid=$ci cseq=$hdr(CSeq) conn=$conid recv=$Ri:$Rp source=$si:$sp socket=$sndfrom(proto):$sndfrom(ip):$sndfrom(port) socket_name=$fsn destination=$snd(ip):$snd(port) ruri=$ru\n"
        );
      }

      {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
      if ($snd(buf) =~ "^(INVITE|BYE|CANCEL|UPDATE) ") {
        xlog(
          "L_INFO",
          "SIP wire request pod=$env(POD_NAME) callid=$ci method=$rm cseq=$hdr(CSeq) conn=$conid socket=$sndfrom(proto):$sndfrom(ip):$sndfrom(port) socket_name=$fsn destination=$snd(ip):$snd(port)\n"
        );
      }

      if (
        $snd(buf) =~ "^SIP/2.0 (180|183|2[0-9][0-9]) " &&
        $hdr(CSeq) =~ "INVITE" &&
        $snd(buf) =~ "\r\nContact:" &&
        $snd(buf) =~ "\r\nRecord-Route:"
      ) {
        xlog(
          "L_INFO",
          "SIP wire invite-reply pod=$env(POD_NAME) callid=$ci status=$rs destination=$snd(ip):$snd(port) contact=$(snd(buf){re.subst,/.*\r\n(Contact:[^\r\n]+)\r\n.*/\\1/s}) routes=$(snd(buf){re.subst,/.*\r\n(Record-Route:[^\r\n]+)\r\n.*/\\1/s})\n"
        );
      }

      # Regression detector: private routing metadata must never leave through
      # the carrier-facing TLS listener.
      if (
        $fsn == "public_tls" &&
        (
          $snd(buf) =~ "sn=private_tls" ||
          $snd(buf) =~ "sn=public_tls" ||
          $snd(buf) =~ ";r2=on" ||
          $snd(buf) =~ "{{ $kamailioHost }}"
        )
      ) {
        xlog(
          "L_ERR",
          "SIP wire leak pod=$env(POD_NAME) callid=$ci destination=$snd(ip):$snd(port) reason=private-routing-metadata\n"
        );
      }
      {{- end }}

      {{- if .Values.kamailio.sipLogging.diagnostics.sdp }}
      if (
        (
          $snd(buf) =~ "^INVITE " ||
          $snd(buf) =~ "^SIP/2.0 (180|183|200) "
        ) &&
        $snd(buf) =~ "\r\nc=IN IP" &&
        $snd(buf) =~ "\r\nm="
      ) {
        xlog(
          "L_INFO",
          "SIP wire SDP pod=$env(POD_NAME) callid=$ci method=$rm status=$rs destination=$snd(ip):$snd(port) connection=$(snd(buf){re.subst,/.*\r\n(c=[^\r\n]+)\r\n.*/\\1/s}) media=$(snd(buf){re.subst,/.*\r\n(m=[^\r\n]+)\r\n.*/\\1/s})\n"
        );
      }
      {{- end }}
    }

  tls.cfg: |
    [server:default]
    method = TLSv1.2+
    verify_certificate = no
    require_certificate = no
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt

    [client:default]
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = {{ if .Values.freeswitch.enabled }}/etc/kamailio/tls-ca/ca-certificates.crt{{ else }}/etc/ssl/certs/ca-certificates.crt{{ end }}
{{- end }}