{{- define "avoip.kamailio.render.KamailioConfig" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- $fullName := include "avoip.fullname" . -}}
{{- $bindAddress := default "KAMAILIO_POD_IP" .Values.kamailio.listeners.bindAddress -}}
{{- $backendService := default (printf "%s-freeswitch" $fullName) .Values.kamailio.backend.serviceName -}}
{{- $publicSipHost := include "avoip.sip.siteHost" . -}}
{{- $kamailioPubHost := include "avoip.sip.kamailioPubHost" . -}}
{{- $kamailioHost := include "avoip.sip.serviceHost" (dict "root" . "component" $component "override" .Values.kamailio.sip.serviceHost) -}}
{{- $freeswitchHost := default (printf "%s.%s.svc.%s" $backendService $.Release.Namespace (required "cluster.domain is required for SIP backend routing" $.Values.cluster.domain)) .Values.freeswitch.sip.serviceHost -}}
{{- $sipCoreReturnHost := include "avoip.sip.sipCoreReturnHost" (dict "root" .) -}}
{{- $sipCoreConfigured := and .Values.asterisk.enabled .Values.asterisk.sipCore.enabled -}}
{{- $websocketHA := .Values.kamailio.websocketHA | default dict -}}
{{- $sipCoreEnabled := and $sipCoreConfigured (eq .Values.kamailio.role "private-sbc") (or (eq .Values.kamailio.name .Values.asterisk.sipCore.kamailioInstance) $websocketHA.enabled $websocketHA.legacyOwner) -}}
{{- $sipCoreTlsIngress := default (default .Values.asterisk.sipCore.kamailioInstance .Values.asterisk.sipCore.ingressKamailioInstance) .Values.asterisk.sipCore.tls.ingressKamailioInstance -}}
{{- $sipCoreTlsEnabled := and $sipCoreEnabled .Values.asterisk.sipCore.tls.enabled (eq .Values.kamailio.name $sipCoreTlsIngress) -}}
{{- $ownerService := include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "owner") -}}
{{- $ownerHost := printf "%s.%s.svc.%s" $ownerService .Release.Namespace (required "cluster.domain is required for Kamailio owner addressing" .Values.cluster.domain) -}}
{{- $rawSipLogging := and (or .Values.kamailio.sipLogging.diagnostics.enabled (default false .Values.kamailio.sipLogging.rawInbound)) (not $sipCoreConfigured) -}}
{{- $carrierTrafficLogging := and (or (eq .Values.kamailio.role "carrier-sbc") (not $sipCoreConfigured)) (default false .Values.kamailio.sipLogging.carrierTraffic) -}}
{{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.udpEnabled (not .Values.kamailio.publicExposure.sip.directService.enabled) -}}
{{- fail "public UDP SIP dialogs require kamailio.publicExposure.sip.directService.enabled so the advertised UDP Contact is reachable" -}}
{{- end -}}
{{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.tcpEnabled (not .Values.kamailio.publicExposure.sip.directService.enabled) -}}
{{- fail "public TCP SIP dialogs require kamailio.publicExposure.sip.directService.enabled so the advertised TCP Contact is reachable" -}}
{{- end -}}
{{- if and (eq .Values.kamailio.role "carrier-sbc") .Values.asterisk.enabled .Values.asterisk.sipCore.enabled (not .Values.kamailio.carrierOutbound.clientIdentity.enabled) -}}
{{- fail "carrier Kamailio needs carrierOutbound.clientIdentity enabled to route TLS dialogs to the SIP Core return Service" -}}
{{- end -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "config") }}
data:
  kamailio.cfg: |
    {{- if eq $bindAddress "KAMAILIO_POD_IP" }}
    # Bind each pod's actual address so SIP traces and hlog HEP sources are concrete.
    #!substdef "/KAMAILIO_POD_IP/$env(POD_IP)/"
    {{- end }}
    {{- if .Values.kamailio.topology.enabled }}
    # TOPOS_REDIS_SERVER comes from a Secret-backed environment variable.
    # Example:
    # name=topos;addr=dragonfly;port=6379;db=51;pass=...;tls=1
    #!defenvs TOPOS_REDIS_SERVER
    {{- end }}
    {{- if .Values.kamailio.registrar.enabled }}
    # Database URI is supplied by the dedicated User claim's connection Secret.
    #!defenvs REGISTRAR_DB_URL
    {{- end }}

    debug={{ if and $websocketHA.enabled (dig "sipLogging" "diagnostics" "enabled" false $websocketHA) }}{{ dig "sipLogging" "diagnostics" "coreDebug" .Values.kamailio.coreDebug $websocketHA }}{{ else if .Values.kamailio.sipLogging.diagnostics.enabled }}{{ .Values.kamailio.sipLogging.diagnostics.coreDebug }}{{ else }}{{ .Values.kamailio.coreDebug }}{{ end }}
    corelog=-1
    log_stderror=yes

    children=2
    tcp_children={{ default 4 .Values.kamailio.tcpChildren }}
    dns_try_ipv6=off

    auto_aliases=no

    {{- if $rawSipLogging }}
    received_route_mode=1
    {{- end }}

    {{- if or .Values.kamailio.sipLogging.diagnostics.enabled .Values.kamailio.sipLogging.diagnostics.sdp }}
    onsend_route_reply=1
    {{- end }}

    # Envoy TLS passthrough + PROXY v2 for carrier SIP and optional SIP Core TLS.
    tcp_accept_haproxy={{ if or (eq .Values.kamailio.role "carrier-sbc") $sipCoreTlsEnabled }}yes{{ else }}no{{ end }}
    enable_tls=1
    {{- if and (eq .Values.kamailio.role "private-sbc") $websocketHA.enabled .Values.kamailio.registrar.enabled .Values.freeswitch.enabled }}
    # The registrar and application profiles can connect to the same
    # FreeSWITCH pod with different certificate authorities and identities.
    tls_connection_match_domain=yes
    {{- end }}
    {{- if $sipCoreEnabled }}
    tcp_accept_no_cl=yes
    listen=tcp:{{ $bindAddress }}:{{ $.Values.asterisk.sipCore.httpPort }} name "sipcore_ws"
    {{- if $sipCoreTlsEnabled }}
    listen=tls:{{ $bindAddress }}:{{ $.Values.asterisk.sipCore.tls.port }} advertise "{{ $.Values.asterisk.sipCore.hostname }}":{{ $.Values.asterisk.sipCore.tls.gatewayPort }} name "sipcore_client_tls"
    {{- end }}
    {{- if $websocketHA.enabled }}
    # This owner token is substituted by Kamailio's preprocessor from POD_NAME.
    # The rest of the SIP script remains untouched by generic envsubst.
    #!substdef "/SIPCORE_OWNER_POD/$env(POD_NAME)/"
    listen=tls:0.0.0.0:{{ $.Values.asterisk.sipCore.privateEgressPort }} advertise "SIPCORE_OWNER_POD.{{ $ownerHost }}":{{ $.Values.asterisk.sipCore.privateEgressPort }} name "sipcore_owner_tls"
    alias="SIPCORE_OWNER_POD.{{ $ownerHost }}:{{ $.Values.asterisk.sipCore.privateEgressPort }}"
    {{- else }}
    listen=tls:{{ $bindAddress }}:{{ $.Values.asterisk.sipCore.privateEgressPort }} advertise "{{ $sipCoreReturnHost }}":{{ $.Values.asterisk.sipCore.privateEgressPort }} name "sipcore_private_tls"
    alias="{{ $sipCoreReturnHost }}:{{ $.Values.asterisk.sipCore.privateEgressPort }}"
    {{- end }}
    {{- end }}

    # Public carrier-facing identity.
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.udpEnabled }}
    listen=udp:{{ $bindAddress }}:5060 advertise "{{ if .Values.kamailio.publicExposure.sip.directService.enabled }}{{ $kamailioPubHost }}{{ else }}{{ $publicSipHost }}{{ end }}":5060 name "public_udp"
    {{- end }}
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.tcpEnabled }}
    listen=tcp:{{ $bindAddress }}:5060 advertise "{{ if .Values.kamailio.publicExposure.sip.directService.enabled }}{{ $kamailioPubHost }}{{ else }}{{ $publicSipHost }}{{ end }}":5060 name "public_tcp"
    {{- end }}
    {{- if eq .Values.kamailio.role "carrier-sbc" }}
    listen=tls:{{ $bindAddress }}:5061 advertise "{{ $publicSipHost }}":{{ .Values.kamailio.advertisedTLSPort }} name "public_tls"
    {{- end }}

    # Private application/B2BUA-facing identity.
    listen=tls:{{ $bindAddress }}:5062 advertise "{{ $kamailioHost }}":5062 name "private_tls"

    {{- if eq .Values.kamailio.role "carrier-sbc" }}
    alias="{{ .Values.sip.globalHost }}:{{ .Values.kamailio.advertisedTLSPort }}"
    alias="{{ $publicSipHost }}:{{ .Values.kamailio.advertisedTLSPort }}"
    {{- if $sipCoreEnabled }}
    alias="{{ $.Values.asterisk.sipCore.hostname }}:443"
    {{- end }}
    {{- if .Values.kamailio.publicExposure.sip.directService.enabled }}
    alias="{{ $kamailioPubHost }}:5060"
    {{- end }}
    {{- end }}
    alias="{{ $kamailioHost }}:5062"

    # tls must precede modules that initialize thread-local/OpenSSL state.
    # The registrar's libpq TLS connections are opened again in forked workers.
    loadmodule "tls.so"
    loadmodule "tm.so"
    loadmodule "sl.so"
    {{- if include "avoip.kamailio.adminRoutingEnabled" (dict "root" . "instance" .Values.kamailio) | trim }}
    {{ include "avoip.admin.routing.modules" . | nindent 4 }}
    {{- end }}
    {{- if $sipCoreEnabled }}
    loadmodule "nathelper.so"
    # tcpops exposes the actual accepted TCP peer when PROXY protocol
    # overrides the SIP message source address and port.
    {{- if .Values.asterisk.sipCore.tls.enabled }}
    loadmodule "tcpops.so"
    {{- if not (include "avoip.kamailio.adminRoutingEnabled" (dict "root" . "instance" .Values.kamailio) | trim) }}
    loadmodule "htable.so"
    {{- end }}
    # Process-local socket IDs are deliberately not replicated through Redis.
    # A restarted owner must fail an old dialog rather than attach it to a
    # different TLS connection that later reuses Envoy's source tuple.
    modparam("htable", "htable", "sipcore_tls_dialog=>size=8;autoexpire=86400")
    modparam("htable", "htable", "sipcore_dialog_destination=>size=8;autoexpire=86400")
    {{- end }}
    {{- if not (include "avoip.kamailio.adminRoutingEnabled" (dict "root" . "instance" .Values.kamailio) | trim) }}
    # SIP Core reads the managed extension codec policy on WSS INVITEs even
    # when the admin-routing module bundle is disabled on the HA edge.
    loadmodule "jansson.so"
    {{- end }}

    # SIP Core return routing calls check_flow_token() even on the legacy
    # single-replica owner while a separate WSS edge is being piloted.
    loadmodule "outbound.so"
    {{- if $websocketHA.enabled }}
    loadmodule "path.so"
    modparam("path", "use_received", 0)
    {{- end }}
    loadmodule "xhttp.so"
    loadmodule "websocket.so"
    modparam("websocket", "cors_mode", 0)
    modparam("websocket", "keepalive_mechanism", {{ $websocketHA.keepaliveMechanism | default .Values.kamailio.websocket.keepaliveMechanism }})
    modparam("websocket", "keepalive_timeout", {{ .Values.kamailio.websocket.keepaliveTimeoutSeconds }})
    {{- if (($websocketHA.compatibility | default dict).lfOnlyHeartbeat | default dict).enabled }}
    # Exact 0A 0A text-frame compatibility for Home Assistant SIP Core.
    modparam("websocket", "lf_keepalive_compat", 1)
    {{- end }}
    {{- end }}
    {{- $controlPort := default (dig "defaults" "controlPort" 2046 .Values.kamailio) .Values.kamailio.controlPort }}
    {{- if or $websocketHA.enabled $websocketHA.legacyOwner $controlPort }}
    loadmodule "ctl.so"
    {{- if or $websocketHA.enabled $websocketHA.legacyOwner }}
    modparam("ctl", "binrpc", "unix:/tmp/kamailio_ctl")
    {{- end }}
    {{- if $controlPort }}
    # Restricted by the Admin-to-control network policy; one endpoint per pod.
    modparam("ctl", "binrpc", "tcp:*:{{ $controlPort }}")
    {{- end }}
    {{- end }}
    loadmodule "corex.so"
    loadmodule "maxfwd.so"
    loadmodule "sanity.so"
    loadmodule "pv.so"
    loadmodule "ipops.so"
    loadmodule "rr.so"
    loadmodule "siputils.so"
    loadmodule "textops.so"
    loadmodule "xlog.so"
    {{- if and $sipCoreEnabled .Values.asterisk.sipCore.tls.enabled }}
    # Closure events are metadata-only. A lost socket remains pinned in the
    # process-local dialog table so an old call cannot use a replacement flow.
    event_route[tcp:closed] {
      if ($Rp == {{ $.Values.asterisk.sipCore.tls.port }}) {
        xlog("L_INFO", "SIPCORE FLOW stage=frontend-tls-closed pod=$env(POD_NAME) connection_id=$conid peer=$si:$sp\n");
      }
    }
    event_route[tcp:timeout] {
      if ($Rp == {{ $.Values.asterisk.sipCore.tls.port }}) {
        xlog("L_WARN", "SIPCORE FLOW stage=frontend-tls-timeout pod=$env(POD_NAME) connection_id=$conid peer=$si:$sp\n");
      }
    }
    event_route[tcp:reset] {
      if ($Rp == {{ $.Values.asterisk.sipCore.tls.port }}) {
        xlog("L_WARN", "SIPCORE FLOW stage=frontend-tls-reset pod=$env(POD_NAME) connection_id=$conid peer=$si:$sp\n");
      }
    }
    {{- end }}
    {{- if or .Values.kamailio.carrierOutbound.enabled $sipCoreEnabled (and (eq .Values.kamailio.role "private-sbc") .Values.kamailio.interSite.peers) }}
    loadmodule "dialog.so"
    {{- if and (eq .Values.kamailio.role "carrier-sbc") .Values.kamailio.carrierOutbound.enabled }}
    modparam("dialog", "default_timeout", {{ .Values.kamailio.carrierOutbound.limits.maxDurationSeconds }})
    # Outbound dialogs use an explicit timeout route that checks the shared
    # teardown marker before sending a local cleanup BYE. A process-local
    # dialog timer cannot observe a BYE handled on another carrier replica.
    modparam("dialog", "send_bye", 0)
    {{- end }}
    {{- end }}
    {{- if eq .Values.kamailio.role "private-sbc" }}
    loadmodule "dispatcher.so"
    modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
    modparam("dispatcher", "ds_ping_interval", 10)
    modparam("dispatcher", "ds_probing_mode", 1)
    {{- if .Values.kamailio.registrar.enabled }}
    loadmodule "db_postgres.so"
    modparam("db_postgres", "con_param", "sslmode=verify-full;connect_timeout={{ default 30 .Values.kamailio.registrar.database.connectTimeoutSeconds }}")
    loadmodule "auth.so"
    loadmodule "auth_db.so"
    loadmodule "usrloc.so"
    loadmodule "registrar.so"
    {{- if not $sipCoreEnabled }}
    loadmodule "nathelper.so"
    {{- end }}
    modparam("auth_db", "db_url", REGISTRAR_DB_URL)
    modparam("auth_db", "use_domain", 1)
    modparam("auth_db", "calculate_ha1", 0)
    modparam("auth_db", "password_column", "ha1")
    modparam("auth_db", "load_credentials", "")
    # The active_subscriber view filters disabled and expired verifiers.
    modparam("auth_db", "version_table", 0)
    modparam("usrloc", "db_url", REGISTRAR_DB_URL)
    modparam("usrloc", "db_mode", 3)
    modparam("usrloc", "use_domain", 1)
    modparam("registrar", "max_contacts", {{ .Values.kamailio.registrar.maxContacts }})
    modparam("registrar", "min_expires", {{ .Values.kamailio.registrar.minExpires }})
    modparam("registrar", "max_expires", {{ .Values.kamailio.registrar.maxExpires }})
    # lookup("location") must append every active binding so TM can fork
    # inbound calls to all registered TLS and WebSocket endpoints.
    modparam("registrar", "append_branches", 1)
    modparam("registrar", "use_path", 1)
    # Store the generated owner Path without returning it to clients that do
    # not advertise Path support.
    modparam("registrar", "path_mode", 0)
    {{- end }}
    {{- end }}

    {{- if .Values.kamailio.topology.enabled }}
    loadmodule "ndb_redis.so"
    loadmodule "topos.so"
    loadmodule "topos_redis.so"
    {{- end }}

    {{- if and .Values.kamailio.functions.sipTrace (include "avoip.homer.enabled" . | trim) }}
    loadmodule "siptrace.so"
    {{- end }}

    {{- if and (or .Values.kamailio.functions.media $sipCoreEnabled) (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
    {{- if eq .Values.rtpengine.control.transport "websocket" }}
    loadmodule "lwsc.so"
    {{- end }}
    loadmodule "rtpengine.so"
    loadmodule "textopsx.so"
    {{- end }}

    {{- if $sipCoreEnabled }}
    event_route[xhttp:request] {
      set_reply_close();
      set_reply_no_connect();

      if ($Rp != {{ $.Values.asterisk.sipCore.httpPort }} || $rm != "GET" || $hu != "/ws") {
        xhttp_reply("404", "Not Found", "", "");
        exit;
      }

      if ($hdrc(Host) != 1 ||
          ($(hdr(Host){s.tolower}) != "{{ $.Values.asterisk.sipCore.hostname }}" &&
           $(hdr(Host){s.tolower}) != "{{ $.Values.asterisk.sipCore.hostname }}:443")) {
        xhttp_reply("403", "Host Not Allowed", "", "");
        exit;
      }

      if ($hdrc(Origin) != 1) {
        xhttp_reply("403", "Origin Required", "", "");
        exit;
      }

      $var(sipcore_origin_allowed) = 0;
      {{- range $.Values.asterisk.sipCore.allowedOrigins }}
      if ($hdr(Origin) == "{{ . }}") $var(sipcore_origin_allowed) = 1;
      {{- end }}
      if ($var(sipcore_origin_allowed) != 1) {
        xhttp_reply("403", "Origin Not Allowed", "", "");
        exit;
      }

      if (ws_handle_handshake()) exit;
      exit;
    }
    {{- end }}

    modparam("tls", "config", "{{ if and (eq .Values.kamailio.role "private-sbc") $websocketHA.enabled }}/tmp/kamailio-tls.cfg{{ else }}/etc/kamailio/tls.cfg{{ end }}")
    modparam("tls", "xavp_cfg", "tls")

    #
    # Record routing
    #
    # The complete route topology exists only inside Kamailio/TOPOS storage.
    # Neither Flowroute nor FreeSWITCH needs to know the opposite side.
    #
    modparam("rr", "enable_double_rr", 2)
    modparam("rr", "append_fromtag", 1)
    modparam("rr", "sockname_mode", 1)
    modparam("sanity", "autodrop", 0)

    {{- if .Values.kamailio.topology.enabled }}
    #
    # Shared topology state.
    #
    # This is intentionally Redis/Dragonfly-backed rather than pod-local so
    # later Kamailio replicas can restore the same dialog topology.
    #
    modparam("ndb_redis", "server", TOPOS_REDIS_SERVER)
    modparam("ndb_redis", "connect_timeout", 1000)
    modparam("ndb_redis", "cmd_timeout", 1000)

    modparam("topos", "storage", "redis")
    modparam("topos_redis", "serverid", "topos")
    # Keep all TOPOS hooks enabled: outgoing response rewriting plus incoming
    # dialog lookup/restoration are both required when Kamailio replicas share
    # Redis/Dragonfly state.
    # Bits 1|2|4|8 enable outgoing, pre-send, incoming, and receive hooks.
    # In particular bit 2 is required for event_route[topos:msg-sending].
    modparam("topos", "event_mode", 15)

    # Store and restore topology around INVITE dialogs.
    modparam("topos", "sanity_checks", 1)
    modparam("topos", "rr_update", 1)
    # OPTIONS keepalives do not form dialogs and need no topology record. This
    # avoids futile TOPOS writes when Asterisk probes a stale WSS contact.
    modparam("topos", "methods_noinitial", "OPTIONS")

    #
    # Preserve each side's meaningful Contact user; TOPOS stores its lookup
    # token in this URI parameter, not in the Contact username.
    modparam("topos", "contact_mode", 1)
    modparam("topos", "cparam_name", "tps")
    {{- end }}

    {{- if and .Values.kamailio.topology.enabled .Values.kamailio.sipLogging.postToposResponses }}
    # This hook runs before TOPOS strips outbound topology. Its message is an
    # intermediate diagnostic snapshot, not the final network representation.
    event_route[topos:msg-sending] {
      if (is_reply() && $rm == "INVITE" && $rs >= 180 && $rs <= 299) {
        xlog(
          "L_INFO",
          "SIP PRE-TOPOS-STRIP SEND call_id=$ci status=$rs cseq=$hdr(CSeq) contact=$hdr(Contact) record_route=$hdr(Record-Route) via=$hdr(Via) to=$hdr(To) from=$hdr(From) content_length=$hdr(Content-Length) destination=$du send_socket=$fsn/$fs\n--- SIP PRE-TOPOS-STRIP MESSAGE BEGIN ---\n$mb\n--- SIP PRE-TOPOS-STRIP MESSAGE END ---\n"
        );
      }
    }
    {{- end }}

    {{- if .Values.kamailio.sipLogging.postToposResponses }}
    # corex observes the raw message at the network I/O boundary. Do not set
    # nio_msg_avp or change $mb: this route is strictly observation-only.
    modparam("corex", "nio_intercept", 1)

    event_route[network:msg] {
      if (!is_incoming()) {
        # Limit this sensitive raw capture to the controlled test's initial
        # INVITE 180/200 responses (CSeq 1 INVITE).
        if (
          $mb =~ "^SIP/2.0 (180|200) " &&
          $mb =~ "\r\nCSeq:[ \t]*1[ \t]+INVITE"
        ) {
          xlog(
            "L_INFO",
            "--- SIP FINAL NETWORK TX BEGIN ---\n$mb\n--- SIP FINAL NETWORK TX END ---\n"
          );
        }
      }
    }
    {{- end }}

    {{- if and .Values.kamailio.functions.sipTrace (include "avoip.homer.enabled" . | trim) }}
    modparam("siptrace", "trace_on", 1)
    modparam("siptrace", "trace_mode", 1)
    modparam("siptrace", "trace_to_database", 0)
    modparam(
      "siptrace",
      "duplicate_uri",
      "sip:{{ $fullName }}-homer-heplify.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}:{{ $.Values.homer.capture.hepTCPPort }};transport=tcp"
    )
    modparam("siptrace", "hep_mode_on", 1)
    modparam("siptrace", "hep_version", 3)
    modparam("siptrace", "hep_capture_id", 101)
    {{- end }}

{{ include "avoip.kamailio.sip.media" . }}
    #
    # Earliest possible raw SIP diagnostics.
    #
    {{- if $rawSipLogging }}
    event_route[core:msg-received] {
      xlog(
        "L_INFO",
        "SIP RX RAW pod=$env(POD_NAME) proto=$rcv(sproto) source=$rcv(srcip):$rcv(srcport) recv=$rcv(rcvip):$rcv(rcvport) bytes=$rcv(len)\n--- SIP RX BEGIN ---\n$rcv(buf)\n--- SIP RX END ---\n"
      );
    }

    event_route[core:receive-parse-error] {
      xlog(
        "L_ERR",
        "SIP RX PARSE-ERROR pod=$env(POD_NAME) proto=$proto source=$si:$sp recv=$Ri:$Rp bytes=$ml\n--- SIP BAD BEGIN ---\n$mb\n--- SIP BAD END ---\n"
      );
    }
    {{- end }}

    {{- if $sipCoreEnabled }}
    # Keep parse diagnostics useful without recording the malformed buffer,
    # which could contain credentials or other SIP payload data.
    event_route[core:receive-parse-error] {
      xlog(
        "L_INFO",
        "SIPCORE PARSE-ERROR pod=$env(POD_NAME) proto=$proto source=$si:$sp recv=$Ri:$Rp bytes=$ml\n"
      );
    }

    event_route[websocket:closed] {
      xlog(
        "L_WARN",
        "SIPCORE WS-CLOSED pod=$env(POD_NAME) source=$si:$sp connection_id=$ws_conid\n"
      );
    }
    {{- end }}

    {{- if include "avoip.kamailio.adminRoutingEnabled" (dict "root" . "instance" .Values.kamailio) | trim }}
    {{ include "avoip.admin.routing.routes" . | nindent 4 }}
    {{- end }}

{{ if eq .Values.kamailio.role "private-sbc" }}
{{ include "avoip.kamailio.sip.private" . | nindent 4 }}
{{ else }}
{{ include "avoip.kamailio.sip.sanityAndClassification" . | nindent 4 }}
{{ include "avoip.kamailio.sip.authorizationAndTransactions" . | nindent 4 }}
{{ include "avoip.kamailio.sip.topologyAndBackend" . | nindent 4 }}
{{ include "avoip.kamailio.sip.dialogRouting" . | nindent 4 }}
{{ include "avoip.kamailio.sip.relayAndObservability" . | nindent 4 }}
{{ if .Values.kamailio.carrierOutbound.enabled }}
{{ include "avoip.kamailio.sip.outbound" . | nindent 4 }}
{{ end }}
{{ end }}
{{ if eq .Values.kamailio.role "private-sbc" }}
  dispatcher.list: |
    {{ range .Values.kamailio.privateRouting.destinations }}
    {{ .setId }} {{ .uri }} 0
    {{ end }}
{{ end }}
  tls.cfg: |
    [server:default]
    method = TLSv1.2+
    # Sofia omits SNI on the per-replica owner connection. Keep this default
    # server-authenticated; the SIP route and network policy enforce the
    # private FreeSWITCH peer on 5062, while owner forwarding stays usable.
    verify_certificate = {{ if and (eq .Values.kamailio.role "private-sbc") (not $websocketHA.enabled) }}yes{{ else }}no{{ end }}
    require_certificate = {{ if and (eq .Values.kamailio.role "private-sbc") (not $websocketHA.enabled) }}yes{{ else }}no{{ end }}
    {{- if eq .Values.kamailio.role "private-sbc" }}
    ca_list = {{ if .Values.kamailio.carrierOutbound.clientIdentity.enabled }}/etc/kamailio/peer-ca/ca.crt{{ else if and .Values.freeswitch.enabled (eq .Values.kamailio.role "private-sbc") }}/etc/kamailio/freeswitch-peer-ca/ca.crt{{ else }}/etc/ssl/certs/ca-certificates.crt{{ end }}
    {{- end }}
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt

    {{- if and (eq .Values.kamailio.role "private-sbc") $websocketHA.enabled }}
    # FreeSWITCH sends owner requests without SNI. This listener is bound to
    # the wildcard address so the port-specific server profile is selected.
    [server:0.0.0.0:{{ $.Values.asterisk.sipCore.privateEgressPort }}]
    method = TLSv1.2+
    verify_certificate = no
    require_certificate = no
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt

    {{- if $websocketHA.enabled }}
    # FreeSWITCH omits SNI. Bind the private listener to the pod IP and use
    # the same IP in its strict TLS profile; the wildcard profile fell back
    # to the relaxed owner default and did not request a client certificate.
    # The startup command replaces this token before loading tls.cfg.
    [server:KAMAILIO_POD_IP:5062]
    {{- end }}
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = yes
    ca_list = /etc/kamailio/freeswitch-peer-ca/ca.crt
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt
    {{- end }}

    {{- if $sipCoreTlsEnabled }}
    # Public SIP Core SNI presents its dedicated ACME certificate. The default
    # profile and all other SIP TLS listeners keep the existing certificate.
    [server:any]
    server_name = {{ $.Values.asterisk.sipCore.hostname }}
    method = TLSv1.2+
    verify_certificate = no
    require_certificate = no
    private_key = /etc/kamailio/sipcore-public-tls/tls.key
    certificate = /etc/kamailio/sipcore-public-tls/tls.crt
    {{- end }}

    {{- if and .Values.asterisk.enabled .Values.asterisk.sipCore.enabled (or (eq .Values.kamailio.name .Values.asterisk.sipCore.kamailioInstance) $websocketHA.enabled $websocketHA.legacyOwner) }}
    # Asterisk's ACME certificate is a server certificate, not a client
    # identity. Its dedicated return listener relies on Cilium's workload
    # identity policy; the other private TLS listener keeps strict mTLS.
    [server:any]
    server_name = {{ include "avoip.sip.sipCoreReturnHost" (dict "root" .) }}
    method = TLSv1.2+
    verify_certificate = no
    require_certificate = no
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt
    {{- if $websocketHA.enabled }}
    # Pod SNI names share a cert-manager wildcard SAN for the owner Service.
    # This exception is source-restricted to Asterisk/edge Cilium identities;
    # the strict default mTLS profile remains active on 5062.
    [server:any]
    server_name = {{ $ownerHost }}
    server_name_mode = 2
    method = TLSv1.2+
    verify_certificate = no
    require_certificate = no
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt
    {{- end }}
    {{- end }}

    {{- if and (eq .Values.kamailio.role "carrier-sbc") .Values.kamailio.carrierOutbound.enabled .Values.kamailio.carrierOutbound.clientIdentity.enabled }}
    # Reuse the existing public SIPS SNI for the internal peer. Client
    # certificates are optional here so existing carrier traffic keeps working;
    # the SIP route requires and checks the Vault SAN for this peer.
    [server:any]
    server_name = {{ include "avoip.sip.siteHost" . }}
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = /etc/kamailio/peer-ca/ca.crt
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt
    {{- if .Values.kamailio.interSite.peers }}

    # Inter-site clients send the receiving site's configured outbound SNI.
    # Select the same optional-mTLS verification policy for that SNI; the
    # SIP route still requires a verified certificate, exact SAN and CIDR.
    [server:any]
    server_name = {{ .Values.kamailio.carrierOutbound.sniHost }}
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = /etc/kamailio/peer-ca/ca.crt
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt
    {{- end }}
    {{- end }}

    [client:default]
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = /etc/ssl/certs/ca-certificates.crt
    {{- if or (eq .Values.kamailio.role "private-sbc") .Values.kamailio.carrierOutbound.enabled }}
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt
    {{- end }}
    {{- if .Values.kamailio.carrierOutbound.clientIdentity.enabled }}

    # Use the Vault-issued client identity for this authenticated SIP peer.
    # The default client profile remains tied to the public server certificate.
    [client:any]
    server_name = {{ if eq .Values.kamailio.role "carrier-sbc" }}{{ .Values.kamailio.carrierOutbound.peer.serviceHost }}{{ else }}{{ include "avoip.sip.siteHost" . }}{{ end }}
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = {{ if eq .Values.kamailio.role "carrier-sbc" }}/etc/kamailio/peer-ca/ca.crt{{ else }}/etc/ssl/certs/ca-certificates.crt{{ end }}
    private_key = /etc/kamailio/mtls/tls.key
    certificate = /etc/kamailio/mtls/tls.crt
    {{- if and (eq .Values.kamailio.role "carrier-sbc") .Values.asterisk.enabled .Values.asterisk.sipCore.enabled }}

    # The SIP Core return Service is a distinct TLS identity from the private
    # Kamailio peer Service. Match its exact DNS name and use the internal
    # mTLS identity and CA bundle when relaying restored dialogs to port 5063.
    [client:any]
    server_name = {{ include "avoip.sip.sipCoreReturnHost" (dict "root" .) }}
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = /etc/kamailio/peer-ca/ca.crt
    private_key = /etc/kamailio/mtls/tls.key
    certificate = /etc/kamailio/mtls/tls.crt
    {{- end }}
    {{- end }}
    {{- if and (eq .Values.kamailio.role "private-sbc") $websocketHA.enabled .Values.kamailio.registrar.enabled .Values.freeswitch.enabled }}

    # FreeSWITCH's registrar listener and application listener share a DNS
    # name but present certificates from different CAs. Select each client
    # profile explicitly by server_id on the trusted routing boundary.
    [client:any]
    server_id = freeswitch-registrar-return
    server_name = {{ include "avoip.sip.serviceHost" (dict "root" . "component" "freeswitch") }}
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = /etc/kamailio/freeswitch-peer-ca/ca.crt
    private_key = /etc/kamailio/mtls/tls.key
    certificate = /etc/kamailio/mtls/tls.crt

    [client:any]
    server_id = freeswitch-application
    server_name = {{ include "avoip.sip.serviceHost" (dict "root" . "component" "freeswitch") }}
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = /etc/ssl/certs/ca-certificates.crt
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt
    {{- end }}
    {{- if and (eq .Values.kamailio.role "private-sbc") .Values.freeswitch.enabled .Values.kamailio.carrierOutbound.clientIdentity.enabled }}

    # FreeSWITCH's owner-pod listener presents the site-internal certificate.
    # Match its service SNI even when the restored TOPOS target is a pod IP.
    [client:any]
    server_name = {{ include "avoip.sip.serviceHost" (dict "root" . "component" "freeswitch") }}
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = /etc/kamailio/peer-ca/ca.crt
    private_key = /etc/kamailio/mtls/tls.key
    certificate = /etc/kamailio/mtls/tls.crt
    {{- end }}
    {{- range .Values.kamailio.interSite.peers }}

    # Per-site client profile lets dialogs use the peer's site SNI while
    # presenting this carrier's Vault-issued mTLS identity.
    [client:any]
    server_id = inter-site-{{ .name }}
    server_name = {{ .serverName }}
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = /etc/ssl/certs/ca-certificates.crt
    private_key = /etc/kamailio/mtls/tls.key
    certificate = /etc/kamailio/mtls/tls.crt
    {{- end }}
{{ end }}
{{- $root := . -}}
{{- range $instance := (include "avoip.kamailio.instances" $root | fromYamlArray) -}}
{{- if $instance.enabled -}}
{{- $values := deepCopy $root.Values -}}
{{- $_ := set $values "kamailio" $instance -}}
{{- $ctx := dict "Values" $values "Release" $root.Release "Chart" $root.Chart "Files" $root.Files "Capabilities" $root.Capabilities -}}
{{ include "avoip.kamailio.render.KamailioConfig" $ctx }}
{{ end }}
{{ end }}
