{{- if .Values.kamailio.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- $backendService := default (printf "%s-freeswitch" $fullName) .Values.kamailio.backend.serviceName -}}
{{- $siteHost := include "avoip.sip.siteHost" . -}}
{{- $kamailioHost := include "avoip.sip.serviceHost" (dict "root" . "component" "kamailio") -}}
{{- $freeswitchHost := default (printf "%s.%s.svc.%s" $backendService $.Release.Namespace (required "cluster.domain is required for SIP backend routing" $.Values.cluster.domain)) .Values.freeswitch.sip.serviceHost -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-kamailio-config
data:
  kamailio.cfg: |
    debug={{ if .Values.kamailio.sipLogging.diagnostics.enabled }}{{ .Values.kamailio.sipLogging.diagnostics.coreDebug }}{{ else }}0{{ end }}
    corelog=-1
    log_stderror=yes
    # Keep allocator diagnostics disabled in the production foreground log.
    memdbg=4
    memlog=4
    children=2
    auto_aliases=no
    {{- if .Values.kamailio.sipLogging.diagnostics.sdp }}
    onsend_route_reply=1
    {{- end }}
    # Envoy terminates public TLS and sends PROXY v2 before the decrypted SIP
    # stream, so $si remains the carrier IP.
    tcp_accept_haproxy=yes
    # Required for both the private TLS listener and TLS relays to FreeSWITCH.
    enable_tls=1
    listen=tcp:0.0.0.0:5061 advertise "{{ $siteHost }}":{{ .Values.kamailio.advertisedTLSPort }} name "public_tcp"
    listen=tls:0.0.0.0:5062 advertise "{{ $kamailioHost }}":5062 name "private_tls"
    alias="{{ .Values.sip.globalHost }}:{{ .Values.kamailio.advertisedTLSPort }}"
    alias="{{ $siteHost }}:{{ .Values.kamailio.advertisedTLSPort }}"
    alias="{{ $kamailioHost }}:5062"

    loadmodule "tm.so"
    loadmodule "sl.so"
    loadmodule "rr.so"
    loadmodule "maxfwd.so"
    loadmodule "sanity.so"
    loadmodule "pv.so"
    loadmodule "siputils.so"
    loadmodule "textops.so"
    loadmodule "xlog.so"
    loadmodule "tls.so"
    modparam("tls", "config", "/etc/kamailio/tls.cfg")
    modparam("tls", "xavp_cfg", "tls")
    {{- if .Values.homer.enabled }}
    loadmodule "siptrace.so"
    {{- end }}
    {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
    loadmodule "rtpengine.so"
    loadmodule "textopsx.so"
    {{- end }}

    modparam("rr", "enable_full_lr", 1)
    # Preserve the actual local socket across the private TLS/public TCP
    # double-Record-Route used by the FreeSWITCH leg and the carrier leg.
    modparam("rr", "sockname_mode", 1)
    modparam("sanity", "autodrop", 0)
    modparam("siputils", "rpid_avp", "$avp(s:rpid)")
    {{- if .Values.homer.enabled }}
    modparam("siptrace", "trace_on", 1)
    # Mirror core SIP events as HEP to the configured Homer capture endpoint.
    # Use the Homer TCP HEP listener because Kamailio has no UDP SIP socket.
    modparam("siptrace", "trace_mode", 1)
    modparam("siptrace", "trace_to_database", 0)
    modparam("siptrace", "duplicate_uri", "sip:{{ $fullName }}-homer-heplify.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}:{{ $.Values.homer.capture.hepTCPPort }};transport=tcp")
    modparam("siptrace", "hep_mode_on", 1)
    modparam("siptrace", "hep_version", 3)
    modparam("siptrace", "hep_capture_id", 101)
    {{- end }}
    {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
    modparam("rtpengine", "rtpengine_sock", "udp:{{ $fullName }}-rtpengine.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}:{{ $.Values.rtpengine.controlPort }}")

    route[MEDIA_INITIAL] {
      if (!has_body("application/sdp")) {
        return;
      }
      {{- if .Values.kamailio.sipLogging.diagnostics.sdp }}
      xlog("L_INFO", "SIP media before RTPEngine phase=initial callid=$ci source=$si:$sp did=$rU from=$fu pai=$hdr(P-Asserted-Identity) set=private-control flags=external,internal sdp=$rb\n");
      {{- end }}
      if (!rtpengine_manage("replace-origin external internal")) {
        xlog("L_ERR", "RTPEngine initial SDP handling failed callid=$ci method=$rm source=$si:$sp\n");
        # Do not send an offer to FreeSWITCH if it cannot be anchored. Any
        # answer could otherwise expose FreeSWITCH's private pod address.
        sl_send_reply("503", "Media Relay Unavailable");
        exit;
      }
      xlog("L_INFO", "RTPEngine initial SDP handled callid=$ci method=$rm source=$si:$sp\n");
        {{- if .Values.kamailio.sipLogging.diagnostics.sdp }}
        xlog("L_INFO", "SIP media after RTPEngine phase=initial callid=$ci source=$si:$sp did=$rU from=$fu pai=$hdr(P-Asserted-Identity) sdp=$rb\n");
        {{- end }}
    }

    route[MEDIA_DIALOG] {
      if (has_body("application/sdp")) {
        {{- if .Values.kamailio.sipLogging.diagnostics.sdp }}
        xlog("L_INFO", "SIP media before RTPEngine phase=dialog callid=$ci method=$rm source=$si:$sp did=$rU from=$fu pai=$hdr(P-Asserted-Identity) sdp=$rb\n");
        {{- end }}
        if (!rtpengine_manage("replace-origin")) {
          xlog("L_ERR", "RTPEngine dialog SDP handling failed callid=$ci method=$rm source=$si:$sp\n");
          if (!is_method("ACK")) {
            sl_send_reply("488", "Media Relay Unavailable");
          }
          exit;
        }
          {{- if .Values.kamailio.sipLogging.diagnostics.sdp }}
          xlog("L_INFO", "SIP media after RTPEngine phase=dialog callid=$ci method=$rm source=$si:$sp did=$rU from=$fu pai=$hdr(P-Asserted-Identity) sdp=$rb\n");
          {{- end }}
      } else if (is_method("BYE|CANCEL")) {
        rtpengine_manage();
      }
    }
    {{- end }}

    request_route {
      {{- if .Values.kamailio.sipLogging.enabled }}
      xlog("L_INFO", "SIP request proto=$proto recv=$Ri:$Rp method=$rm source=$si:$sp ruri=$ru route=$hdr(Route) callid=$ci\n");
      {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
      xlog("L_INFO", "SIP diagnostic ingress socket=$Ri:$Rp proto=$proto method=$rm cseq=$hdr(CSeq) source=$si:$sp ruri=$ru route=$hdr(Route) via=$hdr(Via) callid=$ci\n");
      {{- end }}
      {{- end }}
      if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Kamailio rejected malformed SIP from $si:$sp\n");
        exit;
      }

      # Only Flowroute signaling sources may use the public DID termination.
      {{- range .Values.flowroute.signalingCIDRs }}
      if (src_ip == {{ . }}) {
        {{- if $.Values.kamailio.sipLogging.diagnostics.enabled }}
        xlog("L_INFO", "SIP diagnostic ACL=flowroute source=$si:$sp method=$rm callid=$ci\n");
        {{- end }}
        route(FLOWROUTE_AUTHORIZED);
      }
      {{- end }}
      # Permit only established dialogs arriving from the private backend.
      # Initial requests from the backend remain unauthorized.
      if (src_ip == {{ .Values.kamailio.backend.podCIDR }}) {
        if (has_totag()) {
          {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
          xlog("L_INFO", "SIP diagnostic ACL=backend-established source=$si:$sp method=$rm callid=$ci\n");
          {{- end }}
          route(IN_DIALOG);
          exit;
        }
        sl_send_reply("403", "Source Not Authorized");
        exit;
      }
      {{- if .Values.kamailio.sipLogging.enabled }}
      xlog("L_WARN", "Kamailio rejected SIP source=$si:$sp method=$rm ruri=$ru callid=$ci\n");
      {{- end }}
      sl_send_reply("403", "Source Not Authorized");
      exit;
    }

    route[FLOWROUTE_AUTHORIZED] {
      if (is_method("REGISTER")) {
        sl_send_reply("403", "Registration Disabled");
        exit;
      }

      if (is_method("OPTIONS")) {
        sl_send_reply("200", "Keepalive");
        exit;
      }

      if (has_totag()) {
        {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
        xlog("L_INFO", "SIP diagnostic dialog-entry proto=$proto recv=$Ri:$Rp method=$rm source=$si:$sp ruri=$ru route=$hdr(Route) callid=$ci\n");
        {{- end }}
        # Flowroute may send a 2xx ACK to the public Request-URI without a
        # Route header. It is already restricted by the Flowroute source ACL;
        # relay this ACK to the private FreeSWITCH edge so the UAS can match the
        # established dialog instead of rejecting it as an unroutable request.
        if (is_method("ACK") && !is_present_hf("Route")) {
          {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
          xlog("L_WARN", "SIP diagnostic ACK fallback=no-route source=$si:$sp ruri=$ru callid=$ci\n");
          {{- end }}
          route(RELAY);
          exit;
        }
        route(IN_DIALOG);
        exit;
      }

      if (is_method("INVITE|MESSAGE|INFO|UPDATE|PRACK|REFER|NOTIFY")) {
        # TLS is terminated by the Gateway before the PROXY-v2 TCP stream
        # reaches Kamailio; the private dialog leg remains TLS end-to-end.
        {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
        xlog("L_INFO", "SIP diagnostic initial-route transport=tcp public_route=tls:{{ $siteHost }}:{{ .Values.kamailio.advertisedTLSPort }} internal_route=tls:5062 callid=$ci\n");
        {{- end }}
        record_route_preset("{{ $kamailioHost }}:5062;transport=tls;sn=private_tls", "{{ $siteHost }}:{{ .Values.kamailio.advertisedTLSPort }};transport=tls;sn=public_tcp");
        add_rr_param(";r2=on");
        {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
        route(MEDIA_INITIAL);
        {{- end }}
        route(RELAY);
        exit;
      }

      if (is_method("ACK|BYE|CANCEL")) {
        route(RELAY);
        exit;
      }

      sl_send_reply("405", "Method Not Allowed");
      exit;
    }

    route[IN_DIALOG] {
      {{- if .Values.kamailio.sipLogging.enabled }}
      xlog("L_INFO", "SIP in-dialog proto=$proto recv=$Ri:$Rp method=$rm source=$si:$sp callid=$ci route=$hdr(Route)\n");
      {{- end }}
      if (!loose_route()) {
        {{- if .Values.kamailio.sipLogging.enabled }}
        xlog("L_WARN", "SIP in-dialog loose_route=failed method=$rm source=$si:$sp ruri=$ru callid=$ci\n");
        {{- end }}
        sl_send_reply("481", "Call Does Not Exist");
        exit;
      }
      # loose_route() can leave the next dialog hop in the Request-URI while
      # leaving $du empty.  Do not let the initial-request backend fallback in
      # RELAY send that established request back to FreeSWITCH.  The Contact
      # selected by the route set is the destination for this hop, including
      # backend-originated BYE and carrier ACK requests.
      if ($du == $null || $du == "") {
        $du = $ru;
      }
      {{- if .Values.kamailio.sipLogging.enabled }}
      xlog("L_INFO", "SIP in-dialog loose_route=accepted method=$rm source=$si:$sp ruri=$ru next=$du route=$route_uri callid=$ci\n");
      {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
      xlog("L_INFO", "SIP diagnostic in-dialog decision=relay proto=$proto recv=$Ri:$Rp method=$rm cseq=$hdr(CSeq) source=$si:$sp ruri=$ru next=$du route=$route_uri callid=$ci\n");
      {{- end }}
      {{- end }}
      {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
      route(MEDIA_DIALOG);
      {{- end }}
      route(RELAY);
      exit;
    }

    route[RELAY] {
      # Preserve the next hop selected by loose_route() for backend-originated
      # in-dialog traffic. Initial/public requests have no destination yet and
      # are sent to the private FreeSWITCH SIP edge.
      if ($du == $null || $du == "") {
        $du = "sip:{{ $freeswitchHost }}:{{ $.Values.kamailio.backend.servicePort }};transport=tls";
        $xavp(tls=>server_name) = "{{ $freeswitchHost }}";
      }
      {{- if .Values.kamailio.sipLogging.enabled }}
      xlog("L_INFO", "SIP relay proto=$proto recv=$Ri:$Rp method=$rm source=$si:$sp destination=$du callid=$ci\n");
      {{- end }}
      if (!t_relay()) {
        {{- if .Values.kamailio.sipLogging.enabled }}
        xlog("L_ERR", "SIP relay failed method=$rm source=$si:$sp destination=$du callid=$ci\n");
        {{- end }}
        sl_reply_error();
      } else {
        {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
        xlog("L_INFO", "SIP diagnostic relay=queued proto=$proto recv=$Ri:$Rp method=$rm cseq=$hdr(CSeq) source=$si:$sp destination=$du ruri=$ru callid=$ci\n");
        {{- end }}
      }
      exit;
    }

    {{- if or .Values.kamailio.sipLogging.enabled (and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled) }}
    # Core reply processing also covers late 2xx retransmissions forwarded
    # statelessly after TM has removed the transaction. A named t_on_reply
    # callback alone misses those replies and cannot reliably drop final ones.
    reply_route {
      {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
      # Recover offer/answer context when the transaction still exists.
      # Without it, rtpengine_manage treats an SDP reply as an answer.
      if (t_check_trans()) {
        $var(media_reply_transaction) = "matched";
      } else {
        $var(media_reply_transaction) = "unmatched";
      }
      if (has_body("application/sdp")) {
        {{- if .Values.kamailio.sipLogging.diagnostics.sdp }}
        xlog("L_INFO", "SIP media before RTPEngine phase=reply callid=$ci status=$rs source=$si:$sp did=$rU from=$fu pai=$hdr(P-Asserted-Identity) sdp=$rb\n");
        {{- end }}
        if (!rtpengine_manage("replace-origin")) {
          xlog("L_ERR", "RTPEngine reply SDP handling failed callid=$ci status=$rs\n");
          # Dropping the SDP-bearing reply is fail-closed: never forward a
          # FreeSWITCH pod address to the carrier when rewriting failed.
          drop;
        }
        # Commit body edits before forwarding and before reading $rb for
        # diagnostics. This is valid in the core reply route, not a TM callback.
        if (!msg_apply_changes()) {
          xlog("L_ERR", "RTPEngine reply body apply failed callid=$ci status=$rs\n");
          drop;
        }
        {{- if .Values.kamailio.sipLogging.diagnostics.sdp }}
        xlog("L_INFO", "SIP media after RTPEngine phase=reply transaction=$var(media_reply_transaction) callid=$ci cseq=$hdr(CSeq) status=$rs source=$si:$sp sdp=$rb\n");
        {{- end }}
      } else if ($var(media_reply_transaction) == "matched" && $rs =~ "[3-6][0-9][0-9]") {
        rtpengine_manage();
      }
      {{- end }}
      {{- if .Values.kamailio.sipLogging.enabled }}
      xlog("L_INFO", "SIP reply proto=$proto recv=$Ri:$Rp status=$rs reason=$rr source=$si:$sp via=$hdr(Via) callid=$ci\n");
      {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
      xlog("L_INFO", "SIP diagnostic reply socket=$Ri:$Rp proto=$proto status=$rs reason=$rr source=$si:$sp cseq=$hdr(CSeq) via=$hdr(Via) callid=$ci\n");
      {{- end }}
      {{- end }}
      return(1);
    }
    {{- end }}
    {{- if or .Values.kamailio.sipLogging.diagnostics.enabled .Values.kamailio.sipLogging.diagnostics.sdp }}
    # Observe the serialized response buffer, not the original $rb. Emit only
    # ACK routing metadata and SDP address/port lines, never full SIP headers
    # or authentication.
    onsend_route {
      {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
      # ACKs are logged at the serialized send boundary so a packet capture can
      # be matched with Kamailio's selected destination and the same Call-ID.
      if ($snd(buf) =~ "^ACK ") {
        xlog("L_INFO", "SIP wire ACK callid=$ci cseq=$hdr(CSeq) destination=$snd(ip):$snd(port) ruri=$ru route=$hdr(Route)\n");
      }
      {{- end }}
      {{- if .Values.kamailio.sipLogging.diagnostics.sdp }}
      if ($snd(buf) =~ "^SIP/2.0 200 " &&
          $snd(buf) =~ "\r\nc=IN IP" && $snd(buf) =~ "\r\nm=") {
        xlog("L_INFO", "SIP wire SDP answer callid=$ci cseq=$hdr(CSeq) destination=$snd(ip):$snd(port) connection=$(snd(buf){re.subst,/.*\r\n(c=[^\r\n]+)\r\n.*/\\1/s}) media=$(snd(buf){re.subst,/.*\r\n(m=[^\r\n]+)\r\n.*/\\1/s})\n");
      }
      {{- end }}
    }
    {{- end }}
  tls.cfg: |
    # Private Kamailio TLS listener and verified FreeSWITCH TLS client.
    [server:default]
    method = TLSv1.2+
    verify_certificate = no
    require_certificate = no
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt

    [client:default]
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = {{ if .Values.freeswitch.enabled }}/etc/kamailio/tls-ca/ca-certificates.crt{{ else }}/etc/ssl/certs/ca-certificates.crt{{ end }}
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt
{{- end }}
