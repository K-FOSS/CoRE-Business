{{- if .Values.kamailio.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- $backendService := default (printf "%s-freeswitch" $fullName) .Values.kamailio.backend.serviceName -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-kamailio-config
data:
  kamailio.cfg: |
    debug=0
    corelog=-1
    log_stderror=yes
    # Keep allocator diagnostics disabled in the production foreground log.
    memdbg=4
    memlog=4
    children=2
    auto_aliases=no
    enable_tls=yes
    # Envoy Gateway sends the original Flowroute address in PROXY v2 before
    # the TLS ClientHello. Kamailio then exposes it as the source address.
    tcp_accept_haproxy=yes
    listen=tls:0.0.0.0:5061

    loadmodule "tm.so"
    loadmodule "sl.so"
    loadmodule "rr.so"
    loadmodule "maxfwd.so"
    loadmodule "sanity.so"
    loadmodule "pv.so"
    loadmodule "siputils.so"
    loadmodule "textops.so"
    loadmodule "xlog.so"
    loadmodule "tls.so"

    modparam("tls", "config", "/etc/kamailio/tls.cfg")
    modparam("rr", "enable_full_lr", 1)
    modparam("sanity", "autodrop", 0)
    modparam("siputils", "rpid_avp", "$avp(s:rpid)")

    request_route {
{{- if .Values.kamailio.sipLogging.enabled }}
      xlog("L_WARN", "SIP request method=$rm source=$si:$sp ruri=$ru callid=$ci\n");
{{- end }}
      if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Kamailio rejected malformed SIP from $si:$sp\n");
        exit;
      }

      # Only Flowroute signaling sources may use the public DID termination.
{{- range .Values.flowroute.signalingCIDRs }}
      if (src_ip == {{ . }}) {
        route(FLOWROUTE_AUTHORIZED);
      }
{{- end }}
{{- if .Values.kamailio.sipLogging.enabled }}
      xlog("L_WARN", "Kamailio rejected SIP source=$si:$sp method=$rm ruri=$ru callid=$ci\n");
{{- end }}
      sl_send_reply("403", "Source Not Authorized");
      exit;
    }

    route[FLOWROUTE_AUTHORIZED] {
      if (is_method("REGISTER")) {
        sl_send_reply("403", "Registration Disabled");
        exit;
      }

      if (is_method("OPTIONS")) {
        sl_send_reply("200", "Keepalive");
        exit;
      }

      if (has_totag() && loose_route()) {
        route(RELAY);
        exit;
      }

      if (is_method("INVITE|MESSAGE|INFO|UPDATE|PRACK|REFER|NOTIFY")) {
        record_route();
        route(RELAY);
        exit;
      }

      if (is_method("ACK|BYE|CANCEL")) {
        route(RELAY);
        exit;
      }

      sl_send_reply("405", "Method Not Allowed");
      exit;
    }

    route[RELAY] {
      $du = "sip:{{ $backendService }}.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}:{{ $.Values.kamailio.backend.servicePort }};transport=udp";
{{- if .Values.kamailio.sipLogging.enabled }}
      if (!is_method("ACK")) {
        t_on_reply("KAMAILIO_SIP_REPLY");
      }
      xlog("L_WARN", "SIP relay method=$rm source=$si:$sp destination=$du callid=$ci\n");
{{- end }}
      if (!t_relay()) {
{{- if .Values.kamailio.sipLogging.enabled }}
        xlog("L_ERR", "SIP relay failed method=$rm source=$si:$sp destination=$du callid=$ci\n");
{{- end }}
        sl_reply_error();
      }
      exit;
    }

{{- if .Values.kamailio.sipLogging.enabled }}
    onreply_route[KAMAILIO_SIP_REPLY] {
      xlog("L_WARN", "SIP reply status=$rs reason=$rr source=$si:$sp callid=$ci\n");
    }
{{- end }}
  tls.cfg: |
    [server:default]
    method = TLSv1.2+
    verify_certificate = no
    require_certificate = no
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt
{{- end }}
