{{- if .Values.kamailio.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- $backendService := default (printf "%s-freeswitch" $fullName) .Values.kamailio.backend.serviceName -}}
{{- $siteHost := include "avoip.sip.siteHost" . -}}
{{- $publicSipHost := include "avoip.sip.publicHost" . -}}
{{- $kamailioHost := include "avoip.sip.serviceHost" (dict "root" . "component" "kamailio") -}}
{{- $freeswitchHost := default (printf "%s.%s.svc.%s" $backendService $.Release.Namespace (required "cluster.domain is required for SIP backend routing" $.Values.cluster.domain)) .Values.freeswitch.sip.serviceHost -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-kamailio-config
data:
  kamailio.cfg: |
    debug={{ if .Values.kamailio.sipLogging.diagnostics.enabled }}{{ .Values.kamailio.sipLogging.diagnostics.coreDebug }}{{ else }}0{{ end }}
    corelog=-1
    log_stderror=yes
    children=2
    auto_aliases=no
    {{- if or .Values.kamailio.sipLogging.diagnostics.enabled .Values.kamailio.sipLogging.diagnostics.sdp }}
    onsend_route_reply=1
    {{- end }}
    # Envoy passes the encrypted TCP stream and prepends PROXY v2 so $si
    # remains the carrier IP. Kamailio owns TLS for the complete SIP session.
    tcp_accept_haproxy=yes
    # Required for both the private TLS listener and TLS relays to FreeSWITCH.
    enable_tls=1
    listen=tls:0.0.0.0:5061 advertise "{{ $publicSipHost }}":{{ .Values.kamailio.advertisedTLSPort }} name "public_tls"
    listen=tls:0.0.0.0:5062 advertise "{{ $kamailioHost }}":5062 name "private_tls"
    alias="{{ .Values.sip.globalHost }}:{{ .Values.kamailio.advertisedTLSPort }}"
    alias="{{ $siteHost }}:{{ .Values.kamailio.advertisedTLSPort }}"
    alias="{{ $kamailioHost }}:5062"

    loadmodule "tm.so"
    loadmodule "sl.so"
    loadmodule "rr.so"
    loadmodule "corex.so"
    loadmodule "maxfwd.so"
    loadmodule "sanity.so"
    loadmodule "pv.so"
    loadmodule "siputils.so"
    loadmodule "textops.so"
    loadmodule "xlog.so"
    loadmodule "tls.so"
    modparam("tls", "config", "/etc/kamailio/tls.cfg")
    modparam("tls", "xavp_cfg", "tls")
    {{- if (include "avoip.homer.enabled" . | trim) }}
    loadmodule "siptrace.so"
    {{- end }}
    {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
    loadmodule "rtpengine.so"
    loadmodule "textopsx.so"
    {{- end }}

    # Preserve the actual local socket across the private/public TLS
    # double-Record-Route used by the FreeSWITCH leg and the carrier leg.
    modparam("rr", "sockname_mode", 1)
    modparam("sanity", "autodrop", 0)
    {{- if (include "avoip.homer.enabled" . | trim) }}
    modparam("siptrace", "trace_on", 1)
    # Mirror core SIP events as HEP to the configured Homer capture endpoint.
    # Use the Homer TCP HEP listener because Kamailio has no UDP SIP socket.
    modparam("siptrace", "trace_mode", 1)
    modparam("siptrace", "trace_to_database", 0)
    modparam("siptrace", "duplicate_uri", "sip:{{ $fullName }}-homer-heplify.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}:{{ $.Values.homer.capture.hepTCPPort }};transport=tcp")
    modparam("siptrace", "hep_mode_on", 1)
    modparam("siptrace", "hep_version", 3)
    modparam("siptrace", "hep_capture_id", 101)
    {{- end }}
    {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
    modparam("rtpengine", "rtpengine_sock", "udp:{{ $fullName }}-rtpengine.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}:{{ $.Values.rtpengine.controlPort }}")
    # Re-probe the stable control Service after failure instead of suppressing
    # commands for Kamailio's 60-second default disabled-node timeout.
    modparam("rtpengine", "rtpengine_disable_tout", {{ .Values.rtpengine.recovery.disableTimeoutSeconds }})
    modparam("rtpengine", "aggressive_redetection", {{ if .Values.rtpengine.recovery.aggressiveRedetection }}1{{ else }}0{{ end }})
    modparam("rtpengine", "ping_interval", {{ .Values.rtpengine.recovery.pingIntervalSeconds }})

    route[MEDIA_INITIAL] {
      if (!has_body("application/sdp")) {
        return;
      }
      if (!rtpengine_manage("replace-origin external internal")) {
        xlog("L_ERR", "RTPEngine initial SDP handling failed callid=$ci method=$rm source=$si:$sp\n");
        # Do not send an offer to FreeSWITCH if it cannot be anchored. Any
        # answer could otherwise expose FreeSWITCH's private pod address.
        sl_send_reply("503", "Media Relay Unavailable");
        exit;
      }
    }

    route[MEDIA_DIALOG] {
      if (has_body("application/sdp")) {
        if (!rtpengine_manage("replace-origin")) {
          xlog("L_ERR", "RTPEngine dialog SDP handling failed callid=$ci method=$rm source=$si:$sp\n");
          if (!is_method("ACK")) {
            sl_send_reply("488", "Media Relay Unavailable");
          }
          exit;
        }
      } else if (is_method("BYE|CANCEL")) {
        rtpengine_manage();
      }
    }
    {{- end }}

    request_route {
      if (is_method("ACK")) {
        xlog("L_INFO", "SIP ack ingress pod=$env(POD_NAME) callid=$ci cseq=$hdr(CSeq) conn=$conid recv=$Ri:$Rp proto=$proto source=$si:$sp ruri=$ru route=$hdr(Route)\n");
      }
      if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "SIP reject reason=malformed pod=$env(POD_NAME) method=$rm source=$si:$sp callid=$ci\n");
        exit;
      }
      if (!mf_process_maxfwd_header("10")) {
        xlog("L_WARN", "SIP reject reason=max-forwards pod=$env(POD_NAME) method=$rm source=$si:$sp callid=$ci\n");
        if (!is_method("ACK")) sl_send_reply("483", "Too Many Hops");
        exit;
      }
      # The public socket receives Envoy's passthrough TLS and PROXY v2.
      # The private socket is for FreeSWITCH, with a pod-selector policy on 5062.
      if ($proto == "tls" && $Rp == 5061) {
        {{- range .Values.flowroute.signalingCIDRs }}
        if (src_ip == {{ . }}) {
          $var(side) = "carrier";
          route(FROM_CARRIER);
          exit;
        }
        {{- end }}
      }
      if ($proto == "tls" && $Rp == 5062 && src_ip == {{ .Values.kamailio.backend.podCIDR }}) {
        $var(side) = "backend";
        route(FROM_BACKEND);
        exit;
      }
      xlog("L_WARN", "SIP reject reason=source-or-socket pod=$env(POD_NAME) method=$rm source=$si:$sp recv=$Ri:$Rp proto=$proto callid=$ci\n");
      if (!is_method("ACK")) sl_send_reply("403", "Source Not Authorized");
      exit;
    }

    route[FROM_CARRIER] {
      # Flowroute may use an ephemeral TLS source port without Via rport.
      force_rport();
      if (is_method("REGISTER")) {
        sl_send_reply("403", "Registration Disabled");
        exit;
      }
      if (is_method("OPTIONS")) {
        sl_send_reply("200", "Keepalive");
        exit;
      }
      # TM consumes ACKs to negative finals. A 2xx ACK continues through the
      # Route set even after the original INVITE transaction expires.
      if (is_method("ACK")) t_check_trans();
      if (is_method("CANCEL")) {
        if (t_check_trans()) {
          set_send_socket_name("private_tls");
          route(RELAY);
        }
        sl_send_reply("481", "Call Does Not Exist");
        exit;
      }
      if (has_totag()) {
        route(IN_DIALOG);
        exit;
      }
      if (is_method("ACK")) {
        xlog("L_WARN", "SIP ack drop reason=no-dialog-route pod=$env(POD_NAME) callid=$ci cseq=$hdr(CSeq) source=$si:$sp\n");
        exit;
      }
      if (is_method("INVITE|MESSAGE|INFO|UPDATE|PRACK|REFER|NOTIFY")) {
        route(INITIAL_BACKEND);
        exit;
      }
      xlog("L_WARN", "SIP reject reason=unsupported-initial pod=$env(POD_NAME) method=$rm callid=$ci\n");
      sl_send_reply("405", "Method Not Allowed");
      exit;
    }

    route[FROM_BACKEND] {
      # A To tag alone is not proof of a dialog; IN_DIALOG checks the private
      # local Route URI before selecting an external destination.
      if (is_method("ACK")) t_check_trans();
      if (is_method("CANCEL")) {
        if (t_check_trans()) {
          set_send_socket_name("public_tls");
          route(RELAY);
        }
        sl_send_reply("481", "Call Does Not Exist");
        exit;
      }
      if (has_totag()) {
        route(IN_DIALOG);
        exit;
      }
      xlog("L_WARN", "SIP reject reason=backend-initial pod=$env(POD_NAME) method=$rm source=$si:$sp callid=$ci\n");
      if (!is_method("ACK")) sl_send_reply("403", "Source Not Authorized");
      exit;
    }

    route[INITIAL_BACKEND] {
      record_route_preset("{{ $kamailioHost }}:5062;transport=tls;sn=private_tls", "{{ $publicSipHost }}:{{ .Values.kamailio.advertisedTLSPort }};transport=tls;sn=public_tls");
      add_rr_param(";r2=on");
      {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
      route(MEDIA_INITIAL);
      {{- end }}
      route(TO_BACKEND);
      route(RELAY);
      exit;
    }

    route[IN_DIALOG] {
      if (!is_method("ACK|BYE|UPDATE|INVITE|INFO|REFER|PRACK|NOTIFY")) {
        route(REJECT_DIALOG);
      }
      if (!is_present_hf("Route")) {
        route(REJECT_DIALOG);
      }
      # A carrier request must target the public Contact we advertised.
      if ($var(side) == "carrier" && $rd != "{{ $publicSipHost }}") {
        route(REJECT_DIALOG);
      }
      if ($var(side) == "carrier") {
        if ($(route_uri{uri.host}) != "{{ $publicSipHost }}" ||
            $(route_uri{uri.port}) != "{{ .Values.kamailio.advertisedTLSPort }}" ||
            $(route_uri{uri.transport}) != "tls" ||
            $(route_uri{uri.param,sn}) != "public_tls") route(REJECT_DIALOG);
        # The public Contact names this proxy; skip strict R-URI detection.
        if (!loose_route_mode("1")) route(REJECT_DIALOG);
        route(TO_BACKEND);
      } else {
        # Backend-originated in-dialog requests must enter through the
        # private Kamailio Record-Route identity.
        if ($(route_uri{uri.host}) != "{{ $kamailioHost }}" ||
            $(route_uri{uri.port}) != "5062" ||
            $(route_uri{uri.transport}) != "tls" ||
            $(route_uri{uri.param,sn}) != "private_tls") {
          route(REJECT_DIALOG);
        }

        # This is the first half of our paired Record-Route set. r2=on tells
        # rr to process both corresponding Route headers together, so do not
        # attempt to consume the public half with a second loose_route call.
        if (!loose_route_mode("1")) {
          route(REJECT_DIALOG);
        }

        route(TO_CARRIER);
      }
      {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
      route(MEDIA_DIALOG);
      {{- end }}
      if (is_method("ACK")) {
        xlog("L_INFO", "SIP ack decision=relay pod=$env(POD_NAME) callid=$ci cseq=$hdr(CSeq) side=$var(side) recv=$Ri:$Rp source=$si:$sp ruri=$ru route=$route_uri next=$du socket=$fsn\n");
      }
      {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
      if (!is_method("ACK")) {
        xlog("L_INFO", "SIP dialog decision=relay pod=$env(POD_NAME) callid=$ci method=$rm side=$var(side) ruri=$ru route=$route_uri next=$du socket=$fsn\n");
      }
      {{- end }}
      route(RELAY);
      exit;
    }

    route[REJECT_DIALOG] {
      xlog("L_WARN", "SIP dialog reject pod=$env(POD_NAME) callid=$ci method=$rm cseq=$hdr(CSeq) side=$var(side) source=$si:$sp recv=$Ri:$Rp ruri=$ru route=$hdr(Route)\n");
      if (!is_method("ACK")) sl_send_reply("481", "Call Does Not Exist");
      exit;
    }

    route[TO_BACKEND] {
      # FreeSWITCH has one replica in this chart; the Service resolves to that
      # dialog endpoint. Multiple backend replicas require dialog affinity.
      $du = "sip:{{ $freeswitchHost }}:{{ .Values.kamailio.backend.servicePort }};transport=tls";
      $xavp(tls=>server_name) = "{{ $freeswitchHost }}";
      set_send_socket_name("private_tls");
    }

    route[TO_CARRIER] {
      if ($du == $null || $du == "") $du = $ru;
      set_send_socket_name("public_tls");
    }

    route[RELAY] {
      if (!t_relay()) {
        xlog("L_ERR", "SIP relay failure pod=$env(POD_NAME) callid=$ci method=$rm side=$var(side) recv=$Ri:$Rp next=$du socket=$fsn\n");
        if (!is_method("ACK")) sl_reply_error();
        exit;
      }
      {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
      xlog("L_INFO", "SIP relay queued pod=$env(POD_NAME) callid=$ci method=$rm side=$var(side) next=$du socket=$fsn\n");
      {{- end }}
      exit;
    }

    {{- if or .Values.freeswitch.enabled .Values.kamailio.sipLogging.enabled }}
    # Core reply processing also covers late 2xx retransmissions forwarded
    # statelessly after TM has removed the transaction. A named t_on_reply
    # callback alone misses those replies and cannot reliably drop final ones.
    reply_route {
      if (t_check_trans()) {
        $var(reply_transaction) = "matched";
      } else {
        $var(reply_transaction) = "unmatched";
      }
      # Only FreeSWITCH INVITE replies heading to the carrier cross this
      # topology boundary. In reply_route $Rp names the original request's
      # receiving socket, so use the source plus transaction/private route.
      if (src_ip == {{ .Values.kamailio.backend.podCIDR }} && $hdr(CSeq) =~ "INVITE" &&
          ($var(reply_transaction) == "matched" || $hdr(Record-Route) =~ "sn=private_tls")) {
        if (remove_hf_match("Record-Route", "in", "{{ $kamailioHost }}:5062;transport=tls;sn=private_tls")) {
          subst_hf("Record-Route", "/(sn=public_tls[^>]*);r2=on/\\1/", "a");
        }
        if ($rs =~ "^(180|183|2[0-9][0-9])$" && is_present_hf("Contact")) {
          if (!subst_hf("Contact", "/<sips?:([^@>]+)@[^;>]+(;[^>]*)?>/<sips:\\1@{{ $publicSipHost }}:{{ .Values.kamailio.advertisedTLSPort }}\\2>/", "a")) {
            xlog("L_ERR", "SIP reply drop reason=contact-rewrite pod=$env(POD_NAME) callid=$ci status=$rs\n");
            drop;
          }
        }
      }
      {{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.freeswitch.enabled }}
      # Without transaction context rtpengine_manage cannot infer a late
      # duplicate answer, so retain the existing reply processing behavior.
      if (has_body("application/sdp")) {
        if (!rtpengine_manage("replace-origin")) {
          xlog("L_ERR", "RTPEngine reply SDP handling failed callid=$ci status=$rs\n");
          # Dropping the SDP-bearing reply is fail-closed: never forward a
          # FreeSWITCH pod address to the carrier when rewriting failed.
          drop;
        }
        # Commit body edits before forwarding and before reading $rb for
        # diagnostics. This is valid in the core reply route, not a TM callback.
        if (!msg_apply_changes()) {
          xlog("L_ERR", "RTPEngine reply body apply failed callid=$ci status=$rs\n");
          drop;
        }
      } else if ($var(reply_transaction) == "matched" && $rs =~ "[3-6][0-9][0-9]") {
        rtpengine_manage();
      }
      {{- end }}
      {{- if .Values.kamailio.sipLogging.enabled }}
      xlog("L_INFO", "SIP reply pod=$env(POD_NAME) callid=$ci cseq=$hdr(CSeq) status=$rs source=$si:$sp recv=$Ri:$Rp\n");
      {{- end }}
      return(1);
    }
    {{- end }}
    # Observe serialized bytes and the actual chosen send socket. This is a
    # local send observation, not confirmation that the peer received SIP.
    onsend_route {
      if ($snd(buf) =~ "^ACK ") {
        xlog("L_INFO", "SIP ack send pod=$env(POD_NAME) callid=$ci cseq=$hdr(CSeq) conn=$conid recv=$Ri:$Rp source=$si:$sp socket=$sndfrom(proto):$sndfrom(ip):$sndfrom(port) socket_name=$fsn destination=$snd(ip):$snd(port) ruri=$ru\n");
      }
      {{- if .Values.kamailio.sipLogging.diagnostics.enabled }}
      if ($snd(buf) =~ "^(INVITE|BYE|CANCEL|UPDATE) ") {
        xlog("L_INFO", "SIP wire request pod=$env(POD_NAME) callid=$ci method=$rm cseq=$hdr(CSeq) conn=$conid socket=$sndfrom(proto):$sndfrom(ip):$sndfrom(port) socket_name=$fsn destination=$snd(ip):$snd(port)\n");
      }
      if ($snd(buf) =~ "^SIP/2.0 (180|183|2[0-9][0-9]) " && $hdr(CSeq) =~ "INVITE" &&
          $snd(buf) =~ "\r\nContact:" && $snd(buf) =~ "\r\nRecord-Route:") {
        xlog("L_INFO", "SIP wire invite-reply pod=$env(POD_NAME) callid=$ci status=$rs destination=$snd(ip):$snd(port) contact=$(snd(buf){re.subst,/.*\r\n(Contact:[^\r\n]+)\r\n.*/\\1/s}) routes=$(snd(buf){re.subst,/.*\r\n(Record-Route:[^\r\n]+)\r\n.*/\\1/s})\n");
      }
      {{- end }}
      {{- if .Values.kamailio.sipLogging.diagnostics.sdp }}
      if (($snd(buf) =~ "^INVITE " || $snd(buf) =~ "^SIP/2.0 (180|183|200) ") &&
          $snd(buf) =~ "\r\nc=IN IP" && $snd(buf) =~ "\r\nm=") {
        xlog("L_INFO", "SIP wire SDP pod=$env(POD_NAME) callid=$ci method=$rm status=$rs destination=$snd(ip):$snd(port) connection=$(snd(buf){re.subst,/.*\r\n(c=[^\r\n]+)\r\n.*/\\1/s}) media=$(snd(buf){re.subst,/.*\r\n(m=[^\r\n]+)\r\n.*/\\1/s})\n");
      }
      {{- end }}
    }
  tls.cfg: |
    # Private Kamailio TLS listener and verified FreeSWITCH TLS client.
    [server:default]
    method = TLSv1.2+
    verify_certificate = no
    require_certificate = no
    private_key = /etc/kamailio/tls/tls.key
    certificate = /etc/kamailio/tls/tls.crt

    [client:default]
    method = TLSv1.2+
    verify_certificate = yes
    require_certificate = no
    ca_list = {{ if .Values.freeswitch.enabled }}/etc/kamailio/tls-ca/ca-certificates.crt{{ else }}/etc/ssl/certs/ca-certificates.crt{{ end }}
{{- end }}
