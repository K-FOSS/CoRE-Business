{{- define "avoip.kamailio.render.K8GB" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.enabled .Values.sip.globalRouting.enabled }}
{{- $fullName := include "avoip.fullname" . -}}
{{- $gslbName := printf "%s-sip" $fullName | trunc 63 | trimSuffix "-" -}}
{{- $parentZone := regexReplaceAll "^[^.]+\\." .Values.sip.globalHost "" -}}
{{- if not .Values.sip.globalRouting.primaryGeoTag }}
{{- fail "sip.globalRouting.primaryGeoTag is required when global SIP routing is enabled" }}
{{- end }}
{{- if eq $parentZone .Values.sip.globalHost }}
{{- fail "sip.globalHost must be a hostname below its parent DNS zone" }}
{{- end }}
---
apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: {{ $gslbName }}
  annotations:
    k8gb.io/hostname: '{{ .Values.sip.globalHost }}'
spec:
  resourceRef:
    apiVersion: gateway.networking.k8s.io/v1
    kind: TLSRoute
    name: {{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "global") }}
  strategy:
    type: failover
    dnsTtlSeconds: {{ .Values.sip.globalRouting.dnsTtlSeconds }}
    primaryGeoTag: '{{ .Values.sip.globalRouting.primaryGeoTag }}'
---
apiVersion: k8gb.io/v1beta1
kind: ZoneDelegation
metadata:
  name: {{ $gslbName }}
spec:
  loadBalancedZone: '{{ .Values.sip.globalHost }}'
  parentZone: '{{ $parentZone }}'
  dnsZoneNegTTL: {{ .Values.sip.globalRouting.dnsZoneNegTTL }}
  doFinalize: {{ .Values.sip.globalRouting.doFinalize }}
{{- end }}
{{ end }}
{{- $root := . -}}
{{- range $instance := (include "avoip.kamailio.instances" $root | fromYamlArray) -}}
{{- if $instance.enabled -}}
{{- $values := deepCopy $root.Values -}}
{{- $_ := set $values "kamailio" $instance -}}
{{- $ctx := dict "Values" $values "Release" $root.Release "Chart" $root.Chart "Files" $root.Files "Capabilities" $root.Capabilities -}}
{{ include "avoip.kamailio.render.K8GB" $ctx }}
{{ end }}
{{ end }}
