{{- $root := . -}}
{{- range $instance := (include "avoip.kamailio.instances" $root | fromYamlArray) -}}
{{- if and $instance.enabled (eq $instance.role "private-sbc") }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "avoip.kamailio.resourceName" (dict "root" $root "instance" $instance "suffix" "sip-policy") }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: '{{ include "avoip.kamailio.component" $instance }}'
      app.kubernetes.io/instance: '{{ $root.Release.Name }}'
  ingress:
    {{- if and (not $instance.privateRouting.peers) (not (and $.Values.asterisk.enabled $.Values.asterisk.sipCore.enabled (or (eq $instance.name $.Values.asterisk.sipCore.kamailioInstance) $instance.websocketHA.enabled $instance.websocketHA.legacyOwner))) }} []
    {{- else }}
    {{- if and $.Values.asterisk.enabled $.Values.asterisk.sipCore.enabled (or (eq $instance.name $.Values.asterisk.sipCore.kamailioInstance) $instance.websocketHA.enabled $instance.websocketHA.legacyOwner) }}
    {{- if and $.Values.asterisk.sipCore.tls.enabled (eq $instance.name (default (default $.Values.asterisk.sipCore.kamailioInstance $.Values.asterisk.sipCore.ingressKamailioInstance) $.Values.asterisk.sipCore.tls.ingressKamailioInstance)) }}
    - fromEndpoints:
        - matchLabels:
            'k8s:io.kubernetes.pod.namespace': '{{ $instance.networkPolicy.envoy.namespace }}'
            app.kubernetes.io/name: '{{ $instance.networkPolicy.envoy.podName }}'
      toPorts:
        - ports:
            - port: '{{ $.Values.asterisk.sipCore.tls.port }}'
              protocol: 'TCP'
    {{- end }}
    - fromEndpoints:
        - matchLabels:
            'k8s:io.kubernetes.pod.namespace': '{{ $instance.networkPolicy.envoy.namespace }}'
            app.kubernetes.io/name: '{{ $instance.networkPolicy.envoy.podName }}'
      toPorts:
        - ports:
            - port: '{{ $.Values.asterisk.sipCore.httpPort }}'
              protocol: 'TCP'
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: 'asterisk'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '{{ $.Values.asterisk.sipCore.privateEgressPort }}'
              protocol: 'TCP'
    {{- if and $.Values.freeswitch.enabled $.Values.freeswitch.flowrouteOutbound.enabled (eq $instance.name $.Values.asterisk.sipCore.kamailioInstance) }}
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: 'freeswitch'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '5062'
              protocol: 'TCP'
    {{- end }}
    {{- end }}
    {{- if and $instance.registrar.enabled $instance.websocketHA.enabled }}
    # A DB lookup on any replica follows the stored Path to its flow owner.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: '{{ include "avoip.kamailio.component" $instance }}'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '{{ $.Values.asterisk.sipCore.privateEgressPort }}'
              protocol: 'TCP'
    # FreeSWITCH can return in-dialog requests to this owner listener.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: 'freeswitch'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '{{ $.Values.asterisk.sipCore.privateEgressPort }}'
              protocol: 'TCP'
    {{- end }}
    {{- range $peer := $instance.privateRouting.peers }}
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: '{{ $peer.controller }}'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '5062'
              protocol: 'TCP'
    {{- end }}
    {{- if and $root.Values.avoipAdmin.enabled $root.Values.avoipAdmin.telephony.enabled }}
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: 'avoip-admin'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '{{ default (dig "defaults" "controlPort" 2046 $root.Values.kamailio) $root.Values.kamailio.controlPort }}'
              protocol: 'TCP'
    {{- end }}
    {{- end }}
  egress:
    {{ if and $root.Values.avoipAdmin.enabled $root.Values.avoipAdmin.routing.enabled (not ($instance.websocketHA | default dict).enabled) }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: 'avoip-admin'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '8081'
              protocol: 'TCP'
    {{ end }}
    {{- if $instance.registrar.enabled }}
    - toFQDNs:
        - matchName: '{{ $instance.registrar.database.host }}'
      toPorts:
        - ports:
            - port: '{{ $instance.registrar.database.port }}'
              protocol: 'TCP'
    {{- if $instance.websocketHA.enabled }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: '{{ include "avoip.kamailio.component" $instance }}'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '{{ $.Values.asterisk.sipCore.privateEgressPort }}'
              protocol: 'TCP'
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: 'freeswitch'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '5072'
              protocol: 'TCP'
    {{- end }}
    {{- end }}
    {{- if $instance.carrierOutbound.enabled }}
    - toEndpoints:
        - matchLabels:
            'k8s:io.kubernetes.pod.namespace': '{{ $instance.carrierOutbound.gatewayNamespace }}'
            app.kubernetes.io/name: 'envoy'
            gateway.envoyproxy.io/owning-gateway-name: 'main-gw'
            gateway.envoyproxy.io/owning-gateway-namespace: '{{ $root.Release.Namespace }}'
      toPorts:
        - ports:
            - port: '5061'
              protocol: 'TCP'
    {{- end }}
    {{- $sipCoreEnabled := and $.Values.asterisk.enabled $.Values.asterisk.sipCore.enabled (or (eq $instance.name $.Values.asterisk.sipCore.kamailioInstance) $instance.websocketHA.enabled $instance.websocketHA.legacyOwner) }}
    {{- if $sipCoreEnabled }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: 'asterisk'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '5061'
              protocol: 'TCP'
    {{- if and $.Values.freeswitch.enabled $.Values.freeswitch.flowrouteOutbound.enabled (eq $instance.name $.Values.asterisk.sipCore.kamailioInstance) }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: 'freeswitch'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '{{ $.Values.freeswitch.flowrouteOutbound.tlsPort }}'
              protocol: 'TCP'
    {{- end }}
    {{- end }}
    {{- if or $instance.functions.media $sipCoreEnabled }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: 'rtpengine'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
          {{- if or $.Values.rtpengine.control.websocketEnabled (eq $.Values.rtpengine.control.transport "websocket") }}
            - port: '{{ $.Values.rtpengine.controlPort }}'
              protocol: 'UDP'
            - port: '{{ $.Values.rtpengine.control.websocketPort }}'
              protocol: 'TCP'
          {{- else }}
            - port: '{{ $.Values.rtpengine.controlPort }}'
              protocol: 'UDP'
          {{- end }}
    {{- end }}
    {{- range $destination := $instance.privateRouting.destinations }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: '{{ $destination.controller }}'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '{{ trimPrefix "sips:" $destination.uri | splitList ":" | last }}'
              protocol: 'TCP'
    {{- end }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: 'dragonfly'
            app.kubernetes.io/instance: 'dragonfly-core'
      toPorts:
        - ports:
            - port: '6379'
              protocol: 'TCP'
    - toEndpoints:
        - matchLabels:
            'k8s:io.kubernetes.pod.namespace': 'kube-system'
            k8s-app: 'kube-dns'
      toPorts:
        - ports:
            - port: '53'
              protocol: 'UDP'
            - port: '53'
              protocol: 'TCP'
{{ end }}
{{ end }}
{{ $root := . }}
{{- range $instance := (include "avoip.kamailio.instances" $root | fromYamlArray) -}}
{{- if and $instance.enabled $instance.registrar.database.enabled -}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: '{{ include "avoip.kamailio.resourceName" (dict "root" $root "instance" $instance "suffix" "registrar-schema-policy") }}'
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: '{{ include "avoip.kamailio.component" $instance }}-registrar-schema'
      app.kubernetes.io/instance: '{{ $root.Release.Name }}'
  ingress: []
  egress:
    - toFQDNs:
        - matchName: '{{ $instance.registrar.database.host }}'
      toPorts:
        - ports:
            - port: '{{ $instance.registrar.database.port }}'
              protocol: 'TCP'
    - toEndpoints:
        - matchLabels:
            'k8s:io.kubernetes.pod.namespace': 'kube-system'
            k8s-app: 'kube-dns'
      toPorts:
        - ports:
            - port: '53'
              protocol: 'UDP'
            - port: '53'
              protocol: 'TCP'
{{ end }}
{{ end }}
