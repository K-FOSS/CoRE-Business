{{- if and .Values.freeswitch.enabled .Values.freeswitch.publicExposure.enabled .Values.freeswitch.publicExposure.sip.enabled .Values.freeswitch.publicExposure.sip.tcpEnabled }}
{{- $fullName := include "avoip.fullname" . -}}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ $fullName }}-freeswitch

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ $.Values.gateway.namespace }}
      name: {{ $.Values.gateway.name }}
      sectionName: sip-tcp

  rules:
    - backendRefs:
      - name: {{ $fullName }}-ext-freeswitch
        port: 5060
{{- end }}
