{{- define "avoip.kamailio.render.ToposRedis" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- if and .Values.kamailio.topology.enabled }}
{{- $redis := .Values.kamailio.topology.redis }}
{{- $remoteKey := default (printf "Storage/DragonFly/CoRE/%s/%s/%s/Creds" .Values.region .Values.datacenter .Values.cluster.name) $redis.remoteRef.key }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $redis.secretName }}'
spec:
  refreshInterval: '1h'
  target:
    name: '{{ $redis.secretName }}'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
    template:
      engineVersion: 'v2'
      type: 'Opaque'
      data:
        # ndb_redis in the pinned Kamailio image has no Redis TLS support.
        # The pod-local HAProxy bridge performs verified TLS to Dragonfly.
        server: 'name=topos;addr=127.0.0.1;port={{ $redis.proxyPort }};db={{ $redis.database }};pass={{ `{{ .password }}` }};tls=0'
  secretStoreRef:
    kind: '{{ $redis.secretStoreRef.kind }}'
    name: '{{ $redis.secretStoreRef.name }}'
  data:
    - secretKey: 'password'
      remoteRef:
        key: '{{ $remoteKey }}'
        property: '{{ $redis.remoteRef.property }}'
{{- end }}
{{ end }}
{{- $root := . -}}
{{- range $instance := (include "avoip.kamailio.instances" $root | fromYamlArray) -}}
{{- if $instance.enabled -}}
{{- $values := deepCopy $root.Values -}}
{{- $_ := set $values "kamailio" $instance -}}
{{- $ctx := dict "Values" $values "Release" $root.Release "Chart" $root.Chart "Files" $root.Files "Capabilities" $root.Capabilities -}}
{{ include "avoip.kamailio.render.ToposRedis" $ctx }}
{{ end }}
{{ end }}
