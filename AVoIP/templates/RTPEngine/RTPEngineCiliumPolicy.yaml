{{- if (include "avoip.rtpengine.enabled" . | trim) }}
{{- $root := . -}}
{{- $instances := include "avoip.kamailio.instances" . | fromYamlArray -}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: '{{ include "avoip.fullname" . }}-rtpengine-ingress'
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: 'rtpengine'
      app.kubernetes.io/instance: '{{ .Release.Name }}'
  ingress:
    - fromEntities: ['cluster', 'host', 'remote-node', 'world']
      toPorts:
        - ports:
            - port: '{{ .Values.rtpengine.media.min }}'
              endPort: {{ sub (.Values.rtpengine.media.max | int) 1 }}
              protocol: 'UDP'
    {{- range $instance := $instances }}
    {{- if $instance.enabled }}
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/controller: '{{ include "avoip.kamailio.component" $instance }}'
            app.kubernetes.io/instance: '{{ $root.Release.Name }}'
      toPorts:
        - ports:
            - port: '{{ $root.Values.rtpengine.controlPort }}'
              protocol: 'UDP'
            {{- if eq $root.Values.rtpengine.control.transport "websocket" }}
            - port: '{{ $root.Values.rtpengine.control.websocketPort }}'
              protocol: 'TCP'
            {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
