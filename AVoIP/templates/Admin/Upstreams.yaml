{{- define "avoip.upstream.gatewayXML" -}}
{{- $root := .root -}}
{{- $upstream := .upstream -}}
{{- $private := include "avoip.kamailio.component" (dict "name" $root.Values.freeswitch.flowrouteOutbound.kamailioInstance) -}}
{{- $proxy := include "avoip.sip.serviceHost" (dict "root" $root "component" $private) -}}
<include>
  <gateway name="{{ $upstream.name }}">
    {{- if eq .authentication "credentials" }}
    <param name="username" value="{{ `{{ .username | replace "&" "&amp;" | replace "<" "&lt;" | replace ">" "&gt;" | replace "\"" "&quot;" | replace "'" "&apos;" }}` }}"/>
    <param name="auth-username" value="{{ `{{ .username | replace "&" "&amp;" | replace "<" "&lt;" | replace ">" "&gt;" | replace "\"" "&quot;" | replace "'" "&apos;" }}` }}"/>
    <param name="password" value="{{ `{{ .password | replace "&" "&amp;" | replace "<" "&lt;" | replace ">" "&gt;" | replace "\"" "&quot;" | replace "'" "&apos;" }}` }}"/>
    <param name="extension" value="{{ `{{ .username | replace "&" "&amp;" | replace "<" "&lt;" | replace ">" "&gt;" | replace "\"" "&quot;" | replace "'" "&apos;" }}` }}"/>
    <param name="extension-in-contact" value="true"/>
    {{- end }}
    <param name="proxy" value="{{ $upstream.host }}"/>
    <param name="from-domain" value="{{ include "avoip.sip.siteHost" $root }}"/>
    {{- if $upstream.register }}
    <param name="register-proxy" value="{{ $upstream.host }}"/>
    <param name="register-transport" value="tls"/>
    {{- end }}
    <param name="register" value="{{ $upstream.register | default false }}"/>
    <param name="caller-id-in-from" value="true"/>
    <param name="outbound-proxy" value="sips:{{ $proxy }}:5062;transport=tls"/>
  </gateway>
</include>
{{- end -}}

{{- if and .Values.freeswitch.enabled .Values.avoipAdmin.enabled }}
{{- $root := . -}}
{{- $names := dict -}}
{{- range .Values.avoipAdmin.upstreams }}
{{- $authentication := default "credentials" .authentication -}}
{{- if or (hasKey $names .name) (has .name (list "asterisk" "flowroute" "flowroute-tls")) }}{{ fail "additional SIP gateway names must be unique and cannot replace built-in gateways" }}{{ end }}
{{- $_ := set $names .name true -}}
{{- if or (not (regexMatch "^[a-z][a-z0-9-]{0,39}$" .name)) (not (regexMatch "^[a-z0-9][a-z0-9.-]+$" .host)) }}{{ fail "SIP upstream names and hostnames must be canonical and contain no SIP parameters" }}{{ end }}
{{- if not (has $authentication (list "credentials" "ip-acl")) }}{{ fail "SIP upstream authentication must be credentials or ip-acl" }}{{ end }}
{{- if and (eq $authentication "ip-acl") (.register | default false) }}{{ fail "IP ACL upstreams cannot register" }}{{ end }}
{{- if not $root.Values.freeswitch.flowrouteOutbound.enabled }}{{ fail "additional SIP gateways require the existing authenticated FreeSWITCH carrier profile" }}{{ end }}
{{- if eq $authentication "credentials" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ include "avoip.resourceNameWithSuffix" (dict "root" $root "suffix" (printf "upstream-%s" .name)) }}'
spec:
  secretStoreRef:
    kind: '{{ $root.Values.freeswitch.flowrouteOutbound.secretStoreRef.kind }}'
    name: '{{ $root.Values.freeswitch.flowrouteOutbound.secretStoreRef.name }}'
  target:
    creationPolicy: 'Owner'
    template:
      engineVersion: 'v2'
      data:
        gateway.xml: |
{{ include "avoip.upstream.gatewayXML" (dict "root" $root "upstream" . "authentication" $authentication) | indent 10 }}
  data:
    - secretKey: 'username'
      remoteRef:
        key: '{{ required "SIP upstream credential Vault reference is required" .remoteKey }}'
        property: '{{ default "Username" .usernameProperty }}'
    - secretKey: 'password'
      remoteRef:
        key: '{{ .remoteKey }}'
        property: '{{ default "Password" .passwordProperty }}'
{{- end }}
{{- end }}
{{- end }}
