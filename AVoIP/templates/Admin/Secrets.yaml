{{- if and .Values.avoipAdmin.enabled .Values.freeswitch.enabled }}
{{- $name := include "avoip.fullname" . -}}
{{- $db := default (printf "%s-core-voice-sms" $name) .Values.flowrouteSMS.databaseSecret.name -}}
{{- if .Values.avoipAdmin.telephony.enabled }}
{{- $managementSecret := default (printf "%s-telephony-management" $name) .Values.avoipAdmin.telephony.managementSecret.name -}}
{{- $managementRemoteKey := default (printf "AVoIP/Telephony/%s/%s/%s/Admin" .Values.region .Values.datacenter .Values.cluster.name) .Values.avoipAdmin.telephony.managementSecret.remoteKey -}}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: '{{ $managementSecret }}-generator'
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  length: 48
  digits: 0
  symbols: 0
  allowRepeat: true
  encoding: 'hex'
  secretKeys:
    - 'password'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $managementSecret }}-generate'
  annotations:
    argocd.argoproj.io/sync-wave: '-9'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: '{{ $managementSecret }}'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: 'Password'
          name: '{{ $managementSecret }}-generator'
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: '{{ $managementSecret }}-push'
  annotations:
    argocd.argoproj.io/sync-wave: '-8'
spec:
  refreshInterval: '1h'
  updatePolicy: 'Replace'
  deletionPolicy: 'None'
  secretStoreRefs:
    - kind: 'ClusterSecretStore'
      name: 'corevault-rootsecrets'
  selector:
    secret:
      name: '{{ $managementSecret }}'
  data:
    - match:
        secretKey: 'password'
        remoteRef:
          remoteKey: '{{ $managementRemoteKey }}'
          property: 'Password'
{{- end }}
{{- if eq .Values.region .Values.avoipAdmin.primaryRegion }}
# Publish the existing application User connection, not a parallel DB identity.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: '{{ $name }}-admin-database'
spec:
  refreshInterval: '1m'
  updatePolicy: 'Replace'
  deletionPolicy: 'None'
  secretStoreRefs:
    - kind: 'ClusterSecretStore'
      name: 'corevault-rootsecrets'
  selector:
    secret:
      name: '{{ $db }}'
  data:
    - match:
        secretKey: '{{ .Values.flowrouteSMS.databaseSecret.key }}'
        remoteRef:
          remoteKey: '{{ .Values.avoipAdmin.databaseRemoteKey }}'
          property: 'PSQLURI'
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $name }}-admin-connection'
spec:
  refreshInterval: '1m'
  secretStoreRef:
    kind: 'ClusterSecretStore'
    name: 'corevault-rootsecrets'
  target:
    name: '{{ $name }}-admin-connection'
    creationPolicy: 'Owner'
  data:
    - secretKey: 'psqlURI'
      remoteRef:
        key: '{{ .Values.avoipAdmin.databaseRemoteKey }}'
        property: 'PSQLURI'
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: '{{ $name }}-admin-routing-token'
spec:
  length: 64
  digits: 0
  symbols: 0
  allowRepeat: true
  encoding: 'hex'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ $name }}-admin-routing-token'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: '{{ $name }}-admin-routing-token'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
    template:
      engineVersion: 'v2'
      data:
        token: '{{ `{{ .password }}` }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: 'Password'
          name: '{{ $name }}-admin-routing-token'
{{- end }}
