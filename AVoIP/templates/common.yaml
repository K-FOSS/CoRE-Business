{{- define "avoip.kamailio.common.configMaps" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- if and .Values.kamailio.enabled .Values.kamailio.topology.enabled }}
  {{ $component }}-topos-tls-proxy:
    forceRename: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "topos-tls-proxy") }}'
    includeChecksumInControllers:
      - '{{ $component }}'
    data:
      haproxy.cfg: |
        global
          log stdout format raw local0
          maxconn 256

        defaults
          log global
          mode tcp
          timeout connect 2s
          timeout client 1h
          timeout server 1h

        frontend topos_clients
          bind 127.0.0.1:{{ .Values.kamailio.topology.redis.proxyPort }}
          default_backend dragonfly

        backend dragonfly
          server dragonfly {{ default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.kamailio.topology.redis.host }}:{{ .Values.kamailio.topology.redis.port }} check ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str({{ default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.kamailio.topology.redis.tlsServerName }})
{{- end }}
{{- end -}}

{{- define "avoip.kamailio.common.networkpolicies" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- if and .Values.kamailio.enabled (eq .Values.kamailio.role "carrier-sbc") .Values.freeswitch.enabled (not .Values.kamailio.backend.serviceName) }}
  {{ $component }}-sip-ingress:
    controller: {{ $component }}
    policyTypes:
      - Ingress
      - Egress
    rules:
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: '{{ .Values.kamailio.networkPolicy.envoy.namespace }}'
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: '{{ .Values.kamailio.networkPolicy.envoy.podName }}'
          ports:
            - protocol: TCP
              port: 5061
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: freeswitch
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: TCP
              port: 5062
      egress:
        {{- if .Values.kamailio.carrierOutbound.enabled }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: '{{ .Values.kamailio.carrierOutbound.peer.controller }}'
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: TCP
              port: 5062
        {{- end }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: freeswitch
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: TCP
              port: 5061
{{- if .Values.kamailio.functions.media }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: rtpengine
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: UDP
              port: {{ .Values.rtpengine.controlPort }}
{{- end }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: dragonfly
                  app.kubernetes.io/instance: dragonfly-core
          ports:
            - protocol: TCP
              port: 6379
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
{{- range .Values.flowroute.signalingCIDRs }}
        - to:
            - ipBlock:
                cidr: '{{ . }}'
          ports:
            - protocol: TCP
              port: 5061
{{- end }}
{{- if and .Values.kamailio.functions.sipTrace (include "avoip.homer.enabled" . | trim) }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: homer-web
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: TCP
              port: 9061
{{- end }}
{{- end }}
{{- end -}}

{{- define "avoip.kamailio.common.controllers" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{ if .Values.kamailio.enabled }}
  {{ $component }}:
    forceRename: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio) }}'
    {{- if .Values.kamailio.registrar.enabled }}
    annotations:
      argocd.argoproj.io/sync-wave: '1'
    {{- end }}
    strategy: RollingUpdate
    rollingUpdate:
      surge: '{{ .Values.kamailio.rollingUpdate.surge }}'
      unavailable: '{{ .Values.kamailio.rollingUpdate.unavailable }}'
    replicas: {{ .Values.kamailio.replicas }}
    podDisruptionBudget:
      minAvailable: {{ .Values.kamailio.podDisruptionBudget.minAvailable }}
    revisionHistoryLimit: 3
    serviceAccount:
      name: '{{ .Values.kamailio.serviceAccountName }}'
    pod:
      {{- if .Values.kamailio.securityContext.pod }}
      securityContext:
{{ toYaml .Values.kamailio.securityContext.pod | nindent 8 }}
      {{- else }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      labels:
        app: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio) }}'
        avoip.mylogin.space/kamailio-instance: '{{ .Values.kamailio.name }}'
{{- with .Values.kamailio.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: '{{ $component }}'
        kubectl.kubernetes.io/default-logs-container: '{{ $component }}'
        # Restart Kamailio when its generated routing/TLS configuration or the
        # shared certificate material changes so listeners and media routes are
        # loaded from one consistent configuration set.
        configmap.reloader.stakater.com/reload: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "config") }}'
        secret.reloader.stakater.com/reload: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "sip-tls") }}{{ if .Values.freeswitch.enabled }},{{ include "avoip.fullname" . }}-freeswitch-sip-tls{{ end }}{{ if .Values.kamailio.topology.enabled }},{{ .Values.kamailio.topology.redis.secretName }}{{ end }}'
{{- with .Values.kamailio.podAnnotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
      terminationGracePeriodSeconds: 60
{{- with .Values.kamailio.scheduling.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.kamailio.scheduling.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- if .Values.kamailio.scheduling.affinity }}
      affinity:
{{ toYaml .Values.kamailio.scheduling.affinity | nindent 8 }}
{{- else }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio) }}'
              topologyKey: kubernetes.io/hostname
{{- end }}
{{- if .Values.kamailio.scheduling.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml .Values.kamailio.scheduling.topologySpreadConstraints | nindent 8 }}
{{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio) }}'
{{- end }}
    initContainers:
{{- if or .Values.freeswitch.enabled (eq .Values.kamailio.role "private-sbc") .Values.kamailio.carrierOutbound.enabled }}
      tls-ca:
        image:
          repository: '{{ .Values.kamailio.image.repository }}'
          tag: '{{ .Values.kamailio.image.tag }}'
          digest: '{{ .Values.kamailio.image.digest }}'
          pullPolicy: '{{ .Values.kamailio.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            cp /etc/ssl/certs/ca-certificates.crt /tls-output/ca-certificates.crt
            {{- if .Values.freeswitch.enabled }}
            awk 'BEGIN { n = 0 } /BEGIN CERTIFICATE/ { n++ } n > 1 { print }' /tls-peer/tls.crt >> /tls-output/ca-certificates.crt
            {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
{{- end }}
    containers:
{{- if .Values.kamailio.topology.enabled }}
      topos-tls-proxy:
        command:
          - /usr/local/sbin/haproxy
        args:
          - '-W'
          - '-db'
          - '-f'
          - /usr/local/etc/haproxy/haproxy.cfg
        image:
          repository: '{{ .Values.rtpengine.valkey.proxy.image.repository }}'
          tag: '{{ .Values.rtpengine.valkey.proxy.image.tag }}'
          digest: '{{ .Values.rtpengine.valkey.proxy.image.digest }}'
          pullPolicy: '{{ .Values.rtpengine.valkey.proxy.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - nc -z 127.0.0.1 {{ .Values.kamailio.topology.redis.proxyPort }}
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 6
        ports:
          - name: topos-redis
            containerPort: {{ .Values.kamailio.topology.redis.proxyPort }}
            protocol: TCP
{{- end }}
      {{ $component }}:
        command:
          - /bin/sh
          - -c
        args:
          - >-
            /usr/sbin/kamailio -c -f /etc/kamailio/kamailio.cfg &&
            exec /usr/sbin/kamailio -DD -E -P /tmp/kamailio.pid
            -f /etc/kamailio/kamailio.cfg
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
{{- if .Values.kamailio.topology.enabled }}
          - name: TOPOS_REDIS_SERVER
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.kamailio.topology.redis.secretName }}'
                key: '{{ .Values.kamailio.topology.redis.serverKey }}'
{{- end }}
{{- if .Values.kamailio.registrar.enabled }}
          - name: REGISTRAR_DB_URL
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.kamailio.registrar.database.secretName }}'
                key: 'psqlURI'
{{- end }}
{{- with .Values.kamailio.extraEnv }}
{{ toYaml . | nindent 10 }}
{{- end }}
        image:
          repository: '{{ .Values.kamailio.image.repository }}'
          tag: '{{ .Values.kamailio.image.tag }}'
          digest: '{{ .Values.kamailio.image.digest }}'
          pullPolicy: '{{ .Values.kamailio.image.pullPolicy }}'
        securityContext:
{{- if .Values.kamailio.securityContext.container }}
{{ toYaml .Values.kamailio.securityContext.container | nindent 10 }}
{{- else }}
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
{{- end }}
{{- with .Values.kamailio.resources }}
        resources:
{{ toYaml . | nindent 10 }}
{{- end }}
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test -r /etc/kamailio/kamailio.cfg && test -s /tmp/kamailio.pid && kill -0 1
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 18
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test -r /etc/kamailio/kamailio.cfg && test -s /tmp/kamailio.pid && kill -0 1
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test -s /tmp/kamailio.pid && kill -0 1
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
        {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.udpEnabled }}
          - name: udp-public
            containerPort: 5060
            protocol: UDP
        {{- end }}
        {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.tcpEnabled }}
          - name: tcp-public
            containerPort: 5060
            protocol: TCP
        {{- end }}
          - name: tls-public
            containerPort: 5061
            protocol: TCP
          - name: tls-private
            containerPort: 5062
            protocol: TCP
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}
{{ end }}
{{- end -}}

{{- define "avoip.kamailio.common.services" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- $privateService := .Values.kamailio.services.private -}}
{{- $publicService := .Values.kamailio.services.public -}}
{{- if .Values.kamailio.enabled }}
  {{ $component }}:
    forceRename: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio) }}'
    controller: {{ $component }}
    {{- if ne .Values.kamailio.name "carrier" }}
    extraSelectorLabels:
      avoip.mylogin.space/kamailio-instance: '{{ .Values.kamailio.name }}'
    {{- end }}
{{- include "avoip.service.options" (dict "root" $ "name" $component "annotations" $privateService.annotations "labels" $privateService.labels "type" $privateService.type "preferInstance" true) | nindent 4 }}
    ports:
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.udpEnabled }}
      sip-public-udp:
        port: 5060
        targetPort: udp-public
        protocol: UDP
    {{- end }}
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.tcpEnabled }}
      sip-public-tcp:
        port: 5060
        targetPort: tcp-public
        protocol: TCP
    {{- end }}
    {{- if .Values.kamailio.publicExposure.enabled }}
      sip-public:
        port: 5061
        targetPort: tls-public
        protocol: TCP
    {{- end }}
      tls-private:
        port: 5062
        targetPort: tls-private
        protocol: TCP
{{ if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.directService.enabled (or .Values.kamailio.publicExposure.sip.enabled .Values.kamailio.publicExposure.sip.udpEnabled .Values.kamailio.publicExposure.sip.tcpEnabled) }}
{{ $kamailioPubHost := include "avoip.sip.kamailioPubHost" . }}
  {{ $component }}-pub:
    forceRename: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "pub") }}'
    controller: {{ $component }}
    {{- if ne .Values.kamailio.name "carrier" }}
    extraSelectorLabels:
      avoip.mylogin.space/kamailio-instance: '{{ .Values.kamailio.name }}'
    {{- end }}
    {{- if eq (include "avoip.service.type" (dict "root" $ "name" (printf "%s-pub" $component) "type" $publicService.type) | trim) "LoadBalancer" }}
    # Preserve client source addresses for Kamailio's carrier CIDR checks.
    externalTrafficPolicy: Local
    {{- end }}
{{- $publicAnnotations := mergeOverwrite (dict "external-dns.kubernetes.io/hostname" $kamailioPubHost "external-dns.alpha.kubernetes.io/hostname" $kamailioPubHost) (deepCopy $publicService.annotations) -}}
{{- include "avoip.service.options" (dict "root" $ "name" (printf "%s-pub" $component) "annotations" $publicAnnotations "labels" $publicService.labels "type" $publicService.type "loadBalancerClass" $publicService.loadBalancerClass "preferInstance" true) | nindent 4 }}
    ports:
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.udpEnabled }}
      udp-sip:
        port: 5060
        targetPort: udp-public
        protocol: UDP
    {{- end }}
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.tcpEnabled }}
      tcp-sip:
        port: 5060
        targetPort: tcp-public
        protocol: TCP
    {{- end }}
    {{- if .Values.kamailio.publicExposure.sip.enabled }}
      tls-sips:
        port: 5061
        targetPort: tls-public
        protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
{{- end -}}

{{- define "avoip.kamailio.common.persistence" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- if .Values.kamailio.enabled }}
  {{ $component }}-config:
    type: configMap
    name: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "config") }}'
    advancedMounts:
      {{ $component }}:
        {{ $component }}:
          - path: /etc/kamailio/kamailio.cfg
            subPath: kamailio.cfg
          {{- if eq .Values.kamailio.role "private-sbc" }}
          - path: /etc/kamailio/dispatcher.list
            subPath: dispatcher.list
          {{- end }}
          - path: /etc/kamailio/tls.cfg
            subPath: tls.cfg
{{- if .Values.kamailio.topology.enabled }}
  {{ $component }}-topos-tls-proxy-config:
    type: configMap
    name: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "topos-tls-proxy") }}'
    advancedMounts:
      {{ $component }}:
        topos-tls-proxy:
          - path: /usr/local/etc/haproxy/haproxy.cfg
            subPath: haproxy.cfg
{{- end }}
  {{ $component }}-tls:
    type: secret
    name: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "sip-tls") }}'
    advancedMounts:
      {{ $component }}:
        {{ $component }}:
          - path: /etc/kamailio/tls
  {{ $component }}-tmp:
    type: emptyDir
    advancedMounts:
      {{ $component }}:
        {{ $component }}:
          - path: /tmp
{{- if .Values.freeswitch.enabled }}
  {{ $component }}-freeswitch-tls:
    type: secret
    name: '{{ include "avoip.fullname" . }}-freeswitch-sip-tls'
    advancedMounts:
      {{ $component }}:
        tls-ca:
          - path: /tls-peer
{{- end }}
{{- if or .Values.freeswitch.enabled (eq .Values.kamailio.role "private-sbc") }}
  {{ $component }}-tls-ca:
    type: emptyDir
    advancedMounts:
      {{ $component }}:
        tls-ca:
          - path: /tls-output
        {{ $component }}:
          - path: /etc/kamailio/tls-ca
{{- end }}
{{- end }}
{{- end -}}

{{- include "bjw-s.common.loader.init" . }}

{{- define "avoip.common.values" -}}
{{- $asteriskCdrHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.asterisk.cdr.host -}}
{{- if or (lt (int .Values.freeswitch.sipLogging.sofiaDebug) 0) (gt (int .Values.freeswitch.sipLogging.sofiaDebug) 9) }}{{- fail "freeswitch.sipLogging.sofiaDebug must be between 0 and 9" }}{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) (include "avoip.kamailio.carrier.enabled" . | trim) .Values.homer.recordings.enabled .Values.freeswitch.enabled .Values.freeswitch.media.diagnostics.callRecording.enabled }}
{{- if lt (int .Values.homer.recordings.retentionDays) 1 }}{{- fail "homer.recordings.retentionDays must be at least one day" }}{{- end }}
{{- if ne (clean .Values.freeswitch.media.diagnostics.callRecording.path) (clean .Values.freeswitch.fax.spoolPath) }}{{- fail "FreeSWITCH callRecording.path must match fax.spoolPath when Homer playback is enabled" }}{{- end }}
{{- end }}
global:
  nameOverride: '{{ .Release.Name }}'
  createDefaultServiceAccount: false

defaultPodOptions:
  labels:
    logs: loki-myloginspace

configMaps:
{{- range $instance := (include "avoip.kamailio.instances" . | fromYamlArray) -}}
{{- if $instance.enabled -}}
{{- $values := deepCopy $.Values -}}
{{- $_ := set $values "kamailio" $instance -}}
{{- $ctx := dict "Values" $values "Release" $.Release "Chart" $.Chart "Files" $.Files "Capabilities" $.Capabilities -}}
{{- include "avoip.kamailio.common.configMaps" $ctx }}
{{ end }}
{{ end }}
{{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.rtpengine.valkey.enabled }}
{{- if ne (int .Values.rtpengine.valkey.shards) 1 }}{{- fail "RTPEngine Valkey proxy requires exactly one Valkey shard" }}{{- end }}
{{- if ne (int .Values.rtpengine.valkey.database) 0 }}{{- fail "Valkey Cluster requires RTPEngine database 0" }}{{- end }}
  rtpengine-valkey-proxy:
    forceRename: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
    includeChecksumInControllers:
      - 'rtpengine-valkey-proxy'
    data:
      haproxy.cfg: |
        global
          log stdout format raw local0
          maxconn 4096

        defaults
          log global
          mode tcp
          timeout connect 2s
          timeout client 1h
          timeout server 1h

        resolvers kubernetes
          parse-resolv-conf
          resolve_retries 3
          timeout resolve 1s
          hold valid 2s

        frontend valkey_clients
          bind :{{ .Values.rtpengine.valkey.proxy.port }}
          default_backend valkey_primary

        backend valkey_primary
          option tcp-check
          tcp-check connect
          tcp-check send "AUTH default ${VALKEY_PASSWORD}\r\n"
          tcp-check expect string +OK
          tcp-check send "INFO replication\r\n"
          tcp-check expect string role:master
{{- $nodeCount := int (mul (int .Values.rtpengine.valkey.shards) (add 1 (int .Values.rtpengine.valkey.replicas))) }}
{{- range $node := until $nodeCount }}
          server valkey-{{ $node }} valkey-{{ $.Values.rtpengine.valkey.clusterName }}-0-{{ $node }}-0.{{ $.Values.rtpengine.valkey.clusterHost }}:{{ $.Values.rtpengine.valkey.port }} check inter 1s fall 1 rise 1 on-marked-down shutdown-sessions resolvers kubernetes init-addr libc,none
{{- end }}

        frontend health
          mode http
          bind :{{ .Values.rtpengine.valkey.proxy.healthPort }}
          monitor-uri /healthz
          monitor fail if { nbsrv(valkey_primary) lt 1 }
{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) (include "avoip.kamailio.carrier.enabled" . | trim) .Values.homer.recordings.enabled .Values.freeswitch.enabled .Values.freeswitch.media.diagnostics.callRecording.enabled }}
  homer-recordings:
    forceRename: '{{ include "avoip.fullname" . }}-homer-recordings'
    includeChecksumInControllers:
      - 'freeswitch'
    data:
      default.conf: |
