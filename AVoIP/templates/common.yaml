    retain: {{ .Values.homer.storage.persistence.retain }}
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
      argocd.argoproj.io/sync-wave: '-1'
{{- else }}
    type: emptyDir
{{- end }}
    advancedMounts:
      homer-web:
        homer:
          - path: /data/homer
{{- end }}
{{- end }}

