{{- define "avoip.kamailio.common.configMaps" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- if and .Values.kamailio.enabled .Values.kamailio.topology.enabled }}
  {{ $component }}-topos-tls-proxy:
    forceRename: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "topos-tls-proxy") }}'
    includeChecksumInControllers:
      - '{{ $component }}'
    data:
      haproxy.cfg: |
        global
          log stdout format raw local0
          maxconn 256

        defaults
          log global
          mode tcp
          timeout connect 2s
          timeout client 1h
          timeout server 1h

        frontend topos_clients
          bind 127.0.0.1:{{ .Values.kamailio.topology.redis.proxyPort }}
          default_backend dragonfly

        backend dragonfly
          server dragonfly {{ default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.kamailio.topology.redis.host }}:{{ .Values.kamailio.topology.redis.port }} check ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str({{ default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.kamailio.topology.redis.tlsServerName }})
{{- end }}
{{- end -}}

{{- define "avoip.kamailio.common.networkpolicies" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- if and .Values.kamailio.enabled (eq .Values.kamailio.role "carrier-sbc") .Values.freeswitch.enabled (not .Values.kamailio.backend.serviceName) }}
  {{ $component }}-sip-ingress:
    controller: {{ $component }}
    policyTypes:
      - Ingress
      - Egress
    rules:
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: '{{ .Values.kamailio.networkPolicy.envoy.namespace }}'
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: '{{ .Values.kamailio.networkPolicy.envoy.podName }}'
          ports:
            - protocol: TCP
              port: 5061
        {{- range .Values.kamailio.interSite.peers }}
        - from:
            - ipBlock:
                cidr: '{{ .cidr }}'
          ports:
            - protocol: TCP
              port: 5061
        {{- end }}
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: freeswitch
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: TCP
              port: 5062
      egress:
        {{ if and .Values.avoipAdmin.enabled .Values.avoipAdmin.routing.enabled (not (dig "websocketHA" "enabled" false .Values.kamailio)) }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'avoip-admin'
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: 'TCP'
              port: 8081
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'freeswitch'
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: 'TCP'
              port: 5072
        {{ range .Values.avoipAdmin.routing.upstreamCIDRs }}
        - to:
            - ipBlock:
                cidr: '{{ . }}'
          ports:
            - protocol: 'TCP'
              port: 5061
        {{ end }}
        {{ end }}
        {{- if .Values.kamailio.carrierOutbound.enabled }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: '{{ .Values.kamailio.carrierOutbound.peer.controller }}'
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: TCP
              port: 5062
        {{- end }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: freeswitch
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: TCP
              port: 5061
{{- if .Values.kamailio.functions.media }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: rtpengine
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
          {{- if eq .Values.rtpengine.control.transport "websocket" }}
            - protocol: TCP
              port: {{ .Values.rtpengine.control.websocketPort }}
          {{- else }}
            - protocol: UDP
              port: {{ .Values.rtpengine.controlPort }}
          {{- end }}
{{- end }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: dragonfly
                  app.kubernetes.io/instance: dragonfly-core
          ports:
            - protocol: TCP
              port: 6379
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
{{- range .Values.flowroute.signalingCIDRs }}
        - to:
            - ipBlock:
                cidr: '{{ . }}'
          ports:
            - protocol: TCP
              port: 5061
{{- end }}
{{- range .Values.kamailio.interSite.peers }}
        - to:
            - ipBlock:
                cidr: '{{ .serviceIP }}/32'
          ports:
            - protocol: TCP
              port: 5061
{{- end }}
{{- if and .Values.kamailio.functions.sipTrace (include "avoip.homer.enabled" . | trim) }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: homer-web
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: TCP
              port: 9061
{{- end }}
{{- end }}
{{- end -}}

{{- define "avoip.kamailio.common.controllers" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- $websocketHA := .Values.kamailio.websocketHA | default dict -}}
{{- $kamailioImage := .Values.kamailio.image -}}
{{- if and .Values.avoipAdmin.enabled .Values.avoipAdmin.routing.enabled (not (dig "websocketHA" "enabled" false .Values.kamailio)) -}}
  {{- $kamailioImage = .Values.avoipAdmin.routing.image -}}
{{- end -}}
{{- $lfHeartbeat := (($websocketHA.compatibility | default dict).lfOnlyHeartbeat | default dict) -}}
{{- if $lfHeartbeat.enabled -}}
  {{- $kamailioImage = $lfHeartbeat.image -}}
{{- end -}}
{{- $drainableSipCore := or $websocketHA.enabled $websocketHA.legacyOwner -}}
{{ if .Values.kamailio.enabled }}
  {{ $component }}:
    {{- if $websocketHA.enabled }}
    # StatefulSet pod names append an ordinal, so keep the controller name
    # short enough that <name>-<ordinal> remains below Kubernetes' 63-char limit.
    forceRename: '{{ printf "core-kamailio-%s" .Values.kamailio.name }}'
    {{- else }}
    forceRename: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio) }}'
    {{- end }}
    {{- if $websocketHA.enabled }}
    type: statefulset
    statefulset:
      serviceName:
        identifier: '{{ $component }}-owner'
    {{- end }}
    {{- if .Values.kamailio.registrar.enabled }}
    annotations:
      argocd.argoproj.io/sync-wave: '1'
    {{- end }}
    strategy: RollingUpdate
    {{- if $websocketHA.enabled }}
    rollingUpdate:
      partition: {{ int $websocketHA.rolloutPartition }}
    {{- else }}
    rollingUpdate:
      surge: '{{ .Values.kamailio.rollingUpdate.surge }}'
      unavailable: '{{ .Values.kamailio.rollingUpdate.unavailable }}'
    {{- end }}
    replicas: {{ .Values.kamailio.replicas }}
    podDisruptionBudget:
      minAvailable: {{ if $websocketHA.enabled }}{{ int $websocketHA.podDisruptionBudget.minAvailable }}{{ else }}{{ .Values.kamailio.podDisruptionBudget.minAvailable }}{{ end }}
    revisionHistoryLimit: 3
    serviceAccount:
      name: '{{ .Values.kamailio.serviceAccountName }}'
    pod:
      {{- if .Values.kamailio.securityContext.pod }}
      securityContext:
{{ toYaml .Values.kamailio.securityContext.pod | nindent 8 }}
      {{- else }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
{{- if $drainableSipCore }}
        fsGroup: 1000
{{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      labels:
        app: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio) }}'
        avoip.mylogin.space/kamailio-instance: '{{ .Values.kamailio.name }}'
{{- with .Values.kamailio.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: '{{ $component }}'
        kubectl.kubernetes.io/default-logs-container: '{{ $component }}'
        # RTPEngine endpoint replacement leaves Kamailio's UDP control socket
        # unusable. Roll its consumers with every RTPEngine chart change.
        checksum/rtpengine-config: '{{ toYaml .Values.rtpengine | sha256sum }}'
        # Restart Kamailio when its generated routing/TLS configuration or the
        # shared certificate material changes so listeners and media routes are
        # loaded from one consistent configuration set.
        checksum/kamailio-config: '{{ include "avoip.kamailio.render.KamailioConfig" . | sha256sum }}'
        configmap.reloader.stakater.com/reload: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "config") }}'
        secret.reloader.stakater.com/reload: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "sip-tls") }}{{ if .Values.kamailio.carrierOutbound.clientIdentity.enabled }},{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "sip-mtls") }},{{ .Values.kamailio.carrierOutbound.peer.secretName }}{{ end }}{{ if .Values.freeswitch.enabled }},{{ include "avoip.fullname" . }}-freeswitch-sip-tls{{ end }}{{ if .Values.kamailio.topology.enabled }},{{ .Values.kamailio.topology.redis.secretName }}{{ end }}'
{{- with .Values.kamailio.podAnnotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
      terminationGracePeriodSeconds: {{ if $drainableSipCore }}{{ int $websocketHA.terminationGracePeriodSeconds }}{{ else }}60{{ end }}
{{- with .Values.kamailio.scheduling.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.kamailio.scheduling.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- if .Values.kamailio.scheduling.affinity }}
      affinity:
{{ toYaml .Values.kamailio.scheduling.affinity | nindent 8 }}
{{- else }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio) }}'
              topologyKey: kubernetes.io/hostname
{{- end }}
{{- if .Values.kamailio.scheduling.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml .Values.kamailio.scheduling.topologySpreadConstraints | nindent 8 }}
{{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio) }}'
{{- end }}
    {{- if .Values.kamailio.topology.enabled }}
    initContainers:
      topos-tls-proxy:
        # Native sidecar init containers are started before application
        # containers, and Kubernetes waits for this readiness probe before
        # starting Kamailio's ndb_redis children against the loopback listener.
        restartPolicy: Always
        command:
          - /usr/local/sbin/haproxy
        args:
          - '-W'
          - '-db'
          - '-f'
          - /usr/local/etc/haproxy/haproxy.cfg
        image:
          repository: '{{ .Values.rtpengine.valkey.proxy.image.repository }}'
          tag: '{{ .Values.rtpengine.valkey.proxy.image.tag }}'
          digest: '{{ .Values.rtpengine.valkey.proxy.image.digest }}'
          pullPolicy: '{{ .Values.rtpengine.valkey.proxy.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - nc -z 127.0.0.1 {{ .Values.kamailio.topology.redis.proxyPort }}
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 6
        ports:
          - name: topos-redis
            containerPort: {{ .Values.kamailio.topology.redis.proxyPort }}
            protocol: TCP
    {{- end }}
    containers:
      {{ $component }}:
        command:
          - /bin/sh
          - -c
        args:
          - >-
            /usr/sbin/kamailio -c -f /etc/kamailio/kamailio.cfg &&
            exec /usr/sbin/kamailio -m {{ .Values.kamailio.shmSizeMb }} -DD -E -P /tmp/kamailio.pid
            -f /etc/kamailio/kamailio.cfg
        env:
{{ if and .Values.avoipAdmin.enabled .Values.avoipAdmin.routing.enabled (not (dig "websocketHA" "enabled" false .Values.kamailio)) }}
          - name: 'AVOIP_ROUTING_TOKEN'
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-admin-routing-token'
                key: 'token'
{{ end }}
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
{{- if .Values.kamailio.topology.enabled }}
          - name: TOPOS_REDIS_SERVER
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.kamailio.topology.redis.secretName }}'
                key: '{{ .Values.kamailio.topology.redis.serverKey }}'
{{- end }}
{{- if .Values.kamailio.registrar.enabled }}
          - name: REGISTRAR_DB_URL
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.kamailio.registrar.database.secretName }}'
                key: 'psqlURI'
{{- end }}
{{- with .Values.kamailio.extraEnv }}
{{ toYaml . | nindent 10 }}
{{- end }}
        image:
          repository: '{{ $kamailioImage.repository }}'
          tag: '{{ $kamailioImage.tag }}'
          digest: '{{ $kamailioImage.digest }}'
          pullPolicy: '{{ $kamailioImage.pullPolicy | default .Values.kamailio.image.pullPolicy }}'
        securityContext:
{{- if .Values.kamailio.securityContext.container }}
{{ toYaml .Values.kamailio.securityContext.container | nindent 10 }}
{{- else }}
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
{{- end }}
        {{- if $drainableSipCore }}
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  touch /tmp/kamailio-draining;
                  kamcmd -s unix:/tmp/kamailio_ctl ws.disable || true;
                  sleep {{ add (int $websocketHA.endpointRemovalDelaySeconds) (int $websocketHA.drainSeconds) }}
        {{- end }}
{{- with .Values.kamailio.resources }}
        resources:
{{ toYaml . | nindent 10 }}
{{- end }}
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test -r /etc/kamailio/kamailio.cfg && test -s /tmp/kamailio.pid && kill -0 1{{ if $drainableSipCore }} && test ! -e /tmp/kamailio-draining{{ end }}
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 18
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test -r /etc/kamailio/kamailio.cfg && test -s /tmp/kamailio.pid && kill -0 1{{ if $drainableSipCore }} && test ! -e /tmp/kamailio-draining{{ end }}
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test -s /tmp/kamailio.pid && kill -0 1
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
        {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.udpEnabled }}
          - name: udp-public
            containerPort: 5060
            protocol: UDP
        {{- end }}
        {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.tcpEnabled }}
          - name: tcp-public
            containerPort: 5060
            protocol: TCP
        {{- end }}
          - name: tls-public
            containerPort: 5061
            protocol: TCP
          - name: tls-private
            containerPort: 5062
            protocol: TCP
        {{- if and (eq .Values.kamailio.role "private-sbc") (or (eq .Values.kamailio.name $.Values.asterisk.sipCore.kamailioInstance) (.Values.kamailio.websocketHA | default dict).enabled (.Values.kamailio.websocketHA | default dict).legacyOwner) $.Values.asterisk.enabled $.Values.asterisk.sipCore.enabled }}
          - name: sipcore-ws
            containerPort: {{ $.Values.asterisk.sipCore.httpPort }}
            protocol: TCP
          - name: sipcore-tls
            containerPort: {{ $.Values.asterisk.sipCore.privateEgressPort }}
            protocol: TCP
        {{- end }}
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}
{{ end }}
{{- end -}}

{{- define "avoip.kamailio.common.services" -}}
{{- $component := include "avoip.kamailio.component" .Values.kamailio -}}
{{- $privateService := .Values.kamailio.services.private -}}
{{- $publicService := .Values.kamailio.services.public -}}
{{- if .Values.kamailio.enabled }}
  {{ $component }}:
    forceRename: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio) }}'
    controller: {{ $component }}
    {{- if ne .Values.kamailio.name "carrier" }}
    extraSelectorLabels:
      avoip.mylogin.space/kamailio-instance: '{{ .Values.kamailio.name }}'
    {{- end }}
{{- include "avoip.service.options" (dict "root" $ "name" $component "annotations" $privateService.annotations "labels" $privateService.labels "type" $privateService.type "preferInstance" true) | nindent 4 }}
    ports:
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.udpEnabled }}
      sip-public-udp:
        port: 5060
        targetPort: udp-public
        protocol: UDP
    {{- end }}
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.tcpEnabled }}
      sip-public-tcp:
        port: 5060
        targetPort: tcp-public
        protocol: TCP
    {{- end }}
    {{- if .Values.kamailio.publicExposure.enabled }}
      sip-public:
        port: 5061
        targetPort: tls-public
        protocol: TCP
    {{- end }}
      tls-private:
        port: 5062
        targetPort: tls-private
        protocol: TCP
    {{- if and (eq .Values.kamailio.role "private-sbc") (or (eq .Values.kamailio.name $.Values.asterisk.sipCore.kamailioInstance) (.Values.kamailio.websocketHA | default dict).enabled (.Values.kamailio.websocketHA | default dict).legacyOwner) $.Values.asterisk.enabled $.Values.asterisk.sipCore.enabled }}
      sipcore-ws:
        port: {{ $.Values.asterisk.sipCore.httpPort }}
        targetPort: sipcore-ws
        protocol: TCP
        appProtocol: kubernetes.io/ws
      sipcore-tls:
        port: {{ $.Values.asterisk.sipCore.privateEgressPort }}
        targetPort: sipcore-tls
        protocol: TCP
    {{- end }}
{{- if and (eq .Values.kamailio.role "private-sbc") (or (eq .Values.kamailio.name $.Values.asterisk.sipCore.kamailioInstance) (.Values.kamailio.websocketHA | default dict).legacyOwner) $.Values.asterisk.enabled $.Values.asterisk.sipCore.enabled }}
  {{ $component }}-sipcore-return:
    forceRename: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "sipcore-return") }}'
    controller: {{ $component }}
    extraSelectorLabels:
      avoip.mylogin.space/kamailio-instance: '{{ .Values.kamailio.name }}'
    {{- if (.Values.kamailio.websocketHA | default dict).legacyOwner }}
    publishNotReadyAddresses: true
    {{- end }}
    ports:
      sipcore-return:
        port: {{ $.Values.asterisk.sipCore.privateEgressPort }}
        targetPort: sipcore-tls
        protocol: TCP
{{- end }}
{{- if and (.Values.kamailio.websocketHA | default dict).enabled (eq .Values.kamailio.role "private-sbc") }}
  {{ $component }}-owner:
    forceRename: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "owner") }}'
    controller: {{ $component }}
    extraSelectorLabels:
      avoip.mylogin.space/kamailio-instance: '{{ .Values.kamailio.name }}'
    clusterIP: 'None'
    # Keep stable owner DNS usable during readiness-based drain until the
    # process exits. The Envoy-facing Service still excludes draining pods.
    publishNotReadyAddresses: true
    ports:
      sipcore-owner:
        port: {{ $.Values.asterisk.sipCore.privateEgressPort }}
        targetPort: sipcore-tls
        protocol: TCP
{{- end }}
{{ if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.directService.enabled (or .Values.kamailio.publicExposure.sip.enabled .Values.kamailio.publicExposure.sip.udpEnabled .Values.kamailio.publicExposure.sip.tcpEnabled) }}
{{ $kamailioPubHost := include "avoip.sip.kamailioPubHost" . }}
  {{ $component }}-pub:
    forceRename: '{{ include "avoip.kamailio.resourceName" (dict "root" . "instance" .Values.kamailio "suffix" "pub") }}'
    controller: {{ $component }}
    {{- if ne .Values.kamailio.name "carrier" }}
    extraSelectorLabels:
      avoip.mylogin.space/kamailio-instance: '{{ .Values.kamailio.name }}'
    {{- end }}
    {{- if eq (include "avoip.service.type" (dict "root" $ "name" (printf "%s-pub" $component) "type" $publicService.type) | trim) "LoadBalancer" }}
    # Preserve client source addresses for Kamailio's carrier CIDR checks.
    externalTrafficPolicy: Local
    {{- end }}
{{- $publicAnnotations := mergeOverwrite (dict "external-dns.kubernetes.io/hostname" $kamailioPubHost "external-dns.alpha.kubernetes.io/hostname" $kamailioPubHost) (deepCopy $publicService.annotations) -}}
{{- include "avoip.service.options" (dict "root" $ "name" (printf "%s-pub" $component) "annotations" $publicAnnotations "labels" $publicService.labels "type" $publicService.type "loadBalancerClass" $publicService.loadBalancerClass "preferInstance" true) | nindent 4 }}
    ports:
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.udpEnabled }}
      udp-sip:
        port: 5060
        targetPort: udp-public
        protocol: UDP
    {{- end }}
    {{- if and .Values.kamailio.publicExposure.enabled .Values.kamailio.publicExposure.sip.tcpEnabled }}
      tcp-sip:
        port: 5060
        targetPort: tcp-public
        protocol: TCP
    {{- end }}
    {{- if .Values.kamailio.publicExposure.sip.enabled }}
      tls-sips:
        port: 5061
        targetPort: tls-public
        protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
{{- end -}}

{{- define "avoip.kamailio.common.persistence" -}}
