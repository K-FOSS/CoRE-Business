controllers:
{{- with $routrResources.controllers }}{{ toYaml . | nindent 2 }}{{- end }}
{{- if .Values.asterisk.enabled }}
  asterisk:
    forceRename: '{{ include "avoip.fullname" . }}-asterisk'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: 1
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-asterisk'
      annotations:
        kubectl.kubernetes.io/default-container: 'asterisk'
        kubectl.kubernetes.io/default-logs-container: 'asterisk'
        # Asterisk PJSIP transports require a process restart to apply identity
        # changes. Hash the rendered PJSIP ConfigMap into the pod template.
        checksum/asterisk-pjsip-config: '{{ include (print $.Template.BasePath "/Asterisk/AsteriskConfigTemplate.yaml") . | sha256sum }}'
        # Reloader restarts Asterisk when its file-backed configuration changes.
        # The credentials are rendered into startup-only files, so include the
        # mounted Secret as well when the generated connection changes.
        configmap.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-asterisk-configs,{{ include "avoip.fullname" . }}-asterisk-config-tpl'
        secret.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-asterisk,{{ include "avoip.fullname" . }}-asterisk-sip-tls{{ if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }},{{ include "avoip.fullname" . }}-asterisk-voicemail-pin{{ end }}{{ if .Values.freeswitch.enabled }},{{ include "avoip.fullname" . }}-asterisk-freeswitch-peer{{ end }}{{ if .Values.asterisk.sipCore.enabled }},{{ include "avoip.asterisk.sipCore.kamailioTLSSecret" . }}{{ range .Values.asterisk.sipCore.extensions }},{{ include "avoip.asterisk.sipCore.secretName" (dict "root" $ "number" .number) }}{{ end }}{{ end }}{{ if and .Values.asterisk.turn.enabled .Values.asterisk.sipCore.enabled }},{{ .Values.asterisk.turn.secret.name }}{{ end }}'
    initContainers:
      asterisk-timezone:
        image:
          repository: '{{ .Values.asterisk.image.repository }}'
          tag: '{{ .Values.asterisk.image.tag }}'
          digest: '{{ .Values.asterisk.image.digest }}'
          pullPolicy: '{{ .Values.asterisk.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            zone='/usr/share/zoneinfo/{{ include "avoip.asterisk.timeZone" . }}'
            test -s "$zone" || { printf '%s\n' 'Configured Asterisk timezone is missing from the image' >&2; exit 1; }
            cp "$zone" /timezone/localtime
            chmod 0444 /timezone/localtime
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
{{- if or .Values.asterisk.cdr.enabled .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
      cdr-schema:
        image:
          repository: 'postgres'
          tag: '17-alpine'
          digest: 'sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24'
          pullPolicy: 'IfNotPresent'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            {{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
            case "$VM_PIN" in
              ''|*[!0-9]*) printf '%s\n' 'Voicemail PIN must contain digits only' >&2; exit 1 ;;
            esac
            if [ "${#VM_PIN}" -lt 4 ] || [ "${#VM_PIN}" -gt 12 ]; then
              printf '%s\n' 'Voicemail PIN must contain 4 to 12 digits' >&2
              exit 1
            fi
            {{- end }}
            export PGUSER="$USERNAME"
            export PGPASSWORD="$PASSWORD"
            export PGDATABASE="$USERNAME"
            until psql -v ON_ERROR_STOP=1 -h '{{ $asteriskCdrHost }}' -p '{{ $.Values.asterisk.cdr.port }}' -c 'SELECT 1' >/dev/null 2>&1; do
              sleep 2
            done
            psql -v ON_ERROR_STOP=1 -h '{{ $asteriskCdrHost }}' -p '{{ $.Values.asterisk.cdr.port }}' <<'SQL'
            {{- if .Values.asterisk.cdr.enabled }}
            CREATE TABLE IF NOT EXISTS {{ $.Values.asterisk.cdr.table }} (
              calldate timestamp NOT NULL,
              clid varchar(80) NOT NULL,
              src varchar(80) NOT NULL,
              dst varchar(80) NOT NULL,
              dcontext varchar(80) NOT NULL,
              channel varchar(80) NOT NULL,
              dstchannel varchar(80) NOT NULL,
              lastapp varchar(80) NOT NULL,
              lastdata varchar(80) NOT NULL,
              duration integer NOT NULL,
              billsec integer NOT NULL,
              disposition varchar(45) NOT NULL,
              amaflags integer NOT NULL,
              accountcode varchar(20) NOT NULL,
              uniqueid varchar(150) NOT NULL,
              userfield varchar(255) NOT NULL,
              peeraccount varchar(20),
              linkedid varchar(150),
              sequence integer
            );
            {{- end }}
            {{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
            CREATE TABLE IF NOT EXISTS {{ $.Values.asterisk.voicemail.messagesTable }} (
              dir varchar(255) NOT NULL,
              msgnum integer NOT NULL,
              context varchar(80),
              macrocontext varchar(80),
              callerid varchar(80),
              origtime integer,
              duration integer,
              recording bytea,
              flag varchar(30),
              category varchar(30),
              mailboxuser varchar(30),
              mailboxcontext varchar(30),
              msg_id varchar(40),
              PRIMARY KEY (dir, msgnum)
            );
            CREATE TABLE IF NOT EXISTS voicemail (
              uniqueid bigserial PRIMARY KEY,
              context varchar(80) NOT NULL,
              mailbox varchar(80) NOT NULL,
              password varchar(80) NOT NULL,
              fullname varchar(80) NOT NULL DEFAULT '',
              alias varchar(80) NOT NULL DEFAULT '',
              email varchar(80) NOT NULL DEFAULT '',
              pager varchar(80) NOT NULL DEFAULT '',
              tz varchar(30) NOT NULL DEFAULT 'UTC',
              attach varchar(3) NOT NULL DEFAULT 'no',
              saycid varchar(3) NOT NULL DEFAULT 'no',
              sendvoicemail varchar(3) NOT NULL DEFAULT 'no',
              review varchar(3) NOT NULL DEFAULT 'no',
              tempgreetwarn varchar(3) NOT NULL DEFAULT 'no',
              operator varchar(3) NOT NULL DEFAULT 'no',
              envelope varchar(3) NOT NULL DEFAULT 'yes',
              sayduration integer NOT NULL DEFAULT 0,
              saydurationm integer NOT NULL DEFAULT 1,
              forcename varchar(3) NOT NULL DEFAULT 'no',
              forcegreetings varchar(3) NOT NULL DEFAULT 'no',
              callback varchar(80) NOT NULL DEFAULT '',
              dialout varchar(80) NOT NULL DEFAULT '',
              exitcontext varchar(80) NOT NULL DEFAULT '',
              maxmsg integer NOT NULL DEFAULT 100,
              volgain numeric(5,2) NOT NULL DEFAULT 0,
              deletevoicemail varchar(3) NOT NULL DEFAULT 'no',
              nextaftercmd varchar(3) NOT NULL DEFAULT 'yes',
              hidefromdir varchar(3) NOT NULL DEFAULT 'yes',
              stamp timestamp with time zone NOT NULL DEFAULT now(),
              UNIQUE (context, mailbox)
            );
            \getenv voicemail_pin VM_PIN
            INSERT INTO voicemail (context, mailbox, password, fullname, email, attach)
            VALUES ('default', '{{ default $.Values.asterisk.sipCore.inboundVoiceExtension $.Values.asterisk.voicemail.mailbox }}', :'voicemail_pin', '', '', 'no')
            ON CONFLICT (context, mailbox) DO NOTHING;
            {{- end }}
            SQL
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-asterisk'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-asterisk'
                key: password
        {{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
          - name: VM_PIN
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-asterisk-voicemail-pin'
                key: pin
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
{{- end }}
      asterisk-sounds:
        image:
          repository: '{{ .Values.asterisk.image.repository }}'
          tag: '{{ .Values.asterisk.image.tag }}'
          digest: '{{ .Values.asterisk.image.digest }}'
          pullPolicy: '{{ .Values.asterisk.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            ls -lah /usr/share/asterisk/sounds/en/
            ls -lah /usr/share/asterisk
            ls -lah /var/lib/asterisk
            ls -lah /var/lib/asterisk/sounds
            mkdir -p /var/lib/asterisk/sounds/en
            cp -R /usr/share/asterisk/sounds/en/. /var/lib/asterisk/sounds/en/
            test -f /var/lib/asterisk/sounds/en/demo-congrats.gsm
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    containers:
      asterisk:
        command:
          - /bin/sh
          - -c
        args:
          - |
            umask 077
            {{- if .Values.asterisk.sipCore.enabled }}
            if [ ! -s /etc/asterisk/sipcore-ca/ca.crt ]; then
              printf '%s\n' 'Site SIP CA bundle is missing; refusing unverified Asterisk TLS' >&2
              exit 1
            fi
            cat /etc/ssl/certs/ca-certificates.crt /etc/asterisk/sipcore-ca/ca.crt > /tmp/avoip-ca-bundle.pem
            chmod 0444 /tmp/avoip-ca-bundle.pem
            {{- end }}
            printf '[freeswitch-auth]\ntype=auth\nauth_type=userpass\nusername=freeswitch\npassword=%s\n' \
              "$(cat /tmp/avoip-freeswitch-peer-password)" > /tmp/avoip-pjsip-auth.conf
            {{- if .Values.freeswitch.enabled }}
            printf '\n[freeswitch-inbound-auth]\ntype=auth\nauth_type=userpass\nusername=freeswitch\npassword=%s\n' \
              "$(cat /tmp/avoip-freeswitch-peer-password)" >> /tmp/avoip-pjsip-auth.conf
            {{- end }}
            {{- if .Values.asterisk.sipCore.enabled }}
            : > /tmp/avoip-sipcore-pjsip.conf
            {{- range .Values.asterisk.sipCore.extensions }}
            sip_password="$(cat /run/avoip/sipcore/{{ .number }}/password)"
            case "$sip_password" in
              ''|*[!0123456789abcdefABCDEF]*) echo 'SIP Core password must be hexadecimal' >&2; exit 1 ;;
            esac
            if [ "${#sip_password}" -lt 32 ]; then echo 'SIP Core password must be at least 32 characters' >&2; exit 1; fi
            {
              printf '[{{ .number }}]\ntype=auth\nauth_type=userpass\nusername={{ .number }}\npassword=%s\n\n' "$sip_password"
              printf '[{{ .number }}]\ntype=aor\nmax_contacts={{ default 2 .maxContacts }}\nremove_existing=yes\nremove_unavailable=yes\nqualify_frequency=30\nqualify_2xx_only=yes\nsupport_path=yes\n\n'
              printf '[{{ .number }}]\ntype=endpoint\ntransport=transport-tls\n'
              {{- if $sipCoreWebsocketHA }}
              # In HA mode PJSIP must route each contact through its saved
              # Path. An endpoint outbound_proxy overrides that per-contact
              # route (including a local sink), so leave it unset. Kamailio
              # rejects HA registrations without an owner Path.
              {{- else }}
              printf 'outbound_proxy=sip:{{ include "avoip.sip.sipCoreReturnHost" (dict "root" $) }}:{{ $.Values.asterisk.sipCore.privateEgressPort }}\\;transport=tls\\;lr\n'
              {{- end }}
              printf 'aors={{ .number }}\nauth={{ .number }}\nidentify_by=username,auth_username\ncontext=from-sipcore-{{ .number }}\nwebrtc=yes\nrtp_ipv6=no\ndirect_media=no\ndisallow=all\nallow={{ join "," $.Values.codecs.asterisk.sipCore }}\n'
              {{- if and $.Values.asterisk.sipCore.enabled $.Values.asterisk.sipCore.media.enabled }}
              printf 'media_address={{ $.Values.asterisk.sipCore.media.address }}\n'
              {{- end }}
            } >> /tmp/avoip-sipcore-pjsip.conf
            unset sip_password
            {{- end }}
            {{- if and .Values.avoipAdmin.enabled .Values.avoipAdmin.routing.enabled }}
            printf '\n[carrier-outbound]\ntype=aor\ncontact=sip:{{ include "avoip.sip.sipCoreReturnHost" (dict "root" $) }}:{{ $.Values.asterisk.sipCore.privateEgressPort }}\\;transport=tls\n\n' >> /tmp/avoip-sipcore-pjsip.conf
            printf '[carrier-outbound]\ntype=endpoint\ntransport=transport-tls\naors=carrier-outbound\noutbound_proxy=sip:{{ include "avoip.sip.sipCoreReturnHost" (dict "root" $) }}:{{ $.Values.asterisk.sipCore.privateEgressPort }}\\;transport=tls\\;lr\ncontext=carrier-outbound-deny\ndirect_media=no\nrtp_ipv6=no\ndisallow=all\nallow={{ join "," $.Values.codecs.asterisk.sipCore }}\n' >> /tmp/avoip-sipcore-pjsip.conf
            {{- end }}
            {{- end }}
            {{- if and .Values.asterisk.turn.enabled .Values.asterisk.sipCore.enabled }}
            turn_shared_secret="$(cat /run/avoip/turn/{{ .Values.asterisk.turn.secret.key }})"
            if [ -z "$turn_shared_secret" ]; then echo 'CoTURN shared secret is empty' >&2; exit 1; fi
            if ! command -v openssl >/dev/null 2>&1; then echo 'openssl is required to derive CoTURN REST credentials' >&2; exit 1; fi
            turn_expiry=$(( $(date +%s) + {{ int .Values.asterisk.turn.credentialLifetimeSeconds }} ))
            turn_username="${turn_expiry}:{{ .Values.asterisk.turn.username }}"
            turn_password="$(printf '%s' "$turn_username" | openssl dgst -sha1 -hmac "$turn_shared_secret" -binary | openssl base64 -A)"
            if [ -z "$turn_password" ]; then echo 'CoTURN REST credential generation failed' >&2; exit 1; fi
            {
              printf '[general]\n'
              printf 'turnaddr={{ include "avoip.asterisk.turnHostname" . }}:{{ .Values.asterisk.turn.port }}\n'
              printf 'turnusername=%s\nturnpassword=%s\n' "$turn_username" "$turn_password"
            } > /tmp/avoip-turn.conf
            unset turn_shared_secret turn_username turn_password turn_expiry
            {{- end }}
            {{- if .Values.asterisk.cdr.enabled }}
            printf '[global]\n' > /tmp/avoip-cdr_pgsql.conf
            printf 'hostname={{ $asteriskCdrHost }}\n' >> /tmp/avoip-cdr_pgsql.conf
            printf 'port={{ .Values.asterisk.cdr.port }}\n' >> /tmp/avoip-cdr_pgsql.conf
            printf 'dbname=%s\n' "$(cat /tmp/avoip-username)" >> /tmp/avoip-cdr_pgsql.conf
            printf 'user=%s\n' "$(cat /tmp/avoip-username)" >> /tmp/avoip-cdr_pgsql.conf
            printf 'password=%s\n' "$(cat /tmp/avoip-password)" >> /tmp/avoip-cdr_pgsql.conf
            printf 'encoding=UTF-8\n' >> /tmp/avoip-cdr_pgsql.conf
            printf 'table={{ .Values.asterisk.cdr.table }}\n' >> /tmp/avoip-cdr_pgsql.conf
            {{- end }}
            {{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
            if ! find /usr/lib/asterisk/modules /usr/lib64/asterisk/modules -type f -name app_voicemail_odbc.so -print -quit 2>/dev/null | grep -q app_voicemail_odbc.so; then
              printf '%s\n' 'Asterisk voicemail requires app_voicemail_odbc.so in the image' >&2
              exit 1
            fi
            if ! command -v odbcinst >/dev/null 2>&1 || ! odbcinst -q -d 2>/dev/null | grep -Fqx '[{{ .Values.asterisk.voicemail.odbcDriver }}]'; then
              printf '%s\n' 'Asterisk voicemail requires its configured PostgreSQL ODBC driver in the image' >&2
              exit 1
            fi
            db_username="$(cat /tmp/avoip-username)"
            db_password="$(cat /tmp/avoip-password)"
            {
              printf '[avoip-voicemail]\nenabled => yes\ndsn => avoip-voicemail\nusername => %s\npassword => %s\npre-connect => yes\n' "$db_username" "$db_password"
            } > /tmp/avoip-res_odbc.conf
            {
              printf '[avoip-voicemail]\nDriver={{ .Values.asterisk.voicemail.odbcDriver }}\nServername={{ $asteriskCdrHost }}\nPort={{ .Values.asterisk.cdr.port }}\nDatabase=%s\nUsername=%s\nPassword=%s\nSSLmode=prefer\n' "$db_username" "$db_username" "$db_password"
            } > /tmp/avoip-odbc.ini
            unset db_username db_password
            {{- end }}
            exec /usr/sbin/asterisk -f -C /etc/asterisk/asterisk.conf
        image:
          repository: '{{ .Values.asterisk.image.repository }}'
          tag: '{{ .Values.asterisk.image.tag }}'
          digest: '{{ .Values.asterisk.image.digest }}'
          pullPolicy: '{{ .Values.asterisk.image.pullPolicy }}'
        env:
          - name: TZ
            value: '{{ include "avoip.asterisk.timeZone" . }}'
        {{- if or .Values.asterisk.voicemail.enabled .Values.freeswitch.voicemail.enabled }}
          - name: ODBCINI
            value: /tmp/avoip-odbc.ini
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 24
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
        ports:
          - name: tcp-sip
            containerPort: 5060
            protocol: TCP
          - name: udp-sip
            containerPort: 5060
            protocol: UDP
          - name: tls-sips
            containerPort: 5061
            protocol: TCP
{{- $asteriskRtpPorts := untilStep (.Values.asterisk.rtp.min | int) (.Values.asterisk.rtp.max | int) 1 -}}
{{- if and .Values.asterisk.sipCore.enabled .Values.asterisk.sipCore.media.enabled -}}
{{- $asteriskRtpPorts = untilStep (.Values.asterisk.rtp.min | int) (add (.Values.asterisk.rtp.max | int) 1 | int) 1 -}}
{{- end -}}
{{- range $asteriskRtpPorts }}
          - name: 'udp-{{ . }}'
            containerPort: {{ . }}
            protocol: UDP
          - name: 'tcp-{{ . }}'
            containerPort: {{ . }}
            protocol: TCP
{{ end }}
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}
{{ end }}
{{- range $instance := (include "avoip.kamailio.instances" . | fromYamlArray) -}}
{{- if $instance.enabled -}}
{{- $values := deepCopy $.Values -}}
{{- $_ := set $values "kamailio" $instance -}}
{{- $ctx := dict "Values" $values "Release" $.Release "Chart" $.Chart "Files" $.Files "Capabilities" $.Capabilities -}}
{{- include "avoip.kamailio.common.controllers" $ctx }}
{{- if $instance.registrar.database.enabled }}
  {{ include "avoip.kamailio.component" $instance }}-registrar-schema:
    enabled: true
    type: 'job'
    forceRename: '{{ include "avoip.kamailio.resourceName" (dict "root" $ "instance" $instance "suffix" "registrar-schema") }}'
    serviceAccount:
      name: '{{ $instance.serviceAccountName }}'
    annotations:
      argocd.argoproj.io/hook: 'Sync'
      argocd.argoproj.io/hook-delete-policy: 'BeforeHookCreation,HookSucceeded'
      argocd.argoproj.io/sync-wave: '0'
    pod:
      restartPolicy: 'OnFailure'
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: 'RuntimeDefault'
    containers:
      migrate:
        image:
          repository: '{{ $instance.image.repository }}'
          tag: '{{ $instance.image.tag }}'
          digest: '{{ $instance.image.digest }}'
          pullPolicy: '{{ $instance.image.pullPolicy }}'
        command: ['/bin/sh', '-c']
        args:
          - |
            set -eu
            psql -v ON_ERROR_STOP=1 -h '{{ $instance.registrar.database.host }}' -p '{{ $instance.registrar.database.port }}' <<'SQL'
            BEGIN;
            SELECT pg_advisory_xact_lock(670061, 6104);
            SELECT CASE WHEN to_regclass('public.version') IS NULL THEN 'true' ELSE 'false' END AS create_version \gset
            \if :create_version
            \i /usr/share/kamailio/postgres/standard-create.sql
            \endif
            SELECT CASE WHEN to_regclass('public.subscriber') IS NULL THEN 'true' ELSE 'false' END AS create_subscriber \gset
            \if :create_subscriber
            \i /usr/share/kamailio/postgres/auth_db-create.sql
            \endif
            SELECT CASE WHEN to_regclass('public.location') IS NULL THEN 'true' ELSE 'false' END AS create_location \gset
            \if :create_location
            \i /usr/share/kamailio/postgres/usrloc-create.sql
            \endif
            DO $$ BEGIN
              IF (SELECT table_version FROM version WHERE table_name='subscriber') IS DISTINCT FROM 7 OR
                 (SELECT table_version FROM version WHERE table_name='location') IS DISTINCT FROM 9 OR
                 (SELECT table_version FROM version WHERE table_name='location_attrs') IS DISTINCT FROM 1 THEN
                RAISE EXCEPTION 'Unsupported Kamailio registrar schema version';
              END IF;
            END $$;
            ALTER TABLE subscriber ADD COLUMN IF NOT EXISTS enabled boolean NOT NULL DEFAULT false;
            ALTER TABLE subscriber ADD COLUMN IF NOT EXISTS expires_at timestamptz NOT NULL DEFAULT 'epoch';
            CREATE OR REPLACE VIEW active_subscriber AS
              SELECT id, username, domain, password, ha1, ha1b
              FROM subscriber WHERE enabled AND expires_at > now();
            CREATE OR REPLACE FUNCTION avoip_purge_revoked_contacts() RETURNS trigger
              LANGUAGE plpgsql AS $$
            BEGIN
              IF TG_OP = 'DELETE' THEN
                DELETE FROM location WHERE username = OLD.username AND domain = OLD.domain;
                RETURN OLD;
              END IF;
              IF NEW.enabled IS NOT TRUE OR NEW.expires_at <= now() OR
                 NEW.username IS DISTINCT FROM OLD.username OR
                 NEW.domain IS DISTINCT FROM OLD.domain OR
                 NEW.ha1 IS DISTINCT FROM OLD.ha1 OR
                 NEW.ha1b IS DISTINCT FROM OLD.ha1b THEN
                DELETE FROM location WHERE username = OLD.username AND domain = OLD.domain;
              END IF;
              RETURN NEW;
            END;
            $$;
            DROP TRIGGER IF EXISTS avoip_revoke_contacts ON subscriber;
            CREATE TRIGGER avoip_revoke_contacts
              AFTER UPDATE OF username, domain, enabled, expires_at, ha1, ha1b OR DELETE ON subscriber
              FOR EACH ROW EXECUTE FUNCTION avoip_purge_revoked_contacts();
            COMMIT;
            SQL
        env:
          - name: PGSSLMODE
            value: 'verify-full'
          - name: PGCONNECT_TIMEOUT
            value: '5'
          - name: PGUSER
            valueFrom:
              secretKeyRef:
                name: '{{ $instance.registrar.database.secretName }}'
                key: 'username'
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ $instance.registrar.database.secretName }}'
                key: 'password'
          - name: PGDATABASE
            valueFrom:
              secretKeyRef:
                name: '{{ $instance.registrar.database.secretName }}'
                key: 'database'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ['ALL']
{{- end }}
{{ end }}
{{ end }}
{{- if (include "avoip.rtpengine.enabled" . | trim) }}
{{- if not (has .Values.rtpengine.control.transport (list "udp" "websocket")) }}{{- fail "rtpengine.control.transport must be udp or websocket" }}{{- end }}
{{- if and (eq .Values.rtpengine.control.transport "websocket") (or (lt (int .Values.rtpengine.control.websocketPort) 1) (gt (int .Values.rtpengine.control.websocketPort) 65535)) }}{{- fail "rtpengine.control.websocketPort must be between 1 and 65535" }}{{- end }}
{{- if and (eq .Values.rtpengine.control.transport "websocket") (lt (int .Values.rtpengine.control.websocketBufferSizeKB) 1) }}{{- fail "rtpengine.control.websocketBufferSizeKB must be positive when WebSocket control is enabled" }}{{- end }}
{{- if or (lt (int .Values.rtpengine.timeouts.timeoutSeconds) 1) (lt (int .Values.rtpengine.timeouts.silentTimeoutSeconds) 1) (lt (int .Values.rtpengine.timeouts.offerTimeoutSeconds) 1) (lt (int .Values.rtpengine.timeouts.finalTimeoutSeconds) 0) }}{{- fail "RTPEngine timeouts must be positive except finalTimeoutSeconds, which may be zero" }}{{- end }}
  rtpengine:
    forceRename: '{{ include "avoip.fullname" . }}-rtpengine'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: {{ .Values.rtpengine.replicas }}
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-rtpengine'
      annotations:
        kubectl.kubernetes.io/default-container: 'rtpengine'
        kubectl.kubernetes.io/default-logs-container: 'rtpengine'
        # RTPEngine configuration is rendered into the pod command line. Any
        # values change therefore changes the pod template and rolls the
        # workload through Argo CD; there are no mounted RTPEngine configmaps
        # for a live-reload annotation to watch.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: '{{ include "avoip.fullname" . }}-rtpengine'
              topologyKey: kubernetes.io/hostname
    containers:
      rtpengine:
        command:
          - /bin/sh
          - -c
        args:
          - >-
            exec /bin/sh /usr/local/bin/rtpengine-redis-restore-entrypoint.sh /usr/local/bin/rtpengine
            --table=-1
            --interface=internal/${POD_IP}
            --interface=external/${POD_IP}!{{ .Values.rtpengine.media.address }}
            --listen-ng=${POD_IP}:{{ .Values.rtpengine.controlPort }}
            {{- if eq .Values.rtpengine.control.transport "websocket" }}
            --listen-http=${POD_IP}:{{ .Values.rtpengine.control.websocketPort }}
            --http-buf-size={{ .Values.rtpengine.control.websocketBufferSizeKB }}
            {{- end }}
            --port-min={{ .Values.rtpengine.media.min }}
            --port-max={{ sub (.Values.rtpengine.media.max | int) 1 }}
            --timeout={{ .Values.rtpengine.timeouts.timeoutSeconds }}
            --silent-timeout={{ .Values.rtpengine.timeouts.silentTimeoutSeconds }}
            --offer-timeout={{ .Values.rtpengine.timeouts.offerTimeoutSeconds }}
            --final-timeout={{ .Values.rtpengine.timeouts.finalTimeoutSeconds }}
{{- if .Values.rtpengine.valkey.enabled }}
            --redis=${RTPENGINE_REDIS_HOST}:{{ .Values.rtpengine.valkey.proxy.port }}/{{ .Values.rtpengine.valkey.database }}
            --redis-subscribe=${RTPENGINE_REDIS_HOST}:{{ .Values.rtpengine.valkey.proxy.port }}/{{ .Values.rtpengine.valkey.subscribeKeyspace }}
            --subscribe-keyspace={{ .Values.rtpengine.valkey.subscribeKeyspace }}
            --redis-resolve-on-reconnect
{{- if .Values.rtpengine.valkey.activeSwitchover }}
            --active-switchover
{{- end }}
{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) (include "avoip.kamailio.carrier.enabled" . | trim) }}
            --homer={{ include "avoip.fullname" . }}-homer-heplify.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}:{{ $.Values.homer.capture.hepTCPPort }}
            --homer-protocol=tcp
            --homer-id=103
            --homer-enable-ng
{{- end }}
            --foreground
            --log-stderr
{{- if .Values.rtpengine.logging.enabled }}
            --log-level={{ .Values.rtpengine.logging.level }}
            --log-level-control={{ .Values.rtpengine.logging.controlLevel }}
            --log-level-spandsp={{ .Values.rtpengine.logging.spandspLevel }}
            --log-level-rtcp={{ .Values.rtpengine.logging.rtcpLevel }}
{{- else }}
            --log-level=6
{{- end }}
        image:
          repository: '{{ .Values.rtpengine.image.repository }}'
          tag: '{{ .Values.rtpengine.image.tag }}'
          digest: '{{ .Values.rtpengine.image.digest }}'
          pullPolicy: '{{ .Values.rtpengine.image.pullPolicy }}'
        env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: RTPENGINE_REDIS_RESTORE_REQUIRED
            value: '{{ .Values.rtpengine.valkey.enabled }}'
{{- if .Values.rtpengine.valkey.enabled }}
          - name: RTPENGINE_REDIS_HOST
            value: '{{ default (printf "%s.%s.svc.%s" (include "avoip.rtpengine.valkeyProxyName" .) .Release.Namespace (default "cluster.local" .Values.cluster.domain)) .Values.rtpengine.valkey.host }}'
          - name: RTPENGINE_REDIS_AUTH_PW
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.rtpengine.valkey.secretName }}'
                key: '{{ .Values.rtpengine.valkey.passwordKey }}'
          - name: RTPENGINE_REDIS_SUBSCRIBE_AUTH_PW
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.rtpengine.valkey.secretName }}'
                key: '{{ .Values.rtpengine.valkey.passwordKey }}'
{{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
{{- if .Values.rtpengine.valkey.enabled }}
                  - test -f /tmp/rtpengine-redis-restored
{{- else }}
                  - kill -0 1
{{- end }}
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
          - name: control
            containerPort: {{ .Values.rtpengine.controlPort }}
            protocol: UDP
          {{- if eq .Values.rtpengine.control.transport "websocket" }}
          - name: control-ws
            containerPort: {{ .Values.rtpengine.control.websocketPort }}
            protocol: TCP
          {{- end }}
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}
{{- end }}
{{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.rtpengine.valkey.enabled }}
  rtpengine-valkey-proxy:
    forceRename: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: {{ .Values.rtpengine.valkey.proxy.replicas }}
    revisionHistoryLimit: 3
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
              topologyKey: kubernetes.io/hostname
    containers:
      haproxy:
        command:
          - /usr/local/sbin/haproxy
        args:
          - '-W'
          - '-db'
          - '-f'
          - /usr/local/etc/haproxy/haproxy.cfg
        image:
          repository: '{{ .Values.rtpengine.valkey.proxy.image.repository }}'
          tag: '{{ .Values.rtpengine.valkey.proxy.image.tag }}'
          digest: '{{ .Values.rtpengine.valkey.proxy.image.digest }}'
          pullPolicy: '{{ .Values.rtpengine.valkey.proxy.image.pullPolicy }}'
        env:
          - name: VALKEY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.rtpengine.valkey.secretName }}'
                key: '{{ .Values.rtpengine.valkey.passwordKey }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: health
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 120
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: health
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 2
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1
              periodSeconds: 30
              timeoutSeconds: 2
              failureThreshold: 3
        ports:
          - name: redis
            containerPort: {{ .Values.rtpengine.valkey.proxy.port }}
            protocol: TCP
          - name: health
            containerPort: {{ .Values.rtpengine.valkey.proxy.healthPort }}
            protocol: TCP
{{- end }}
{{ if .Values.freeswitch.enabled }}
{{ $cdrHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.freeswitch.cdr.host }}
  freeswitch:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: {{ ternary .Values.freeswitch.highAvailability.replicas 1 .Values.freeswitch.highAvailability.enabled }}
    {{- if .Values.freeswitch.highAvailability.enabled }}
    podDisruptionBudget:
      minAvailable: {{ .Values.freeswitch.highAvailability.minAvailable }}
    {{- end }}
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
{{- if .Values.freeswitch.highAvailability.enabled }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'freeswitch'
                  app.kubernetes.io/instance: '{{ $.Release.Name }}'
{{- end }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      annotations:
        kubectl.kubernetes.io/default-container: 'freeswitch'
        kubectl.kubernetes.io/default-logs-container: 'freeswitch'
        # Flowroute/fax, Sofia, dialplan, and core XML are mounted as separate
        # ConfigMaps. Roll the pod so FreeSWITCH reloads the complete set
        # consistently instead of retaining a mixed in-memory configuration.
        configmap.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-freeswitch-configs,{{ include "avoip.fullname" . }}-freeswitch-misc-configs,{{ include "avoip.fullname" . }}-freeswitch-sip-configs,{{ include "avoip.fullname" . }}-freeswitch-dialplan-configs{{ range .Values.avoipAdmin.upstreams }}{{ if eq (default "credentials" .authentication) "ip-acl" }},{{ include "avoip.resourceNameWithSuffix" (dict "root" $ "suffix" (printf "upstream-%s" .name)) }}{{ end }}{{ end }}'
{{- if .Values.freeswitch.sms.enabled }}
        secret.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-freeswitch-sms,{{ include "avoip.fullname" . }}-freeswitch-sip-tls{{ if .Values.asterisk.enabled }},{{ include "avoip.fullname" . }}-asterisk-sip-tls,{{ include "avoip.fullname" . }}-asterisk-freeswitch-peer{{ end }}{{ if .Values.freeswitch.flowrouteOutbound.enabled }},{{ include "avoip.fullname" . }}-freeswitch-flowroute,{{ include "avoip.fullname" . }}-freeswitch-flowroute-client-tls{{ end }}{{ range .Values.avoipAdmin.upstreams }}{{ if eq (default "credentials" .authentication) "credentials" }},{{ include "avoip.resourceNameWithSuffix" (dict "root" $ "suffix" (printf "upstream-%s" .name)) }}{{ end }}{{ end }}'
{{- else }}
        secret.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-freeswitch-sip-tls{{ if .Values.asterisk.enabled }},{{ include "avoip.fullname" . }}-asterisk-sip-tls{{ end }}{{ if .Values.freeswitch.flowrouteOutbound.enabled }},{{ include "avoip.fullname" . }}-freeswitch-flowroute,{{ include "avoip.fullname" . }}-freeswitch-flowroute-client-tls{{ end }}{{ range .Values.avoipAdmin.upstreams }}{{ if eq (default "credentials" .authentication) "credentials" }},{{ include "avoip.resourceNameWithSuffix" (dict "root" $ "suffix" (printf "upstream-%s" .name)) }}{{ end }}{{ end }}'
{{- end }}
    initContainers:
{{ if and .Values.avoipAdmin.enabled .Values.avoipAdmin.routing.enabled }}
      managed-dialplan-config:
        image:
          repository: '{{ .Values.avoipAdmin.image.repository }}'
          tag: '{{ .Values.avoipAdmin.image.tag }}'
          digest: '{{ .Values.avoipAdmin.image.digest }}'
        env:
          - name: 'SMS_SERVICE_MODE'
            value: 'fs-config'
          - name: 'AVOIP_ADMIN_INTERNAL_URL'
            value: 'http://{{ include "avoip.fullname" . }}-admin.{{ .Release.Namespace }}.svc.{{ .Values.cluster.domain }}:8081'
          - name: 'AVOIP_ROUTING_TOKEN'
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-admin-routing-token'
                key: 'token'
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
{{ end }}
{{- if .Values.freeswitch.cdr.enabled }}
      cdr-schema:
        image:
          repository: 'postgres'
          tag: '17-alpine'
          digest: 'sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24'
          pullPolicy: 'IfNotPresent'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            export PGUSER="$USERNAME"
            export PGPASSWORD="$PASSWORD"
            export PGDATABASE="$USERNAME"
            until psql -v ON_ERROR_STOP=1 -h '{{ $cdrHost }}' -p '{{ $.Values.freeswitch.cdr.port }}' -c 'SELECT 1' >/dev/null 2>&1; do
              sleep 2
            done
            psql -v ON_ERROR_STOP=1 -h '{{ $cdrHost }}' -p '{{ $.Values.freeswitch.cdr.port }}' <<'SQL'
            CREATE TABLE IF NOT EXISTS {{ $.Values.freeswitch.cdr.table }} (
              id bigserial PRIMARY KEY,
              local_ip_v4 text,
              caller_id_name text,
              caller_id_number text,
              destination_number text NOT NULL,
              context text NOT NULL,
              start_stamp text,
              answer_stamp text,
              end_stamp text,
              duration bigint,
              billsec bigint,
              hangup_cause text,
              uuid text NOT NULL,
              bleg_uuid text,
              accountcode text,
              read_codec text,
              write_codec text
            )
            SQL
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
{{- end }}
      tls-material:
        image:
          repository: '{{ .Values.freeswitch.image.repository }}'
          tag: '{{ .Values.freeswitch.image.tag }}'
          digest: '{{ .Values.freeswitch.image.digest }}'
          pullPolicy: '{{ .Values.freeswitch.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            umask 077
            # Sofia expects the leaf certificate, private key, then any
            # intermediates. cert-manager stores the chain as leaf followed by
            # intermediates in tls.crt; placing the key between them makes the
            # full chain available to TLS clients instead of serving only the
            # leaf certificate.
            awk 'BEGIN { n = 0 } /BEGIN CERTIFICATE/ { n++ } n == 1 { print }' /tls-input/tls.crt > /tls-output/agent.pem
            cat /tls-input/tls.key >> /tls-output/agent.pem
            awk 'BEGIN { n = 0 } /BEGIN CERTIFICATE/ { n++ } n > 1 { print }' /tls-input/tls.crt >> /tls-output/agent.pem
            cp /etc/ssl/certs/ca-certificates.crt /tls-output/cafile.pem
{{- if .Values.freeswitch.flowrouteOutbound.enabled }}
            awk 'BEGIN { n = 0 } /BEGIN CERTIFICATE/ { n++ } n == 1 { print }' /tls-flowroute/tls.crt > /tls-flowroute-output/agent.pem
            cat /tls-flowroute/tls.key >> /tls-flowroute-output/agent.pem
            awk 'BEGIN { n = 0 } /BEGIN CERTIFICATE/ { n++ } n > 1 { print }' /tls-flowroute/tls.crt >> /tls-flowroute-output/agent.pem
            cat /tls-flowroute/ca.crt >> /tls-flowroute-output/cafile.pem
{{- end }}
{{- if .Values.asterisk.enabled }}
            awk 'BEGIN { n = 0 } /BEGIN CERTIFICATE/ { n++ } n > 1 { print }' /tls-peer/tls.crt >> /tls-output/cafile.pem
{{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    containers:
      freeswitch:
        command:
          - /bin/sh
          - -c
        args:
          - |
            exec /usr/bin/freeswitch -nonat -nocal -nort -nosql -nf -nc </dev/null
        image:
          repository: '{{ .Values.freeswitch.image.repository }}'
          tag: '{{ .Values.freeswitch.image.tag }}'
          digest: '{{ .Values.freeswitch.image.digest }}'
          pullPolicy: '{{ .Values.freeswitch.image.pullPolicy }}'
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: password
        {{- if .Values.asterisk.enabled }}
          - name: ASTERISK_PEER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-asterisk-freeswitch-peer'
                key: password
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
          - name: udp-sip
            containerPort: 5060
            protocol: UDP
          - name: tcp-sip
            containerPort: 5060
            protocol: TCP
          - name: tls-sips
            containerPort: 5061
            protocol: TCP
          - name: tls-asterisk
            containerPort: {{ .Values.freeswitch.asterisk.tlsPort }}
            protocol: TCP
          {{- if .Values.freeswitch.flowrouteOutbound.enabled }}
          - name: tls-flowroute
            containerPort: {{ .Values.freeswitch.flowrouteOutbound.tlsPort }}
            protocol: TCP
          {{- end }}
          - name: udp-sip-edge
            containerPort: 5090
            protocol: UDP
{{- if and (include "avoip.homer.enabled" . | trim) (include "avoip.kamailio.carrier.enabled" . | trim) .Values.homer.recordings.enabled .Values.freeswitch.media.diagnostics.callRecording.enabled }}
      recordings:
        image:
          repository: '{{ .Values.homer.recordings.image.repository }}'
          tag: '{{ .Values.homer.recordings.image.tag }}'
          digest: '{{ .Values.homer.recordings.image.digest }}'
          pullPolicy: '{{ .Values.homer.recordings.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            (while :; do
              find /recordings -maxdepth 1 -type f -name '*.wav' -mtime +{{ sub (int .Values.homer.recordings.retentionDays) 1 }} -exec rm -f '{}' \;
              sleep 21600
            done) &
            exec nginx -g 'daemon off;'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
          - name: recordings
            containerPort: {{ .Values.homer.recordings.port }}
            protocol: TCP
{{- end }}
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}

{{ end }}
{{- if and (include "avoip.homer.enabled" . | trim) (include "avoip.kamailio.carrier.enabled" . | trim) }}
  homer-web:
    forceRename: '{{ include "avoip.fullname" . }}-homer-web'
    # Homer writes SQLite and DuckDB catalogs; Recreate prevents two pods from
    # writing the same RWX volume during a rollout.
    strategy: Recreate
    replicas: 1
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        # Homer 11's upstream image runs as uid/gid 1000.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-homer-web'
      annotations:
        kubectl.kubernetes.io/default-container: 'homer'
        kubectl.kubernetes.io/default-logs-container: 'homer'
    containers:
      homer:
        command:
          - /bin/sh
          - -c
        args:
          - >-
            sed "s|__OIDC_CLIENT_ID__|${OIDC_CLIENT_ID}|g;
            s|__OIDC_CLIENT_SECRET__|${OIDC_CLIENT_SECRET}|g;
            s|__JWT_SECRET__|${JWT_SECRET}|g" /etc/homer-template/homer.json
            > /data/homer/homer.json && exec /homer --config-path /data/homer/homer.json
        image:
          repository: '{{ .Values.homer.web.image.repository }}'
          tag: '{{ .Values.homer.web.image.tag }}'
          digest: '{{ .Values.homer.web.image.digest }}'
          pullPolicy: '{{ .Values.homer.web.image.pullPolicy }}'
        env:
          - name: OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.homer.oidc.workspaceName }}'
                key: OIDC_CLIENT_ID
          - name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.homer.oidc.workspaceName }}'
                key: OIDC_CLIENT_SECRET
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.homer.oidc.workspaceName }}'
                key: JWT_SECRET
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
          - name: hep
            containerPort: {{ .Values.homer.capture.hepPort }}
            protocol: UDP
          - name: hep-tcp
            containerPort: {{ .Values.homer.capture.hepTCPPort }}
            protocol: TCP
          - name: ingest-http
            containerPort: {{ .Values.homer.capture.httpPort }}
            protocol: TCP
          - name: metrics
            containerPort: {{ .Values.homer.capture.metricsPort }}
            protocol: TCP
          - name: http
            containerPort: {{ .Values.homer.web.port }}
            protocol: TCP
{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) (include "avoip.kamailio.carrier.enabled" . | trim) .Values.homer.soundLibrary.enabled (or .Values.asterisk.enabled .Values.freeswitch.enabled) }}
  audio-library:
    forceRename: '{{ include "avoip.fullname" . }}-audio-library'
    replicas: 1
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-audio-library'
      annotations:
        kubectl.kubernetes.io/default-container: 'audio-library'
        kubectl.kubernetes.io/default-logs-container: 'audio-library'
    containers:
      audio-library:
        command:
          - /bin/sh
          - -c
        args:
          - exec nginx -g 'daemon off;'
        image:
          repository: '{{ .Values.homer.recordings.image.repository }}'
          tag: '{{ .Values.homer.recordings.image.tag }}'
          digest: '{{ .Values.homer.recordings.image.digest }}'
          pullPolicy: '{{ .Values.homer.recordings.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ['ALL']
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: '{{ .Values.homer.soundLibrary.path }}/'
                port: http
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 12
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: '{{ .Values.homer.soundLibrary.path }}/'
                port: http
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
          - name: http
            containerPort: {{ .Values.homer.soundLibrary.port }}
            protocol: TCP
{{- end }}

service:
{{- with $routrResources.services }}{{ toYaml . | nindent 2 }}{{- end }}
{{- if .Values.asterisk.enabled }}
  asterisk:
    forceRename: '{{ include "avoip.fullname" . }}-asterisk'
    controller: asterisk
{{- include "avoip.service.options" (dict "root" $ "name" "asterisk") | nindent 4 }}
    extraSelectorLabels:
      app: '{{ include "avoip.fullname" . }}-asterisk'
    ports:
      tcp-sip:
        port: 5060
        targetPort: tcp-sip
        protocol: TCP
      udp-sip:
        port: 5060
        targetPort: udp-sip
        protocol: UDP
      tls-sips:
        port: 5061
        targetPort: tls-sips
        protocol: TCP
{{- end }}
{{- if and .Values.asterisk.sipCore.enabled .Values.asterisk.sipCore.media.enabled }}
  asterisk-rtp:
    forceRename: '{{ include "avoip.resourceNameWithSuffix" (dict "root" . "suffix" "asterisk-rtp") }}'
    controller: asterisk
    externalTrafficPolicy: 'Cluster'
{{- include "avoip.service.options" (dict "root" $ "name" "asterisk-rtp" "type" "LoadBalancer") | nindent 4 }}
    extraSelectorLabels:
      app: '{{ include "avoip.fullname" . }}-asterisk'
    ports:
{{- range untilStep (.Values.asterisk.rtp.min | int) (add (.Values.asterisk.rtp.max | int) 1 | int) 1 }}
      'udp-{{ . }}':
        port: {{ . }}
        targetPort: 'udp-{{ . }}'
        protocol: 'UDP'
{{- end }}
{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) (include "avoip.kamailio.carrier.enabled" . | trim) .Values.homer.soundLibrary.enabled (or .Values.asterisk.enabled .Values.freeswitch.enabled) }}
  audio-library:
    forceRename: '{{ include "avoip.fullname" . }}-audio-library'
    controller: audio-library
{{- include "avoip.service.options" (dict "root" $ "name" "audio-library") | nindent 4 }}
    ports:
      http:
        port: {{ .Values.homer.soundLibrary.port }}
        targetPort: http
        protocol: TCP
{{- end }}
{{- range $instance := (include "avoip.kamailio.instances" . | fromYamlArray) -}}
{{- if $instance.enabled -}}
{{- $values := deepCopy $.Values -}}
{{- $_ := set $values "kamailio" $instance -}}
{{- $ctx := dict "Values" $values "Release" $.Release "Chart" $.Chart "Files" $.Files "Capabilities" $.Capabilities -}}
{{- include "avoip.kamailio.common.services" $ctx }}
{{ end }}
{{ end }}
{{- if .Values.freeswitch.enabled }}
  freeswitch:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch'
    controller: freeswitch
{{- include "avoip.service.options" (dict "root" $ "name" "freeswitch") | nindent 4 }}
    ports:
{{ if and .Values.avoipAdmin.enabled .Values.avoipAdmin.routing.enabled }}
      tls-managed:
        port: 5072
        targetPort: 5072
        protocol: 'TCP'
{{ end }}
      tcp-sip:
        port: 5060
        targetPort: tcp-sip
        protocol: TCP
      udp-sip:
        port: 5060
        targetPort: udp-sip
        protocol: UDP
      udp-sip-edge:
        port: 5090
        targetPort: udp-sip-edge
        protocol: UDP
      tls-sips:
        port: 5061
        targetPort: tls-sips
        protocol: TCP
      tls-asterisk:
        port: {{ .Values.freeswitch.asterisk.tlsPort }}
        targetPort: tls-asterisk
        protocol: TCP
{{- if and .Values.freeswitch.publicExposure.enabled (or (not (include "avoip.rtpengine.enabled" . | trim)) (not (include "avoip.kamailio.carrier.enabled" . | trim))) }}
  freeswitch-rtp:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch-rtp'
    controller: freeswitch
    {{- if eq (include "avoip.service.type" (dict "root" $ "name" "freeswitch-rtp") | trim) "LoadBalancer" }}
    # Preserve carrier RTP source addresses and avoid cross-node kube-proxy
    # SNAT for the public media socket.
    externalTrafficPolicy: Local
    {{- end }}
{{- include "avoip.service.options" (dict "root" $ "name" "freeswitch-rtp") | nindent 4 }}
    ports:
      rtp:
        portRange:
          start: {{ .Values.freeswitch.rtp.min }}
          end: {{ sub (.Values.freeswitch.rtp.max | int) 1 }}
        protocol: UDP
{{- end }}
{{- end }}
{{- if (include "avoip.rtpengine.enabled" . | trim) }}
  rtpengine:
    forceRename: '{{ include "avoip.fullname" . }}-rtpengine'
    controller: rtpengine
{{- include "avoip.service.options" (dict "root" $ "name" "rtpengine") | nindent 4 }}
    ports:
      control:
        port: {{ .Values.rtpengine.controlPort }}
        targetPort: control
        protocol: UDP
      {{- if eq .Values.rtpengine.control.transport "websocket" }}
      control-ws:
        port: {{ .Values.rtpengine.control.websocketPort }}
        targetPort: control-ws
        protocol: TCP
      {{- end }}
  rtpengine-media:
    forceRename: '{{ include "avoip.fullname" . }}-rtpengine-media'
    controller: rtpengine
    {{- if eq (include "avoip.service.type" (dict "root" $ "name" "rtpengine-media") | trim) "LoadBalancer" }}
    {{- if not (has .Values.rtpengine.media.externalTrafficPolicy (list "Cluster" "Local")) }}
    {{- fail "rtpengine.media.externalTrafficPolicy must be Cluster or Local" }}
    {{- end }}
    externalTrafficPolicy: '{{ .Values.rtpengine.media.externalTrafficPolicy }}'
    {{- end }}
{{- include "avoip.service.options" (dict "root" $ "name" "rtpengine-media") | nindent 4 }}
    ports:
      rtp:
        portRange:
          start: {{ .Values.rtpengine.media.min }}
          end: {{ sub (.Values.rtpengine.media.max | int) 1 }}
        protocol: UDP
{{- end }}
{{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.rtpengine.valkey.enabled }}
  rtpengine-valkey-proxy:
    forceRename: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
    controller: rtpengine-valkey-proxy
{{- include "avoip.service.options" (dict "root" $ "name" "rtpengine-valkey-proxy") | nindent 4 }}
    ports:
      redis:
        port: {{ .Values.rtpengine.valkey.proxy.port }}
        targetPort: redis
        protocol: TCP
      health:
        port: {{ .Values.rtpengine.valkey.proxy.healthPort }}
        targetPort: health
        protocol: TCP
{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) (include "avoip.kamailio.carrier.enabled" . | trim) }}
  homer-heplify:
    forceRename: '{{ include "avoip.fullname" . }}-homer-heplify'
    controller: homer-web
{{- include "avoip.service.options" (dict "root" $ "name" "homer-heplify") | nindent 4 }}
    ports:
      hep:
        port: {{ .Values.homer.capture.hepPort }}
        targetPort: hep
        protocol: UDP
      hep-tcp:
        port: {{ .Values.homer.capture.hepTCPPort }}
        targetPort: hep-tcp
        protocol: TCP
      metrics:
        port: {{ .Values.homer.capture.metricsPort }}
        targetPort: metrics
        protocol: TCP
  homer-web:
    forceRename: '{{ include "avoip.fullname" . }}-homer-web'
    controller: homer-web
{{- include "avoip.service.options" (dict "root" $ "name" "homer-web") | nindent 4 }}
    ports:
      http:
        port: 80
        targetPort: http
        protocol: TCP
{{- if and .Values.homer.recordings.enabled .Values.freeswitch.enabled .Values.freeswitch.media.diagnostics.callRecording.enabled }}
  homer-recordings:
    forceRename: '{{ include "avoip.fullname" . }}-rec'
    controller: freeswitch
{{- include "avoip.service.options" (dict "root" $ "name" "homer-recordings") | nindent 4 }}
    ports:
      http:
        port: {{ .Values.homer.recordings.port }}
        targetPort: recordings
        protocol: TCP
{{- end }}
{{- end }}

persistence:
{{ include "avoip.routr.common.persistence" . }}
{{- if .Values.asterisk.enabled }}
  asterisk-localtime:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk-timezone:
          - path: /timezone
        asterisk:
          - path: /etc/localtime
            subPath: localtime
            readOnly: true
{{- end }}
{{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.rtpengine.valkey.enabled }}
  rtpengine-valkey-proxy-config:
    type: configMap
    name: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
    advancedMounts:
