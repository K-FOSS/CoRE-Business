{{- if and .Values.asterisk.sipCore.callbackAudioDiagnostics.enabled (or (lt (int .Values.asterisk.sipCore.callbackAudioDiagnostics.rtpLeadInMs) 0) (gt (int .Values.asterisk.sipCore.callbackAudioDiagnostics.rtpLeadInMs) 1000)) }}{{- fail "asterisk.sipCore.callbackAudioDiagnostics.rtpLeadInMs must be between 0 and 1000" }}{{- end }}
