{{- include "bjw-s.common.loader.init" . }}

{{- define "avoip.common.values" -}}
{{- $asteriskCdrHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.asterisk.cdr.host -}}
{{- if .Values.kamailio.topology.enabled }}
{{- if not .Values.kamailio.topology.redis.secretName }}{{- fail "kamailio.topology.redis.secretName is required when topology hiding is enabled" }}{{- end }}
{{- if not .Values.kamailio.topology.redis.serverKey }}{{- fail "kamailio.topology.redis.serverKey is required when topology hiding is enabled" }}{{- end }}
{{- if lt (int .Values.kamailio.topology.redis.database) 1 }}{{- fail "kamailio.topology.redis.database must be a non-zero site-local Dragonfly allocation" }}{{- end }}
{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) .Values.kamailio.enabled .Values.homer.recordings.enabled .Values.freeswitch.enabled .Values.freeswitch.media.diagnostics.callRecording.enabled }}
{{- if lt (int .Values.homer.recordings.retentionDays) 1 }}{{- fail "homer.recordings.retentionDays must be at least one day" }}{{- end }}
{{- if ne (clean .Values.freeswitch.media.diagnostics.callRecording.path) (clean .Values.freeswitch.fax.spoolPath) }}{{- fail "FreeSWITCH callRecording.path must match fax.spoolPath when Homer playback is enabled" }}{{- end }}
{{- end }}
global:
  nameOverride: '{{ .Release.Name }}'
  createDefaultServiceAccount: false

defaultPodOptions:
  labels:
    logs: loki-myloginspace

configMaps:
{{- if and .Values.kamailio.enabled .Values.kamailio.topology.enabled }}
  kamailio-topos-tls-proxy:
    forceRename: '{{ include "avoip.fullname" . }}-kamailio-topos-tls-proxy'
    includeChecksumInControllers:
      - 'kamailio'
    data:
      haproxy.cfg: |
        global
          log stdout format raw local0
          maxconn 256

        defaults
          log global
          mode tcp
          timeout connect 2s
          timeout client 1h
          timeout server 1h

        frontend topos_clients
          bind 127.0.0.1:{{ .Values.kamailio.topology.redis.proxyPort }}
          default_backend dragonfly

        backend dragonfly
          server dragonfly {{ default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.kamailio.topology.redis.host }}:{{ .Values.kamailio.topology.redis.port }} check ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str({{ default (printf "dragonfly.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.kamailio.topology.redis.tlsServerName }})
{{- end }}
{{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.rtpengine.valkey.enabled }}
{{- if ne (int .Values.rtpengine.valkey.shards) 1 }}{{- fail "RTPEngine Valkey proxy requires exactly one Valkey shard" }}{{- end }}
{{- if ne (int .Values.rtpengine.valkey.database) 0 }}{{- fail "Valkey Cluster requires RTPEngine database 0" }}{{- end }}
  rtpengine-valkey-proxy:
    forceRename: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
    includeChecksumInControllers:
      - 'rtpengine-valkey-proxy'
    data:
      haproxy.cfg: |
        global
          log stdout format raw local0
          maxconn 4096

        defaults
          log global
          mode tcp
          timeout connect 2s
          timeout client 1h
          timeout server 1h

        resolvers kubernetes
          parse-resolv-conf
          resolve_retries 3
          timeout resolve 1s
          hold valid 2s

        frontend valkey_clients
          bind :{{ .Values.rtpengine.valkey.proxy.port }}
          default_backend valkey_primary

        backend valkey_primary
          option tcp-check
          tcp-check connect
          tcp-check send "AUTH default ${VALKEY_PASSWORD}\r\n"
          tcp-check expect string +OK
          tcp-check send "INFO replication\r\n"
          tcp-check expect string role:master
{{- $nodeCount := int (mul (int .Values.rtpengine.valkey.shards) (add 1 (int .Values.rtpengine.valkey.replicas))) }}
{{- range $node := until $nodeCount }}
          server valkey-{{ $node }} valkey-{{ $.Values.rtpengine.valkey.clusterName }}-0-{{ $node }}-0.{{ $.Values.rtpengine.valkey.clusterHost }}:{{ $.Values.rtpengine.valkey.port }} check inter 1s fall 1 rise 1 on-marked-down shutdown-sessions resolvers kubernetes init-addr libc,none
{{- end }}

        frontend health
          mode http
          bind :{{ .Values.rtpengine.valkey.proxy.healthPort }}
          monitor-uri /healthz
          monitor fail if { nbsrv(valkey_primary) lt 1 }
{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) .Values.kamailio.enabled .Values.homer.recordings.enabled .Values.freeswitch.enabled .Values.freeswitch.media.diagnostics.callRecording.enabled }}
  homer-recordings:
    forceRename: '{{ include "avoip.fullname" . }}-homer-recordings'
    includeChecksumInControllers:
      - 'freeswitch'
    data:
      default.conf: |
{{ $.Files.Get "files/homer-recordings/default.conf" | replace "__PORT__" (toString $.Values.homer.recordings.port) | indent 8 }}
      index.html: |
{{ $.Files.Get "files/homer-recordings/index.html" | indent 8 }}
      player.js: |
{{ $.Files.Get "files/homer-recordings/player.js" | indent 8 }}
{{- end }}

networkpolicies:
{{- if and .Values.kamailio.enabled .Values.freeswitch.enabled (not .Values.kamailio.backend.serviceName) }}
  kamailio-sip-ingress:
    controller: kamailio
    policyTypes:
      - Ingress
      - Egress
    rules:
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: '{{ .Values.kamailio.networkPolicy.envoy.namespace }}'
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: '{{ .Values.kamailio.networkPolicy.envoy.podName }}'
          ports:
            - protocol: TCP
              port: 5061
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: freeswitch
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: TCP
              port: 5062
      egress:
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: freeswitch
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: TCP
              port: 5061
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: rtpengine
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: UDP
              port: {{ .Values.rtpengine.controlPort }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: dragonfly
                  app.kubernetes.io/instance: dragonfly-core
          ports:
            - protocol: TCP
              port: 6379
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
{{- range .Values.flowroute.signalingCIDRs }}
        - to:
            - ipBlock:
                cidr: '{{ . }}'
          ports:
            - protocol: TCP
              port: 5061
{{- end }}
{{- if include "avoip.homer.enabled" . | trim }}
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: homer-web
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
          ports:
            - protocol: TCP
              port: 9061
{{- end }}
{{- end }}

controllers:
{{- if .Values.asterisk.enabled }}
  asterisk:
    forceRename: '{{ include "avoip.fullname" . }}-asterisk'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: 1
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-asterisk'
      annotations:
        kubectl.kubernetes.io/default-container: 'asterisk'
        kubectl.kubernetes.io/default-logs-container: 'asterisk'
        # Reloader restarts Asterisk when its file-backed configuration changes.
        # The credentials are rendered into startup-only files, so include the
        # mounted Secret as well when the generated connection changes.
        configmap.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-asterisk-configs,{{ include "avoip.fullname" . }}-asterisk-config-tpl'
        secret.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-asterisk,{{ include "avoip.fullname" . }}-asterisk-sip-tls'
    initContainers:
{{- if .Values.asterisk.cdr.enabled }}
      cdr-schema:
        image:
          repository: 'postgres'
          tag: '17-alpine'
          digest: 'sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24'
          pullPolicy: 'IfNotPresent'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            export PGUSER="$USERNAME"
            export PGPASSWORD="$PASSWORD"
            export PGDATABASE="$USERNAME"
            until psql -v ON_ERROR_STOP=1 -h '{{ $asteriskCdrHost }}' -p '{{ $.Values.asterisk.cdr.port }}' -c 'SELECT 1' >/dev/null 2>&1; do
              sleep 2
            done
            psql -v ON_ERROR_STOP=1 -h '{{ $asteriskCdrHost }}' -p '{{ $.Values.asterisk.cdr.port }}' <<'SQL'
            CREATE TABLE IF NOT EXISTS {{ $.Values.asterisk.cdr.table }} (
              calldate timestamp NOT NULL,
              clid varchar(80) NOT NULL,
              src varchar(80) NOT NULL,
              dst varchar(80) NOT NULL,
              dcontext varchar(80) NOT NULL,
              channel varchar(80) NOT NULL,
              dstchannel varchar(80) NOT NULL,
              lastapp varchar(80) NOT NULL,
              lastdata varchar(80) NOT NULL,
              duration integer NOT NULL,
              billsec integer NOT NULL,
              disposition varchar(45) NOT NULL,
              amaflags integer NOT NULL,
              accountcode varchar(20) NOT NULL,
              uniqueid varchar(150) NOT NULL,
              userfield varchar(255) NOT NULL,
              peeraccount varchar(20),
              linkedid varchar(150),
              sequence integer
            )
            SQL
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-asterisk'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-asterisk'
                key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
{{- end }}
      asterisk-sounds:
        image:
          repository: '{{ .Values.asterisk.image.repository }}'
          tag: '{{ .Values.asterisk.image.tag }}'
          digest: '{{ .Values.asterisk.image.digest }}'
          pullPolicy: '{{ .Values.asterisk.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            ls -lah /usr/share/asterisk/sounds/en/
            ls -lah /usr/share/asterisk
            ls -lah /var/lib/asterisk
            ls -lah /var/lib/asterisk/sounds
            mkdir -p /var/lib/asterisk/sounds/en
            cp -R /usr/share/asterisk/sounds/en/. /var/lib/asterisk/sounds/en/
            test -f /var/lib/asterisk/sounds/en/demo-congrats.gsm
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    containers:
      asterisk:
        command:
          - /bin/sh
          - -c
        args:
          - |
            umask 077
            printf '[freeswitch-auth]\n' > /tmp/avoip-pjsip-auth.conf
            printf 'type=auth\n' >> /tmp/avoip-pjsip-auth.conf
            printf 'auth_type=userpass\n' >> /tmp/avoip-pjsip-auth.conf
            printf 'username=%s\n' "$(cat /tmp/avoip-username)" >> /tmp/avoip-pjsip-auth.conf
            printf 'password=%s\n' "$(cat /tmp/avoip-password)" >> /tmp/avoip-pjsip-auth.conf
{{- if .Values.asterisk.cdr.enabled }}
            printf '[global]\n' > /tmp/avoip-cdr_pgsql.conf
            printf 'hostname={{ $asteriskCdrHost }}\n' >> /tmp/avoip-cdr_pgsql.conf
            printf 'port={{ .Values.asterisk.cdr.port }}\n' >> /tmp/avoip-cdr_pgsql.conf
            printf 'dbname=%s\n' "$(cat /tmp/avoip-username)" >> /tmp/avoip-cdr_pgsql.conf
            printf 'user=%s\n' "$(cat /tmp/avoip-username)" >> /tmp/avoip-cdr_pgsql.conf
            printf 'password=%s\n' "$(cat /tmp/avoip-password)" >> /tmp/avoip-cdr_pgsql.conf
            printf 'encoding=UTF-8\n' >> /tmp/avoip-cdr_pgsql.conf
            printf 'table={{ .Values.asterisk.cdr.table }}\n' >> /tmp/avoip-cdr_pgsql.conf
{{- end }}
            exec /usr/sbin/asterisk -f -C /etc/asterisk/asterisk.conf
        image:
          repository: '{{ .Values.asterisk.image.repository }}'
          tag: '{{ .Values.asterisk.image.tag }}'
          digest: '{{ .Values.asterisk.image.digest }}'
          pullPolicy: '{{ .Values.asterisk.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 24
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
        ports:
          - name: tcp-sip
            containerPort: 5060
            protocol: TCP
          - name: udp-sip
            containerPort: 5060
            protocol: UDP
          - name: tls-sips
            containerPort: 5061
            protocol: TCP
{{- range untilStep (.Values.asterisk.rtp.min | int) (.Values.asterisk.rtp.max | int) 1 }}
          - name: 'udp-{{ . }}'
            containerPort: {{ . }}
            protocol: UDP
          - name: 'tcp-{{ . }}'
            containerPort: {{ . }}
            protocol: TCP
{{ end }}
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}
{{ end }}
{{ if .Values.kamailio.enabled }}
  kamailio:
    forceRename: '{{ include "avoip.fullname" . }}-kamailio'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: {{ .Values.kamailio.replicas }}
    podDisruptionBudget:
      minAvailable: {{ .Values.kamailio.podDisruptionBudget.minAvailable }}
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-kamailio'
      annotations:
        kubectl.kubernetes.io/default-container: 'kamailio'
        kubectl.kubernetes.io/default-logs-container: 'kamailio'
        # Restart Kamailio when its generated routing/TLS configuration or the
        # shared certificate material changes so listeners and media routes are
        # loaded from one consistent configuration set.
        configmap.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-kamailio-config'
        secret.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-kamailio-sip-tls{{ if .Values.freeswitch.enabled }},{{ include "avoip.fullname" . }}-freeswitch-sip-tls{{ end }}{{ if .Values.kamailio.topology.enabled }},{{ .Values.kamailio.topology.redis.secretName }}{{ end }}'
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: '{{ include "avoip.fullname" . }}-kamailio'
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: '{{ include "avoip.fullname" . }}-kamailio'
    initContainers:
{{- if .Values.freeswitch.enabled }}
      tls-ca:
        image:
          repository: '{{ .Values.kamailio.image.repository }}'
          tag: '{{ .Values.kamailio.image.tag }}'
          digest: '{{ .Values.kamailio.image.digest }}'
          pullPolicy: '{{ .Values.kamailio.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            cp /etc/ssl/certs/ca-certificates.crt /tls-output/ca-certificates.crt
            awk 'BEGIN { n = 0 } /BEGIN CERTIFICATE/ { n++ } n > 1 { print }' /tls-peer/tls.crt >> /tls-output/ca-certificates.crt
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
{{- end }}
    containers:
{{- if .Values.kamailio.topology.enabled }}
      topos-tls-proxy:
        command:
          - /usr/local/sbin/haproxy
        args:
          - '-W'
          - '-db'
          - '-f'
          - /usr/local/etc/haproxy/haproxy.cfg
        image:
          repository: '{{ .Values.rtpengine.valkey.proxy.image.repository }}'
          tag: '{{ .Values.rtpengine.valkey.proxy.image.tag }}'
          digest: '{{ .Values.rtpengine.valkey.proxy.image.digest }}'
          pullPolicy: '{{ .Values.rtpengine.valkey.proxy.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - nc -z 127.0.0.1 {{ .Values.kamailio.topology.redis.proxyPort }}
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 6
        ports:
          - name: topos-redis
            containerPort: {{ .Values.kamailio.topology.redis.proxyPort }}
            protocol: TCP
{{- end }}
      kamailio:
        command:
          - /bin/sh
          - -c
        args:
          - >-
            /usr/sbin/kamailio -c -f /etc/kamailio/kamailio.cfg &&
            exec /usr/sbin/kamailio -DD -E -P /tmp/kamailio.pid
            -f /etc/kamailio/kamailio.cfg
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
{{- if .Values.kamailio.topology.enabled }}
          - name: TOPOS_REDIS_SERVER
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.kamailio.topology.redis.secretName }}'
                key: '{{ .Values.kamailio.topology.redis.serverKey }}'
{{- end }}
        image:
          repository: '{{ .Values.kamailio.image.repository }}'
          tag: '{{ .Values.kamailio.image.tag }}'
          digest: '{{ .Values.kamailio.image.digest }}'
          pullPolicy: '{{ .Values.kamailio.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test -r /etc/kamailio/kamailio.cfg && test -s /tmp/kamailio.pid && kill -0 1
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 18
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    test -r /etc/kamailio/kamailio.cfg &&
                    test -s /tmp/kamailio.pid &&
                    kamcmd -s unixs:{{ .Values.kamailio.rpcSocket }} core.uptime >/dev/null
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test -s /tmp/kamailio.pid && kill -0 1
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
          - name: tls-public
            containerPort: 5061
            protocol: TCP
          - name: tls-private
            containerPort: 5062
            protocol: TCP
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}
{{ end }}
{{- if (include "avoip.rtpengine.enabled" . | trim) }}
  rtpengine:
    forceRename: '{{ include "avoip.fullname" . }}-rtpengine'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: {{ .Values.rtpengine.replicas }}
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-rtpengine'
      annotations:
        kubectl.kubernetes.io/default-container: 'rtpengine'
        kubectl.kubernetes.io/default-logs-container: 'rtpengine'
        # RTPEngine configuration is rendered into the pod command line. Any
        # values change therefore changes the pod template and rolls the
        # workload through Argo CD; there are no mounted RTPEngine configmaps
        # for a live-reload annotation to watch.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: '{{ include "avoip.fullname" . }}-rtpengine'
              topologyKey: kubernetes.io/hostname
    containers:
      rtpengine:
        command:
          - /bin/sh
          - -c
        args:
          - >-
            exec /usr/local/bin/rtpengine
            --table=-1
            --interface=internal/${POD_IP}
            --interface=external/${POD_IP}!{{ .Values.rtpengine.media.address }}
            --listen-ng=0.0.0.0:{{ .Values.rtpengine.controlPort }}
            --port-min={{ .Values.rtpengine.media.min }}
            --port-max={{ sub (.Values.rtpengine.media.max | int) 1 }}
{{- if .Values.rtpengine.valkey.enabled }}
            --redis=${RTPENGINE_REDIS_HOST}:{{ .Values.rtpengine.valkey.proxy.port }}/{{ .Values.rtpengine.valkey.database }}
            --redis-subscribe=${RTPENGINE_REDIS_HOST}:{{ .Values.rtpengine.valkey.proxy.port }}/{{ .Values.rtpengine.valkey.subscribeKeyspace }}
            --subscribe-keyspace={{ .Values.rtpengine.valkey.subscribeKeyspace }}
            --redis-resolve-on-reconnect
{{- if .Values.rtpengine.valkey.activeSwitchover }}
            --active-switchover
{{- end }}
{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) .Values.kamailio.enabled }}
            --homer={{ include "avoip.fullname" . }}-homer-heplify.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}:{{ $.Values.homer.capture.hepTCPPort }}
            --homer-protocol=tcp
            --homer-id=102
            --homer-enable-ng
{{- end }}
            --foreground
            --log-stderr
{{- if .Values.rtpengine.logging.enabled }}
            --log-level={{ .Values.rtpengine.logging.level }}
            --log-level-control={{ .Values.rtpengine.logging.controlLevel }}
            --log-level-spandsp={{ .Values.rtpengine.logging.spandspLevel }}
            --log-level-rtcp={{ .Values.rtpengine.logging.rtcpLevel }}
{{- else }}
            --log-level=6
{{- end }}
        image:
          repository: '{{ .Values.rtpengine.image.repository }}'
          tag: '{{ .Values.rtpengine.image.tag }}'
          digest: '{{ .Values.rtpengine.image.digest }}'
          pullPolicy: '{{ .Values.rtpengine.image.pullPolicy }}'
        env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
{{- if .Values.rtpengine.valkey.enabled }}
          - name: RTPENGINE_REDIS_HOST
            value: '{{ default (printf "%s.%s.svc.%s" (include "avoip.rtpengine.valkeyProxyName" .) .Release.Namespace (default "cluster.local" .Values.cluster.domain)) .Values.rtpengine.valkey.host }}'
          - name: RTPENGINE_REDIS_AUTH_PW
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.rtpengine.valkey.secretName }}'
                key: '{{ .Values.rtpengine.valkey.passwordKey }}'
          - name: RTPENGINE_REDIS_SUBSCRIBE_AUTH_PW
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.rtpengine.valkey.secretName }}'
                key: '{{ .Values.rtpengine.valkey.passwordKey }}'
{{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
          - name: control
            containerPort: {{ .Values.rtpengine.controlPort }}
            protocol: UDP
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}
{{- end }}
{{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.rtpengine.valkey.enabled }}
  rtpengine-valkey-proxy:
    forceRename: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: {{ .Values.rtpengine.valkey.proxy.replicas }}
    revisionHistoryLimit: 3
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
              topologyKey: kubernetes.io/hostname
    containers:
      haproxy:
        command:
          - /usr/local/sbin/haproxy
        args:
          - '-W'
          - '-db'
          - '-f'
          - /usr/local/etc/haproxy/haproxy.cfg
        image:
          repository: '{{ .Values.rtpengine.valkey.proxy.image.repository }}'
          tag: '{{ .Values.rtpengine.valkey.proxy.image.tag }}'
          digest: '{{ .Values.rtpengine.valkey.proxy.image.digest }}'
          pullPolicy: '{{ .Values.rtpengine.valkey.proxy.image.pullPolicy }}'
        env:
          - name: VALKEY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.rtpengine.valkey.secretName }}'
                key: '{{ .Values.rtpengine.valkey.passwordKey }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: health
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 120
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: health
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 2
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1
              periodSeconds: 30
              timeoutSeconds: 2
              failureThreshold: 3
        ports:
          - name: redis
            containerPort: {{ .Values.rtpengine.valkey.proxy.port }}
            protocol: TCP
          - name: health
            containerPort: {{ .Values.rtpengine.valkey.proxy.healthPort }}
            protocol: TCP
{{- end }}
{{ if .Values.freeswitch.enabled }}
{{ $cdrHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.freeswitch.cdr.host }}
  freeswitch:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: 1
    minReadySeconds: 30
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      annotations:
        kubectl.kubernetes.io/default-container: 'freeswitch'
        kubectl.kubernetes.io/default-logs-container: 'freeswitch'
        # Flowroute/fax, Sofia, dialplan, and core XML are mounted as separate
        # ConfigMaps. Roll the pod so FreeSWITCH reloads the complete set
        # consistently instead of retaining a mixed in-memory configuration.
        configmap.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-freeswitch-configs,{{ include "avoip.fullname" . }}-freeswitch-misc-configs,{{ include "avoip.fullname" . }}-freeswitch-sip-configs,{{ include "avoip.fullname" . }}-freeswitch-dialplan-configs'
{{- if .Values.freeswitch.sms.enabled }}
        secret.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-freeswitch-sms,{{ include "avoip.fullname" . }}-freeswitch-sip-tls{{ if .Values.asterisk.enabled }},{{ include "avoip.fullname" . }}-asterisk-sip-tls{{ end }}'
{{- else }}
        secret.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-freeswitch-sip-tls{{ if .Values.asterisk.enabled }},{{ include "avoip.fullname" . }}-asterisk-sip-tls{{ end }}'
{{- end }}
    initContainers:
{{- if .Values.freeswitch.cdr.enabled }}
      cdr-schema:
        image:
          repository: 'postgres'
          tag: '17-alpine'
          digest: 'sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24'
          pullPolicy: 'IfNotPresent'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            export PGUSER="$USERNAME"
            export PGPASSWORD="$PASSWORD"
            export PGDATABASE="$USERNAME"
            until psql -v ON_ERROR_STOP=1 -h '{{ $cdrHost }}' -p '{{ $.Values.freeswitch.cdr.port }}' -c 'SELECT 1' >/dev/null 2>&1; do
              sleep 2
            done
            psql -v ON_ERROR_STOP=1 -h '{{ $cdrHost }}' -p '{{ $.Values.freeswitch.cdr.port }}' <<'SQL'
            CREATE TABLE IF NOT EXISTS {{ $.Values.freeswitch.cdr.table }} (
              id bigserial PRIMARY KEY,
              local_ip_v4 text,
              caller_id_name text,
              caller_id_number text,
              destination_number text NOT NULL,
              context text NOT NULL,
              start_stamp text,
              answer_stamp text,
              end_stamp text,
              duration bigint,
              billsec bigint,
              hangup_cause text,
              uuid text NOT NULL,
              bleg_uuid text,
              accountcode text,
              read_codec text,
              write_codec text
            )
            SQL
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
{{- end }}
      tls-material:
        image:
          repository: '{{ .Values.freeswitch.image.repository }}'
          tag: '{{ .Values.freeswitch.image.tag }}'
          digest: '{{ .Values.freeswitch.image.digest }}'
          pullPolicy: '{{ .Values.freeswitch.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            umask 077
            # Sofia expects the leaf certificate, private key, then any
            # intermediates. cert-manager stores the chain as leaf followed by
            # intermediates in tls.crt; placing the key between them makes the
            # full chain available to TLS clients instead of serving only the
            # leaf certificate.
            awk 'BEGIN { n = 0 } /BEGIN CERTIFICATE/ { n++ } n == 1 { print }' /tls-input/tls.crt > /tls-output/agent.pem
            cat /tls-input/tls.key >> /tls-output/agent.pem
            awk 'BEGIN { n = 0 } /BEGIN CERTIFICATE/ { n++ } n > 1 { print }' /tls-input/tls.crt >> /tls-output/agent.pem
            cp /etc/ssl/certs/ca-certificates.crt /tls-output/cafile.pem
{{- if .Values.asterisk.enabled }}
            awk 'BEGIN { n = 0 } /BEGIN CERTIFICATE/ { n++ } n > 1 { print }' /tls-peer/tls.crt >> /tls-output/cafile.pem
{{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    containers:
      freeswitch:
        command:
          - /bin/sh
          - -c
        args:
          - exec /usr/bin/freeswitch -nonat -nocal -nort -nosql -nf -nc </dev/null
        image:
          repository: '{{ .Values.freeswitch.image.repository }}'
          tag: '{{ .Values.freeswitch.image.tag }}'
          digest: '{{ .Values.freeswitch.image.digest }}'
          pullPolicy: '{{ .Values.freeswitch.image.pullPolicy }}'
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
          - name: udp-sip
            containerPort: 5060
            protocol: UDP
          - name: tcp-sip
            containerPort: 5060
            protocol: TCP
          - name: tls-sips
            containerPort: 5061
            protocol: TCP
          - name: udp-sip-edge
            containerPort: 5090
            protocol: UDP
{{- if and (include "avoip.homer.enabled" . | trim) .Values.kamailio.enabled .Values.homer.recordings.enabled .Values.freeswitch.media.diagnostics.callRecording.enabled }}
      recordings:
        image:
          repository: '{{ .Values.homer.recordings.image.repository }}'
          tag: '{{ .Values.homer.recordings.image.tag }}'
          digest: '{{ .Values.homer.recordings.image.digest }}'
          pullPolicy: '{{ .Values.homer.recordings.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            (while :; do
              find /recordings -maxdepth 1 -type f -name '*.wav' -mtime +{{ sub (int .Values.homer.recordings.retentionDays) 1 }} -exec rm -f '{}' \;
              sleep 21600
            done) &
            exec nginx -g 'daemon off;'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
          - name: recordings
            containerPort: {{ .Values.homer.recordings.port }}
            protocol: TCP
{{- end }}
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}

{{ end }}
{{- if and (include "avoip.homer.enabled" . | trim) .Values.kamailio.enabled }}
  homer-web:
    forceRename: '{{ include "avoip.fullname" . }}-homer-web'
    # Homer writes SQLite and DuckDB catalogs; Recreate prevents two pods from
    # writing the same RWX volume during a rollout.
    strategy: Recreate
    replicas: 1
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        # Homer 11's upstream image runs as uid/gid 1000.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-homer-web'
      annotations:
        kubectl.kubernetes.io/default-container: 'homer'
        kubectl.kubernetes.io/default-logs-container: 'homer'
    containers:
      homer:
        command:
          - /bin/sh
          - -c
        args:
          - >-
            sed "s|__OIDC_CLIENT_ID__|${OIDC_CLIENT_ID}|g;
            s|__OIDC_CLIENT_SECRET__|${OIDC_CLIENT_SECRET}|g;
            s|__JWT_SECRET__|${JWT_SECRET}|g" /etc/homer-template/homer.json
            > /data/homer/homer.json && exec /homer --config-path /data/homer/homer.json
        image:
          repository: '{{ .Values.homer.web.image.repository }}'
          tag: '{{ .Values.homer.web.image.tag }}'
          digest: '{{ .Values.homer.web.image.digest }}'
          pullPolicy: '{{ .Values.homer.web.image.pullPolicy }}'
        env:
          - name: OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.homer.oidc.workspaceName }}'
                key: OIDC_CLIENT_ID
          - name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.homer.oidc.workspaceName }}'
                key: OIDC_CLIENT_SECRET
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.homer.oidc.workspaceName }}'
                key: JWT_SECRET
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
          - name: hep
            containerPort: {{ .Values.homer.capture.hepPort }}
            protocol: UDP
          - name: hep-tcp
            containerPort: {{ .Values.homer.capture.hepTCPPort }}
            protocol: TCP
          - name: ingest-http
            containerPort: {{ .Values.homer.capture.httpPort }}
            protocol: TCP
          - name: metrics
            containerPort: {{ .Values.homer.capture.metricsPort }}
            protocol: TCP
          - name: http
            containerPort: {{ .Values.homer.web.port }}
            protocol: TCP
{{- end }}

service:
{{- if .Values.asterisk.enabled }}
  asterisk:
    forceRename: '{{ include "avoip.fullname" . }}-asterisk'
    controller: asterisk
{{- include "avoip.service.options" (dict "root" $ "name" "asterisk") | nindent 4 }}
    extraSelectorLabels:
      app: '{{ include "avoip.fullname" . }}-asterisk'
    ports:
      tcp-sip:
        port: 5060
        targetPort: tcp-sip
        protocol: TCP
      udp-sip:
        port: 5060
        targetPort: udp-sip
        protocol: UDP
      tls-sips:
        port: 5061
        targetPort: tls-sips
        protocol: TCP
{{- end }}
{{- if .Values.kamailio.enabled }}
{{- if .Values.kamailio.publicExposure.enabled }}
  kamailio:
    forceRename: '{{ include "avoip.fullname" . }}-kamailio'
    controller: kamailio
{{- include "avoip.service.options" (dict "root" $ "name" "kamailio") | nindent 4 }}
    ports:
      sip-public:
        port: 5061
        targetPort: tls-public
        protocol: TCP
      tls-private:
        port: 5062
        targetPort: tls-private
        protocol: TCP
{{- if and .Values.kamailio.publicExposure.sip.enabled .Values.kamailio.publicExposure.sip.udpEnabled .Values.kamailio.publicExposure.sip.directService.enabled (eq .Values.cluster.type "hub") }}
  kamailio-udp:
    forceRename: '{{ include "avoip.fullname" . }}-kamailio-udp'
    controller: kamailio
    type: LoadBalancer
    # Preserve Flowroute source addresses and avoid cross-node kube-proxy SNAT.
    externalTrafficPolicy: Local
{{- include "avoip.service.options" (dict "root" $ "name" "kamailio-udp" "loadBalancer" true) | nindent 4 }}
    ports:
      udp-sip:
        port: 5060
        targetPort: udp-sip
        protocol: UDP
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.freeswitch.enabled }}
  freeswitch:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch'
    controller: freeswitch
{{- include "avoip.service.options" (dict "root" $ "name" "freeswitch") | nindent 4 }}
    ports:
      tcp-sip:
        port: 5060
        targetPort: tcp-sip
        protocol: TCP
      udp-sip:
        port: 5060
        targetPort: udp-sip
        protocol: UDP
      udp-sip-edge:
        port: 5090
        targetPort: udp-sip-edge
        protocol: UDP
      tls-sips:
        port: 5061
        targetPort: tls-sips
        protocol: TCP
{{- if and .Values.freeswitch.publicExposure.enabled (or (not (include "avoip.rtpengine.enabled" . | trim)) (not .Values.kamailio.enabled)) }}
  freeswitch-rtp:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch-rtp'
    controller: freeswitch
    type: LoadBalancer
    # Preserve carrier RTP source addresses and avoid cross-node kube-proxy
    # SNAT for the public media socket.
    externalTrafficPolicy: Local
{{- include "avoip.service.options" (dict "root" $ "name" "freeswitch-rtp" "loadBalancer" true) | nindent 4 }}
    ports:
      rtp:
        portRange:
          start: {{ .Values.freeswitch.rtp.min }}
          end: {{ sub (.Values.freeswitch.rtp.max | int) 1 }}
        protocol: UDP
{{- end }}
{{- end }}
{{- if (include "avoip.rtpengine.enabled" . | trim) }}
  rtpengine:
    forceRename: '{{ include "avoip.fullname" . }}-rtpengine'
    controller: rtpengine
{{- include "avoip.service.options" (dict "root" $ "name" "rtpengine") | nindent 4 }}
    ports:
      control:
        port: {{ .Values.rtpengine.controlPort }}
        targetPort: control
        protocol: UDP
  rtpengine-media:
    forceRename: '{{ include "avoip.fullname" . }}-rtpengine-media'
    controller: rtpengine
    type: LoadBalancer
    externalTrafficPolicy: Local
{{- include "avoip.service.options" (dict "root" $ "name" "rtpengine-media" "loadBalancer" true) | nindent 4 }}
    ports:
      rtp:
        portRange:
          start: {{ .Values.rtpengine.media.min }}
          end: {{ sub (.Values.rtpengine.media.max | int) 1 }}
        protocol: UDP
{{- end }}
{{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.rtpengine.valkey.enabled }}
  rtpengine-valkey-proxy:
    forceRename: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
    controller: rtpengine-valkey-proxy
{{- include "avoip.service.options" (dict "root" $ "name" "rtpengine-valkey-proxy") | nindent 4 }}
    ports:
      redis:
        port: {{ .Values.rtpengine.valkey.proxy.port }}
        targetPort: redis
        protocol: TCP
      health:
        port: {{ .Values.rtpengine.valkey.proxy.healthPort }}
        targetPort: health
        protocol: TCP
{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) .Values.kamailio.enabled }}
  homer-heplify:
    forceRename: '{{ include "avoip.fullname" . }}-homer-heplify'
    controller: homer-web
{{- include "avoip.service.options" (dict "root" $ "name" "homer-heplify") | nindent 4 }}
    ports:
      hep:
        port: {{ .Values.homer.capture.hepPort }}
        targetPort: hep
        protocol: UDP
      hep-tcp:
        port: {{ .Values.homer.capture.hepTCPPort }}
        targetPort: hep-tcp
        protocol: TCP
      metrics:
        port: {{ .Values.homer.capture.metricsPort }}
        targetPort: metrics
        protocol: TCP
  homer-web:
    forceRename: '{{ include "avoip.fullname" . }}-homer-web'
    controller: homer-web
{{- include "avoip.service.options" (dict "root" $ "name" "homer-web") | nindent 4 }}
    ports:
      http:
        port: 80
        targetPort: http
        protocol: TCP
{{- if and .Values.homer.recordings.enabled .Values.freeswitch.enabled .Values.freeswitch.media.diagnostics.callRecording.enabled }}
  homer-recordings:
    forceRename: '{{ include "avoip.fullname" . }}-rec'
    controller: freeswitch
    ports:
      http:
        port: {{ .Values.homer.recordings.port }}
        targetPort: recordings
        protocol: TCP
{{- end }}
{{- end }}

persistence:
{{- if and (include "avoip.rtpengine.enabled" . | trim) .Values.rtpengine.valkey.enabled }}
  rtpengine-valkey-proxy-config:
    type: configMap
    name: '{{ include "avoip.rtpengine.valkeyProxyName" . }}'
    advancedMounts:
      rtpengine-valkey-proxy:
        haproxy:
          - path: /usr/local/etc/haproxy/haproxy.cfg
            subPath: haproxy.cfg
{{- end }}
{{- if .Values.asterisk.enabled }}
  asterisk-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-asterisk-configs'
    advancedMounts:
      asterisk:
        asterisk:
          - path: /etc/asterisk/rtp.conf
            subPath: rtp.conf
          - path: /etc/asterisk/extensions.conf
            subPath: extensions.conf
          - path: /etc/asterisk/logger.conf
            subPath: logger.conf
          - path: /etc/asterisk/cdr.conf
            subPath: cdr.conf
          - path: /etc/asterisk/cdr_pgsql.conf
            subPath: cdr_pgsql.conf
          - path: /etc/asterisk/modules.conf
            subPath: modules.conf
          - path: /etc/asterisk/asterisk.conf
            subPath: asterisk.conf
  asterisk-pjsip-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-asterisk-config-tpl'
    advancedMounts:
      asterisk:
        asterisk:
          - path: /etc/asterisk/pjsip.conf
            subPath: pjsip.conf
  asterisk-user:
    type: secret
    name: '{{ include "avoip.fullname" . }}-asterisk'
    advancedMounts:
      asterisk:
        asterisk:
          - path: /tmp/avoip-username
            subPath: username
          - path: /tmp/avoip-password
            subPath: password
  asterisk-sip-tls:
    type: secret
    name: '{{ include "avoip.fullname" . }}-asterisk-sip-tls'
    advancedMounts:
      asterisk:
        asterisk:
          - path: /etc/asterisk/tls
  asterisk-tmp:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk:
          - path: /tmp
  asterisk-run:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk:
          - path: /var/run/asterisk
  asterisk-lib:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk-sounds:
          - path: /var/lib/asterisk
        asterisk:
          - path: /var/lib/asterisk
  asterisk-sounds:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk-sounds:
          - path: /var/lib/asterisk/sounds
        asterisk:
          - path: /var/lib/asterisk/sounds
  asterisk-log:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk-sounds:
          - path: /var/log/asterisk
        asterisk:
          - path: /var/log/asterisk
  asterisk-spool:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk:
          - path: /var/spool/asterisk
{{- end }}
{{- if .Values.kamailio.enabled }}
  kamailio-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-kamailio-config'
    advancedMounts:
      kamailio:
        kamailio:
          - path: /etc/kamailio/kamailio.cfg
            subPath: kamailio.cfg
          - path: /etc/kamailio/tls.cfg
            subPath: tls.cfg
{{- if .Values.kamailio.topology.enabled }}
  kamailio-topos-tls-proxy-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-kamailio-topos-tls-proxy'
    advancedMounts:
      kamailio:
        topos-tls-proxy:
          - path: /usr/local/etc/haproxy/haproxy.cfg
            subPath: haproxy.cfg
{{- end }}
  kamailio-tls:
    type: secret
    name: '{{ include "avoip.fullname" . }}-kamailio-sip-tls'
    advancedMounts:
      kamailio:
        kamailio:
          - path: /etc/kamailio/tls
  kamailio-tmp:
    type: emptyDir
    advancedMounts:
      kamailio:
        kamailio:
          - path: /tmp
{{- if .Values.freeswitch.enabled }}
  kamailio-freeswitch-tls:
    type: secret
    name: '{{ include "avoip.fullname" . }}-freeswitch-sip-tls'
    advancedMounts:
      kamailio:
        tls-ca:
          - path: /tls-peer
  kamailio-tls-ca:
    type: emptyDir
    advancedMounts:
      kamailio:
        tls-ca:
          - path: /tls-output
        kamailio:
          - path: /etc/kamailio/tls-ca
{{- end }}
{{- end }}
{{- if .Values.freeswitch.enabled }}
  freeswitch-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/freeswitch.xml
            subPath: freeswitch.xml
          - path: /etc/freeswitch/vars.xml
            subPath: vars.xml
{{- if .Values.freeswitch.sms.enabled }}
  freeswitch-sms-config:
    type: secret
    name: '{{ include "avoip.fullname" . }}-freeswitch-sms'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/autoload_configs/sms_flowroute.conf.xml
            subPath: sms_flowroute.conf.xml
{{- end }}
  freeswitch-misc-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-misc-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
{{- range $file := list "ldap.conf.xml" "opus.conf.xml" "modules.conf.xml" "console.conf.xml" "switch.conf.xml" "logfile.conf.xml" "event_socket.conf.xml" "cdr_pg_csv.conf.xml" "spandsp.conf.xml" "acl.conf.xml" "sofia.conf.xml" }}
          - path: /etc/freeswitch/autoload_configs/{{ $file }}
            subPath: {{ $file }}
{{- end }}
  freeswitch-tls-source:
    type: secret
    name: '{{ include "avoip.fullname" . }}-freeswitch-sip-tls'
    advancedMounts:
      freeswitch:
        tls-material:
          - path: /tls-input
{{- if .Values.asterisk.enabled }}
  freeswitch-asterisk-tls:
    type: secret
    name: '{{ include "avoip.fullname" . }}-asterisk-sip-tls'
    advancedMounts:
      freeswitch:
        tls-material:
          - path: /tls-peer
{{- end }}
  freeswitch-tls-certs:
    type: emptyDir
    advancedMounts:
      freeswitch:
        tls-material:
          - path: /tls-output
        freeswitch:
          - path: /etc/freeswitch/tls
  freeswitch-sip-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-sip-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/sip_profiles/external.xml
            subPath: external.xml
          - path: /etc/freeswitch/sip_profiles/asterisk.xml
            subPath: asterisk.xml
          - path: /etc/freeswitch/sip_profiles/kamailio.xml
            subPath: kamailio.xml
          - path: /etc/freeswitch/sip_profiles/internal.xml
            subPath: internal.xml
          - path: /etc/freeswitch/sip_profiles/internal-ipv6.xml
            subPath: internal-ipv6.xml
          - path: /etc/freeswitch/sip_profiles/external-ipv6.xml
            subPath: external-ipv6.xml
  freeswitch-dialplan-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-dialplan-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/dialplan/default.xml
            subPath: default.xml
          - path: /etc/freeswitch/dialplan/public.xml
            subPath: public.xml
  freeswitch-fax-spool:
{{- if .Values.freeswitch.fax.persistence.enabled }}
    type: persistentVolumeClaim
    storageClass: '{{ .Values.freeswitch.fax.persistence.storageClass }}'
    accessMode: '{{ .Values.freeswitch.fax.persistence.accessMode }}'
    size: '{{ .Values.freeswitch.fax.persistence.size }}'
    retain: {{ .Values.freeswitch.fax.persistence.retain }}
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
{{- else }}
    type: emptyDir
{{- end }}
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: {{ .Values.freeswitch.fax.spoolPath }}
{{- if and (include "avoip.homer.enabled" . | trim) .Values.kamailio.enabled .Values.homer.recordings.enabled .Values.freeswitch.media.diagnostics.callRecording.enabled }}
        recordings:
          - path: /recordings
{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) .Values.kamailio.enabled .Values.homer.recordings.enabled .Values.freeswitch.media.diagnostics.callRecording.enabled }}
  homer-recordings-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-homer-recordings'
    advancedMounts:
      freeswitch:
        recordings:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf
          - path: /usr/share/nginx/html/recordings
{{- end }}
{{- end }}
{{- if and (include "avoip.homer.enabled" . | trim) .Values.kamailio.enabled }}
  homer-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-homer-config'
    advancedMounts:
      homer-web:
        homer:
          - path: /etc/homer-template
  homer-data:
{{- if .Values.homer.storage.persistence.enabled }}
    forceRename: '{{ include "avoip.fullname" . }}-homer-rwx'
    type: persistentVolumeClaim
    storageClass: '{{ .Values.homer.storage.persistence.storageClass }}'
    accessMode: '{{ .Values.homer.storage.persistence.accessMode }}'
    size: '{{ .Values.homer.storage.persistence.size }}'
    retain: {{ .Values.homer.storage.persistence.retain }}
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
      argocd.argoproj.io/sync-wave: '-1'
{{- else }}
    type: emptyDir
{{- end }}
    advancedMounts:
      homer-web:
        homer:
          - path: /data/homer
{{- end }}
{{- end }}

{{- $commonValues := include "avoip.common.values" . | fromYaml -}}
{{- $_ := set .Values "controllers" $commonValues.controllers -}}
{{- $_ := set .Values "service" $commonValues.service -}}
{{- $_ := set .Values "persistence" $commonValues.persistence -}}
{{- $_ := set .Values "networkpolicies" (mergeOverwrite (deepCopy (.Values.networkpolicies | default dict)) ($commonValues.networkpolicies | default dict)) -}}
{{- $_ := set .Values "configMaps" (mergeOverwrite (default dict .Values.configMaps) (default dict $commonValues.configMaps)) -}}
{{- include "avoip.networking.apply" . -}}
{{- include "bjw-s.common.loader.generate" . }}
