{{ $.Files.Get "files/audio-library/app.js" | replace "__PATH__" $.Values.homer.soundLibrary.path | indent 8 }}
      style.css: |
{{ $.Files.Get "files/audio-library/style.css" | indent 8 }}
{{- end }}
