{{- include "bjw-s.common.loader.init" . }}

{{- define "avoip.common.values" -}}
{{- $asteriskCdrHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.asterisk.cdr.host -}}
global:
  nameOverride: '{{ .Release.Name }}'
  createDefaultServiceAccount: false

defaultPodOptions:
  labels:
    logs: loki-myloginspace

controllers:
{{- if .Values.asterisk.enabled }}
  asterisk:
    forceRename: '{{ include "avoip.fullname" . }}-asterisk'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: 1
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-asterisk'
      annotations:
        # Reloader restarts Asterisk when its file-backed configuration changes.
        # The credentials are rendered into startup-only files, so include the
        # mounted Secret as well when the generated connection changes.
        configmap.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-asterisk-configs,{{ include "avoip.fullname" . }}-asterisk-config-tpl'
        secret.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-asterisk'
    initContainers:
{{- if .Values.asterisk.cdr.enabled }}
      cdr-schema:
        image:
          repository: 'postgres'
          tag: '17-alpine'
          digest: 'sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24'
          pullPolicy: 'IfNotPresent'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            export PGUSER="$USERNAME"
            export PGPASSWORD="$PASSWORD"
            export PGDATABASE="$USERNAME"
            until psql -v ON_ERROR_STOP=1 -h '{{ $asteriskCdrHost }}' -p '{{ $.Values.asterisk.cdr.port }}' -c 'SELECT 1' >/dev/null 2>&1; do
              sleep 2
            done
            psql -v ON_ERROR_STOP=1 -h '{{ $asteriskCdrHost }}' -p '{{ $.Values.asterisk.cdr.port }}' <<'SQL'
            CREATE TABLE IF NOT EXISTS {{ $.Values.asterisk.cdr.table }} (
              calldate timestamp NOT NULL,
              clid varchar(80) NOT NULL,
              src varchar(80) NOT NULL,
              dst varchar(80) NOT NULL,
              dcontext varchar(80) NOT NULL,
              channel varchar(80) NOT NULL,
              dstchannel varchar(80) NOT NULL,
              lastapp varchar(80) NOT NULL,
              lastdata varchar(80) NOT NULL,
              duration integer NOT NULL,
              billsec integer NOT NULL,
              disposition varchar(45) NOT NULL,
              amaflags integer NOT NULL,
              accountcode varchar(20) NOT NULL,
              uniqueid varchar(150) NOT NULL,
              userfield varchar(255) NOT NULL,
              peeraccount varchar(20),
              linkedid varchar(150),
              sequence integer
            )
            SQL
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-asterisk'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-asterisk'
                key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
{{- end }}
      asterisk-sounds:
        image:
          repository: '{{ .Values.asterisk.image.repository }}'
          tag: '{{ .Values.asterisk.image.tag }}'
          digest: '{{ .Values.asterisk.image.digest }}'
          pullPolicy: '{{ .Values.asterisk.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            ls -lah /usr/share/asterisk/sounds/en/
            ls -lah /usr/share/asterisk
            ls -lah /var/lib/asterisk
            ls -lah /var/lib/asterisk/sounds
            mkdir -p /var/lib/asterisk/sounds/en
            cp -R /usr/share/asterisk/sounds/en/. /var/lib/asterisk/sounds/en/
            test -f /var/lib/asterisk/sounds/en/demo-congrats.gsm
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    containers:
      asterisk:
        command:
          - /bin/sh
          - -c
        args:
          - |
            umask 077
            printf '[freeswitch-auth]\n' > /tmp/avoip-pjsip-auth.conf
            printf 'type=auth\n' >> /tmp/avoip-pjsip-auth.conf
            printf 'auth_type=userpass\n' >> /tmp/avoip-pjsip-auth.conf
            printf 'username=%s\n' "$(cat /tmp/avoip-username)" >> /tmp/avoip-pjsip-auth.conf
            printf 'password=%s\n' "$(cat /tmp/avoip-password)" >> /tmp/avoip-pjsip-auth.conf
{{- if .Values.asterisk.cdr.enabled }}
            printf '[global]\n' > /tmp/avoip-cdr_pgsql.conf
            printf 'hostname={{ $asteriskCdrHost }}\n' >> /tmp/avoip-cdr_pgsql.conf
            printf 'port={{ .Values.asterisk.cdr.port }}\n' >> /tmp/avoip-cdr_pgsql.conf
            printf 'dbname=%s\n' "$(cat /tmp/avoip-username)" >> /tmp/avoip-cdr_pgsql.conf
            printf 'user=%s\n' "$(cat /tmp/avoip-username)" >> /tmp/avoip-cdr_pgsql.conf
            printf 'password=%s\n' "$(cat /tmp/avoip-password)" >> /tmp/avoip-cdr_pgsql.conf
            printf 'encoding=UTF-8\n' >> /tmp/avoip-cdr_pgsql.conf
            printf 'table={{ .Values.asterisk.cdr.table }}\n' >> /tmp/avoip-cdr_pgsql.conf
{{- end }}
            exec /usr/sbin/asterisk -f -C /etc/asterisk/asterisk.conf
        image:
          repository: '{{ .Values.asterisk.image.repository }}'
          tag: '{{ .Values.asterisk.image.tag }}'
          digest: '{{ .Values.asterisk.image.digest }}'
          pullPolicy: '{{ .Values.asterisk.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 24
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
        ports:
          - name: tcp-sip
            containerPort: 5060
            protocol: TCP
          - name: udp-sip
            containerPort: 5060
            protocol: UDP
          - name: tls-sips
            containerPort: 5061
            protocol: TCP
{{- range untilStep (.Values.asterisk.rtp.min | int) (.Values.asterisk.rtp.max | int) 1 }}
          - name: 'udp-{{ . }}'
            containerPort: {{ . }}
            protocol: UDP
          - name: 'tcp-{{ . }}'
            containerPort: {{ . }}
            protocol: TCP
{{ end }}
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}
{{ end }}
{{ if .Values.kamailio.enabled }}
  kamailio:
    forceRename: '{{ include "avoip.fullname" . }}-kamailio'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: 1
    minReadySeconds: 5
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-kamailio'
    containers:
      kamailio:
        command:
          - /bin/sh
          - -c
        args:
          - exec /usr/sbin/kamailio -DD -E -P /tmp/kamailio.pid -f /etc/kamailio/kamailio.cfg
        image:
          repository: '{{ .Values.kamailio.image.repository }}'
          tag: '{{ .Values.kamailio.image.tag }}'
          digest: '{{ .Values.kamailio.image.digest }}'
          pullPolicy: '{{ .Values.kamailio.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/kamailio/kamailio.cfg
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 18
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/kamailio/kamailio.cfg
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
          - name: udp-sip
            containerPort: 5060
            protocol: UDP
          - name: tcp-sip
            containerPort: 5061
            protocol: TCP
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}
{{ end }}
{{- if .Values.rtpengine.enabled }}
  rtpengine:
    forceRename: '{{ include "avoip.fullname" . }}-rtpengine'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: 1
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-rtpengine'
    containers:
      rtpengine:
        command:
          - /bin/sh
          - -c
        args:
          - >-
            exec /usr/local/bin/rtpengine
            --table=-1
            --interface=internal/${POD_IP}
            --interface=external/${POD_IP}!{{ .Values.rtpengine.media.address }}
            --listen-ng=0.0.0.0:{{ .Values.rtpengine.controlPort }}
            --port-min={{ .Values.rtpengine.media.min }}
            --port-max={{ sub (.Values.rtpengine.media.max | int) 1 }}
{{- if and .Values.homer.enabled (eq .Values.cluster.type "hub") .Values.kamailio.enabled }}
            --homer={{ include "avoip.fullname" . }}-homer-heplify.{{ $.Release.Namespace }}.svc.{{ default "cluster.local" $.Values.cluster.domain }}:{{ $.Values.homer.capture.hepPort }}
            --homer-id=102
            --homer-enable-ng
{{- end }}
            --foreground
            --log-stderr
{{- if .Values.rtpengine.logging.enabled }}
            --log-level={{ .Values.rtpengine.logging.level }}
            --log-level-control={{ .Values.rtpengine.logging.controlLevel }}
            --log-level-spandsp={{ .Values.rtpengine.logging.spandspLevel }}
            --log-level-rtcp={{ .Values.rtpengine.logging.rtcpLevel }}
{{- else }}
            --log-level=6
{{- end }}
        image:
          repository: '{{ .Values.rtpengine.image.repository }}'
          tag: '{{ .Values.rtpengine.image.tag }}'
          digest: '{{ .Values.rtpengine.image.digest }}'
          pullPolicy: '{{ .Values.rtpengine.image.pullPolicy }}'
        env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
          - name: control
            containerPort: {{ .Values.rtpengine.controlPort }}
            protocol: UDP
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}
{{- end }}
{{ if .Values.freeswitch.enabled }}
{{ $cdrHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.freeswitch.cdr.host }}
  freeswitch:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: 1
    minReadySeconds: 30
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      annotations:
        # Flowroute/fax, Sofia, dialplan, and core XML are mounted as separate
        # ConfigMaps. Roll the pod so FreeSWITCH reloads the complete set
        # consistently instead of retaining a mixed in-memory configuration.
        configmap.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-freeswitch-configs,{{ include "avoip.fullname" . }}-freeswitch-misc-configs,{{ include "avoip.fullname" . }}-freeswitch-sip-configs,{{ include "avoip.fullname" . }}-freeswitch-dialplan-configs'
{{- if .Values.freeswitch.sms.enabled }}
        secret.reloader.stakater.com/reload: '{{ include "avoip.fullname" . }}-freeswitch-sms'
{{- end }}
    initContainers:
{{- if .Values.freeswitch.cdr.enabled }}
      cdr-schema:
        image:
          repository: 'postgres'
          tag: '17-alpine'
          digest: 'sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24'
          pullPolicy: 'IfNotPresent'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            export PGUSER="$USERNAME"
            export PGPASSWORD="$PASSWORD"
            export PGDATABASE="$USERNAME"
            until psql -v ON_ERROR_STOP=1 -h '{{ $cdrHost }}' -p '{{ $.Values.freeswitch.cdr.port }}' -c 'SELECT 1' >/dev/null 2>&1; do
              sleep 2
            done
            psql -v ON_ERROR_STOP=1 -h '{{ $cdrHost }}' -p '{{ $.Values.freeswitch.cdr.port }}' <<'SQL'
            CREATE TABLE IF NOT EXISTS {{ $.Values.freeswitch.cdr.table }} (
              id bigserial PRIMARY KEY,
              local_ip_v4 text,
              caller_id_name text,
              caller_id_number text,
              destination_number text NOT NULL,
              context text NOT NULL,
              start_stamp text,
              answer_stamp text,
              end_stamp text,
              duration bigint,
              billsec bigint,
              hangup_cause text,
              uuid text NOT NULL,
              bleg_uuid text,
              accountcode text,
              read_codec text,
              write_codec text
            )
            SQL
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
{{- end }}
      tls-material:
        image:
          repository: '{{ .Values.freeswitch.image.repository }}'
          tag: '{{ .Values.freeswitch.image.tag }}'
          digest: '{{ .Values.freeswitch.image.digest }}'
          pullPolicy: '{{ .Values.freeswitch.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            umask 077
            cat /tls-input/tls.crt /tls-input/tls.key > /tls-output/agent.pem
            cp /tls-input/tls.crt /tls-output/cafile.pem
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    containers:
      freeswitch:
        command:
          - /bin/sh
          - -c
        args:
          - exec /usr/bin/freeswitch -nonat -nocal -nort -nosql -nf -nc </dev/null
        image:
          repository: '{{ .Values.freeswitch.image.repository }}'
          tag: '{{ .Values.freeswitch.image.tag }}'
          digest: '{{ .Values.freeswitch.image.digest }}'
          pullPolicy: '{{ .Values.freeswitch.image.pullPolicy }}'
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
          - name: udp-sip
            containerPort: 5060
            protocol: UDP
          - name: tcp-sip
            containerPort: 5060
            protocol: TCP
          - name: tls-sips
            containerPort: 5061
            protocol: TCP
          - name: udp-sipext
            containerPort: 5080
            protocol: UDP
          - name: tcp-sipext
            containerPort: 5080
            protocol: TCP
          - name: tls-sipext
            containerPort: 5081
            protocol: TCP
          - name: udp-sip-edge
            containerPort: 5090
            protocol: UDP
{{- if .Values.diagnostics.netshoot.enabled }}
      netshoot:
        command:
          - /bin/sh
          - -c
        args:
          - sleep infinity
        image:
          repository: '{{ .Values.diagnostics.netshoot.image.repository }}'
          tag: '{{ .Values.diagnostics.netshoot.image.tag }}'
          digest: '{{ .Values.diagnostics.netshoot.image.digest }}'
          pullPolicy: '{{ .Values.diagnostics.netshoot.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
{{- end }}

{{ end }}
{{- if and .Values.homer.enabled (eq .Values.cluster.type "hub") .Values.kamailio.enabled }}
  homer-web:
    forceRename: '{{ include "avoip.fullname" . }}-homer-web'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: 1
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        # Homer 11's upstream image runs as uid/gid 1000.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-homer-web'
    containers:
      homer:
        command:
          - /bin/sh
          - -c
        args:
          - >-
            sed "s|__OIDC_CLIENT_ID__|${OIDC_CLIENT_ID}|g;
            s|__OIDC_CLIENT_SECRET__|${OIDC_CLIENT_SECRET}|g;
            s|__JWT_SECRET__|${JWT_SECRET}|g" /etc/homer-template/homer.json
            > /data/homer/homer.json && exec /homer --config-path /data/homer/homer.json
        image:
          repository: '{{ .Values.homer.web.image.repository }}'
          tag: '{{ .Values.homer.web.image.tag }}'
          digest: '{{ .Values.homer.web.image.digest }}'
          pullPolicy: '{{ .Values.homer.web.image.pullPolicy }}'
        env:
          - name: OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.homer.oidc.workspaceName }}'
                key: OIDC_CLIENT_ID
          - name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.homer.oidc.workspaceName }}'
                key: OIDC_CLIENT_SECRET
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.homer.oidc.workspaceName }}'
                key: JWT_SECRET
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
          - name: hep
            containerPort: {{ .Values.homer.capture.hepPort }}
            protocol: UDP
          - name: hep-tcp
            containerPort: {{ .Values.homer.capture.hepTCPPort }}
            protocol: TCP
          - name: metrics
            containerPort: {{ .Values.homer.capture.metricsPort }}
            protocol: TCP
          - name: http
            containerPort: {{ .Values.homer.web.port }}
            protocol: TCP
{{- end }}

service:
{{- if .Values.asterisk.enabled }}
  asterisk:
    forceRename: '{{ include "avoip.fullname" . }}-asterisk'
    controller: asterisk
    extraSelectorLabels:
      app: '{{ include "avoip.fullname" . }}-asterisk'
    ports:
      tcp-sip:
        port: 5060
        targetPort: tcp-sip
        protocol: TCP
      udp-sip:
        port: 5060
        targetPort: udp-sip
        protocol: UDP
{{- end }}
{{- if .Values.kamailio.enabled }}
{{- if .Values.kamailio.publicExposure.enabled }}
  kamailio:
    forceRename: '{{ include "avoip.fullname" . }}-kamailio'
    controller: kamailio
    ports:
      udp-sip:
        port: 5060
        targetPort: udp-sip
        protocol: UDP
      tcp-sip:
        port: 5061
        targetPort: tcp-sip
        protocol: TCP
{{- end }}
{{- end }}
{{- if .Values.freeswitch.enabled }}
  freeswitch:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch'
    controller: freeswitch
    ports:
      tcp-sip:
        port: 5060
        targetPort: tcp-sip
        protocol: TCP
      udp-sip:
        port: 5060
        targetPort: udp-sip
        protocol: UDP
      udp-sip-edge:
        port: 5090
        targetPort: udp-sip-edge
        protocol: UDP
      tls-sips:
        port: 5061
        targetPort: tls-sips
        protocol: TCP
{{- if and .Values.freeswitch.publicExposure.enabled (or (not .Values.rtpengine.enabled) (not .Values.kamailio.enabled)) }}
  freeswitch-rtp:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch-rtp'
    controller: freeswitch
    type: LoadBalancer
    # Preserve carrier RTP source addresses and avoid cross-node kube-proxy
    # SNAT for the public media socket.
    externalTrafficPolicy: Local
    annotations:
      purelb.io/allow-shared-ip: voip-gw.resolvemy.host
      purelb.io/service-group: core-public
      purelb.io/allow-local: 'true'
      purelb.io/addresses: '{{ .Values.freeswitch.publicExposure.address }}'
    ports:
      rtp:
        portRange:
          start: {{ .Values.freeswitch.rtp.min }}
          end: {{ sub (.Values.freeswitch.rtp.max | int) 1 }}
        protocol: UDP
{{- end }}
{{- end }}
{{- if .Values.rtpengine.enabled }}
  rtpengine:
    forceRename: '{{ include "avoip.fullname" . }}-rtpengine'
    controller: rtpengine
    ports:
      control:
        port: {{ .Values.rtpengine.controlPort }}
        targetPort: control
        protocol: UDP
  rtpengine-media:
    forceRename: '{{ include "avoip.fullname" . }}-rtpengine-media'
    controller: rtpengine
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      purelb.io/allow-shared-ip: voip-gw.resolvemy.host
      purelb.io/service-group: core-public
      purelb.io/allow-local: 'true'
      purelb.io/addresses: '{{ .Values.rtpengine.media.address }}'
    ports:
      rtp:
        portRange:
          start: {{ .Values.rtpengine.media.min }}
          end: {{ sub (.Values.rtpengine.media.max | int) 1 }}
        protocol: UDP
{{- end }}
{{- if and .Values.homer.enabled (eq .Values.cluster.type "hub") .Values.kamailio.enabled }}
  homer-heplify:
    forceRename: '{{ include "avoip.fullname" . }}-homer-heplify'
    controller: homer-web
    ports:
      hep:
        port: {{ .Values.homer.capture.hepPort }}
        targetPort: hep
        protocol: UDP
      hep-tcp:
        port: {{ .Values.homer.capture.hepTCPPort }}
        targetPort: hep-tcp
        protocol: TCP
      metrics:
        port: {{ .Values.homer.capture.metricsPort }}
        targetPort: metrics
        protocol: TCP
  homer-web:
    forceRename: '{{ include "avoip.fullname" . }}-homer-web'
    controller: homer-web
    ports:
      http:
        port: 80
        targetPort: http
        protocol: TCP
{{- end }}

persistence:
{{- if .Values.asterisk.enabled }}
  asterisk-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-asterisk-configs'
    advancedMounts:
      asterisk:
        asterisk:
          - path: /etc/asterisk/rtp.conf
            subPath: rtp.conf
          - path: /etc/asterisk/extensions.conf
            subPath: extensions.conf
          - path: /etc/asterisk/logger.conf
            subPath: logger.conf
          - path: /etc/asterisk/cdr.conf
            subPath: cdr.conf
          - path: /etc/asterisk/cdr_pgsql.conf
            subPath: cdr_pgsql.conf
          - path: /etc/asterisk/modules.conf
            subPath: modules.conf
          - path: /etc/asterisk/asterisk.conf
            subPath: asterisk.conf
  asterisk-pjsip-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-asterisk-config-tpl'
    advancedMounts:
      asterisk:
        asterisk:
          - path: /etc/asterisk/pjsip.conf
            subPath: pjsip.conf
  asterisk-user:
    type: secret
    name: '{{ include "avoip.fullname" . }}-asterisk'
    advancedMounts:
      asterisk:
        asterisk:
          - path: /tmp/avoip-username
            subPath: username
          - path: /tmp/avoip-password
            subPath: password
  asterisk-tmp:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk:
          - path: /tmp
  asterisk-run:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk:
          - path: /var/run/asterisk
  asterisk-lib:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk-sounds:
          - path: /var/lib/asterisk
        asterisk:
          - path: /var/lib/asterisk
  asterisk-sounds:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk-sounds:
          - path: /var/lib/asterisk/sounds
        asterisk:
          - path: /var/lib/asterisk/sounds
  asterisk-log:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk-sounds:
          - path: /var/log/asterisk
        asterisk:
          - path: /var/log/asterisk
  asterisk-spool:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk:
          - path: /var/spool/asterisk
{{- end }}
{{- if .Values.kamailio.enabled }}
  kamailio-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-kamailio-config'
    advancedMounts:
      kamailio:
        kamailio:
          - path: /etc/kamailio/kamailio.cfg
            subPath: kamailio.cfg
  kamailio-tmp:
    type: emptyDir
    advancedMounts:
      kamailio:
        kamailio:
          - path: /tmp
{{- end }}
{{- if .Values.freeswitch.enabled }}
  freeswitch-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/freeswitch.xml
            subPath: freeswitch.xml
          - path: /etc/freeswitch/vars.xml
            subPath: vars.xml
{{- if .Values.freeswitch.sms.enabled }}
  freeswitch-sms-config:
    type: secret
    name: '{{ include "avoip.fullname" . }}-freeswitch-sms'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/autoload_configs/sms_flowroute.conf.xml
            subPath: sms_flowroute.conf.xml
{{- end }}
  freeswitch-misc-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-misc-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
{{- range $file := list "ldap.conf.xml" "opus.conf.xml" "modules.conf.xml" "console.conf.xml" "switch.conf.xml" "logfile.conf.xml" "event_socket.conf.xml" "cdr_pg_csv.conf.xml" "spandsp.conf.xml" "acl.conf.xml" "sofia.conf.xml" }}
          - path: /etc/freeswitch/autoload_configs/{{ $file }}
            subPath: {{ $file }}
{{- end }}
  freeswitch-tls-source:
    type: secret
    name: resolvemyhost-default-certificates
    advancedMounts:
      freeswitch:
        tls-material:
          - path: /tls-input
  freeswitch-tls-certs:
    type: emptyDir
    advancedMounts:
      freeswitch:
        tls-material:
          - path: /tls-output
        freeswitch:
          - path: /etc/freeswitch/tls
  freeswitch-sip-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-sip-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/sip_profiles/external.xml
            subPath: external.xml
          - path: /etc/freeswitch/sip_profiles/asterisk.xml
            subPath: asterisk.xml
          - path: /etc/freeswitch/sip_profiles/kamailio.xml
            subPath: kamailio.xml
          - path: /etc/freeswitch/sip_profiles/internal.xml
            subPath: internal.xml
          - path: /etc/freeswitch/sip_profiles/internal-ipv6.xml
            subPath: internal-ipv6.xml
          - path: /etc/freeswitch/sip_profiles/external-ipv6.xml
            subPath: external-ipv6.xml
  freeswitch-dialplan-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-dialplan-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/dialplan/default.xml
            subPath: default.xml
          - path: /etc/freeswitch/dialplan/public.xml
            subPath: public.xml
  freeswitch-fax-spool:
{{- if .Values.freeswitch.fax.persistence.enabled }}
    type: persistentVolumeClaim
    storageClass: '{{ .Values.freeswitch.fax.persistence.storageClass }}'
    accessMode: '{{ .Values.freeswitch.fax.persistence.accessMode }}'
    size: '{{ .Values.freeswitch.fax.persistence.size }}'
    retain: {{ .Values.freeswitch.fax.persistence.retain }}
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
{{- else }}
    type: emptyDir
{{- end }}
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: {{ .Values.freeswitch.fax.spoolPath }}
{{- end }}
{{- if and .Values.homer.enabled (eq .Values.cluster.type "hub") .Values.kamailio.enabled }}
  homer-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-homer-config'
    advancedMounts:
      homer-web:
        homer:
          - path: /etc/homer-template
  homer-data:
{{- if .Values.homer.storage.persistence.enabled }}
    type: persistentVolumeClaim
    storageClass: '{{ .Values.homer.storage.persistence.storageClass }}'
    accessMode: '{{ .Values.homer.storage.persistence.accessMode }}'
    size: '{{ .Values.homer.storage.persistence.size }}'
    retain: {{ .Values.homer.storage.persistence.retain }}
    annotations:
      argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
{{- else }}
    type: emptyDir
{{- end }}
    advancedMounts:
      homer-web:
        homer:
          - path: /data/homer
{{- end }}
{{- end }}

