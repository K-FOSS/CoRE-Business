{{- $commonValues := include "avoip.common.values" . | fromYaml -}}
{{- if hasKey $commonValues "Error" }}{{- fail (printf "invalid generated BJW-S common values: %s" (index $commonValues "Error")) }}{{- end }}
{{- $flowrouteSMSValues := include "avoip.flowrouteSMS.commonValues" . | fromYaml -}}
{{- if $flowrouteSMSValues.controllers }}
  {{- $_ := set $commonValues "controllers" (mergeOverwrite (deepCopy ($commonValues.controllers | default dict)) $flowrouteSMSValues.controllers) -}}
{{- end }}
{{- if $flowrouteSMSValues.service }}
  {{- $_ := set $commonValues "service" (mergeOverwrite (deepCopy ($commonValues.service | default dict)) $flowrouteSMSValues.service) -}}
{{- end }}
{{- if $flowrouteSMSValues.networkpolicies }}
  {{- $_ := set $commonValues "networkpolicies" (mergeOverwrite (deepCopy ($commonValues.networkpolicies | default dict)) $flowrouteSMSValues.networkpolicies) -}}
{{- end }}
{{- $adminValues := include "avoip.admin.commonValues" . | fromYaml -}}
{{- range $key := list "controllers" "service" "networkpolicies" -}}
  {{- if index $adminValues $key -}}
    {{- $_ := set $commonValues $key (mergeOverwrite (deepCopy (index $commonValues $key | default dict)) (index $adminValues $key)) -}}
  {{- end -}}
{{- end -}}
{{- $_ := set .Values "controllers" $commonValues.controllers -}}
{{- $_ := set .Values "service" $commonValues.service -}}
{{- $_ := set .Values "persistence" $commonValues.persistence -}}
{{- $_ := set .Values "networkpolicies" (mergeOverwrite (deepCopy (.Values.networkpolicies | default dict)) ($commonValues.networkpolicies | default dict)) -}}
{{- $_ := set .Values "configMaps" (mergeOverwrite (default dict .Values.configMaps) (default dict $commonValues.configMaps)) -}}
{{- include "avoip.networking.apply" . -}}
{{- include "bjw-s.common.loader.generate" . }}
