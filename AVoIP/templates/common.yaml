{{- include "bjw-s.common.loader.init" . }}

{{- define "avoip.common.values" -}}
global:
  nameOverride: '{{ .Release.Name }}'
  createDefaultServiceAccount: false

defaultPodOptions:
  labels:
    logs: loki-myloginspace

controllers:
{{- if .Values.asterisk.enabled }}
  asterisk:
    forceRename: '{{ include "avoip.fullname" . }}-asterisk'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: 1
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      labels:
        app: '{{ include "avoip.fullname" . }}-asterisk'
    initContainers:
      asterisk-sounds:
        image:
          repository: '{{ .Values.asterisk.image.repository }}'
          tag: '{{ .Values.asterisk.image.tag }}'
          digest: '{{ .Values.asterisk.image.digest }}'
          pullPolicy: '{{ .Values.asterisk.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            mkdir -p /var/lib/asterisk/sounds/en /var/log/asterisk/cdr-csv
            cp -R /usr/share/asterisk/sounds/en/. /var/lib/asterisk/sounds/en/
            test -f /var/lib/asterisk/sounds/en/demo-congrats.gsm
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    containers:
      asterisk:
        command:
          - /bin/sh
          - -c
        args:
          - |
            umask 077
            printf '[freeswitch-auth]\n' > /tmp/avoip-pjsip-auth.conf
            printf 'type=auth\n' >> /tmp/avoip-pjsip-auth.conf
            printf 'auth_type=userpass\n' >> /tmp/avoip-pjsip-auth.conf
            printf 'username=%s\n' "$(cat /tmp/avoip-username)" >> /tmp/avoip-pjsip-auth.conf
            printf 'password=%s\n' "$(cat /tmp/avoip-password)" >> /tmp/avoip-pjsip-auth.conf
            exec /usr/sbin/asterisk -f -C /etc/asterisk/asterisk.conf
        image:
          repository: '{{ .Values.asterisk.image.repository }}'
          tag: '{{ .Values.asterisk.image.tag }}'
          digest: '{{ .Values.asterisk.image.digest }}'
          pullPolicy: '{{ .Values.asterisk.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 24
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - /usr/sbin/asterisk -rx 'core show uptime' >/dev/null 2>&1
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
        ports:
          - name: tcp-sip
            containerPort: 5060
            protocol: TCP
          - name: udp-sip
            containerPort: 5060
            protocol: UDP
          - name: tls-sips
            containerPort: 5061
            protocol: TCP
{{- range untilStep (.Values.asterisk.rtp.min | int) (.Values.asterisk.rtp.max | int) 1 }}
          - name: 'udp-{{ . }}'
            containerPort: {{ . }}
            protocol: UDP
          - name: 'tcp-{{ . }}'
            containerPort: {{ . }}
            protocol: TCP
{{ end }}
{{ end }}
{{ if .Values.freeswitch.enabled }}
{{ $cdrHost := default (printf "psql-local.%s.%s.%s.mylogin.space" .Values.cluster.name .Values.datacenter .Values.region) .Values.freeswitch.cdr.host }}
  freeswitch:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch'
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    replicas: 1
    minReadySeconds: 30
    revisionHistoryLimit: 3
    serviceAccount:
      name: default
    pod:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    initContainers:
{{- if .Values.freeswitch.cdr.enabled }}
      cdr-schema:
        image:
          repository: 'postgres'
          tag: '17-alpine'
          digest: 'sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24'
          pullPolicy: 'IfNotPresent'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            export PGUSER="$USERNAME"
            export PGPASSWORD="$PASSWORD"
            export PGDATABASE="$USERNAME"
            until psql -v ON_ERROR_STOP=1 -h '{{ $cdrHost }}' -p '{{ $.Values.freeswitch.cdr.port }}' -c 'SELECT 1' >/dev/null 2>&1; do
              sleep 2
            done
            psql -v ON_ERROR_STOP=1 -h '{{ $cdrHost }}' -p '{{ $.Values.freeswitch.cdr.port }}' <<'SQL'
            CREATE TABLE IF NOT EXISTS {{ $.Values.freeswitch.cdr.table }} (
              id bigserial PRIMARY KEY,
              local_ip_v4 text,
              caller_id_name text,
              caller_id_number text,
              destination_number text NOT NULL,
              context text NOT NULL,
              start_stamp text,
              answer_stamp text,
              end_stamp text,
              duration bigint,
              billsec bigint,
              hangup_cause text,
              uuid text NOT NULL,
              bleg_uuid text,
              accountcode text,
              read_codec text,
              write_codec text
            )
            SQL
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
{{- end }}
      tls-material:
        image:
          repository: '{{ .Values.freeswitch.image.repository }}'
          tag: '{{ .Values.freeswitch.image.tag }}'
          digest: '{{ .Values.freeswitch.image.digest }}'
          pullPolicy: '{{ .Values.freeswitch.image.pullPolicy }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            umask 077
            cat /tls-input/tls.crt /tls-input/tls.key > /tls-output/agent.pem
            cp /tls-input/tls.crt /tls-output/cafile.pem
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    containers:
      freeswitch:
        command:
          - /bin/sh
          - -c
        args:
          - exec /usr/bin/freeswitch -nonat -nocal -nort -nosql -nf -nc </dev/null
        image:
          repository: '{{ .Values.freeswitch.image.repository }}'
          tag: '{{ .Values.freeswitch.image.tag }}'
          digest: '{{ .Values.freeswitch.image.digest }}'
          pullPolicy: '{{ .Values.freeswitch.image.pullPolicy }}'
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "avoip.fullname" . }}-freeswitch'
                key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -0 1 && test -r /etc/freeswitch/freeswitch.xml
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
          - name: udp-sip
            containerPort: 5060
            protocol: UDP
          - name: tcp-sip
            containerPort: 5060
            protocol: TCP
          - name: tls-sips
            containerPort: 5061
            protocol: TCP
          - name: udp-sipext
            containerPort: 5080
            protocol: UDP
          - name: tcp-sipext
            containerPort: 5080
            protocol: TCP
          - name: tls-sipext
            containerPort: 5081
            protocol: TCP

{{ end }}

service:
{{- if .Values.asterisk.enabled }}
  asterisk:
    forceRename: '{{ include "avoip.fullname" . }}-asterisk'
    controller: asterisk
    extraSelectorLabels:
      app: '{{ include "avoip.fullname" . }}-asterisk'
    ports:
      tcp-sip:
        port: 5060
        targetPort: tcp-sip
        protocol: TCP
      udp-sip:
        port: 5060
        targetPort: udp-sip
        protocol: UDP
{{- end }}
{{- if .Values.freeswitch.enabled }}
  freeswitch:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch'
    controller: freeswitch
    ports:
      tcp-sip:
        port: 5060
        targetPort: tcp-sip
        protocol: TCP
      udp-sip:
        port: 5060
        targetPort: udp-sip
        protocol: UDP
      tls-sips:
        port: 5061
        targetPort: tls-sips
        protocol: TCP
  freeswitch-ext:
    forceRename: '{{ include "avoip.fullname" . }}-ext-freeswitch'
    controller: freeswitch
    ports:
      tcp-sip:
        port: 5060
        targetPort: tcp-sipext
        protocol: TCP
      udp-sip:
        port: 5060
        targetPort: udp-sipext
        protocol: UDP
      tls-sips:
        port: 5061
        targetPort: tls-sipext
        protocol: TCP
{{- if .Values.freeswitch.publicExposure.enabled }}
  freeswitch-rtp:
    forceRename: '{{ include "avoip.fullname" . }}-freeswitch-rtp'
    controller: freeswitch
    type: LoadBalancer
    loadBalancerClass: purelb.io/purelbv2
    annotations:
      purelb.io/allow-shared-ip: main-gw.resolvemy.host
      purelb.io/service-group: core-public
      purelb.io/allow-local: 'true'
      purelb.io/addresses: '{{ .Values.freeswitch.publicExposure.address }}'
    ports:
      rtp:
        portRange:
          start: {{ .Values.freeswitch.rtp.min }}
          end: {{ sub (.Values.freeswitch.rtp.max | int) 1 }}
        protocol: UDP
{{- end }}
{{- end }}

persistence:
{{- if .Values.asterisk.enabled }}
  asterisk-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-asterisk-configs'
    advancedMounts:
      asterisk:
        asterisk:
          - path: /etc/asterisk/rtp.conf
            subPath: rtp.conf
          - path: /etc/asterisk/extensions.conf
            subPath: extensions.conf
          - path: /etc/asterisk/logger.conf
            subPath: logger.conf
          - path: /etc/asterisk/modules.conf
            subPath: modules.conf
          - path: /etc/asterisk/asterisk.conf
            subPath: asterisk.conf
  asterisk-pjsip-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-asterisk-config-tpl'
    advancedMounts:
      asterisk:
        asterisk:
          - path: /etc/asterisk/pjsip.conf
            subPath: pjsip.conf
  asterisk-user:
    type: secret
    name: '{{ include "avoip.fullname" . }}-asterisk'
    advancedMounts:
      asterisk:
        asterisk:
          - path: /tmp/avoip-username
            subPath: username
          - path: /tmp/avoip-password
            subPath: password
  asterisk-tmp:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk:
          - path: /tmp
  asterisk-run:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk:
          - path: /var/run/asterisk
  asterisk-lib:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk-sounds:
          - path: /var/lib/asterisk
        asterisk:
          - path: /var/lib/asterisk
  asterisk-log:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk-sounds:
          - path: /var/log/asterisk
        asterisk:
          - path: /var/log/asterisk
  asterisk-spool:
    type: emptyDir
    advancedMounts:
      asterisk:
        asterisk:
          - path: /var/spool/asterisk
{{- end }}
{{- if .Values.freeswitch.enabled }}
  freeswitch-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/freeswitch.xml
            subPath: freeswitch.xml
          - path: /etc/freeswitch/vars.xml
            subPath: vars.xml
{{- if .Values.freeswitch.sms.enabled }}
  freeswitch-sms-config:
    type: secret
    name: '{{ include "avoip.fullname" . }}-freeswitch-sms'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/autoload_configs/sms_flowroute.conf.xml
            subPath: sms_flowroute.conf.xml
{{- end }}
  freeswitch-misc-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-misc-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
{{- range $file := list "ldap.conf.xml" "opus.conf.xml" "modules.conf.xml" "console.conf.xml" "switch.conf.xml" "logfile.conf.xml" "event_socket.conf.xml" "cdr_pg_csv.conf.xml" "spandsp.conf.xml" "acl.conf.xml" "sofia.conf.xml" }}
          - path: /etc/freeswitch/autoload_configs/{{ $file }}
            subPath: {{ $file }}
{{- end }}
  freeswitch-tls-source:
    type: secret
    name: resolvemyhost-default-certificates
    advancedMounts:
      freeswitch:
        tls-material:
          - path: /tls-input
  freeswitch-tls-certs:
    type: emptyDir
    advancedMounts:
      freeswitch:
        tls-material:
          - path: /tls-output
        freeswitch:
          - path: /etc/freeswitch/tls
  freeswitch-sip-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-sip-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/sip_profiles/external.xml
            subPath: external.xml
          - path: /etc/freeswitch/sip_profiles/asterisk.xml
            subPath: asterisk.xml
          - path: /etc/freeswitch/sip_profiles/internal.xml
            subPath: internal.xml
          - path: /etc/freeswitch/sip_profiles/internal-ipv6.xml
            subPath: internal-ipv6.xml
          - path: /etc/freeswitch/sip_profiles/external-ipv6.xml
            subPath: external-ipv6.xml
  freeswitch-upstream-config:
    type: secret
    name: '{{ include "avoip.fullname" . }}-freeswitch-upstream'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/sip_profiles/external/flowroute.xml
            subPath: flowroute.xml
  freeswitch-dialplan-config:
    type: configMap
    name: '{{ include "avoip.fullname" . }}-freeswitch-dialplan-configs'
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /etc/freeswitch/dialplan/default.xml
            subPath: default.xml
          - path: /etc/freeswitch/dialplan/public.xml
            subPath: public.xml
  freeswitch-fax-spool:
    type: emptyDir
    advancedMounts:
      freeswitch:
        freeswitch:
          - path: /var/spool/freeswitch
{{- end }}
{{- end }}

{{- $commonValues := include "avoip.common.values" . | fromYaml -}}
{{- $_ := set .Values "controllers" $commonValues.controllers -}}
{{- $_ := set .Values "service" $commonValues.service -}}
{{- $_ := set .Values "persistence" $commonValues.persistence -}}
{{- include "bjw-s.common.loader.generate" . }}
