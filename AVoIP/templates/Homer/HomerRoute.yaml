{{- if and (include "avoip.homer.enabled" . | trim) (include "avoip.kamailio.carrier.enabled" . | trim) }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: '{{ include "avoip.fullname" . }}-homer-auth'
spec:
  targetRefs:
    - group: 'gateway.networking.k8s.io'
      kind: 'HTTPRoute'
      name: '{{ include "avoip.fullname" . }}-homer'
  extAuth:
    failOpen: false
    headersToExtAuth:
      - 'cookie'
      - 'x-forwarded-host'
      - 'x-forwarded-method'
      - 'x-forwarded-proto'
      - 'x-forwarded-uri'
    http:
      headersToBackend:
        - 'set-cookie'
        - 'x-authentik-*'
        - 'authorization'
        - 'Content-Type'
        - 'Location'
      backendSettings:
        loadBalancer:
          type: 'ConsistentHash'
          consistentHash:
            type: 'SourceIP'
      backendRefs:
        - group: ''
          kind: 'Service'
          namespace: '{{ .Values.homer.authentikOutpost.namespace }}'
          name: '{{ .Values.homer.authentikOutpost.name }}'
          port: {{ .Values.homer.authentikOutpost.port }}
      path: '/outpost.goauthentik.io/auth/envoy'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ include "avoip.fullname" . }}-homer'
  annotations:
    external-dns.alpha.kubernetes.io/hostname: '{{ include "avoip.homer.hostname" . }}'
    wan-mode: 'public'
spec:
  parentRefs:
    - kind: 'Gateway'
      name: '{{ .Values.gateway.name }}'
      namespace: '{{ .Values.gateway.namespace }}'
      sectionName: '{{ .Values.gateway.sectionName }}'
  hostnames:
    - '{{ include "avoip.homer.hostname" . }}'
  rules:
    {{- if and .Values.homer.recordings.enabled .Values.freeswitch.enabled .Values.freeswitch.media.diagnostics.callRecording.enabled }}
    - matches:
        - path:
            type: 'PathPrefix'
            value: '/recordings'
      backendRefs:
        - group: ''
          kind: 'Service'
          name: '{{ include "avoip.fullname" . }}-rec'
          port: {{ .Values.homer.recordings.port }}
    {{- end }}
    - matches:
        - path:
            type: 'PathPrefix'
            value: '/outpost.goauthentik.io'
      backendRefs:
        - group: ''
          kind: 'Service'
          name: '{{ .Values.homer.authentikOutpost.name }}'
          namespace: '{{ .Values.homer.authentikOutpost.namespace }}'
          port: {{ .Values.homer.authentikOutpost.port }}
    - backendRefs:
        - group: ''
          kind: 'Service'
          name: '{{ include "avoip.fullname" . }}-homer-web'
          port: 80
---
# Homer must receive its OAuth callback without the outer Forward Auth check.
# Otherwise Authentik challenges the callback before Homer can exchange the
# authorization code and the browser returns to /system:login.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ include "avoip.fullname" . }}-homer-oidc-callback'
spec:
  parentRefs:
    - kind: 'Gateway'
      name: '{{ .Values.gateway.name }}'
      namespace: '{{ .Values.gateway.namespace }}'
      sectionName: '{{ .Values.gateway.sectionName }}'
  hostnames:
    - '{{ include "avoip.homer.hostname" . }}'
  rules:
    - matches:
        - path:
            type: 'Exact'
            value: '/api/v4/auth/oauth2/authentik/callback'
      backendRefs:
        - group: ''
          kind: 'Service'
          name: '{{ include "avoip.fullname" . }}-homer-web'
          port: 80
---
# Homer 7 links and bookmarks still point to its login route. Homer 11 uses
# its own root login page, where the configured OIDC provider starts login.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ include "avoip.fullname" . }}-homer-legacy-login'
spec:
  parentRefs:
    - kind: 'Gateway'
      name: '{{ .Values.gateway.name }}'
      namespace: '{{ .Values.gateway.namespace }}'
      sectionName: '{{ .Values.gateway.sectionName }}'
  hostnames:
    - '{{ include "avoip.homer.hostname" . }}'
  rules:
    - matches:
        - path:
            type: 'Exact'
            value: '/(system:login)'
        - path:
            type: 'Exact'
            value: '/system:login'
      filters:
        - type: 'RequestRedirect'
          requestRedirect:
            path:
              type: 'ReplaceFullPath'
              replaceFullPath: '/'
{{- end }}
