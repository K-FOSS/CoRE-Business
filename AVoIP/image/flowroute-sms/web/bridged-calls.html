<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridged calls · CoRE AVoIP</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="shell"><p class="eyebrow">CoRE AVoIP</p><h1>Bridged calls</h1><p>Have CoRE call you first, then connect you to an authorized internal extension.</p><form id="call-form"><fieldset><legend>Call</legend><label><input type="radio" name="mode" value="now" checked> Call now</label><label><input type="radio" name="mode" value="schedule"> Schedule call</label><label>Callback destination<select id="callback" required></select></label><label id="new-number" hidden>New external callback number<input id="number" type="tel" inputmode="tel" autocomplete="tel" placeholder="+1…"></label><label>Extension<input id="extension-search" type="search" placeholder="Search extensions" autocomplete="off"><select id="extension" required></select></label><label>Caller ID<select id="caller-id" required></select></label><label id="when" hidden>Local date and time<input id="scheduled-at" type="datetime-local"></label><label id="tz">Timezone<input id="timezone" value="America/Vancouver" required></label></fieldset><section class="review"><h2>Review</h2><p id="review">Choose both destinations to review the call.</p></section><p id="error" role="alert"></p><button type="submit">Place call</button></form><section><h2>Upcoming and recent calls</h2><div id="calls" aria-live="polite">Loading…</div></section></main><script src="/assets/bridged-calls.js"></script></body></html>
