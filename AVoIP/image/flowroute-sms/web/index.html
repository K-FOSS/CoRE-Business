<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Messages</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <main class="app" id="app">
    <aside class="sidebar" aria-label="Conversations">
      <header class="sidebar-head"><h1>Messages</h1><button id="compose" class="icon-button primary" aria-label="New message" title="New message">＋</button></header>
      <div class="sidebar-tools"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search conversations" aria-label="Search conversations"></label><label class="number-label" for="number">SMS number</label><select id="number" aria-label="SMS number"></select><p id="provider-status" class="provider-status" role="status" hidden></p></div>
      <div id="conversations" class="conversations" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
      <footer class="sidebar-footer"><a id="admin-link" class="text-button" target="_blank" rel="noopener" hidden>Administration</a><button id="theme" class="text-button">Toggle theme</button></footer>
    </aside>
    <section class="thread" id="thread" aria-label="Conversation">
      <header class="thread-head"><button id="back" class="icon-button back" aria-label="Back to conversations">‹</button><span class="avatar" id="avatar" aria-hidden="true">#</span><div class="thread-heading"><strong id="recipient-heading">Select a conversation</strong><a id="recipient-link" class="recipient-link" hidden>Call number</a><small id="local-heading"></small></div><button id="copy-number" class="icon-button" aria-label="Copy phone number" title="Copy phone number" hidden>⧉</button></header>
      <div id="timeline" class="timeline" role="log" aria-live="polite"><div class="welcome"><span class="welcome-icon">✉</span><h2>Your messages</h2><p>Choose a conversation to read and reply.</p></div></div>
      <form id="composer" class="composer" hidden><label class="sr-only" for="body">Message</label><textarea id="body" rows="1" placeholder="Text message" maxlength="1600"></textarea><label id="media-label" class="media-label" for="media-files" hidden>Attach images</label><input id="media-files" class="media-files" type="file" accept="image/*" multiple hidden><select id="provider" aria-label="Sending provider" hidden></select><span id="count" class="count" aria-live="polite"></span><button class="send" id="send" type="submit" aria-label="Send message">➤</button></form>
    </section>
  </main>
  <dialog id="new-message"><form method="dialog" id="new-message-form"><h2>New message</h2><label for="new-from">Send from</label><select id="new-from" required></select><label for="new-to">Recipient number</label><input id="new-to" type="tel" inputmode="tel" autocomplete="tel" placeholder="+1 206 555 0123" required><p>Enter the recipient in international format.</p><div class="dialog-actions"><button type="button" id="cancel-new">Cancel</button><button type="submit" class="dialog-primary">Continue</button></div></form></dialog>
  <dialog id="media-preview" class="media-dialog"><form method="dialog"><header><h2 id="media-preview-title">Attachment</h2><button class="icon-button" value="cancel" aria-label="Close attachment">×</button></header><div id="media-preview-content"></div><footer><details class="attachment-menu"><summary aria-label="Attachment options">⋮</summary><a id="media-download" download>Download</a></details><button value="cancel" class="dialog-primary">Close</button></footer></form></dialog>
  <dialog id="confirm-action"><form method="dialog"><h2>Confirm deletion</h2><p id="confirm-description"></p><div class="dialog-actions"><button value="cancel">Cancel</button><button value="delete" class="text-button danger">Delete</button></div></form></dialog>
  <div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
  <script src="/assets/attachments.js" defer></script>
</body>
</html>
