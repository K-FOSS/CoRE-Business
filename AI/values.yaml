owui:
  enabled: true

  psql:
    enabled: true

    # Defaults to psql-local.<cluster.name>.<datacenter>.<region>.mylogin.space.
    host: ''

    # Both providers default to psql-<datacenter>-<region>.
    crossplaneProvider: ''
    terraformProvider: ''

  redis:
    enabled: true

    # Defaults to dragonfly.<cluster.name>.<datacenter>.<region>.mylogin.space.
    host: ''
    port: 6379
    database: 150
    websocketDatabase: 151

    existingSecret:
      name: 'openwebui-dragonfly'
      passwordKey: 'password'

    secretStoreRef:
      kind: ClusterSecretStore
      name: corevault-rootsecrets

    remoteRef:
      key: Storage/DragonFly/CoRE/Creds
      property: Password

  mcpo:
    enabled: true

mcp:
  enabled: true

  hub:
    enabled: true

  containers:
    - name: brave-search
      image: mcp/brave-search
      tag: latest

      env:
        - name: BRAVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-core-business-ai-brave-search'
              key: APIKey

        - name: BRAVE_MCP_TRANSPORT
          value: 'http'

  frr:
    enabled: true

  docker:
    enabled: true

  search:
    enabled: true

ai:
  namespace:
    name: core-ai-testing

    create: true

pubgateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace



oauth:
  indexKey: openwebui
  scopes: ''
  groups: []
  authentik:
    urlBase: https://idp.mylogin.space


gateway:
  enabled: true

  tenant: testing

  service:
    labels:

    annotations:
      purelb.io/allow-shared-ip: ai.int.mylogin.space
      purelb.io/service-group: core-anycast
      purelb.io/allow-local: 'true'
      purelb.io/addresses: 10.1.1.19

  labels:
    wan-mode: 'public'
    lan-mode: 'private'
    resolvemy.host/gw: 'ai-gw'
    resolvemy.host/gw-ns: '{{ .Release.Namespace }}'
    resolvemy.host/security: 'private'
    resolvemy.host/env: 'prod'
