env: prod

hub: true

cluster:
  name: k8s
  domain: cluster.local

datacenter: dc1

region: yxl

global:
  test: 'test'


mcpbox:
  enabled: true

  image: quay.io/mudler/localagi-mcpbox

  tag: main

localagi:
  enabled: true

  persistence:
    enabled: true

  image: quay.io/mudler/localagi
  tag: main


wyoming:
  enabled: true

  replicas: 2

  service:
    enabled: true

  image: ghcr.io/roryeckel/wyoming_openai
  tag: latest

  tts:
    endpoint: https://gpustack.mylogin.space/v1

    models:
      - CoRE-AI-TTS

    streamingModels:
      - CoRE-AI-TTS

    voices: 'af_bella af_v0'

  stt:
    endpoint: https://stt.int.mylogin.space/v1

    models:
      - Systran/faster-whisper-small

    streamingModels: []

  logs:
    level: DEBUG

  languages: 'en'

speeches:
  enabled: true

  image: 'ghcr.io/speaches-ai/speaches'

  model: 'Systran/faster-whisper-small'

  backends:
    cpu:
      enabled: true
      tag: '0.8.3-cpu'
      replicas: 2
      inferenceDevice: 'cpu'
      computeType: 'int8'
      cpuThreads: '4'
      nodes:
        - 'srv2'
        - 'srv3'
      resources:
        requests:
          cpu: '4'
        limits:
          cpu: '4'
      service:
        name: 'core-speaches-cpu'
        weight: 1

    cuda:
      enabled: true
      tag: '0.8.3-cuda-12.6.3'
      replicas: 1
      inferenceDevice: 'cuda'
      computeType: 'float16'
      runtimeClassName: 'nvidia'

      resources:
        requests:
          nvidia.com/gpu.shared: '1'
        limits:
          nvidia.com/gpu.shared: '1'
      service:
        name: 'core-speaches-cuda'
        weight: 99

  persistence:
    size: '10Gi'
    storageClass: 'speaches-longhorn-rwx'
    accessMode: ReadWriteMany

  storageClass:
    create: true
    name: 'speaches-longhorn-rwx'
    numberOfReplicas: '2'
    migratable: 'false'

  service:
    sessionAffinity: ClientIP
    sessionAffinityTimeoutSeconds: 10800
    clusterMesh:
      enabled: true
      shared: true
      affinity: 'local'

  externalBackend: []


tts:
  enabled: false

  image: ghcr.io/remsky/kokoro-fastapi-gpu
  tag: v0.2.4

  runtimeClassName: nvidia

  nodeSelector:
    gpu-node: 'true'

  externalBackend:
    - name: hpc3-windows
      endpoint:
        ip:
          address: 172.31.192.12
          port: 8880


externalSecrets:
  enabled: true

  secretStoreRef:
    kind: ClusterSecretStore
    name: mainvault-core

gpustack:
  enabled: true

  tokens:
    # Requires a management-scoped GPUStack API key in auth.existingSecret.
    enabled: false
    schedule: '*/5 * * * *'

    auth:
      existingSecret: 'gpustack-token-provisioner'
      key: 'apiKey'

    generator:
      length: 64
      digits: 10
      symbols: 0

    items: []
      # - name: 'openwebui'
      #   description: 'OpenWebUI inference access'
      #   scopes:
      #     - 'inference'
      #   allowedModelNames: []
      #   secret:
      #     name: 'gpustack-token-openwebui'
      #     key: 'apiKey'

  oidc:
    enabled: true
    providerConfigRef: 'authentik'
    issuerBaseUrl: 'https://idp.mylogin.space'
    applicationSlug: 'gpustack'
    accessGroup: 'GPUStack Users'

  psql:
    enabled: true

    # Defaults to psql-local.<cluster.name>.<datacenter>.<region>.mylogin.space.
    host: ''

    # Both providers default to psql-<datacenter>-<region>.
    crossplaneProvider: ''
    terraformProvider: ''

  server:
    enabled: true
    externalUrl: 'https://gpustack.mylogin.space'

    image: gpustack/gpustack
    tag: v2.2.3

    replicas: 1
    
    service:
      enabled: true

    gateway:
      enabled: true
      httproute:
        enabled: true

        domains:
          - gpustack.mylogin.space

        labels:
          test: 'true'

  workers: []


localai:
  enabled: false

  nodeSelector:
    kubernetes.io/hostname: hpc3

docker:
  mcp:
    enabled: true
  kubedock:
    enabled: false

    rbac:
      create: false

