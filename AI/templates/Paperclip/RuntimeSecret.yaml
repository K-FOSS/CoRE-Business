{{- if and .Values.paperclip.enabled (eq .Values.cluster.name .Values.paperclip.targetCluster) }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.paperclip.runtimeSecret.generatorName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  length: 64
  digits: 0
  symbols: 0
  allowRepeat: true
  encoding: 'hex'
  secretKeys:
    - 'BETTER_AUTH_SECRET'
    - 'PAPERCLIP_AGENT_JWT_SECRET'
    - 'PAPERCLIP_TOOL_ACTION_SIGNING_SECRET'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-generate" .Values.paperclip.runtimeSecret.secretName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-9'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: {{ .Values.paperclip.runtimeSecret.secretName | quote }}
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: 'Password'
          name: {{ .Values.paperclip.runtimeSecret.generatorName | quote }}
{{- end }}
