{{- if and .Values.gpustack.enabled .Values.gpustack.server.enabled .Values.gpustack.psql.enabled }}
apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: {{ .Release.Name }}-gpustack

spec:
  name: GPUStack {{ .Values.region }}-{{ .Values.datacenter }}-{{ .Values.cluster.name }}

  psql:
    enabled: true

    crossplane:
      crossplaneProvider: {{ default (printf "psql-%s-%s" .Values.datacenter .Values.region) .Values.gpustack.psql.crossplaneProvider }}
      terraformProvider: {{ default (printf "psql-%s-%s" .Values.datacenter .Values.region) .Values.gpustack.psql.terraformProvider }}

  groups:
    - LDAPService

  writeConnectionSecretToRef:
    name: {{ .Release.Name }}-gpustack-user
{{- end }}
