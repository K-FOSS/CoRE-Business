apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      resolvemy.host/env: 'prod'

patches:
  - path: patches/nextcloud-dns.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/name=nextcloud,app.kubernetes.io/component=app
  - path: patches/nextcloud-websocket.yaml
    target:
      version: v1
      kind: Service
      labelSelector: app.kubernetes.io/name=nextcloud,app.kubernetes.io/component=app
