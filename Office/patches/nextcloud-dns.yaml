apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
spec:
  template:
    spec:
      containers:
        - name: nextcloud
          env:
            - name: PHP_INI_SCAN_DIR
              value: '/usr/local/etc/php/conf.d:/tmp/php-conf.d'
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.44.4.10
          - 1.1.1.1
        options:
          - name: edns0
          - name: ndots
            value: '0'
