{{- if .Values.nextcloud.enabled }}
apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: nextcloud-core-{{ .Values.env }}

spec:
  name: NextCloud {{ .Values.region }}

  psql:
    enabled: true

    crossplane:
      crossplaneProvider: psql-home1-yvr
      terraformProvider: psql-home1-yvr

  s3:
    enabled: true

    createCredentials: true

    createServiceAccount: true

    crossplane:
      terraformProvider: s3-yvr-home1-core
      crossplaneProvider: s3-yvr-home1-core

    writeServiceAccountCredentialsSecretRef:
      name: {{ .Values.nextcloudS3Credentials.credentialsSecretName | quote }}
      namespace: {{ .Release.Namespace }}    

    writeCredentialsSecretRef:
      name: {{ .Values.nextcloudS3Credentials.sessionSecretName | quote }}
      namespace: {{ .Release.Namespace }}

  groups:
    - LDAPService

  writeConnectionSecretToRef:
    name: office-nextcloud-creds
{{- end }}
