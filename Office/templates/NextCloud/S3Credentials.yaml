{{- if and .Values.nextcloud.enabled .Values.nextcloudS3Credentials.enabled }}
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: nextcloud-s3-credentials
spec:
  providerConfigRef:
    name: {{ .Values.nextcloudS3Credentials.providerConfigRef | quote }}

  deletionPolicy: Orphan

  managementPolicies:
    - Observe
    - Create
    - Update

  writeConnectionSecretToRef:
    name: {{ .Values.nextcloudS3Credentials.credentialsSecretName | quote }}
    namespace: {{ .Release.Namespace }}

  forProvider:
    source: Inline
    env:
      - name: TF_VAR_access_key
        secretKeyRef:
          name: {{ .Values.nextcloudS3Credentials.sessionSecretName | quote }}
          namespace: {{ .Release.Namespace }}
          key: AccessKey
      - name: TF_VAR_secret_access_key
        secretKeyRef:
          name: {{ .Values.nextcloudS3Credentials.sessionSecretName | quote }}
          namespace: {{ .Release.Namespace }}
          key: SecretAccessKey
      - name: TF_VAR_session_token
        secretKeyRef:
          name: {{ .Values.nextcloudS3Credentials.sessionSecretName | quote }}
          namespace: {{ .Release.Namespace }}
          key: SessionToken
      - name: TF_VAR_target_user
        secretKeyRef:
          name: {{ .Values.nextcloudS3Credentials.userSecretName | quote }}
          namespace: {{ .Release.Namespace }}
          key: username

    varmap:
      endpoint: {{ .Values.nextcloudS3Credentials.endpoint | quote }}
      service_account_name: {{ .Values.nextcloudS3Credentials.serviceAccountName | quote }}

    module: | # hcl
      variable "access_key" {
        description = "Temporary S3 access key"
        type        = string
        sensitive   = true
      }

      variable "secret_access_key" {
        description = "Temporary S3 secret access key"
        type        = string
        sensitive   = true
      }

      variable "session_token" {
        description = "Temporary S3 session token"
        type        = string
        sensitive   = true
      }

      variable "target_user" {
        description = "MinIO LDAP user that owns the service account"
        type        = string
      }

      variable "endpoint" {
        description = "MinIO API endpoint"
        type        = string
      }

      variable "service_account_name" {
        description = "Stable name for the Nextcloud service account"
        type        = string
      }

      provider "minio" {
        alias               = "nextcloud_session"
        minio_server        = var.endpoint
        minio_user          = var.access_key
        minio_password      = var.secret_access_key
        minio_session_token = var.session_token
        minio_ssl           = true
      }

      resource "minio_iam_service_account" "nextcloud" {
        provider    = minio.nextcloud_session
        target_user = var.target_user
        name        = var.service_account_name
        description = "Nextcloud primary object storage"
      }

      output "AccessKey" {
        value     = minio_iam_service_account.nextcloud.access_key
        sensitive = true
      }

      output "SecretAccessKey" {
        value     = minio_iam_service_account.nextcloud.secret_key
        sensitive = true
      }
{{- end }}
