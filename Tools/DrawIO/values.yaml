global:
  createDefaultServiceAccount: true

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

k8gb:
  enabled: true
  strategy: 'roundRobin'
  dnsTtlSeconds: 30
  domain: gslb.mylogin.space

drawio:
  domains:
    - 'draw.mylogin.space'
  replicas: 2

  image:
    repository: jgraph/drawio
    tag: '32.5.5'
    digest: 'sha256:16296fe9fd09eff92a3808cc674ce1883712c1b0bae5d48ccc30f9abf13c578b'
    pullPolicy: 'IfNotPresent'

route:
  drawio:
    annotations:
      forecastle.stakater.com/expose: 'true'
      forecastle.stakater.com/instance: 'core'
      forecastle.stakater.com/group: 'Tools'
      forecastle.stakater.com/appName: 'DrawIO'
    labels: {}
  drawio-k8gb:
    annotations: {}
    labels: {}
