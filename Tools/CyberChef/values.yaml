global:
  createDefaultServiceAccount: true

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

k8gb:
  enabled: true
  strategy: 'roundRobin'
  dnsTtlSeconds: 30
  domain: gslb.mylogin.space

cyberchef:
  domains:
    - 'cyberchef.mylogin.space'
  replicas: 2

  image:
    repository: ghcr.io/gchq/cyberchef
    tag: '11.5.0@sha256:fa74354a9c5dd014c8dacee843eb9218fb13465d678d8b049e97bc26a69a1640'
    pullPolicy: 'IfNotPresent'

  resources:
    requests:
      cpu: '25m'
      memory: '64Mi'
    limits:
      cpu: '500m'
      memory: '256Mi'

route:
  cyberchef:
    annotations:
      forecastle.stakater.com/expose: 'true'
      forecastle.stakater.com/instance: 'core'
      forecastle.stakater.com/group: 'Tools'
      forecastle.stakater.com/appName: 'CyberChef'
    labels: {}
  cyberchef-k8gb:
    annotations: {}
    labels: {}
