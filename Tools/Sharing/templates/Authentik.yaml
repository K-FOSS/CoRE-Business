{{- if and .Values.sharing.kutt.enabled .Values.sharing.kutt.oidc.enabled }}
{{- $_ := required "sharing.kutt.oidc.providerConfigRef is required" .Values.sharing.kutt.oidc.providerConfigRef -}}
{{- $_ := required "sharing.kutt.oidc.issuerBaseUrl is required" .Values.sharing.kutt.oidc.issuerBaseUrl -}}
{{- $_ := required "sharing.kutt.oidc.applicationSlug is required" .Values.sharing.kutt.oidc.applicationSlug -}}
{{- $_ := required "sharing.kutt.oidc.accessGroup is required" .Values.sharing.kutt.oidc.accessGroup -}}
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: '{{ .Release.Name }}-kutt-oidc'
spec:
  providerConfigRef:
    name: '{{ .Values.sharing.kutt.oidc.providerConfigRef }}'
  writeConnectionSecretToRef:
    namespace: '{{ .Release.Namespace }}'
    name: '{{ .Release.Name }}-kutt-oidc'
  forProvider:
    source: 'Inline'
    varmap:
      cluster_name: '{{ .Values.cluster.name }}'
      datacenter: '{{ .Values.datacenter }}'
      region: '{{ .Values.region }}'
      application_slug: '{{ .Values.sharing.kutt.oidc.applicationSlug }}'
      access_group: '{{ .Values.sharing.kutt.oidc.accessGroup }}'
      issuer_base_url: '{{ trimSuffix "/" .Values.sharing.kutt.oidc.issuerBaseUrl }}'
      external_url: 'https://{{ .Values.sharing.kutt.hostname }}'
    module: |
      variable "cluster_name" { type = string }
      variable "datacenter" { type = string }
      variable "region" { type = string }
      variable "application_slug" { type = string }
      variable "access_group" { type = string }
      variable "issuer_base_url" { type = string }
      variable "external_url" { type = string }

      data "authentik_flow" "authorization" {
        slug = "default-provider-authorization-explicit-consent"
      }

      data "authentik_flow" "invalidation" {
        slug = "default-provider-invalidation-flow"
      }

      data "authentik_property_mapping_provider_scope" "scopes" {
        managed_list = [
          "goauthentik.io/providers/oauth2/scope-email",
          "goauthentik.io/providers/oauth2/scope-openid",
          "goauthentik.io/providers/oauth2/scope-profile",
        ]
      }

      data "authentik_certificate_key_pair" "signing_key" {
        name = "tls"
      }

      resource "random_password" "client_secret" {
        length  = 128
        lower   = true
        numeric = true
        upper   = true
        special = true
      }

      resource "authentik_provider_oauth2" "kutt" {
        name          = "Sharing Kutt ${var.cluster_name} ${var.datacenter} ${var.region}"
        client_id     = "${var.application_slug}-${var.region}-${var.datacenter}-${var.cluster_name}"
        client_secret = random_password.client_secret.result
        client_type   = "confidential"
        signing_key   = data.authentik_certificate_key_pair.signing_key.id
        allowed_redirect_uris = [{
          matching_mode = "strict"
          url           = "${var.external_url}/login/oidc"
        }]
        property_mappings  = data.authentik_property_mapping_provider_scope.scopes.ids
        authorization_flow = data.authentik_flow.authorization.id
        invalidation_flow  = data.authentik_flow.invalidation.id
      }

      resource "authentik_application" "kutt" {
        name              = "Sharing Kutt"
        slug              = "${var.application_slug}-${var.region}-${var.datacenter}-${var.cluster_name}"
        group             = "${var.datacenter}-${var.cluster_name}"
        protocol_provider = authentik_provider_oauth2.kutt.id
      }

      resource "authentik_group" "sharing_users" {
        name         = var.access_group
        is_superuser = false
      }

      resource "authentik_application_entitlement" "sharing_access" {
        name        = "${authentik_group.sharing_users.id}-ent"
        application = authentik_application.kutt.uuid
      }

      resource "authentik_policy_binding" "entitlement_access" {
        target = authentik_application_entitlement.sharing_access.id
        group  = authentik_group.sharing_users.id
        order  = 0
      }

      resource "authentik_policy_binding" "application_access" {
        target = authentik_application.kutt.uuid
        group  = authentik_group.sharing_users.id
        order  = 0
      }

      output "OIDC_CLIENT_ID" {
        value     = authentik_provider_oauth2.kutt.client_id
        sensitive = true
      }

      output "OIDC_CLIENT_SECRET" {
        value     = random_password.client_secret.result
        sensitive = true
      }

      output "OIDC_ISSUER_URL" {
        value     = "${var.issuer_base_url}/application/o/${var.application_slug}-${var.region}-${var.datacenter}-${var.cluster_name}/"
        sensitive = true
      }
{{- end }}
