{{- if .Values.sharing.zipline.enabled }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: '{{ .Values.sharing.zipline.coreSecret.generatorName }}'
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  length: 64
  digits: 16
  symbols: 16
  allowRepeat: true
  secretKeys:
    - 'CORE_SECRET'
  encoding: 'base64url'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ .Values.sharing.zipline.coreSecret.secretName }}-generate'
  annotations:
    argocd.argoproj.io/sync-wave: '-9'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: '{{ .Values.sharing.zipline.coreSecret.secretName }}'
    creationPolicy: 'Owner'
    deletionPolicy: 'Retain'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: 'Password'
          name: '{{ .Values.sharing.zipline.coreSecret.generatorName }}'
{{- end }}
