# Site-specific values are injected by the owning Backplane ApplicationSet.
cluster:
  name: ''
datacenter: ''
region: ''

global:
  createDefaultServiceAccount: true

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

sharing:
  # The stack is intentionally named for the sharing capability. Kutt is the
  # first workload and additional sharing applications can be added here.
  kutt:
    enabled: true
    hostname: 'snd.fyi'
    image:
      repository: 'docker.io/kutt/kutt'
      tag: 'v3.2.6'
      pullPolicy: 'IfNotPresent'
    database:
      # Defaults to psql-local.<cluster>.<datacenter>.<region>.mylogin.space.
      host: ''
      port: '5432'
      userSecret: 'sharing-database'
      usernameKey: 'username'
      passwordKey: 'password'
      ssl: 'true'
      crossplane:
        # Nextcloud provisions the identity through the hub's site-local PSQL
        # providers. Override these when the ApplicationSet selects another site.
        crossplaneProvider: 'psql-home1-yvr'
        terraformProvider: 'psql-home1-yvr'
    redis:
      enabled: true
      ownDragonfly:
        enabled: true
        name: 'sharing-dragonfly'
        replicas: 2
        passwordGeneratorName: 'sharing-dragonfly-password'
        passwordSecretName: 'sharing-dragonfly-password'
        tlsSecretRef:
          name: 'myloginspace-default-certificates'
          namespace: 'core-prod'
      tlsProxy:
        enabled: true
        image:
          repository: 'docker.io/alpine/socat'
          tag: '1.8.0.3'
          pullPolicy: 'IfNotPresent'
        port: '6380'
      host: ''
      port: '6379'
      database: '2'
      secretStoreRef:
        kind: 'ClusterSecretStore'
        name: 'corevault-rootsecrets'
      secretName: 'sharing-dragonfly-password'
      passwordKey: 'password'
    jwtSecret:
      # Generated once by External Secrets; never put the JWT in values or Git.
      generatorName: 'sharing-kutt-jwt'
      secretName: 'sharing-kutt-jwt'
      key: 'JWT_SECRET'
    oidc:
      enabled: true
      providerConfigRef: 'authentik'
      issuerBaseUrl: 'https://idp.mylogin.space'
      applicationSlug: 'sharing-kutt'
      accessGroup: 'Sharing Users'
    siteName: 'Sharing'
    disallowRegistration: 'true'
    disallowAnonymousLinks: 'true'
    # Direct upstream Kutt configuration. Keys are passed through as environment
    # variables; generated database, Redis, JWT and OIDC values take precedence.
    # See https://github.com/thedevs-network/kutt/blob/v3.2.6/.example.env.
    config:
      SITE_NAME: 'Sharing'
      DB_SSL: 'true'
      DB_POOL_MIN: '0'
      DB_POOL_MAX: '10'
      LINK_LENGTH: '6'
      LINK_CUSTOM_ALPHABET: 'abcdefghkmnpqrstuvwxyzABCDEFGHKLMNPQRSTUVWXYZ23456789'
      TRUST_PROXY: 'true'
      DISALLOW_REGISTRATION: 'true'
      DISALLOW_LOGIN_FORM: 'true'
      DISALLOW_ANONYMOUS_LINKS: 'true'
      SERVER_IP_ADDRESS: ''
      SERVER_CNAME_ADDRESS: ''
      CUSTOM_DOMAIN_USE_HTTPS: 'false'
      MAIL_ENABLED: 'false'
      MAIL_HOST: ''
      MAIL_PORT: '587'
      MAIL_SECURE: 'true'
      MAIL_USER: ''
      MAIL_FROM: ''
      MAIL_PASSWORD: ''
      ENABLE_RATE_LIMIT: 'false'
      REPORT_EMAIL: ''
      CONTACT_EMAIL: ''
      OIDC_BUTTON_TEXT: 'Log in with CoRE SSO'
    resources:
      requests:
        cpu: '50m'
        memory: '128Mi'
      limits:
        cpu: '500m'
        memory: '512Mi'
