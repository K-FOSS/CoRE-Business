{{- if .Values.snapotter.runtimeSecret.generate }}
{{- $releaseHash := sha256sum .Release.Name | trunc 8 -}}
{{- $passwordGeneratorName := printf "snapotter-runtime-password-%s" $releaseHash -}}
{{- $externalSecretName := printf "snapotter-runtime-secret-%s" $releaseHash -}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $passwordGeneratorName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  length: {{ .Values.snapotter.runtimeSecret.length }}
  digits: 0
  symbols: 0
  allowRepeat: true
  encoding: 'hex'
  secretKeys:
    - 'DEFAULT_PASSWORD'
    - 'COOKIE_SECRET'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $externalSecretName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-9'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: {{ .Values.snapotter.existingSecret | quote }}
    creationPolicy: 'Orphan'
    deletionPolicy: 'Retain'
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: 'Password'
          name: {{ $passwordGeneratorName | quote }}
{{- end }}
