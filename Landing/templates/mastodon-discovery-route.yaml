{{- if .Values.mastodonDiscovery.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-mastodon-discovery" .Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    wan-mode: 'public'
spec:
  parentRefs:
    - group: 'gateway.networking.k8s.io'
      kind: 'Gateway'
      name: {{ .Values.gateway.name | quote }}
      namespace: {{ .Values.gateway.namespace | quote }}
      sectionName: {{ .Values.gateway.sectionName | quote }}
  hostnames:
    - {{ .Values.mastodonDiscovery.hostname | quote }}
  rules:
    - matches:
        - path:
            type: 'Exact'
            value: '/.well-known/webfinger'
        - path:
            type: 'Exact'
            value: '/.well-known/nodeinfo'
      backendRefs:
        - name: {{ .Values.mastodonDiscovery.serviceName | quote }}
          port: {{ .Values.mastodonDiscovery.servicePort }}
{{- end }}
