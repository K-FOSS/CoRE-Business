{{- if and .Values.atproto.enabled .Values.atproto.hostname .Values.atproto.did }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-atproto" .Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    wan-mode: 'public'
spec:
  parentRefs:
    - group: 'gateway.networking.k8s.io'
      kind: 'Gateway'
      name: {{ .Values.gateway.name | quote }}
      namespace: {{ .Values.gateway.namespace | quote }}
      sectionName: {{ .Values.gateway.sectionName | quote }}
  hostnames:
    - {{ .Values.atproto.hostname | quote }}
  rules:
    - matches:
        - path:
            type: 'Exact'
            value: '/.well-known/atproto-did'
      backendRefs:
        - name: {{ .Values.discovery.serviceName | quote }}
          port: 8080
{{- end }}
