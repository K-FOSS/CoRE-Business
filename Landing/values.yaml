env: 'prod'

landingHttpRoute:
  enabled: true
  backendPort: 80

gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

discovery:
  enabled: true
  hostname: 'mylogin.space'
  serviceName: 'core-home1-talos-prod-business-landing-prod-discovery'
  image:
    repository: 'nginxinc/nginx-unprivileged'
    tag: '1.27.5-alpine'
    pullPolicy: 'IfNotPresent'
  securityTxt:
    contact: 'mailto:security@mylogin.space'
    expires: '2027-03-23T00:00:00Z'
    preferredLanguages: 'en'
  matrix:
    enabled: true
    homeserverBaseUrl: 'https://matrix.mylogin.space'
    serverName: 'matrix.mylogin.space:443'

# Keep this disabled until a specific handle and its matching DID have been
# approved and verified in DNS/AT Protocol management.
atproto:
  enabled: false
  hostname: ''
  did: ''

mastodonDiscovery:
  enabled: true
  hostname: 'mastodon.mylogin.space'
  # Keep aligned with the active Fediverse ApplicationSet release name.
  serviceName: 'core-home1-talos-prod-business-social-fediverse-prod-web'
  servicePort: 3000

forecastle:
  nameOverride: 'landing'

  forecastle:
    image:
      name: 'stakater/forecastle'
      tag: 'v2.0.2'

    deployment:
      replicas: 1
      revisionHistoryLimit: 2
      podSecurityContext:
        runAsUser: 10002
        runAsGroup: 10002
        runAsNonRoot: true
        seccompProfile:
          type: 'RuntimeDefault'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - 'ALL'
        readOnlyRootFilesystem: true
        runAsUser: 10002
        runAsGroup: 10002
        runAsNonRoot: true
      resources:
        requests:
          cpu: '25m'
          memory: '64Mi'
        limits:
          cpu: '250m'
          memory: '256Mi'

    config:
      namespaceSelector:
        matchNames:
          - 'core-prod'
      title: 'CoRE applications'
      instanceName: 'core'
      crdEnabled: true

    service:
      expose: 'false'

    httpRoute:
      enabled: false
      parentRefs:
        - group: 'gateway.networking.k8s.io'
          kind: 'Gateway'
          name: 'main-gw'
          namespace: 'core-prod'
          sectionName: 'https-myloginspace'
      hostnames:
        - 'mylogin.space'
      rules:
        - matches:
            - path:
                type: 'PathPrefix'
                value: '/'
